<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
 <title id="t">直線貼住曲線：看的越長、偏得越快</title><desc id="d">曲線與切線在 h、2h、3h 處的誤差比例為一、四、九。</desc>
 <rect width="960" height="540" rx="22" fill="#fbfaf7"/><style>.h{font:700 25px system-ui;fill:#172033}.s{font:700 18px system-ui;fill:#27344d}.n{font:15px system-ui;fill:#526078}.curve{stroke:#2858a5;stroke-width:7;fill:none}.tan{stroke:#7d8796;stroke-width:4;stroke-dasharray:10 8}.err{stroke:#c65c4b;stroke-width:5}.grid{stroke:#d9dee6;stroke-width:1}</style>
 <text x="40" y="48" class="h">Taylor：切線是最好的直線，但只在切點附近好</text>
 <g transform="translate(50 75)"><rect width="600" height="390" rx="16" fill="#eef3f8" stroke="#a0aec0" stroke-width="2"/>
  <path d="M55 315C210 307 360 245 545 80" class="curve"/><path d="M55 315L555 215" class="tan"/><circle cx="55" cy="315" r="8" fill="#d8a44a"/>
  <g class="err"><path d="M220 282V313"/><path d="M375 218V279"/><path d="M530 94V220"/></g>
  <text x="205" y="340" class="s">h：e</text><text x="347" y="307" class="s">2h：4e</text><text x="495" y="250" class="s">3h：9e</text>
  <text x="70" y="70" class="n">真實軌跡</text><text x="420" y="330" class="n">假設直走（切線）</text><text x="65" y="370" class="n">偏差 ≈ ½h²‖ẍ‖：時間加倍，偏差約四倍</text></g>
 <g transform="translate(685 95)"><text x="0" y="0" class="s">log–log 圖</text><path d="M35 300V45M35 300H225" stroke="#66758a" stroke-width="2"/>
  <path d="M45 280C85 245 125 190 165 120S205 55 220 45" class="curve"/><circle cx="80" cy="249" r="6" fill="#c65c4b"/><circle cx="125" cy="190" r="6" fill="#c65c4b"/><circle cx="175" cy="103" r="6" fill="#c65c4b"/>
  <text x="112" y="105" class="s">斜率 2</text><text x="100" y="335" class="n">log h</text><text x="-10" y="45" class="n">log 誤差</text></g>
 <text x="480" y="510" text-anchor="middle" class="s">彎得越急，‖ẍ‖ 越大；有折角時 smooth Taylor 假設失效。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
 <title id="t">源、匯、穿流：三種箭頭場</title><desc id="d">用小圈的淨流出判讀正、負與零 divergence。</desc>
 <rect width="960" height="540" rx="22" fill="#fbfaf7"/><style>.h{font:700 25px system-ui;fill:#172033}.s{font:700 20px system-ui;fill:#27344d}.n{font:16px system-ui;fill:#526078}.p{fill:#eef3f8;stroke:#a0aec0;stroke-width:2}.c{fill:none;stroke:#76859b;stroke-width:2;stroke-dasharray:7 6}.out{stroke:#c65c4b;stroke-width:4;marker-end:url(#r)}.in{stroke:#3477b8;stroke-width:4;marker-end:url(#b)}.flow{stroke:#51779c;stroke-width:4;marker-end:url(#f)}</style>
 <defs><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#c65c4b"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3477b8"/></marker><marker id="f" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#51779c"/></marker></defs>
 <text x="40" y="50" class="h">divergence 不問箭頭朝哪，只問小圈「淨吐出」還是「淨吸入」</text>
 <g transform="translate(30 86)"><rect width="285" height="370" rx="16" class="p"/><text x="142" y="38" text-anchor="middle" class="s">源 · divergence &gt; 0</text><circle cx="142" cy="190" r="80" class="c"/><circle cx="142" cy="190" r="11" fill="#c65c4b"/>
  <g class="out"><path d="M142 165V92"/><path d="M142 215V288"/><path d="M117 190H44"/><path d="M167 190H240"/><path d="M124 172L73 121"/><path d="M160 208L211 259"/><path d="M160 172L211 121"/><path d="M124 208L73 259"/></g><text x="142" y="338" text-anchor="middle" class="n">小圈淨流出為正</text></g>
 <g transform="translate(338 86)"><rect width="285" height="370" rx="16" class="p"/><text x="142" y="38" text-anchor="middle" class="s">匯 · divergence &lt; 0</text><circle cx="142" cy="190" r="80" class="c"/><circle cx="142" cy="190" r="11" fill="#3477b8"/>
  <g class="in"><path d="M142 92V165"/><path d="M142 288V215"/><path d="M44 190H117"/><path d="M240 190H167"/><path d="M73 121L124 172"/><path d="M211 259L160 208"/><path d="M211 121L160 172"/><path d="M73 259L124 208"/></g><text x="142" y="338" text-anchor="middle" class="n">小圈淨流出為負（藍）</text></g>
 <g transform="translate(646 86)"><rect width="285" height="370" rx="16" class="p"/><text x="142" y="38" text-anchor="middle" class="s">穿流 · divergence = 0</text><circle cx="142" cy="190" r="80" class="c"/>
  <g class="flow"><path d="M30 125H255"/><path d="M30 168H255"/><path d="M30 211H255"/><path d="M30 254H255"/></g><text x="142" y="325" text-anchor="middle" class="n">左邊流入 = 右邊流出</text><text x="142" y="350" text-anchor="middle" class="n">方向一致不等於有 divergence</text></g>
 <text x="480" y="505" text-anchor="middle" class="s">紅＝源（吐出）；藍＝匯（吸入）。暗門帶走人時應顯示藍色 sink。</text>
</svg>

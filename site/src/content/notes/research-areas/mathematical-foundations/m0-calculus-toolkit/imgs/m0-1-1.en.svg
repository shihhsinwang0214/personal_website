<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" style="width: 960px; height: 540px;">
 <title id="t">Source, sink, and through-flow</title><desc id="d">Net flux through a small loop identifies positive, negative, or zero divergence.</desc>
 <rect width="960" height="540" rx="22" fill="#fbfaf7"></rect><style>.h{font:700 25px system-ui;fill:#172033}.s{font:700 20px system-ui;fill:#27344d}.n{font:16px system-ui;fill:#526078}.p{fill:#eef3f8;stroke:#a0aec0;stroke-width:2}.c{fill:none;stroke:#76859b;stroke-width:2;stroke-dasharray:7 6}.out{stroke:#c65c4b;stroke-width:4;marker-end:url(#r)}.in{stroke:#3477b8;stroke-width:4;marker-end:url(#b)}.flow{stroke:#51779c;stroke-width:4;marker-end:url(#f)}</style>
 <defs><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#c65c4b"></path></marker><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3477b8"></path></marker><marker id="f" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#51779c"></path></marker></defs>
 <text x="40" y="50" class="h">Divergence measures net outward flow through a small boundary</text>
 <g transform="translate(30 86)"><rect width="285" height="370" rx="16" class="p"></rect><text x="142" y="38" text-anchor="middle" class="s">Source · divergence &gt; 0</text><circle cx="142" cy="190" r="80" class="c"></circle><circle cx="142" cy="190" r="11" fill="#c65c4b"></circle>
  <g class="out"><path d="M142 165V92"></path><path d="M142 215V288"></path><path d="M117 190H44"></path><path d="M167 190H240"></path><path d="M124 172L73 121"></path><path d="M160 208L211 259"></path><path d="M160 172L211 121"></path><path d="M124 208L73 259"></path></g><text x="142" y="338" text-anchor="middle" class="n">Positive net outward flux</text></g>
 <g transform="translate(338 86)"><rect width="285" height="370" rx="16" class="p"></rect><text x="142" y="38" text-anchor="middle" class="s">Sink · divergence &lt; 0</text><circle cx="142" cy="190" r="80" class="c"></circle><circle cx="142" cy="190" r="11" fill="#3477b8"></circle>
  <g class="in"><path d="M142 92V165"></path><path d="M142 288V215"></path><path d="M44 190H117"></path><path d="M240 190H167"></path><path d="M73 121L124 172"></path><path d="M211 259L160 208"></path><path d="M211 121L160 172"></path><path d="M73 259L124 208"></path></g><text x="142" y="338" text-anchor="middle" class="n">Negative net outward flux (blue)</text></g>
 <g transform="translate(646 86)"><rect width="285" height="370" rx="16" class="p"></rect><text x="142" y="38" text-anchor="middle" class="s" textLength="264.0" lengthAdjust="spacingAndGlyphs" style="font-size: 18.63px;">Through-flow · divergence = 0</text><circle cx="142" cy="190" r="80" class="c"></circle>
  <g class="flow"><path d="M30 125H255"></path><path d="M30 168H255"></path><path d="M30 211H255"></path><path d="M30 254H255"></path></g><text x="142" y="325" text-anchor="middle" class="n">Inflow from left = outflow to right</text><text x="142" y="350" text-anchor="middle" class="n" textLength="264.0" lengthAdjust="spacingAndGlyphs" style="font-size: 13.93px;">Aligned arrows need not imply divergence</text></g>
 <text x="480" y="505" text-anchor="middle" class="s">Red: source · Blue: sink. Removal through an exit contributes a sink term.</text>
</svg>

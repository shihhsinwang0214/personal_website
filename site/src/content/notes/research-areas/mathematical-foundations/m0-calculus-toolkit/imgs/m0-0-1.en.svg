<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" style="width: 960px; height: 540px;">
  <title id="t">A tilted tabletop: two slopes determine every direction</title>
  <desc id="d">Three panels show partial derivatives, directional slopes, and a cross-section along the steepest direction.</desc>
  <rect width="960" height="540" rx="22" fill="#fbfaf7"></rect>
  <style>.h{font:700 24px system-ui;fill:#172033}.s{font:600 17px system-ui;fill:#27344d}.n{font:15px system-ui;fill:#526078}.grid{stroke:#b7c2d3;stroke-width:1}.a{stroke:#2858a5;stroke-width:6;fill:none;marker-end:url(#m)}.b{stroke:#c46c35;stroke-width:4;fill:none;marker-end:url(#m2)}.box{fill:#eef3f8;stroke:#92a4bd;stroke-width:2}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2858a5"></path></marker><marker id="m2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#c46c35"></path></marker></defs>
  <text x="40" y="48" class="h">Gradient: orthogonal slope readings determine steepest ascent</text>
  <g transform="translate(35 85)"><rect width="280" height="390" rx="16" class="box"></rect><text x="20" y="34" class="s">① Measure two directions</text>
    <g transform="translate(35 75) skewY(-9)"><rect width="210" height="210" fill="#d9e6f5" stroke="#607b9d" stroke-width="2"></rect><path d="M0 42H210M0 84H210M0 126H210M0 168H210M42 0V210M84 0V210M126 0V210M168 0V210" class="grid"></path></g>
    <circle cx="143" cy="205" r="13" fill="#d8a44a"></circle><path d="M143 205L220 246" class="a"></path><path d="M143 205H220" class="b"></path><path d="M143 205V130" class="b"></path>
    <text x="20" y="330" class="n">East–west slope: −0.3</text><text x="20" y="357" class="n">North–south slope: −0.4</text><text x="20" y="382" class="n">Thick arrow: downhill direction</text></g>
  <g transform="translate(340 85)"><rect width="280" height="390" rx="16" class="box"></rect><text x="20" y="34" class="s">② Calculate all directions</text>
    <g transform="translate(140 190)" stroke="#2858a5" stroke-width="11" stroke-linecap="round"><path d="M0 0L0-92"></path><path d="M0 0L62-62"></path><path d="M0 0L88 0"></path><path d="M0 0L49 49"></path><path d="M0 0L0 60"></path><path d="M0 0L-62 62"></path><path d="M0 0L-88 0"></path><path d="M0 0L-49-49"></path></g>
    <circle cx="140" cy="190" r="12" fill="#d8a44a"></circle><path d="M140 190L215 235" class="a"></path>
    <text x="31" y="322" class="n">Directional derivative = ∇h · v</text><text x="31" y="350" class="n">Perpendicular to ∇h: zero slope</text><text x="31" y="378" class="n" textLength="239.0" lengthAdjust="spacingAndGlyphs" style="font-size: 10.99px;">Steepest descent aligns with the downhill arrow</text></g>
  <g transform="translate(645 85)"><rect width="280" height="390" rx="16" class="box"></rect><text x="20" y="34" class="s">③ View the slope from the side</text>
    <path d="M35 275L242 120" stroke="#2858a5" stroke-width="8"></path><path d="M35 275H242" stroke="#8b96a8" stroke-width="4" stroke-dasharray="9 8"></path>
    <path d="M62 264L62 234H92" fill="none" stroke="#526078" stroke-width="2"></path><text x="55" y="305" class="n">Steepest cross-section</text><text x="55" y="335" class="s">‖∇h‖ = √(0.3²+0.4²) = 0.5</text><text x="55" y="370" class="n" textLength="215.0" lengthAdjust="spacingAndGlyphs" style="font-size: 10.41px;">The perpendicular cross-section is horizontal</text></g>
  <text x="480" y="515" text-anchor="middle" class="s">At a nonzero gradient, steepest ascent is unique; d dimensions require d partial derivatives.</text>
</svg>

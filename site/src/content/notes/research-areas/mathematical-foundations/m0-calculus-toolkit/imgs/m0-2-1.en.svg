<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" style="width: 960px; height: 540px;">
 <title id="t">A tangent matches locally; error grows with the horizon</title><desc id="d">Leading tangent-approximation errors at h, 2h, and 3h scale as 1, 4, and 9.</desc>
 <rect width="960" height="540" rx="22" fill="#fbfaf7"></rect><style>.h{font:700 25px system-ui;fill:#172033}.s{font:700 18px system-ui;fill:#27344d}.n{font:15px system-ui;fill:#526078}.curve{stroke:#2858a5;stroke-width:7;fill:none}.tan{stroke:#7d8796;stroke-width:4;stroke-dasharray:10 8}.err{stroke:#c65c4b;stroke-width:5}.grid{stroke:#d9dee6;stroke-width:1}</style>
 <text x="40" y="48" class="h">Taylor: the tangent is locally accurate, not globally exact</text>
 <g transform="translate(50 75)"><rect width="600" height="390" rx="16" fill="#eef3f8" stroke="#a0aec0" stroke-width="2"></rect>
  <path d="M55 315C210 307 360 245 545 80" class="curve"></path><path d="M55 315L555 215" class="tan"></path><circle cx="55" cy="315" r="8" fill="#d8a44a"></circle>
  <g class="err"><path d="M220 282V313"></path><path d="M375 218V279"></path><path d="M530 94V220"></path></g>
  <text x="205" y="340" class="s">h: e</text><text x="347" y="307" class="s">2h: 4e</text><text x="495" y="250" class="s">3h: 9e</text>
  <text x="70" y="70" class="n">Exact trajectory</text><text x="420" y="330" class="n" textLength="170.0" lengthAdjust="spacingAndGlyphs" style="font-size: 11.89px;">Straight-line tangent prediction</text><text x="65" y="370" class="n">Error ≈ ½h²‖ẍ‖: doubling time roughly quadruples error</text></g>
 <g transform="translate(685 95)"><text x="0" y="0" class="s">Log–log plot</text><path d="M35 300V45M35 300H225" stroke="#66758a" stroke-width="2"></path>
  <path d="M45 280C85 245 125 190 165 120S205 55 220 45" class="curve"></path><circle cx="80" cy="249" r="6" fill="#c65c4b"></circle><circle cx="125" cy="190" r="6" fill="#c65c4b"></circle><circle cx="175" cy="103" r="6" fill="#c65c4b"></circle>
  <text x="112" y="105" class="s">Slope 2</text><text x="100" y="335" class="n">log h</text><text x="-10" y="45" class="n">Log error</text></g>
 <text x="480" y="510" text-anchor="middle" class="s">Acceleration controls the leading defect; corners invalidate the smooth Taylor assumptions.</text>
</svg>

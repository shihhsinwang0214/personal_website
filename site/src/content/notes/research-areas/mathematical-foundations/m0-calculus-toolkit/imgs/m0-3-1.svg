<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
 <title id="t">全導數的兩個來源</title><desc id="d">浮球溫度計的讀數變化由局部升溫與漂到較暖處兩部分相加。</desc>
 <defs><linearGradient id="water" x1="0" x2="1"><stop stop-color="#b9d8ef"/><stop offset=".55" stop-color="#78acd2"/><stop offset="1" stop-color="#e9a269"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2858a5"/></marker></defs>
 <rect width="960" height="540" rx="22" fill="#fbfaf7"/><style>.h{font:700 25px system-ui;fill:#172033}.s{font:700 18px system-ui;fill:#27344d}.n{font:15px system-ui;fill:#526078}.panel{fill:#eef3f8;stroke:#a0aec0;stroke-width:2}.axis{stroke:#68758a;stroke-width:2}</style>
 <text x="40" y="48" class="h">沿路徑的變化率 = 原地變化 + 移動穿過空間梯度</text>
 <g transform="translate(35 82)"><rect width="560" height="390" rx="16" class="panel"/><text x="22" y="34" class="s">河面俯視：T(x,t)</text><rect x="30" y="75" width="500" height="190" rx="55" fill="url(#water)"/>
   <circle cx="170" cy="170" r="18" fill="#fff" stroke="#27344d" stroke-width="3"/><circle cx="385" cy="170" r="18" fill="#fff" stroke="#27344d" stroke-width="3"/>
   <path d="M195 170H350" stroke="#2858a5" stroke-width="6" marker-end="url(#a)"/><text x="245" y="152" class="s">ẋ 漂速</text>
   <path d="M170 144V96" stroke="#c65c4b" stroke-width="5" marker-end="url(#a)"/><text x="40" y="300" class="n">同一位置的水自己變熱：∂ₜT</text>
   <text x="40" y="330" class="n">漂到右邊較暖處：∇T · ẋ</text><text x="40" y="375" class="s">g′(t) = ∂ₜT + ∇T · ẋ</text></g>
 <g transform="translate(625 82)"><rect width="300" height="390" rx="16" class="panel"/><text x="20" y="34" class="s">讀數斜率的拆帳</text><path d="M45 315V78M45 315H265" class="axis"/><path d="M55 285C105 265 145 225 190 160S230 110 255 92" fill="none" stroke="#2858a5" stroke-width="6"/>
   <rect x="105" y="218" width="48" height="97" fill="#d4a447"/><rect x="105" y="145" width="48" height="73" fill="#c65c4b"/><text x="160" y="268" class="n">∂ₜT</text><text x="160" y="183" class="n">∇T·ẋ</text><path d="M90 145H165" stroke="#27344d" stroke-width="2"/><text x="170" y="140" class="s">g′(t)</text><text x="112" y="350" class="n">兩項疊起來</text></g>
 <text x="480" y="510" text-anchor="middle" class="s">只看浮球讀數拆不開兩項；釘住一支溫度計，才量得到 ∂ₜT。</text>
</svg>

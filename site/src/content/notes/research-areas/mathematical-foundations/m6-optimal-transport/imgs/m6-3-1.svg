<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">精確、entropic 與 minibatch optimal transport 的差異</title><desc id="desc">精確運輸表稀疏，entropic 正則化增加時熱圖由對角帶變模糊，minibatch 配對則可能因看不到全體而產生長路線。</desc>
  <defs><style>.bg{fill:#fbf8f1}.panel{fill:#fff;stroke:#d9d2c5;stroke-width:2}.ink{fill:#202733;font-family:system-ui,sans-serif}.muted{fill:#6c706f;font-family:system-ui,sans-serif}.cell{stroke:#fff;stroke-width:2}.a{fill:#315a9e}.b{fill:#c34e4e}.line{stroke:#7d92ad;stroke-width:1.5;opacity:.5}.long{stroke:#c34e4e;stroke-width:3}</style></defs>
  <rect class="bg" width="960" height="540" rx="22"/><text class="ink" x="48" y="48" font-size="25" font-weight="700">兩種近似：磨圓稜角，或只看一小塊</text><rect class="panel" x="42" y="76" width="245" height="388" rx="18"/><rect class="panel" x="310" y="76" width="338" height="388" rx="18"/><rect class="panel" x="671" y="76" width="247" height="388" rx="18"/>
  <text class="ink" x="66" y="112" font-size="16" font-weight="700">精確：稀疏頂點</text><g class="cell" transform="translate(82 146)"><rect width="28" height="28" fill="#315a9e"/><rect x="28" y="28" width="28" height="28" fill="#4f73ad"/><rect x="56" y="56" width="28" height="28" fill="#315a9e"/><rect x="84" y="84" width="28" height="28" fill="#5e80b7"/><rect x="112" y="112" width="28" height="28" fill="#315a9e"/><rect x="140" y="140" width="28" height="28" fill="#5479b1"/><rect x="168" y="168" width="28" height="28" fill="#315a9e"/><rect x="196" y="196" width="28" height="28" fill="#315a9e"/></g><rect x="82" y="146" width="224" height="224" fill="none" stroke="#d4cec4"/><text class="muted" x="66" y="408" font-size="13">最多 m+n−1 個非零格</text><text class="muted" x="66" y="431" font-size="13">準確，但有稜角、難最佳化</text>
  <text class="ink" x="334" y="112" font-size="16" font-weight="700">Entropic：ε 把解磨圓</text>
  <g transform="translate(330 160)"><g><rect width="82" height="150" fill="#f5f7fa"/><path d="M0 0 L82 68 V96 L0 28Z" fill="#315a9e" opacity=".72"/><text class="muted" x="41" y="174" text-anchor="middle" font-size="12">ε=.01</text></g><g transform="translate(104)"><rect width="82" height="150" fill="#edf2f8"/><path d="M0 0 L82 44 V122 L0 54Z" fill="#527bb2" opacity=".62"/><text class="muted" x="41" y="174" text-anchor="middle" font-size="12">ε=.1</text></g><g transform="translate(208)"><rect width="82" height="150" fill="#cdd9e8"/><rect width="82" height="150" fill="#315a9e" opacity=".22"/><path d="M0 18 L82 35 V138 L0 120Z" fill="#527bb2" opacity=".28"/><text class="muted" x="41" y="174" text-anchor="middle" font-size="12">ε=1</text></g></g><text class="ink" x="479" y="379" text-anchor="middle" font-size="14" font-weight="700">π = diag(u) K diag(v)</text><text class="muted" x="333" y="428" font-size="13">ε ↑ → entropy ↑、成本偏高、每點連出一把扇</text>
  <text class="ink" x="695" y="112" font-size="16" font-weight="700">Minibatch：只看組內</text><g class="a"><circle cx="706" cy="178" r="5"/><circle cx="739" cy="214" r="5"/><circle cx="718" cy="263" r="5"/><circle cx="769" cy="302" r="5"/><circle cx="716" cy="350" r="5"/></g><g class="b"><circle cx="863" cy="168" r="5"/><circle cx="835" cy="230" r="5"/><circle cx="880" cy="277" r="5"/><circle cx="821" cy="330" r="5"/><circle cx="875" cy="370" r="5"/></g><g class="line"><line x1="706" y1="178" x2="835" y2="230"/><line x1="739" y1="214" x2="863" y2="168"/><line x1="718" y1="263" x2="821" y2="330"/><line x1="769" y1="302" x2="880" y2="277"/></g><line class="long" x1="716" y1="350" x2="875" y2="370"/><ellipse cx="793" cy="273" rx="103" ry="140" fill="none" stroke="#b77b16" stroke-width="2" stroke-dasharray="7 6"/><text class="muted" x="693" y="428" font-size="13">組內被迫配 → 長線、成本偏高</text>
  <text class="ink" x="480" y="505" text-anchor="middle" font-size="16" font-weight="650">ε 控制平滑偏差；B 控制抽樣偏差</text>
</svg>

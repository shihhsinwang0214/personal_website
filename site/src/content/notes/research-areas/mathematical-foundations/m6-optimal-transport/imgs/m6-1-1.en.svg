<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
  <title id="title">W₂ and pointwise divergences compare distributions differently</title><desc id="desc">For disjoint compact supports, KL is infinite and TV saturates; W₂ still measures transport distance.</desc>
  <defs><style>.bg{fill:#fbf8f1}.panel{fill:#fff;stroke:#d9d2c5;stroke-width:2}.ink{fill:#202733;font-family:system-ui,sans-serif}.muted{fill:#6c706f;font-family:system-ui,sans-serif}.a{fill:#6f9ad1;opacity:.8}.b{fill:#d8816c;opacity:.78}.arr{stroke:#2f8b59;stroke-width:5;marker-end:url(#m)}.axis{stroke:#777d84;stroke-width:2}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f8b59"></path></marker></defs>
  <rect class="bg" width="960" height="540" rx="22"></rect><text class="ink" x="48" y="48" font-size="25" font-weight="700">Pointwise comparison versus moving mass</text><rect class="panel" x="42" y="76" width="274" height="388" rx="18"></rect><rect class="panel" x="342" y="76" width="274" height="388" rx="18"></rect><rect class="panel" x="642" y="76" width="276" height="388" rx="18"></rect>
  <text class="ink" x="66" y="112" font-size="16" font-weight="700">Pointwise comparison</text><line class="axis" x1="68" y1="225" x2="292" y2="225"></line><path class="a" d="M78 225 Q102 145 126 225Z"></path><path class="b" d="M166 225 Q190 145 214 225Z"></path><text class="ink" x="70" y="254" font-size="14">KL = ∞　TV = 1</text><line class="axis" x1="68" y1="365" x2="292" y2="365"></line><path class="a" d="M78 365 Q102 285 126 365Z"></path><path class="b" d="M250 365 Q274 285 298 365Z"></path><text class="ink" x="70" y="394" font-size="14">KL = ∞　TV = 1</text><text class="muted" x="70" y="424" font-size="13">Same score despite greater separation</text>
  <text class="ink" x="366" y="112" font-size="16" font-weight="700">W₂ transports the mass</text><line class="axis" x1="368" y1="225" x2="592" y2="225"></line><path class="a" d="M378 225 Q402 145 426 225Z"></path><path class="b" d="M466 225 Q490 145 514 225Z"></path><line class="arr" x1="414" y1="174" x2="477" y2="174"></line><text class="ink" x="431" y="255" font-size="15" font-weight="700">W₂ = 3</text><line class="axis" x1="368" y1="365" x2="592" y2="365"></line><path class="a" d="M378 365 Q402 285 426 365Z"></path><path class="b" d="M550 365 Q574 285 598 365Z"></path><line class="arr" x1="414" y1="314" x2="561" y2="314"></line><text class="ink" x="431" y="395" font-size="15" font-weight="700">W₂ = 30</text><text class="muted" x="368" y="424" font-size="13">Distance matters; disjoint supports can give finite W₂</text>
  <text class="ink" x="666" y="112" font-size="16" font-weight="700" style="font-size: 15.89px;">Shape changes require transport too</text><line class="axis" x1="668" y1="342" x2="894" y2="342"></line><path class="a" d="M685 342 Q780 135 875 342Z"></path><path class="b" d="M737 342 Q780 214 823 342Z"></path><g stroke="#2f8b59" stroke-width="2" opacity=".7"><line x1="713" y1="315" x2="751" y2="307"></line><line x1="741" y1="267" x2="761" y2="263"></line><line x1="847" y1="315" x2="809" y2="307"></line><line x1="819" y1="267" x2="799" y2="263"></line></g><text class="muted" x="670" y="381" font-size="13">Same mean, different spread</text><text class="ink" x="670" y="407" font-size="14" font-weight="700">Mass on both sides must move inward</text>
  <text class="muted" x="480" y="505" text-anchor="middle" font-size="15">The left panels use compact supports. Gaussians overlap everywhere and have finite mutual KL when nondegenerate.</text>
</svg>

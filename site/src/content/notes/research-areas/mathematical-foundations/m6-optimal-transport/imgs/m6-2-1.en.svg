<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
  <title id="title">Uncrossing lowers one-dimensional squared transport cost</title><desc id="desc">For the same four endpoints, crossed pairing costs more than monotone pairing by twice the product of endpoint gaps.</desc>
  <defs><style>.bg{fill:#fbf8f1}.panel{fill:#fff;stroke:#d9d2c5;stroke-width:2}.ink{fill:#202733;font-family:system-ui,sans-serif}.muted{fill:#6c706f;font-family:system-ui,sans-serif}.bad{stroke:#c34e4e;stroke-width:7;opacity:.82}.good{stroke:#2f8b59;stroke-width:7;opacity:.82}.street{stroke:#777d84;stroke-width:2}.x{fill:#315a9e}.y{fill:#b77b16}.swap{stroke:#315a9e;stroke-width:5;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315a9e"></path></marker></defs>
  <rect class="bg" width="960" height="540" rx="22"></rect><text class="ink" x="48" y="48" font-size="25" font-weight="700">Uncross the routes: same endpoints, lower squared cost</text><rect class="panel" x="42" y="76" width="370" height="388" rx="18"></rect><rect class="panel" x="548" y="76" width="370" height="388" rx="18"></rect>
  <text class="ink" x="66" y="112" font-size="17" font-weight="700">Crossed pairing</text><line class="street" x1="72" y1="174" x2="382" y2="174"></line><line class="street" x1="72" y1="338" x2="382" y2="338"></line><line class="bad" x1="130" y1="174" x2="350" y2="338"></line><line class="bad" x1="300" y1="174" x2="102" y2="338"></line><g class="x"><circle cx="130" cy="174" r="12"></circle><circle cx="300" cy="174" r="12"></circle></g><g class="y"><circle cx="102" cy="338" r="12"></circle><circle cx="350" cy="338" r="12"></circle></g><g class="muted" font-size="13"><text x="116" y="151">x₁</text><text x="286" y="151">x₂</text><text x="88" y="367">y₁</text><text x="336" y="367">y₂</text></g><text class="ink" x="227" y="411" text-anchor="middle" font-size="15">(x₁−y₂)² + (x₂−y₁)²</text>
  <path class="swap" d="M432 270 H526"></path><text class="ink" x="479" y="246" text-anchor="middle" font-size="15" font-weight="700">Swap</text>
  <text class="ink" x="572" y="112" font-size="17" font-weight="700">Monotone pairing</text><line class="street" x1="578" y1="174" x2="888" y2="174"></line><line class="street" x1="578" y1="338" x2="888" y2="338"></line><line class="good" x1="636" y1="174" x2="608" y2="338"></line><line class="good" x1="806" y1="174" x2="856" y2="338"></line><g class="x"><circle cx="636" cy="174" r="12"></circle><circle cx="806" cy="174" r="12"></circle></g><g class="y"><circle cx="608" cy="338" r="12"></circle><circle cx="856" cy="338" r="12"></circle></g><g class="muted" font-size="13"><text x="622" y="151">x₁</text><text x="792" y="151">x₂</text><text x="594" y="367">y₁</text><text x="842" y="367">y₂</text></g><text class="ink" x="733" y="411" text-anchor="middle" font-size="15">(x₁−y₁)² + (x₂−y₂)²</text>
  <text class="ink" x="480" y="505" text-anchor="middle" font-size="16" font-weight="650">Cost difference = 2(x₂−x₁)(y₂−y₁) &gt; 0 → optimal pairs do not cross</text>
</svg>

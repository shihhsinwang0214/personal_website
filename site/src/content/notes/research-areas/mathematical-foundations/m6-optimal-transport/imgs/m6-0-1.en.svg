<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
  <title id="title">A coupling satisfies supply and demand</title><desc id="desc">Flows from three warehouses to three stores are also represented by a 3×3 matrix with matching marginals.</desc>
  <defs><style>.bg{fill:#fbf8f1}.panel{fill:#fff;stroke:#d9d2c5;stroke-width:2}.ink{fill:#202733;font-family:system-ui,sans-serif}.muted{fill:#6c706f;font-family:system-ui,sans-serif}.route{fill:none;stroke:#315a9e;stroke-linecap:round;opacity:.68}.cell{stroke:#fff;stroke-width:3}.good{fill:#2f8b59}.bad{fill:#c34e4e}</style></defs>
  <rect class="bg" width="960" height="540" rx="22"></rect><text class="ink" x="48" y="48" font-size="25" font-weight="700">A coupling is a transport table matching both marginals</text><rect class="panel" x="42" y="76" width="430" height="388" rx="18"></rect><rect class="panel" x="494" y="76" width="424" height="388" rx="18"></rect>
  <text class="ink" x="66" y="112" font-size="17" font-weight="700">Shipment routes</text><g class="route"><path d="M129 165 C225 165 289 155 387 158" stroke-width="9"></path><path d="M129 165 C239 191 292 260 387 270" stroke-width="4"></path><path d="M129 270 C236 236 286 175 387 158" stroke-width="6"></path><path d="M129 270 C234 270 292 270 387 270" stroke-width="8"></path><path d="M129 378 C241 367 288 283 387 270" stroke-width="5"></path><path d="M129 378 C228 378 300 378 387 378" stroke-width="10"></path></g>
  <g fill="#b77b16" stroke="#fff" stroke-width="3"><circle cx="116" cy="165" r="18"></circle><circle cx="116" cy="270" r="26"></circle><circle cx="116" cy="378" r="33"></circle></g><g fill="#2f8b59" stroke="#fff" stroke-width="3"><rect x="370" y="141" width="36" height="36" rx="5"></rect><rect x="365" y="248" width="44" height="44" rx="5"></rect><rect x="368" y="359" width="40" height="40" rx="5"></rect></g>
  <g class="muted" font-size="12"><text x="72" y="166">10 boxes</text><text x="66" y="271">20 boxes</text><text x="60" y="379">30 boxes</text><text x="414" y="163">25</text><text x="414" y="274">15</text><text x="414" y="382">20</text></g><text class="muted" x="66" y="434" font-size="13">Thicker arrow = larger πᵢⱼ</text>
  <text class="ink" x="518" y="112" font-size="17" font-weight="700">The same plan as a 3 × 3 table</text><g class="cell"><rect x="552" y="144" width="84" height="70" fill="#7da5d8"></rect><rect x="636" y="144" width="84" height="70" fill="#e5edf7"></rect><rect x="720" y="144" width="84" height="70" fill="#f2f5f8"></rect><rect x="552" y="214" width="84" height="70" fill="#a8c1e1"></rect><rect x="636" y="214" width="84" height="70" fill="#6e9bd3"></rect><rect x="720" y="214" width="84" height="70" fill="#eef2f6"></rect><rect x="552" y="284" width="84" height="70" fill="#eef2f6"></rect><rect x="636" y="284" width="84" height="70" fill="#b4cbe5"></rect><rect x="720" y="284" width="84" height="70" fill="#4f84c4"></rect></g>
  <g class="ink" text-anchor="middle" font-size="16" font-weight="700"><text x="594" y="185">10</text><text x="678" y="185">0</text><text x="762" y="185">0</text><text x="594" y="255">15</text><text x="678" y="255">5</text><text x="762" y="255">0</text><text x="594" y="325">0</text><text x="678" y="325">10</text><text x="762" y="325">20</text></g>
  <g class="muted" font-size="13"><text x="822" y="185">= 10</text><text x="822" y="255">= 20</text><text x="822" y="325">= 30</text><text x="580" y="378">25</text><text x="666" y="378">15</text><text x="749" y="378">20</text></g><circle class="good" cx="858" cy="252" r="11"></circle><text class="muted" x="518" y="414" font-size="13">Row sums: supplies · Column sums: demands</text><text class="ink" x="518" y="440" font-size="14" font-weight="700">Total cost = Σ πᵢⱼ cᵢⱼ</text>
  <text class="ink" x="480" y="505" text-anchor="middle" font-size="16" font-weight="650">Monge sends each source to one target; Kantorovich permits splitting, ensuring feasibility for matching finite mass.</text>
</svg>

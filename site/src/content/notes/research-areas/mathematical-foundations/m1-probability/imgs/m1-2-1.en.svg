<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" style="width: 960px; height: 540px;"><title id="t">Mean, mode, and median</title><desc id="d">For the same two-point distribution, squared error, absolute error, and modal prediction favor different centers.</desc>
<rect width="960" height="540" rx="22" fill="#fbfaf7"></rect><style>.h{font:700 24px system-ui;fill:#172033}.s{font:700 17px system-ui;fill:#27344d}.n{font:14px system-ui;fill:#526078}.axis{stroke:#6b788b;stroke-width:3}.mse{stroke:#2858a5;stroke-width:5;fill:none}.mae{stroke:#c06c3d;stroke-width:5;fill:none}</style>
<text x="38" y="46" class="h">The scoring rule determines which center is optimal</text>
<g transform="translate(50 78)"><line x1="30" y1="130" x2="820" y2="130" class="axis"></line><g class="n"><text x="120" y="158">22</text><text x="460" y="158">26.8</text><text x="745" y="158">30</text></g>
 <circle cx="130" cy="95" r="28" fill="#78a7cf"></circle><text x="130" y="101" text-anchor="middle" class="s">0.4</text><circle cx="755" cy="75" r="38" fill="#d8a44a"></circle><text x="755" y="81" text-anchor="middle" class="s">0.6</text>
 <path d="M472 122V65" stroke="#2858a5" stroke-width="5"></path><text x="472" y="45" text-anchor="middle" class="s">mean 26.8</text><path d="M755 122V165" stroke="#c06c3d" stroke-width="5"></path><text x="755" y="190" text-anchor="middle" class="s">mode = median = 30</text></g>
<g transform="translate(65 285)"><path d="M0 180V10M0 180H360" class="axis"></path><path d="M18 35Q170 245 340 35" class="mse"></path><circle cx="202" cy="118" r="7" fill="#2858a5"></circle><text x="120" y="15" class="s">E[(Y−a)²]</text><text x="166" y="145" class="n">Minimum: mean</text></g>
<g transform="translate(535 285)"><path d="M0 180V10M0 180H360" class="axis"></path><path d="M18 35L300 140L340 100" class="mae"></path><circle cx="300" cy="140" r="7" fill="#c06c3d"></circle><text x="120" y="15" class="s">E|Y−a|</text><text x="225" y="165" class="n">Minimum: median</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">一萬人的篩檢與 Bayes posterior</title><desc id="d">以 icon array 分解真陽性與假陽性，說明低盛行率下陽性不等於患病。</desc>
<rect width="960" height="540" rx="22" fill="#fbfaf7"/><style>.h{font:700 24px system-ui;fill:#172033}.s{font:700 18px system-ui;fill:#27344d}.n{font:15px system-ui;fill:#526078}.neg{fill:#d8dde5}.fp{fill:#e8a55a}.tp{fill:#c7554d}.box{fill:#eef3f8;stroke:#9faebe;stroke-width:2}</style>
<text x="38" y="46" class="h">陽性的人裡，真的有病多少？先數 base rate，再數測試錯誤</text>
<g transform="translate(40 80)"><rect width="555" height="400" rx="16" class="box"/><text x="20" y="34" class="s">10,000 人（每格代表 10 人）</text>
 <g transform="translate(24 60)">
  <path d="M0 0h480v280H0z" fill="#d8dde5"/>
  <path d="M0 0h48v28H0z" class="tp"/><path d="M48 0h96v28H48z" class="fp"/>
  <g stroke="#fff" stroke-width="1"><path d="M0 28H480M0 56H480M0 84H480M0 112H480M0 140H480M0 168H480M0 196H480M0 224H480M0 252H480"/><path d="M24 0V280M48 0V280M72 0V280M96 0V280M120 0V280M144 0V280M168 0V280M192 0V280M216 0V280M240 0V280M264 0V280M288 0V280M312 0V280M336 0V280M360 0V280M384 0V280M408 0V280M432 0V280M456 0V280"/></g>
 </g><text x="25" y="375" class="n">紅：真陽性　橘：假陽性　灰：陰性</text></g>
<g transform="translate(625 105)"><text x="0" y="0" class="s">例：盛行率 1%</text><text x="0" y="45" class="n">患者 100 人 × 靈敏度 90%</text><text x="0" y="72" class="s">→ 真陽性 90</text><text x="0" y="118" class="n">健康 9,900 人 × 假陽性率 5%</text><text x="0" y="145" class="s">→ 假陽性 495</text><path d="M0 175H280" stroke="#9faebe" stroke-width="2"/><text x="0" y="215" class="s">P(病 | +) = 90/(90+495)</text><text x="0" y="260" style="font:700 42px system-ui;fill:#c7554d">≈ 15.4%</text><text x="0" y="305" class="n">測試很準，posterior 仍受 base rate 主導。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" style="width: 960px; height: 540px;"><title id="t">The density slope in Tweedie's formula</title><desc id="d">Correct an observation along the observed-density score, scaled by Gaussian noise variance.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#c05b4b"></path></marker></defs><rect width="960" height="540" rx="22" fill="#fbfaf7"></rect><style>.h{font:700 24px system-ui;fill:#172033}.s{font:700 17px system-ui;fill:#27344d}.n{font:14px system-ui;fill:#526078}.den{stroke:#2858a5;stroke-width:6;fill:#dceaf6}.post{stroke:#d8a44a;stroke-width:4;fill:#f8e7b6}.axis{stroke:#6c788a;stroke-width:2}.arr{stroke:#c05b4b;stroke-width:5;marker-end:url(#a)}</style>
<text x="38" y="46" class="h">Tweedie: best estimate = observation + σ² × observed-density score</text>
<g transform="translate(55 82)"><path d="M0 280H850" class="axis"></path><path d="M10 280C120 278 175 225 230 90S355 40 420 160S520 275 850 280" class="den"></path><text x="242" y="55" class="s">pᵧ(y)</text>
 <path d="M610 280C630 277 650 240 675 180S725 160 748 215S770 278 790 280" class="post"></path><line x1="705" y1="110" x2="705" y2="300" stroke="#526078" stroke-dasharray="7 6" stroke-width="2"></line><text x="687" y="325" class="s">y</text>
 <line x1="705" y1="245" x2="652" y2="245" class="arr"></line><text x="560" y="225" class="s">σ² ∇ log pᵧ(y)</text><line x1="652" y1="170" x2="652" y2="300" stroke="#d8a44a" stroke-width="3"></line><text x="590" y="350" class="s">E[X|Y=y]</text>
 <text x="55" y="380" class="n">At a mode: score = 0</text><text x="325" y="380" class="n">On a slope: move toward higher density</text><text x="625" y="380" class="n">A steeper score gives a larger correction</text></g>
<text x="480" y="500" text-anchor="middle" class="s">The score sets direction and σ² sets scale. Gaussian observation noise is essential here.</text></svg>

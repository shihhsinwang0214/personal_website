<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Tweedie 公式的密度坡度</title><desc id="d">讀數沿觀測密度的 score 往高密度處修正，坡越陡與噪聲越大時修正越多。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#c05b4b"/></marker></defs><rect width="960" height="540" rx="22" fill="#fbfaf7"/><style>.h{font:700 24px system-ui;fill:#172033}.s{font:700 17px system-ui;fill:#27344d}.n{font:14px system-ui;fill:#526078}.den{stroke:#2858a5;stroke-width:6;fill:#dceaf6}.post{stroke:#d8a44a;stroke-width:4;fill:#f8e7b6}.axis{stroke:#6c788a;stroke-width:2}.arr{stroke:#c05b4b;stroke-width:5;marker-end:url(#a)}</style>
<text x="38" y="46" class="h">Tweedie：最佳猜測 = 讀數 + σ² × 觀測密度的 score</text>
<g transform="translate(55 82)"><path d="M0 280H850" class="axis"/><path d="M10 280C120 278 175 225 230 90S355 40 420 160S520 275 850 280" class="den"/><text x="242" y="55" class="s">pᵧ(y)</text>
 <path d="M610 280C630 277 650 240 675 180S725 160 748 215S770 278 790 280" class="post"/><line x1="705" y1="110" x2="705" y2="300" stroke="#526078" stroke-dasharray="7 6" stroke-width="2"/><text x="687" y="325" class="s">y</text>
 <line x1="705" y1="245" x2="652" y2="245" class="arr"/><text x="560" y="225" class="s">σ² ∇ log pᵧ(y)</text><line x1="652" y1="170" x2="652" y2="300" stroke="#d8a44a" stroke-width="3"/><text x="590" y="350" class="s">E[X|Y=y]</text>
 <text x="55" y="380" class="n">山頂：score = 0，不修</text><text x="325" y="380" class="n">斜坡：往高密度處修</text><text x="625" y="380" class="n">遠端坡陡：修得更多</text></g>
<text x="480" y="500" text-anchor="middle" class="s">方向由 score 決定；長度再乘 σ²。Gaussian noise 是公式成立的關鍵。</text></svg>

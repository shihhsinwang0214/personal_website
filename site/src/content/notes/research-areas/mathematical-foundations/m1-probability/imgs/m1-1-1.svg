<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">條件期望的分桶與 tower property</title><desc id="d">按鞋碼分桶後，再把鞋碼二十五按性別細分，加權平均會回到原桶。</desc>
<rect width="960" height="540" rx="22" fill="#fbfaf7"/><style>.h{font:700 24px system-ui;fill:#172033}.s{font:700 17px system-ui;fill:#27344d}.n{font:14px system-ui;fill:#526078}.bin{fill:#dbe8f4;stroke:#6f89a6;stroke-width:2}.m{fill:#d8a44a}.f{fill:#6e9bc8}.dot{fill:#7b8797;opacity:.55}</style>
<text x="38" y="46" class="h">E[Y|X] 是每個桶上的數字；細分後按人數合併，仍回到大桶</text>
<g transform="translate(45 85)"><text x="0" y="0" class="s">鞋碼 X</text>
 <g transform="translate(20 45)"><rect width="105" height="175" rx="8" class="bin"/><text x="52" y="-12" text-anchor="middle" class="s">158</text><text x="52" y="205" text-anchor="middle" class="n">23</text></g>
 <g transform="translate(150 30)"><rect width="105" height="190" rx="8" class="bin"/><text x="52" y="-12" text-anchor="middle" class="s">161</text><text x="52" y="220" text-anchor="middle" class="n">24</text></g>
 <g transform="translate(280 15)"><rect width="105" height="205" rx="8" fill="#f5dfaa" stroke="#ad8531" stroke-width="3"/><text x="52" y="-12" text-anchor="middle" class="s">165.2</text><text x="52" y="235" text-anchor="middle" class="n">25</text></g>
 <g transform="translate(410 25)"><rect width="105" height="195" rx="8" class="bin"/><text x="52" y="-12" text-anchor="middle" class="s">169</text><text x="52" y="225" text-anchor="middle" class="n">26</text></g>
 <g transform="translate(540 40)"><rect width="105" height="180" rx="8" class="bin"/><text x="52" y="-12" text-anchor="middle" class="s">173</text><text x="52" y="210" text-anchor="middle" class="n">27</text></g>
 <g transform="translate(670 60)"><rect width="105" height="160" rx="8" class="bin"/><text x="52" y="-12" text-anchor="middle" class="s">177</text><text x="52" y="190" text-anchor="middle" class="n">28</text></g></g>
<path d="M378 330V365" stroke="#ad8531" stroke-width="4"/><path d="M378 365L270 405M378 365L495 405" stroke="#ad8531" stroke-width="4"/>
<g transform="translate(185 395)"><rect width="180" height="90" rx="12" fill="#d8a44a"/><text x="90" y="32" text-anchor="middle" class="s">男・25</text><text x="90" y="60" text-anchor="middle" class="s">40% × 170</text></g>
<g transform="translate(405 395)"><rect width="180" height="90" rx="12" fill="#75a6d0"/><text x="90" y="32" text-anchor="middle" class="s">女・25</text><text x="90" y="60" text-anchor="middle" class="s">60% × 162</text></g>
<text x="620" y="430" class="s">0.4×170 + 0.6×162 = 165.2</text><text x="620" y="462" class="n">小桶合併回大桶：tower property</text></svg>

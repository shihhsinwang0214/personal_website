<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">兩個 Gaussian 相加</title><desc id="d">兩個 Gaussian 的 variance 相加，標準差按畢氏定理合成。</desc>
<rect width="960" height="540" rx="22" fill="#fbfaf7"/><style>.h{font:700 25px system-ui;fill:#172033}.s{font:700 18px system-ui;fill:#27344d}.n{font:15px system-ui;fill:#526078}.p{fill:#eef3f8;stroke:#a0aec0;stroke-width:2}.a{fill:none;stroke:#2858a5;stroke-width:6}.b{fill:none;stroke:#c06c3d;stroke-width:6}.g{stroke:#d4dbe5;stroke-width:1}</style><text x="38" y="48" class="h">獨立 Gaussian 相加：形狀不變，variance 相加</text>
<g transform="translate(30 88)"><rect width="270" height="350" rx="16" class="p"/><text x="135" y="35" text-anchor="middle" class="s">A 台：σₐ = 1</text><path d="M25 285H245M135 70V300" class="g"/><path d="M25 285C70 282 82 245 100 160S170 75 188 160S205 282 245 285" class="a"/><text x="135" y="325" text-anchor="middle" class="n">variance = 1²</text></g>
<text x="320" y="270" class="h">＋</text>
<g transform="translate(345 88)"><rect width="270" height="350" rx="16" class="p"/><text x="135" y="35" text-anchor="middle" class="s">B 台：σᵦ = 0.5</text><path d="M25 285H245M135 70V300" class="g"/><path d="M25 285C98 285 110 250 118 130S152 60 160 130S172 285 245 285" class="b"/><text x="135" y="325" text-anchor="middle" class="n">variance = 0.5²</text></g>
<text x="635" y="270" class="h">＝</text>
<g transform="translate(675 88)"><rect width="255" height="350" rx="16" class="p"/><text x="128" y="35" text-anchor="middle" class="s">A+B：σ ≈ 1.12</text><path d="M20 285H235M128 70V300" class="g"/><path d="M20 285C58 279 74 230 92 155S165 82 183 155S204 279 235 285" class="a"/><path d="M47 250H137V160Z" fill="none" stroke="#c06c3d" stroke-width="3"/><text x="50" y="275" class="n">1</text><text x="141" y="238" class="n">0.5</text><text x="88" y="190" class="n">√1.25</text></g>
<text x="480" y="495" text-anchor="middle" class="s">σ² = σₐ² + σᵦ²；不是取較寬者，也不是把標準差直接相加。</text></svg>

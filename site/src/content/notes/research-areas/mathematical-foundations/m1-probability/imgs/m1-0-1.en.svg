<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" style="width: 960px; height: 540px;"><title id="t">Adding two Gaussians</title><desc id="d">Independent Gaussian variances add; standard deviations combine by the Pythagorean rule.</desc>
<rect width="960" height="540" rx="22" fill="#fbfaf7"></rect><style>.h{font:700 25px system-ui;fill:#172033}.s{font:700 18px system-ui;fill:#27344d}.n{font:15px system-ui;fill:#526078}.p{fill:#eef3f8;stroke:#a0aec0;stroke-width:2}.a{fill:none;stroke:#2858a5;stroke-width:6}.b{fill:none;stroke:#c06c3d;stroke-width:6}.g{stroke:#d4dbe5;stroke-width:1}</style><text x="38" y="48" class="h">Independent Gaussians: Gaussian shape, added variances</text>
<g transform="translate(30 88)"><rect width="270" height="350" rx="16" class="p"></rect><text x="135" y="35" text-anchor="middle" class="s">Machine A: σₐ = 1</text><path d="M25 285H245M135 70V300" class="g"></path><path d="M25 285C70 282 82 245 100 160S170 75 188 160S205 282 245 285" class="a"></path><text x="135" y="325" text-anchor="middle" class="n">variance = 1²</text></g>
<text x="320" y="270" class="h">＋</text>
<g transform="translate(345 88)"><rect width="270" height="350" rx="16" class="p"></rect><text x="135" y="35" text-anchor="middle" class="s">Machine B: σᵦ = 0.5</text><path d="M25 285H245M135 70V300" class="g"></path><path d="M25 285C98 285 110 250 118 130S152 60 160 130S172 285 245 285" class="b"></path><text x="135" y="325" text-anchor="middle" class="n">variance = 0.5²</text></g>
<text x="635" y="270" class="h">＝</text>
<g transform="translate(675 88)"><rect width="255" height="350" rx="16" class="p"></rect><text x="128" y="35" text-anchor="middle" class="s">A+B: σ ≈ 1.12</text><path d="M20 285H235M128 70V300" class="g"></path><path d="M20 285C58 279 74 230 92 155S165 82 183 155S204 279 235 285" class="a"></path><path d="M47 250H137V160Z" fill="none" stroke="#c06c3d" stroke-width="3"></path><text x="50" y="275" class="n">1</text><text x="141" y="238" class="n">0.5</text><text x="88" y="190" class="n">√1.25</text></g>
<text x="480" y="495" text-anchor="middle" class="s">σ² = σₐ² + σᵦ²; neither the larger width nor the sum of standard deviations.</text></svg>

 <g transform="translate(280 15)"><rect width="105" height="205" rx="8" fill="#f5dfaa" stroke="#ad8531" stroke-width="3"></rect><text x="52" y="-12" text-anchor="middle" class="s">165.2</text><text x="52" y="235" text-anchor="middle" class="n">25</text></g>
 <g transform="translate(410 25)"><rect width="105" height="195" rx="8" class="bin"></rect><text x="52" y="-12" text-anchor="middle" class="s">169</text><text x="52" y="225" text-anchor="middle" class="n">26</text></g>
 <g transform="translate(540 40)"><rect width="105" height="180" rx="8" class="bin"></rect><text x="52" y="-12" text-anchor="middle" class="s">173</text><text x="52" y="210" text-anchor="middle" class="n">27</text></g>
 <g transform="translate(670 60)"><rect width="105" height="160" rx="8" class="bin"></rect><text x="52" y="-12" text-anchor="middle" class="s">177</text><text x="52" y="190" text-anchor="middle" class="n">28</text></g></g>

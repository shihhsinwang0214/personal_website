<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" style="width: 960px; height: 540px;"><title id="t">Conditional-expectation bins and the tower property</title><desc id="d">Split a shoe-size bin by another attribute, then recombine subgroup means with their proportions.</desc>
<rect width="960" height="540" rx="22" fill="#fbfaf7"></rect><style>.h{font:700 24px system-ui;fill:#172033}.s{font:700 17px system-ui;fill:#27344d}.n{font:14px system-ui;fill:#526078}.bin{fill:#dbe8f4;stroke:#6f89a6;stroke-width:2}.m{fill:#d8a44a}.f{fill:#6e9bc8}.dot{fill:#7b8797;opacity:.55}</style>
<text x="38" y="46" class="h" textLength="910.0" lengthAdjust="spacingAndGlyphs" style="font-size: 21.7px;">E[Y|X] assigns a mean to each bin; weighted subgroup means recover the parent-bin mean</text>
<g transform="translate(45 85)"><text x="0" y="0" class="s">Shoe size X</text>
 <g transform="translate(20 45)"><rect width="105" height="175" rx="8" class="bin"></rect><text x="52" y="-12" text-anchor="middle" class="s">158</text><text x="52" y="205" text-anchor="middle" class="n">23</text></g>

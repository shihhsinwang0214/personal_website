<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">KL 是每天因用錯機率表而多付的代價</title><desc id="desc">兩條使用同一串結果的 log 財富曲線，以 KL 的固定斜率逐日分開，右上角列出真實機率 p 與下注機率 q。</desc>
  <defs><style>.bg{fill:#fbf8f1}.panel{fill:#fff;stroke:#d9d2c5;stroke-width:2}.axis{stroke:#777d84;stroke-width:2}.grid{stroke:#e5e0d6;stroke-width:1}.p{fill:none;stroke:#315a9e;stroke-width:4}.q{fill:none;stroke:#c34e4e;stroke-width:4}.trend{fill:none;stroke-width:2;stroke-dasharray:8 7}.ink{fill:#202733;font-family:system-ui,sans-serif}.muted{fill:#6c706f;font-family:system-ui,sans-serif}</style></defs>
  <rect class="bg" width="960" height="540" rx="22"/><text class="ink" x="48" y="48" font-size="25" font-weight="700">KL：不是一次罰金，是每天付的租金</text><rect class="panel" x="42" y="76" width="690" height="388" rx="18"/><rect class="panel" x="752" y="76" width="166" height="210" rx="18"/>
  <line class="axis" x1="88" y1="410" x2="690" y2="410"/><line class="axis" x1="88" y1="410" x2="88" y2="115"/><g class="grid"><line x1="88" y1="335" x2="690" y2="335"/><line x1="88" y1="260" x2="690" y2="260"/><line x1="88" y1="185" x2="690" y2="185"/></g>
  <path class="p" d="M90 381 L119 365 L151 370 L180 338 L211 350 L242 323 L271 327 L302 294 L333 302 L364 271 L394 278 L425 243 L455 253 L486 217 L517 228 L548 193 L578 199 L610 166 L641 175 L687 127"/>
  <path class="q" d="M90 381 L119 371 L151 383 L180 358 L211 376 L242 351 L271 367 L302 339 L333 360 L364 330 L394 351 L425 320 L455 342 L486 306 L517 331 L548 294 L578 319 L610 281 L641 306 L687 259"/>
  <path class="trend" stroke="#315a9e" d="M90 382 L687 130"/><path class="trend" stroke="#c34e4e" d="M90 382 L687 260"/><line x1="696" y1="130" x2="696" y2="260" stroke="#c34e4e" stroke-width="7"/><text class="ink" x="563" y="115" font-size="14" font-weight="700">照 p 下注</text><text class="ink" x="560" y="279" font-size="14" font-weight="700">照 q 下注</text><text class="muted" x="675" y="198" text-anchor="end" font-size="13">365 × KL(p‖q)</text><text class="muted" x="385" y="444" text-anchor="middle" font-size="13">天數</text><text class="muted" x="66" y="126" font-size="13">log W</text>
  <text class="ink" x="776" y="108" font-size="16" font-weight="700">三種天氣</text><text class="muted" x="778" y="137" font-size="13">A　B　C</text><text class="ink" x="772" y="171" font-size="14" font-weight="700">p</text><g fill="#315a9e"><rect x="800" y="153" width="46" height="23"/><rect x="850" y="161" width="28" height="15"/><rect x="882" y="166" width="18" height="10"/></g><text class="ink" x="772" y="218" font-size="14" font-weight="700">q</text><g fill="#c34e4e"><rect x="800" y="198" width="56" height="23"/><rect x="860" y="215" width="10" height="6"/><rect x="874" y="209" width="26" height="12"/></g><text class="muted" x="773" y="253" font-size="12">低估 B 最昂貴</text>
  <text class="ink" x="480" y="505" text-anchor="middle" font-size="17" font-weight="650">每天多輸 Eₚ[log(p/q)] = KL(p‖q)</text>

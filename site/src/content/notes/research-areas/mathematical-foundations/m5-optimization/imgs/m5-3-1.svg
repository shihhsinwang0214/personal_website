<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Generator gradient 是 score 差乘上 generator 靈敏度</title><desc id="desc">左側固定六個雜訊紙條送入生成器，右側生成樣本位於模型與目標 log 密度差形成的坡面上，箭頭指出各樣本的更新方向。</desc>
  <defs><style>.bg{fill:#fbf8f1}.panel{fill:#fff;stroke:#d9d2c5;stroke-width:2}.ink{fill:#202733;font-family:system-ui,sans-serif}.muted{fill:#6c706f;font-family:system-ui,sans-serif}.paper{fill:#eee6d7;stroke:#b6aa98}.machine{fill:#315a9e}.model{fill:none;stroke:#315a9e;stroke-width:4}.target{fill:none;stroke:#c34e4e;stroke-width:4;stroke-dasharray:8 6}.land{fill:none;stroke:#b77b16;stroke-width:3}.arr{stroke:#2f8b59;stroke-width:4;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f8b59"/></marker></defs>
  <rect class="bg" width="960" height="540" rx="22"/><text class="ink" x="48" y="48" font-size="25" font-weight="700">固定骰子：坡 × 靈敏度</text><rect class="panel" x="42" y="76" width="325" height="388" rx="18"/><rect class="panel" x="390" y="76" width="528" height="388" rx="18"/>
  <text class="ink" x="66" y="112" font-size="17" font-weight="700">同一批 z，轉動 θ</text><g class="paper"><rect x="67" y="150" width="54" height="32" rx="5"/><rect x="67" y="192" width="54" height="32" rx="5"/><rect x="67" y="234" width="54" height="32" rx="5"/><rect x="67" y="276" width="54" height="32" rx="5"/><rect x="67" y="318" width="54" height="32" rx="5"/><rect x="67" y="360" width="54" height="32" rx="5"/></g><g class="muted" font-size="13" text-anchor="middle"><text x="94" y="171">z₁</text><text x="94" y="213">z₂</text><text x="94" y="255">z₃</text><text x="94" y="297">z₄</text><text x="94" y="339">z₅</text><text x="94" y="381">z₆</text></g>
  <path d="M133 171 L196 247 M133 213 L196 253 M133 255 L196 259 M133 297 L196 265 M133 339 L196 271 M133 381 L196 277" stroke="#aaa195" stroke-width="2"/><rect class="machine" x="196" y="210" width="116" height="112" rx="18"/><text x="254" y="260" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="23" font-weight="700">Gθ</text><circle cx="279" cy="226" r="12" fill="#d8a44a"/><text class="muted" x="180" y="350" font-size="13">∂θG：θ 改變一點</text><text class="muted" x="180" y="371" font-size="13">每個產品移多少</text>
  <text class="ink" x="414" y="112" font-size="17" font-weight="700">機器 vs 規格的地形</text><line x1="426" y1="356" x2="888" y2="356" stroke="#777d84" stroke-width="2"/><path class="model" d="M426 305 C500 302 526 178 602 178 C678 178 704 305 888 305"/><path class="target" d="M426 305 C606 305 630 151 710 151 C790 151 813 305 888 305"/><path class="land" d="M426 388 C530 374 560 338 618 356 C672 372 705 420 770 403 C823 390 852 366 888 366"/>
  <g fill="#315a9e"><circle cx="514" cy="381" r="6"/><circle cx="562" cy="354" r="6"/><circle cx="615" cy="358" r="6"/><circle cx="666" cy="388" r="6"/><circle cx="722" cy="413" r="6"/><circle cx="790" cy="397" r="6"/></g><g class="arr"><line x1="514" y1="381" x2="542" y2="370"/><line x1="562" y1="354" x2="589" y2="357"/><line x1="615" y1="358" x2="642" y2="372"/><line x1="666" y1="388" x2="696" y2="405"/><line x1="722" y1="413" x2="752" y2="408"/><line x1="790" y1="397" x2="816" y2="380"/></g><text class="muted" x="428" y="438" font-size="13">箭頭：−∇x[log pθ − log p*]</text>
  <text class="ink" x="480" y="505" text-anchor="middle" font-size="16" font-weight="650">∇θ KL = Eᵤ[(scoreθ − score*) · ∂θGθ]</text>
</svg>

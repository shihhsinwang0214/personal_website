<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">EMA 的幾何權重與漏水桶比喻</title><desc id="desc">左側以幾何遞減柱表示 EMA 對過去讀數的權重，並與最近十點等權平均對照；右側以進水和漏水的桶表示遞迴更新。</desc>
  <defs><style>.bg{fill:#fbf8f1}.panel{fill:#fff;stroke:#d9d2c5;stroke-width:2}.ink{fill:#202733;font-family:system-ui,sans-serif}.muted{fill:#6c706f;font-family:system-ui,sans-serif}.bar{fill:#315a9e}.avg{fill:#c7a04e}.water{fill:#7faed8}.arrow{stroke:#c34e4e;stroke-width:5;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c34e4e"/></marker></defs>
  <rect class="bg" width="960" height="540" rx="22"/><text class="ink" x="48" y="48" font-size="25" font-weight="700">EMA：一個數，記住整段過去</text><rect class="panel" x="42" y="76" width="585" height="388" rx="18"/><rect class="panel" x="650" y="76" width="268" height="388" rx="18"/>
  <text class="ink" x="68" y="112" font-size="17" font-weight="700">幾何權重（β = 0.9）</text><line x1="76" y1="315" x2="596" y2="315" stroke="#777d84" stroke-width="2"/>
  <g class="bar"><rect x="88" y="188" width="27" height="127"/><rect x="123" y="201" width="27" height="114"/><rect x="158" y="212" width="27" height="103"/><rect x="193" y="222" width="27" height="93"/><rect x="228" y="231" width="27" height="84"/><rect x="263" y="239" width="27" height="76"/><rect x="298" y="247" width="27" height="68"/><rect x="333" y="253" width="27" height="62"/><rect x="368" y="259" width="27" height="56"/><rect x="403" y="265" width="27" height="50"/><rect x="438" y="270" width="27" height="45"/><rect x="473" y="274" width="27" height="41"/></g>
  <text class="muted" x="101" y="339" text-anchor="middle" font-size="12">xₜ</text><text class="muted" x="171" y="339" text-anchor="middle" font-size="12">xₜ₋₂</text><text class="muted" x="311" y="339" text-anchor="middle" font-size="12">xₜ₋₆</text><text class="muted" x="486" y="339" text-anchor="middle" font-size="12">更早</text><path d="M90 165 H430" stroke="#c34e4e" stroke-width="2" stroke-dasharray="6 5"/><text class="muted" x="260" y="153" text-anchor="middle" font-size="13">有效記憶 ≈ 1/(1−β) = 10 步</text>
  <text class="ink" x="68" y="390" font-size="14" font-weight="700">最近 10 點等權平均：硬截止</text><g class="avg"><rect x="292" y="405" width="22" height="34"/><rect x="318" y="405" width="22" height="34"/><rect x="344" y="405" width="22" height="34"/><rect x="370" y="405" width="22" height="34"/><rect x="396" y="405" width="22" height="34"/><rect x="422" y="405" width="22" height="34"/><rect x="448" y="405" width="22" height="34"/><rect x="474" y="405" width="22" height="34"/><rect x="500" y="405" width="22" height="34"/><rect x="526" y="405" width="22" height="34"/></g>
  <text class="ink" x="676" y="112" font-size="17" font-weight="700">漏水的桶</text><path d="M708 212 L728 390 H842 L862 212" fill="none" stroke="#777d84" stroke-width="6"/><path class="water" d="M721 290 H849 L839 380 H731Z"/><path class="arrow" d="M750 135 V244"/><text class="muted" x="677" y="154" font-size="13">倒入 (1−β)xₜ</text><path class="arrow" d="M846 350 H894"/><text class="muted" x="681" y="426" font-size="13">每步漏掉 (1−β)mₜ₋₁</text><text class="ink" x="785" y="335" text-anchor="middle" font-size="24" font-weight="700">mₜ</text>
  <text class="ink" x="480" y="505" text-anchor="middle" font-size="17" font-weight="650">mₜ = (1−β) Σ βᵏxₜ₋ₖ　·　權重和 = 1</text>
</svg>

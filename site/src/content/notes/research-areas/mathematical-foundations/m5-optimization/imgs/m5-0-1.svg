<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Jensen gap：彎度乘上散佈</title><desc id="desc">左側比較凸曲線上的平均點與弦上的期望，右側顯示保單池變大後散佈與 Jensen gap 都縮小。</desc>
  <defs><style>.bg{fill:#fbf8f1}.panel{fill:#fff;stroke:#d9d2c5;stroke-width:2}.axis{stroke:#7a7f87;stroke-width:2}.curve{fill:none;stroke:#315a9e;stroke-width:5}.chord{stroke:#c34e4e;stroke-width:4}.dash{stroke:#8e8a80;stroke-width:2;stroke-dasharray:7 7}.gap{stroke:#c34e4e;stroke-width:9}.ink{fill:#202733;font-family:system-ui,sans-serif}.muted{fill:#6c706f;font-family:system-ui,sans-serif}.blue{fill:#315a9e}.red{fill:#c34e4e}.green{fill:#2f8b59}</style></defs>
  <rect class="bg" width="960" height="540" rx="22"/><text class="ink" x="48" y="48" font-size="25" font-weight="700">Jensen gap = 彎度 × 散佈</text>
  <rect class="panel" x="42" y="76" width="550" height="388" rx="18"/><rect class="panel" x="614" y="76" width="304" height="388" rx="18"/>
  <text class="ink" x="68" y="112" font-size="17" font-weight="700">一個人的隨機損失 X</text><line class="axis" x1="88" y1="410" x2="550" y2="410"/><line class="axis" x1="88" y1="410" x2="88" y2="142"/>
  <path class="curve" d="M100 386 C205 380 286 340 350 267 C422 184 493 153 548 145"/><line class="chord" x1="130" y1="374" x2="526" y2="155"/>
  <line class="dash" x1="316" y1="410" x2="316" y2="237"/><circle class="blue" cx="316" cy="297" r="7"/><circle fill="#fff" stroke="#c34e4e" stroke-width="4" cx="316" cy="258" r="8"/><line class="gap" x1="316" y1="272" x2="316" y2="286"/>
  <text class="muted" x="328" y="303" font-size="14">φ(E[X])</text><text class="red" x="328" y="250" font-size="14">E[φ(X)]</text><text class="red" x="333" y="278" font-size="13" font-weight="700">gap</text>
  <rect x="126" y="390" width="20" height="20" fill="#c7a04e"/><rect x="516" y="390" width="20" height="20" fill="#c7a04e"/><text class="muted" x="93" y="435" font-size="13">兩個可能損失拉得越開，弦離曲線越遠</text>
  <text class="ink" x="638" y="112" font-size="17" font-weight="700">十萬人的平均損失</text><line class="axis" x1="650" y1="368" x2="890" y2="368"/><path class="curve" d="M650 345 C730 334 807 303 890 244"/><line class="chord" x1="753" y1="310" x2="789" y2="291"/><line class="dash" x1="771" y1="368" x2="771" y2="300"/><line class="gap" x1="771" y1="299" x2="771" y2="302"/>
  <g fill="#c7a04e"><rect x="750" y="352" width="7" height="16"/><rect x="761" y="345" width="7" height="23"/><rect x="772" y="342" width="7" height="26"/><rect x="783" y="350" width="7" height="18"/></g><text class="green" x="650" y="408" font-size="15" font-weight="700">X 幾乎不隨機</text><text class="muted" x="650" y="432" font-size="13">弦貼住曲線 → gap 幾乎為 0</text>
  <text class="ink" x="480" y="505" text-anchor="middle" font-size="18" font-weight="650">gap ≈ ½ φ″ · Var(X)</text>
</svg>

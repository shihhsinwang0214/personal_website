<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Euler 與 midpoint 的一步</title><desc id="d">Euler 使用起點切線，midpoint 先試半步再用中點斜率，對平滑曲線有更小誤差。</desc>
<rect width="960" height="540" rx="22" fill="#fbfaf7"/><style>.h{font:700 24px system-ui;fill:#172033}.s{font:700 18px system-ui;fill:#27344d}.n{font:14px system-ui;fill:#526078}.p{fill:#eef3f8;stroke:#9facba;stroke-width:2}.true{stroke:#2858a5;stroke-width:7;fill:none}.eu{stroke:#c65c4b;stroke-width:5;fill:none}.mid{stroke:#d8a44a;stroke-width:5;fill:none}.dash{stroke-dasharray:8 6}</style>
<text x="38" y="46" class="h">同樣一步：Euler 只讀起點，midpoint 多讀中點來看見彎曲</text>
<g transform="translate(35 85)"><rect width="430" height="370" rx="16" class="p"/><text x="215" y="36" text-anchor="middle" class="s">Euler：沿起點切線</text><path d="M45 305Q150 80 365 70" class="true"/><path d="M45 305L360 210" class="eu"/><path d="M360 210L300 105" class="eu dash"/><text x="80" y="342" class="n">局部誤差 O(h²)</text></g>
<g transform="translate(495 85)"><rect width="430" height="370" rx="16" class="p"/><text x="215" y="36" text-anchor="middle" class="s">midpoint：試半步，再沿中點斜率</text><path d="M45 305Q150 80 365 70" class="true"/><path d="M45 305L190 258" class="mid dash"/><circle cx="190" cy="258" r="8" fill="#d8a44a"/><path d="M45 305L340 102" class="mid"/><path d="M340 102L315 88" class="mid dash"/><text x="80" y="342" class="n">局部誤差 O(h³)</text></g>
<text x="480" y="505" text-anchor="middle" class="s">平滑路徑上二階方法更省步；遇到尖角，兩者的階數優勢都會消失。</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" style="width: 960px; height: 540px;"><title id="t">Local and global Euler errors</title><desc id="d">Euler follows tangents, incurring second-order local defects and first-order global error; constant velocity is exact.</desc>
<rect width="960" height="540" rx="22" fill="#fbfaf7"></rect><style>.h{font:700 24px system-ui;fill:#172033}.s{font:700 17px system-ui;fill:#27344d}.n{font:14px system-ui;fill:#526078}.p{fill:#eef3f8;stroke:#9facba;stroke-width:2}.true{stroke:#2858a5;stroke-width:6;fill:none}.eu{stroke:#d8a44a;stroke-width:5;fill:none}.err{stroke:#c65c4b;stroke-width:4}</style>
<text x="38" y="46" class="h">Euler steps along tangents: local h², accumulated global h</text>
<g transform="translate(30 90)"><rect width="285" height="350" rx="16" class="p"></rect><text x="142" y="34" text-anchor="middle" class="s">One step leaves the arc</text><path d="M45 280Q80 80 245 70" class="true"></path><path d="M45 280L235 215" class="eu"></path><path d="M235 215L170 108" class="err"></path><text x="65" y="315" class="n">Local error ≈ ½h²v²/R</text></g>
<g transform="translate(338 90)"><rect width="285" height="350" rx="16" class="p"></rect><text x="142" y="34" text-anchor="middle" class="s">Errors propagate across steps</text><path d="M40 280Q70 70 245 75" class="true"></path><path d="M40 280L85 235L125 185L170 140L220 105L260 88" class="eu"></path><g fill="#d8a44a"><circle cx="85" cy="235" r="5"></circle><circle cx="125" cy="185" r="5"></circle><circle cx="170" cy="140" r="5"></circle><circle cx="220" cy="105" r="5"></circle></g><text x="35" y="315" class="n" textLength="240.0" lengthAdjust="spacingAndGlyphs" style="font-size: 12.88px;">Global error: local defects × propagation</text></g>
<g transform="translate(646 90)"><rect width="285" height="350" rx="16" class="p"></rect><text x="142" y="34" text-anchor="middle" class="s">Constant velocity: exact</text><path d="M35 270L245 85" class="true"></path><path d="M35 270L245 85" class="eu"></path><text x="55" y="315" class="s">ẍ = 0 → error = 0</text></g>
<text x="480" y="500" text-anchor="middle" class="s">Halving h roughly halves global error in the convergent regime; unstable steps can oscillate or diverge.</text></svg>

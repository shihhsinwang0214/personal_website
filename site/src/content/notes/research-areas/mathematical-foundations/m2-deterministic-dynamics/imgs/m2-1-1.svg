<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">一團葉子的 pushforward</title><desc id="d">同一批點與格網被 flow map 拉長壓扁，格內點數不變而面積改變。</desc>
<rect width="960" height="540" rx="22" fill="#fbfaf7"/><style>.h{font:700 24px system-ui;fill:#172033}.s{font:700 17px system-ui;fill:#27344d}.n{font:14px system-ui;fill:#526078}.p{fill:#e9f1f6;stroke:#9cadbd;stroke-width:2}.g{fill:none;stroke:#6f91ad;stroke-width:2}.cloud{fill:#2858a5;opacity:.55}.arrow{stroke:#c06c3d;stroke-width:5}</style>
<text x="38" y="46" class="h">flow map 搬動整團分布：點數守恆，密度由面積伸縮決定</text>
<g transform="translate(30 90)"><rect width="270" height="340" rx="16" class="p"/><text x="135" y="32" text-anchor="middle" class="s">t = 0</text><circle cx="135" cy="185" r="85" class="g"/><path d="M50 100H220M50 157H220M50 214H220M50 270H220M50 100V270M107 100V270M164 100V270M220 100V270" class="g"/><g class="cloud"><circle cx="105" cy="155" r="5"/><circle cx="145" cy="130" r="5"/><circle cx="180" cy="180" r="5"/><circle cx="92" cy="210" r="5"/><circle cx="150" cy="225" r="5"/><circle cx="125" cy="180" r="5"/></g><text x="18" y="318" class="n">框內點數：6</text></g>
<path d="M305 260H335" class="arrow"/><text x="302" y="245" class="n">Φ₂₀</text>
<g transform="translate(345 90)"><rect width="270" height="340" rx="16" class="p"/><text x="135" y="32" text-anchor="middle" class="s">t = 20</text><ellipse cx="135" cy="185" rx="110" ry="58" class="g"/><path d="M25 127C80 150 190 150 245 127M25 185H245M25 243C80 220 190 220 245 243M25 127C58 150 58 220 25 243M98 127C112 150 112 220 98 243M172 127C158 150 158 220 172 243M245 127C212 150 212 220 245 243" class="g"/><g class="cloud"><circle cx="92" cy="171" r="5"/><circle cx="147" cy="150" r="5"/><circle cx="200" cy="183" r="5"/><circle cx="72" cy="205" r="5"/><circle cx="157" cy="215" r="5"/><circle cx="125" cy="184" r="5"/></g><text x="18" y="318" class="n">對應框內點數：6</text></g>
<path d="M620 260H650" class="arrow"/><text x="617" y="245" class="n">Φ₄₀</text>
<g transform="translate(660 90)"><rect width="270" height="340" rx="16" class="p"/><text x="135" y="32" text-anchor="middle" class="s">t = 40</text><ellipse cx="135" cy="185" rx="125" ry="35" class="g"/><path d="M10 150C75 172 195 172 260 150M10 185H260M10 220C75 198 195 198 260 220M10 150C40 170 40 200 10 220M93 150C110 170 110 200 93 220M177 150C160 170 160 200 177 220M260 150C230 170 230 200 260 220" class="g"/><g class="cloud"><circle cx="72" cy="177" r="5"/><circle cx="150" cy="162" r="5"/><circle cx="220" cy="184" r="5"/><circle cx="50" cy="198" r="5"/><circle cx="165" cy="205" r="5"/><circle cx="120" cy="184" r="5"/></g><text x="18" y="318" class="n">對應框內點數：6</text></g>
<text x="480" y="490" text-anchor="middle" class="s">同一小塊的質量不變；面積變小，密度就按 1/|det ∇Φ| 變大。</text></svg>

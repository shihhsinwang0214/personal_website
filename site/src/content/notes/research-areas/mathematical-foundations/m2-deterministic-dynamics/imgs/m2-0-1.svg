<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">水流地圖與葉子軌跡</title><desc id="d">向量場每點一支箭頭，葉子軌跡處處以箭頭為切線，同一起點得到同一路徑。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#547897"/></marker></defs><rect width="960" height="540" rx="22" fill="#fbfaf7"/><style>.h{font:700 24px system-ui;fill:#172033}.s{font:700 17px system-ui;fill:#27344d}.n{font:14px system-ui;fill:#526078}.river{fill:#dcecf5;stroke:#8aa9be;stroke-width:2}.v{stroke:#547897;stroke-width:2;marker-end:url(#a)}.p1{stroke:#c66a3c;stroke-width:6;fill:none}.p2{stroke:#2858a5;stroke-width:5;fill:none}</style>
<text x="38" y="46" class="h">vector field 是地圖；ODE 軌跡是照著每一點箭頭走出的路</text><rect x="45" y="82" width="870" height="350" rx="80" class="river"/>
<g class="v"><path d="M90 145l45 16"/><path d="M200 145l45-4"/><path d="M310 145l45-18"/><path d="M420 145l45-8"/><path d="M530 145l45 12"/><path d="M640 145l45 18"/><path d="M750 145l45 0"/><path d="M90 235l55 15"/><path d="M200 235l55-5"/><path d="M310 235l55-20"/><path d="M420 235l55-9"/><path d="M530 235l55 13"/><path d="M640 235l55 20"/><path d="M750 235l55 1"/><path d="M90 330l43 15"/><path d="M200 330l43-4"/><path d="M310 330l43-17"/><path d="M420 330l43-7"/><path d="M530 330l43 11"/><path d="M640 330l43 17"/><path d="M750 330l43 0"/></g>
<path d="M78 260C190 305 280 195 385 205S575 320 690 280S810 190 880 218" class="p1"/><path d="M78 315C190 360 280 250 385 260S575 375 690 335S810 245 880 273" class="p2"/>
<g fill="#d8a44a"><circle cx="78" cy="260" r="8"/><circle cx="385" cy="205" r="8"/><circle cx="690" cy="280" r="8"/></g><text x="75" y="470" class="s">ẋ(t)=u(x(t),t)：軌跡在每一點的切線，正好就是該點的箭頭</text><text x="665" y="500" class="n">smooth/Lipschitz 場中，同時刻的兩條軌跡不交叉。</text></svg>

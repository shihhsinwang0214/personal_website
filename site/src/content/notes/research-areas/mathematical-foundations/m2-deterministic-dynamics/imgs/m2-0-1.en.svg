<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" style="width: 960px; height: 540px;"><title id="t">A flow map of arrows and leaf trajectories</title><desc id="d">A vector field assigns an arrow at each point; an ODE trajectory follows those arrows, uniquely under suitable assumptions.</desc>

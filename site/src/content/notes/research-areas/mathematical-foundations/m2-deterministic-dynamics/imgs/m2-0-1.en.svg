<g fill="#d8a44a"><circle cx="78" cy="260" r="8"></circle><circle cx="385" cy="205" r="8"></circle><circle cx="690" cy="280" r="8"></circle></g><text x="75" y="470" class="s">ẋ(t)=u(x(t),t): the trajectory's tangent equals the local arrow</text><text x="665" y="500" class="n" textLength="283.0" lengthAdjust="spacingAndGlyphs" style="font-size: 10.15px;">With uniqueness, trajectories cannot cross at the same time.</text></svg>

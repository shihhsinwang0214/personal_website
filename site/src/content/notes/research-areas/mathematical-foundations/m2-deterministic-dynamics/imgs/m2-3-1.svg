<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Euler 法的局部與全域誤差</title><desc id="d">Euler 沿切線前進，在曲線上留下二階局部誤差並逐步累積；直線等速時誤差為零。</desc>
<rect width="960" height="540" rx="22" fill="#fbfaf7"/><style>.h{font:700 24px system-ui;fill:#172033}.s{font:700 17px system-ui;fill:#27344d}.n{font:14px system-ui;fill:#526078}.p{fill:#eef3f8;stroke:#9facba;stroke-width:2}.true{stroke:#2858a5;stroke-width:6;fill:none}.eu{stroke:#d8a44a;stroke-width:5;fill:none}.err{stroke:#c65c4b;stroke-width:4}</style>
<text x="38" y="46" class="h">Euler 每一步沿切線直走：局部 h²，全程累積成 h</text>
<g transform="translate(30 90)"><rect width="285" height="350" rx="16" class="p"/><text x="142" y="34" text-anchor="middle" class="s">一步：離開圓弧</text><path d="M45 280Q80 80 245 70" class="true"/><path d="M45 280L235 215" class="eu"/><path d="M235 215L170 108" class="err"/><text x="65" y="315" class="n">局部誤差 ≈ ½h²v²/R</text></g>
<g transform="translate(338 90)"><rect width="285" height="350" rx="16" class="p"/><text x="142" y="34" text-anchor="middle" class="s">多步：誤差被帶著走</text><path d="M40 280Q70 70 245 75" class="true"/><path d="M40 280L85 235L125 185L170 140L220 105L260 88" class="eu"/><g fill="#d8a44a"><circle cx="85" cy="235" r="5"/><circle cx="125" cy="185" r="5"/><circle cx="170" cy="140" r="5"/><circle cx="220" cy="105" r="5"/></g><text x="35" y="315" class="n">全域誤差 ≈ h × 曲率積分 × 放大因子</text></g>
<g transform="translate(646 90)"><rect width="285" height="350" rx="16" class="p"/><text x="142" y="34" text-anchor="middle" class="s">直線等速：完全正確</text><path d="M35 270L245 85" class="true"/><path d="M35 270L245 85" class="eu"/><text x="55" y="315" class="s">ẍ = 0 → 誤差 = 0</text></g>
<text x="480" y="500" text-anchor="middle" class="s">h 減半，全域誤差約減半；但穩定區外，誤差會震盪甚至發散。</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" style="width: 960px; height: 540px;"><title id="t">One step of Euler and midpoint</title><desc id="d">Euler uses the starting tangent; midpoint probes halfway and uses that slope for a more accurate smooth step.</desc>
<rect width="960" height="540" rx="22" fill="#fbfaf7"></rect><style>.h{font:700 24px system-ui;fill:#172033}.s{font:700 18px system-ui;fill:#27344d}.n{font:14px system-ui;fill:#526078}.p{fill:#eef3f8;stroke:#9facba;stroke-width:2}.true{stroke:#2858a5;stroke-width:7;fill:none}.eu{stroke:#c65c4b;stroke-width:5;fill:none}.mid{stroke:#d8a44a;stroke-width:5;fill:none}.dash{stroke-dasharray:8 6}</style>
<text x="38" y="46" class="h">Euler reads the start; midpoint also probes halfway</text>
<g transform="translate(35 85)"><rect width="430" height="370" rx="16" class="p"></rect><text x="215" y="36" text-anchor="middle" class="s">Euler: starting tangent</text><path d="M45 305Q150 80 365 70" class="true"></path><path d="M45 305L360 210" class="eu"></path><path d="M360 210L300 105" class="eu dash"></path><text x="80" y="342" class="n">Local error O(h²)</text></g>
<g transform="translate(495 85)"><rect width="430" height="370" rx="16" class="p"></rect><text x="215" y="36" text-anchor="middle" class="s">Midpoint: probe halfway, then use its slope</text><path d="M45 305Q150 80 365 70" class="true"></path><path d="M45 305L190 258" class="mid dash"></path><circle cx="190" cy="258" r="8" fill="#d8a44a"></circle><path d="M45 305L340 102" class="mid"></path><path d="M340 102L315 88" class="mid dash"></path><text x="80" y="342" class="n">Local error O(h³)</text></g>
<text x="480" y="505" text-anchor="middle" class="s">Second-order methods save steps on smooth paths; nonsmooth corners can destroy the expected order.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" style="width: 960px; height: 540px;"><title id="t">Tile-by-tile accounting and continuity</title><desc id="d">Flux through a cell's four sides determines its density change; all cells together describe distribution evolution.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2858a5"></path></marker></defs><rect width="960" height="540" rx="22" fill="#fbfaf7"></rect><style>.h{font:700 24px system-ui;fill:#172033}.s{font:700 17px system-ui;fill:#27344d}.n{font:14px system-ui;fill:#526078}.tile{fill:#e0ecf5;stroke:#6f89a6;stroke-width:3}.fl{stroke:#2858a5;stroke-width:5;marker-end:url(#a)}.grid{stroke:#a8b5c4;stroke-width:1}.plus{fill:#c65c4b}.minus{fill:#3477b8}.zero{fill:#6f9b72}</style>
<text x="38" y="46" class="h">Continuity: record inflow minus outflow for every tile</text>
<g transform="translate(55 95)"><text x="125" y="0" text-anchor="middle" class="s">Zoom into one cell</text><rect x="35" y="70" width="180" height="180" class="tile"></rect><text x="125" y="166" text-anchor="middle" class="s">Count = p ΔxΔy</text><path d="M0 160H70M250 160H180M125 35V105M125 285V215" class="fl"></path><text x="0" y="145" class="n">Inflow</text><text x="220" y="145" class="n">In / out</text><text x="15" y="330" class="s">Rate of change = in − out</text><text x="0" y="360" class="n">= −∇·(pu) ΔxΔy</text></g>
<g transform="translate(390 90)"><text x="250" y="0" text-anchor="middle" class="s">Account for every cell</text><rect x="0" y="45" width="500" height="300" fill="#eaf2f7" stroke="#6f89a6" stroke-width="2"></rect><path d="M0 105H500M0 165H500M0 225H500M0 285H500M62 45V345M124 45V345M186 45V345M248 45V345M310 45V345M372 45V345M434 45V345" class="grid"></path>
 <rect x="124" y="105" width="62" height="60" class="plus"></rect><text x="155" y="142" text-anchor="middle" class="s">+</text><rect x="310" y="225" width="62" height="60" class="minus"></rect><text x="341" y="262" text-anchor="middle" class="s">−</text><rect x="372" y="105" width="62" height="60" class="zero"></rect><text x="403" y="142" text-anchor="middle" class="s">0</text>
 <g class="fl"><path d="M35 82h35"></path><path d="M98 142h35"></path><path d="M220 202h35"></path><path d="M280 262h35"></path><path d="M400 320h35"></path></g><text x="0" y="380" class="n">Red: density rises · Blue: falls · Green: balanced flux</text></g>
<text x="480" y="505" text-anchor="middle" class="s">∂ₜp = −∇·(pu): local mass accounts combine into distribution evolution.</text></svg>

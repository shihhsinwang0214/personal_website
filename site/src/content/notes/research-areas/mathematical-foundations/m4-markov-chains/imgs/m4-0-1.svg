<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">一千顆棋子在兩個格子之間跳</title><desc id="desc">兩狀態 Markov chain 的轉移規則與分布逐日收斂到 stationary distribution。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:12px;fill:#657176}.n{font-size:11px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.sun{fill:#d9b875;stroke:#a8864c;stroke-width:2}.rain{fill:#86a4b4;stroke:#587e9b;stroke-width:2}.arr1{fill:none;stroke:#c09551;stroke-width:8;marker-end:url(#g)}.arr2{fill:none;stroke:#587e9b;stroke-width:5;marker-end:url(#b)}.self1{fill:none;stroke:#c09551;stroke-width:7;marker-end:url(#g)}.self2{fill:none;stroke:#587e9b;stroke-width:6;marker-end:url(#b)}.barS{fill:#d9b875}.barR{fill:#86a4b4}.mix{stroke:#6f9278;stroke-width:2;stroke-dasharray:6 4}</style>
 <defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c09551"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#587e9b"/></marker></defs>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">反覆乘同一個 transition matrix，會逐步忘掉起點</text>
 <g transform="translate(40 68)"><rect class="panel" width="880" height="230" rx="12"/><text x="18" y="29" class="h">今天的狀態只決定明天的跳法</text>
  <circle cx="245" cy="125" r="62" class="sun"/><text x="226" y="120" class="h">S</text><text x="219" y="143" class="s">晴</text><circle cx="635" cy="125" r="62" class="rain"/><text x="617" y="120" class="h">R</text><text x="609" y="143" class="s">雨</text>
  <path d="M306 105C395 55 484 55 573 105" class="arr2"/><text x="427" y="64" class="h">0.2</text><path d="M574 151C485 202 395 202 306 151" class="arr1"/><text x="427" y="207" class="h">0.4</text>
  <path d="M211 65C161 7 124 83 181 101" class="self1"/><text x="116" y="52" class="h">0.8</text><path d="M670 65C720 7 758 83 700 101" class="self2"/><text x="740" y="52" class="h">0.6</text>
 </g>
 <g transform="translate(40 318)"><rect class="panel" width="880" height="174" rx="12"/><text x="18" y="27" class="h">1000 顆棋子的分布</text>
  <g transform="translate(25 45)"><g><rect width="120" height="70" rx="7" fill="#f1ead9" stroke="#d8d8cf"/><rect y="0" width="120" height="70" class="barS"/><text x="42" y="92" class="s">n=0</text><text x="22" y="112" class="n">1000 / 0</text></g>
   <g transform="translate(165 0)"><rect width="120" height="70" rx="7" fill="#edf2f4" stroke="#d8d8cf"/><rect width="96" height="70" class="barS"/><rect x="96" width="24" height="70" class="barR"/><text x="42" y="92" class="s">n=1</text><text x="24" y="112" class="n">800 / 200</text></g>
   <g transform="translate(330 0)"><rect width="120" height="70" rx="7" fill="#edf2f4" stroke="#d8d8cf"/><rect width="86.4" height="70" class="barS"/><rect x="86.4" width="33.6" height="70" class="barR"/><text x="42" y="92" class="s">n=2</text><text x="24" y="112" class="n">720 / 280</text></g>
   <g transform="translate(495 0)"><rect width="120" height="70" rx="7" fill="#edf2f4" stroke="#d8d8cf"/><rect width="82.6" height="70" class="barS"/><rect x="82.6" width="37.4" height="70" class="barR"/><text x="42" y="92" class="s">n=3</text><text x="24" y="112" class="n">688 / 312</text></g>
   <g transform="translate(660 0)"><rect width="120" height="70" rx="7" fill="#edf2f4" stroke="#6f9278" stroke-width="2" stroke-dasharray="6 4"/><rect width="80" height="70" class="barS"/><rect x="80" width="40" height="70" class="barR"/><text x="33" y="92" class="s">n→∞</text><text x="24" y="112" class="n">667 / 333</text><text x="36" y="60" class="n">不再變動</text></g>
  </g>
 </g>
 <text x="40" y="518" class="s">stationary distribution 讓兩方向的流量平衡：667×0.2 ≈ 333×0.4。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">兩個沒有記憶的鬧鐘</title><desc id="desc">兩狀態連續時間 Markov chain 以 rate 決定隨機停留時間，沒有離散自環。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:12px;fill:#657176}.n{font-size:11px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.idle{fill:#dce8e3;stroke:#6f9278;stroke-width:2}.busy{fill:#dce5eb;stroke:#587e9b;stroke-width:2}.arr1{fill:none;stroke:#b77968;stroke-width:5;marker-end:url(#r)}.arr2{fill:none;stroke:#587e9b;stroke-width:5;marker-end:url(#b)}.axis{stroke:#59656a;stroke-width:1.5}.step{fill:none;stroke:#29363b;stroke-width:3}.busyBand{fill:#86a4b4;opacity:.55}</style>
 <defs><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b77968"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#587e9b"/></marker></defs>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">CTMC 沒有回合：在每個狀態等一個 exponential 鬧鐘</text>
 <g transform="translate(40 68)"><rect class="panel" width="880" height="190" rx="12"/><text x="18" y="29" class="h">rate 描述「每單位時間跳走的強度」，不是一次跳的機率</text><circle cx="245" cy="105" r="52" class="idle"/><text x="231" y="100" class="h">0</text><text x="218" y="123" class="s">閒置</text><circle cx="635" cy="105" r="52" class="busy"/><text x="622" y="100" class="h">1</text><text x="608" y="123" class="s">忙碌</text><path d="M297 88C385 45 496 45 583 88" class="arr1"/><text x="394" y="48" class="h">λ = 3 / 小時</text><path d="M583 128C495 171 385 171 297 128" class="arr2"/><text x="394" y="177" class="h">μ = 6 / 小時</text><g transform="translate(198 55)"><circle cx="0" cy="0" r="12" fill="none" stroke="#29363b"/><path d="M0 0L0-8M0 0L6 4" stroke="#29363b"/><path d="M-9-10L-14-16M9-10L14-16" stroke="#29363b"/></g><g transform="translate(588 55)"><circle cx="0" cy="0" r="12" fill="none" stroke="#29363b"/><path d="M0 0L0-8M0 0L6 4" stroke="#29363b"/><path d="M-9-10L-14-16M9-10L14-16" stroke="#29363b"/></g><text x="744" y="94" class="s">沒有自環箭頭</text><text x="744" y="114" class="n">「沒跳」已藏在等待時間裡</text></g>
 <g transform="translate(40 278)"><rect class="panel" width="880" height="210" rx="12"/><text x="18" y="29" class="h">一條 3 小時的樣本軌跡</text><line x1="45" y1="156" x2="840" y2="156" class="axis"/><rect x="143" y="70" width="46" height="86" class="busyBand"/><rect x="232" y="70" width="102" height="86" class="busyBand"/><rect x="476" y="70" width="55" height="86" class="busyBand"/><rect x="609" y="70" width="94" height="86" class="busyBand"/><path d="M45 138H143V82H189V138H232V82H334V138H476V82H531V138H609V82H703V138H840" class="step"/><text x="42" y="178" class="n">0 h</text><text x="304" y="178" class="n">1 h</text><text x="568" y="178" class="n">2 h</text><text x="821" y="178" class="n">3 h</text><text x="143" y="62" class="n">4 分</text><text x="265" y="62" class="n">13 分</text><text x="478" y="62" class="n">7 分</text><text x="75" y="132" class="n">22 分</text><text x="196" y="132" class="n">9 分</text><text x="370" y="132" class="n">31 分</text><text x="575" y="48" class="s">忙碌段平均 1/μ = 10 分</text><text x="575" y="65" class="s">閒置段平均 1/λ = 20 分</text></g>
 <text x="40" y="518" class="s">長期忙碌比例由平均段長決定：10 ÷ (20+10) = 1/3。</text>
</svg>

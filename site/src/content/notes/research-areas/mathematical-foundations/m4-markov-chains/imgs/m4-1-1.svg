<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">一千顆棋子與一個坑</title><desc id="desc">吸收狀態鏈中每回合掉坑的人數呈幾何遞減，平均時間長於中位數。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:12px;fill:#657176}.n{font-size:11px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.state{fill:#dce8e3;stroke:#6f9278;stroke-width:2}.pit{fill:#51646d;stroke:#35464e;stroke-width:3}.arr{fill:none;stroke:#b77968;stroke-width:5;marker-end:url(#r)}.self{fill:none;stroke:#6f9278;stroke-width:6;marker-end:url(#g)}.axis{stroke:#59656a;stroke-width:1.5}.bar{fill:#86a4b4}.survive{fill:none;stroke:#c09551;stroke-width:3}.mark{stroke:#b77968;stroke-width:2;stroke-dasharray:6 4}</style>
 <defs><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b77968"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6f9278"/></marker></defs>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">每回合固定 10% 掉坑，等待時間卻有很長的右尾</text>
 <g transform="translate(40 68)"><rect class="panel" width="300" height="420" rx="12"/><text x="18" y="29" class="h">A：還在玩　E：已結束</text><rect x="34" y="100" width="90" height="74" rx="12" class="state"/><text x="73" y="143" class="h">A</text><path d="M124 126C170 85 209 85 242 125" class="arr"/><text x="167" y="80" class="h">q = 0.1</text><path d="M242 124L259 177L225 177Z" class="pit"/><text x="237" y="160" class="h" fill="#fff">E</text><path d="M48 98C15 46 108 36 109 92" class="self"/><text x="25" y="55" class="h">1−q</text><path d="M262 185C303 214 286 279 241 244" class="arr"/><text x="280" y="238" class="h">1</text><text x="48" y="215" class="s">一旦進 E 就出不來</text><rect x="28" y="247" width="244" height="118" rx="10" fill="#f4f2eb" stroke="#d8d8cf"/><text x="45" y="278" class="s">第 n 回合結束：</text><text x="45" y="307" class="h">P(τ=n)=q(1−q)ⁿ⁻¹</text><text x="45" y="340" class="s">還沒結束：</text><text x="145" y="340" class="h">P(τ&gt;n)=(1−q)ⁿ</text></g>
 <g transform="translate(360 68)"><rect class="panel" width="560" height="420" rx="12"/><text x="18" y="29" class="h">每回合結束人數（柱）與仍在玩人數（線）</text><line x1="45" y1="350" x2="530" y2="350" class="axis"/><line x1="45" y1="70" x2="45" y2="350" class="axis"/>
  <g class="bar"><rect x="55" y="315" width="12" height="35"/><rect x="70" y="318" width="12" height="32"/><rect x="85" y="322" width="12" height="28"/><rect x="100" y="324" width="12" height="26"/><rect x="115" y="327" width="12" height="23"/><rect x="130" y="329" width="12" height="21"/><rect x="145" y="331" width="12" height="19"/><rect x="160" y="333" width="12" height="17"/><rect x="175" y="335" width="12" height="15"/><rect x="190" y="336" width="12" height="14"/><rect x="205" y="338" width="12" height="12"/><rect x="220" y="339" width="12" height="11"/><rect x="235" y="340" width="12" height="10"/><rect x="250" y="341" width="12" height="9"/><rect x="265" y="342" width="12" height="8"/><rect x="280" y="343" width="12" height="7"/><rect x="295" y="343" width="12" height="7"/><rect x="310" y="344" width="12" height="6"/><rect x="325" y="345" width="12" height="5"/><rect x="340" y="345" width="12" height="5"/></g>
  <path d="M61 97L76 122L91 145L106 165L121 183L136 200L151 215L166 228L181 240L196 251L211 261L226 270L241 278L256 286L271 292L286 298L301 303L316 308L331 312L346 316L361 320L376 323L391 326L406 328L421 331L436 333L451 335L466 336L481 338L496 339" class="survive"/>
  <line x1="151" y1="70" x2="151" y2="350" class="mark"/><text x="111" y="60" class="s" fill="#9e6657">中位數：7</text><line x1="196" y1="70" x2="196" y2="350" stroke="#6f9278" stroke-width="2" stroke-dasharray="6 4"/><text x="177" y="87" class="s" fill="#58785f">期望：10</text><text x="51" y="375" class="n">1</text><text x="188" y="375" class="n">10</text><text x="338" y="375" class="n">20</text><text x="486" y="375" class="n">30 回合</text><text x="382" y="112" class="s" fill="#9a7741">仍在玩：1000(0.9)ⁿ</text><text x="365" y="303" class="s" fill="#587e9b">本回合掉坑：100(0.9)ⁿ⁻¹</text>
 </g>
 <text x="40" y="518" class="s">一半的人第 7 回合前就結束；少數很久才掉坑的局，把平均等待時間拉到 10。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
 <title id="title">Two rooms versus a three-room cycle</title><desc id="desc">Stationary two-state flows balance pairwise; three states can sustain circulation that reverses under time reversal.</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:12px;fill:#657176}.n{font-size:11px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.room{fill:#dfe8e7;stroke:#6f9278;stroke-width:2}.flow{fill:none;stroke:#587e9b;stroke-width:7;marker-end:url(#b)}.back{fill:none;stroke:#b77968;stroke-width:7;marker-end:url(#r)}.thin{fill:none;stroke:#9eb0b8;stroke-width:2.5;marker-end:url(#s)}.divider{stroke:#d8d8cf;stroke-width:2;stroke-dasharray:7 6}</style>
 <defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#587e9b"></path></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b77968"></path></marker><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9eb0b8"></path></marker></defs>
 <rect width="960" height="540" rx="18" fill="#f2efe7"></rect><text x="40" y="42" class="t">Two states balance; three can sustain net circulation</text>
 <g transform="translate(40 68)"><rect class="panel" width="390" height="420" rx="12"></rect><text x="18" y="30" class="h">Two rooms: unchanged under reversal</text><circle cx="105" cy="150" r="48" class="room"></circle><text x="97" y="156" class="h">S</text><circle cx="285" cy="150" r="48" class="room"></circle><text x="277" y="156" class="h">R</text><path d="M153 132H236" class="flow"></path><path d="M237 169H154" class="flow"></path><text x="90" y="240" class="s">π(S)R(S,R) = π(R)R(R,S)</text><rect x="42" y="270" width="306" height="76" rx="10" fill="#f4f2eb" stroke="#d8d8cf"></rect><text x="78" y="300" class="h">Forward ⇄ reversed</text><text x="77" y="327" class="s" style="font-size: 11.78px;">Equal opposing stationary flows hide the time direction</text></g>
 <g transform="translate(450 68)"><rect class="panel" width="470" height="420" rx="12"></rect><text x="18" y="30" class="h">Three rooms: net circulation reverses</text><line x1="235" y1="50" x2="235" y2="390" class="divider"></line><text x="65" y="62" class="s">Forward</text><circle cx="118" cy="105" r="31" class="room"></circle><circle cx="61" cy="219" r="31" class="room"></circle><circle cx="175" cy="219" r="31" class="room"></circle><text x="110" y="111" class="h">S</text><text x="53" y="225" class="h">C</text><text x="167" y="225" class="h">R</text><path d="M100 134L72 184M93 219H139M159 188L133 135" class="flow"></path><path d="M83 183L110 137M139 204H94M134 137L160 183" class="thin"></path><text x="42" y="276" class="s">Clockwise rate 1</text><text x="42" y="296" class="n">Counterclockwise rate ε</text><path d="M187 330H276" stroke="#29363b" stroke-width="2"></path><path d="M276 330l-10-6v12Z" fill="#29363b"></path><text x="174" y="356" class="s">Reverse: exchange the rates</text><g transform="translate(235 0)"><text x="65" y="62" class="s">Reversed</text><circle cx="118" cy="105" r="31" class="room"></circle><circle cx="61" cy="219" r="31" class="room"></circle><circle cx="175" cy="219" r="31" class="room"></circle><text x="110" y="111" class="h">S</text><text x="53" y="225" class="h">C</text><text x="167" y="225" class="h">R</text><path d="M83 183L110 137M139 204H94M134 137L160 183" class="back"></path><path d="M100 134L72 184M93 219H139M159 188L133 135" class="thin"></path><text x="36" y="276" class="s">Counterclockwise rate 1</text><text x="36" y="296" class="n">Clockwise rate ε</text></g></g>
 <text x="40" y="518" class="s">Detailed balance equates each pair's opposing fluxes; stationarity only balances total inflow and outflow at each state.</text>
</svg>

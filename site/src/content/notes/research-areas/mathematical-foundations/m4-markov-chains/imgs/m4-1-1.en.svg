<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
 <title id="title">One thousand tokens and an absorbing pit</title><desc id="desc">Geometric absorption gives a long right tail; the mean waiting time exceeds its median.</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:12px;fill:#657176}.n{font-size:11px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.state{fill:#dce8e3;stroke:#6f9278;stroke-width:2}.pit{fill:#51646d;stroke:#35464e;stroke-width:3}.arr{fill:none;stroke:#b77968;stroke-width:5;marker-end:url(#r)}.self{fill:none;stroke:#6f9278;stroke-width:6;marker-end:url(#g)}.axis{stroke:#59656a;stroke-width:1.5}.bar{fill:#86a4b4}.survive{fill:none;stroke:#c09551;stroke-width:3}.mark{stroke:#b77968;stroke-width:2;stroke-dasharray:6 4}</style>
 <defs><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b77968"></path></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6f9278"></path></marker></defs>
 <rect width="960" height="540" rx="18" fill="#f2efe7"></rect><text x="40" y="42" class="t">A 10% absorption chance each round still gives a long waiting-time tail</text>
 <g transform="translate(40 68)"><rect class="panel" width="300" height="420" rx="12"></rect><text x="18" y="29" class="h">A: active · E: ended</text><rect x="34" y="100" width="90" height="74" rx="12" class="state"></rect><text x="73" y="143" class="h">A</text><path d="M124 126C170 85 209 85 242 125" class="arr"></path><text x="167" y="80" class="h">q = 0.1</text><path d="M242 124L259 177L225 177Z" class="pit"></path><text x="237" y="160" class="h" fill="#fff">E</text><path d="M48 98C15 46 108 36 109 92" class="self"></path><text x="25" y="55" class="h">1−q</text><path d="M262 185C303 214 286 279 241 244" class="arr"></path><text x="280" y="238" class="h">1</text><text x="48" y="215" class="s">Once in E, there is no exit</text><rect x="28" y="247" width="244" height="118" rx="10" fill="#f4f2eb" stroke="#d8d8cf"></rect><text x="45" y="278" class="s">Ended by round n:</text><text x="45" y="307" class="h">P(τ=n)=q(1−q)ⁿ⁻¹</text><text x="45" y="340" class="s">Still active:</text><text x="145" y="340" class="h">P(τ&gt;n)=(1−q)ⁿ</text></g>
 <g transform="translate(360 68)"><rect class="panel" width="560" height="420" rx="12"></rect><text x="18" y="29" class="h">Absorbed this round (bars) and still active (line)</text><line x1="45" y1="350" x2="530" y2="350" class="axis"></line><line x1="45" y1="70" x2="45" y2="350" class="axis"></line>
  <g class="bar"><rect x="55" y="315" width="12" height="35"></rect><rect x="70" y="318" width="12" height="32"></rect><rect x="85" y="322" width="12" height="28"></rect><rect x="100" y="324" width="12" height="26"></rect><rect x="115" y="327" width="12" height="23"></rect><rect x="130" y="329" width="12" height="21"></rect><rect x="145" y="331" width="12" height="19"></rect><rect x="160" y="333" width="12" height="17"></rect><rect x="175" y="335" width="12" height="15"></rect><rect x="190" y="336" width="12" height="14"></rect><rect x="205" y="338" width="12" height="12"></rect><rect x="220" y="339" width="12" height="11"></rect><rect x="235" y="340" width="12" height="10"></rect><rect x="250" y="341" width="12" height="9"></rect><rect x="265" y="342" width="12" height="8"></rect><rect x="280" y="343" width="12" height="7"></rect><rect x="295" y="343" width="12" height="7"></rect><rect x="310" y="344" width="12" height="6"></rect><rect x="325" y="345" width="12" height="5"></rect><rect x="340" y="345" width="12" height="5"></rect></g>
  <path d="M61 97L76 122L91 145L106 165L121 183L136 200L151 215L166 228L181 240L196 251L211 261L226 270L241 278L256 286L271 292L286 298L301 303L316 308L331 312L346 316L361 320L376 323L391 326L406 328L421 331L436 333L451 335L466 336L481 338L496 339" class="survive"></path>
  <line x1="151" y1="70" x2="151" y2="350" class="mark"></line><text x="111" y="60" class="s" fill="#9e6657">Median: 7</text><line x1="196" y1="70" x2="196" y2="350" stroke="#6f9278" stroke-width="2" stroke-dasharray="6 4"></line><text x="177" y="87" class="s" fill="#58785f">Mean: 10</text><text x="51" y="375" class="n">1</text><text x="188" y="375" class="n">10</text><text x="338" y="375" class="n">20</text><text x="486" y="375" class="n">30 rounds</text><text x="382" y="112" class="s" fill="#9a7741">Still active: 1000(0.9)ⁿ</text><text x="365" y="303" class="s" fill="#587e9b">Absorbed this round: 100(0.9)ⁿ⁻¹</text>
 </g>
 <text x="40" y="518" class="s">At least half finish by round 7; the long right tail raises the mean to 10.</text>
</svg>

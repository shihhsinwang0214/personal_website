<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
 <title id="title">Two memoryless alarms</title><desc id="desc">A two-state CTMC uses rates to set exponential holding times, without discrete self-loop events.</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:12px;fill:#657176}.n{font-size:11px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.idle{fill:#dce8e3;stroke:#6f9278;stroke-width:2}.busy{fill:#dce5eb;stroke:#587e9b;stroke-width:2}.arr1{fill:none;stroke:#b77968;stroke-width:5;marker-end:url(#r)}.arr2{fill:none;stroke:#587e9b;stroke-width:5;marker-end:url(#b)}.axis{stroke:#59656a;stroke-width:1.5}.step{fill:none;stroke:#29363b;stroke-width:3}.busyBand{fill:#86a4b4;opacity:.55}</style>
 <defs><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b77968"></path></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#587e9b"></path></marker></defs>
 <rect width="960" height="540" rx="18" fill="#f2efe7"></rect><text x="40" y="42" class="t">No rounds: wait for an exponential alarm in each state</text>
 <g transform="translate(40 68)"><rect class="panel" width="880" height="190" rx="12"></rect><text x="18" y="29" class="h">A rate is jump intensity per unit time, not a jump probability</text><circle cx="245" cy="105" r="52" class="idle"></circle><text x="231" y="100" class="h">0</text><text x="218" y="123" class="s">Idle</text><circle cx="635" cy="105" r="52" class="busy"></circle><text x="622" y="100" class="h">1</text><text x="608" y="123" class="s">Busy</text><path d="M297 88C385 45 496 45 583 88" class="arr1"></path><text x="394" y="48" class="h">λ = 3 / hour</text><path d="M583 128C495 171 385 171 297 128" class="arr2"></path><text x="394" y="177" class="h">μ = 6 / hour</text><g transform="translate(198 55)"><circle cx="0" cy="0" r="12" fill="none" stroke="#29363b"></circle><path d="M0 0L0-8M0 0L6 4" stroke="#29363b"></path><path d="M-9-10L-14-16M9-10L14-16" stroke="#29363b"></path></g><g transform="translate(588 55)"><circle cx="0" cy="0" r="12" fill="none" stroke="#29363b"></circle><path d="M0 0L0-8M0 0L6 4" stroke="#29363b"></path><path d="M-9-10L-14-16M9-10L14-16" stroke="#29363b"></path></g><text x="744" y="94" class="s">No self-loop arrow</text><text x="744" y="114" class="n" textLength="126.0" lengthAdjust="spacingAndGlyphs" style="font-size: 8px;">Staying is encoded in the holding time</text></g>
 <g transform="translate(40 278)"><rect class="panel" width="880" height="210" rx="12"></rect><text x="18" y="29" class="h">A three-hour sample path</text><line x1="45" y1="156" x2="840" y2="156" class="axis"></line><rect x="143" y="70" width="46" height="86" class="busyBand"></rect><rect x="232" y="70" width="102" height="86" class="busyBand"></rect><rect x="476" y="70" width="55" height="86" class="busyBand"></rect><rect x="609" y="70" width="94" height="86" class="busyBand"></rect><path d="M45 138H143V82H189V138H232V82H334V138H476V82H531V138H609V82H703V138H840" class="step"></path><text x="42" y="178" class="n">0 h</text><text x="304" y="178" class="n">1 h</text><text x="568" y="178" class="n">2 h</text><text x="821" y="178" class="n">3 h</text><text x="143" y="62" class="n">4 min</text><text x="265" y="62" class="n">13 min</text><text x="478" y="62" class="n">7 min</text><text x="75" y="132" class="n">22 min</text><text x="196" y="132" class="n">9 min</text><text x="370" y="132" class="n">31 min</text><text x="575" y="48" class="s">Mean busy interval: 1/μ = 10 min</text><text x="575" y="65" class="s">Mean idle interval: 1/λ = 20 min</text></g>
 <text x="40" y="518" class="s">Long-run busy fraction = 10 ÷ (20+10) = 1/3.</text>
</svg>

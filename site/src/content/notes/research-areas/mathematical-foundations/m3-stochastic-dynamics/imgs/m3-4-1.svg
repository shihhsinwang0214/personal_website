<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">兩把尺：逐路徑比，還是比直方圖</title><desc id="desc">strong convergence 使用同一條 Brownian path 比較終點，weak convergence 只比較分布統計量。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:12px;fill:#657176}.n{font-size:11px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#59656a;stroke-width:1.5}.truth{fill:none;stroke:#587e9b;stroke-width:2}.approx{fill:none;stroke:#b77968;stroke-width:3;stroke-dasharray:8 5}.err{stroke:#b77968;stroke-width:2;marker-start:url(#a);marker-end:url(#a)}.bar1{fill:#7598a5;opacity:.55}.bar2{fill:#c69b63;opacity:.48}.curve1{fill:none;stroke:#587e9b;stroke-width:3}.curve2{fill:none;stroke:#b77968;stroke-width:3;stroke-dasharray:7 4}.arrow{font-size:22px;font-weight:700;fill:#6f9278}</style>
 <defs><marker id="a" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0 3.5L7 0V7Z" fill="#b77968"/></marker></defs>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">strong 問「同一條路差多少」；weak 問「最後的統計量差多少」</text>
 <g transform="translate(40 68)"><rect class="panel" width="390" height="414" rx="12"/><text x="20" y="32" class="h">Strong：共用同一條 Wₜ</text><line x1="42" y1="330" x2="362" y2="330" class="axis"/><line x1="42" y1="70" x2="42" y2="330" class="axis"/>
  <path d="M42 260C67 239 76 269 97 229S130 245 153 204S184 223 205 174S243 203 266 147S309 180 362 118" class="truth"/><path d="M42 260L82 244L122 236L162 209L202 188L242 180L282 151L322 145L362 136" class="approx"/><line x1="362" y1="118" x2="362" y2="136" class="err"/><text x="236" y="105" class="s" fill="#9e6657">|xT − x̂T|</text><text x="58" y="355" class="n">真實路徑（細）</text><text x="190" y="355" class="n">Euler–Maruyama（粗虛線）</text><rect x="20" y="374" width="350" height="25" rx="6" fill="#f4f2eb"/><text x="39" y="392" class="s">逐條相減，再對很多條路徑取平均</text></g>
 <g transform="translate(530 68)"><rect class="panel" width="390" height="414" rx="12"/><text x="20" y="32" class="h">Weak：不要求噪聲配對</text><line x1="42" y1="330" x2="362" y2="330" class="axis"/><line x1="42" y1="70" x2="42" y2="330" class="axis"/>
  <g class="bar1"><rect x="62" y="315" width="19" height="15"/><rect x="84" y="292" width="19" height="38"/><rect x="106" y="244" width="19" height="86"/><rect x="128" y="184" width="19" height="146"/><rect x="150" y="125" width="19" height="205"/><rect x="172" y="103" width="19" height="227"/><rect x="194" y="132" width="19" height="198"/><rect x="216" y="190" width="19" height="140"/><rect x="238" y="250" width="19" height="80"/><rect x="260" y="296" width="19" height="34"/><rect x="282" y="316" width="19" height="14"/></g><path d="M55 328C82 317 101 251 132 181S190 93 221 160S267 315 312 328" class="curve1"/><path d="M55 329C83 318 103 256 134 185S193 98 224 166S270 316 312 329" class="curve2"/><text x="60" y="91" class="s">10⁴ 個真實終點與 10⁴ 個模擬終點</text><line x1="165" y1="119" x2="183" y2="110" class="err"/><text x="201" y="111" class="n">Eφ(xT) − Eφ(x̂T)</text><rect x="20" y="374" width="350" height="25" rx="6" fill="#f4f2eb"/><text x="47" y="392" class="s">只比較分布平均；每條路可以完全對不上</text></g>
 <text x="448" y="190" class="arrow">⇒</text><text x="438" y="216" class="n">strong</text><text x="447" y="238" class="n">保證</text><text x="438" y="271" class="arrow" fill="#b77968">⇏</text><text x="439" y="296" class="n">反向不成立</text>
 <text x="40" y="518" class="s">逐路徑誤差是更嚴格的尺；只要求分布或期望正確，通常能得到更快的收斂階。</text>
</svg>

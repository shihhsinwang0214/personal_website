<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
 <title id="title">Restoring drift and spreading noise determine equilibrium width</title><desc id="desc">Three potentials, their restoring forces, and corresponding stationary densities.</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:15px;font-weight:700}.s{font-size:12px;fill:#657176}.n{font-size:11px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#59656a;stroke-width:1.3}.pot{fill:none;stroke:#587e9b;stroke-width:4}.force{stroke:#b77968;stroke-width:2.5;marker-end:url(#r)}.noise{stroke:#c09551;stroke-width:2;stroke-dasharray:4 3}.density{fill:#dce8e3;stroke:#6f9278;stroke-width:3}.hist{fill:#8ba8b2;opacity:.45}</style>
 <defs><marker id="r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b77968"></path></marker></defs>
 <rect width="960" height="540" rx="18" fill="#f2efe7"></rect><text x="40" y="42" class="t">Drift pulls inward; noise spreads outward; equilibrium is proportional to e⁻ⱽ</text>
 <g transform="translate(40 68)">
  <g><rect class="panel" width="280" height="400" rx="12"></rect><text x="18" y="27" class="h">Standard bowl V=x²/2</text><line x1="25" y1="188" x2="255" y2="188" class="axis"></line><path d="M38 73Q140 245 242 73" class="pot"></path><path d="M64 101L97 133M216 101L183 133" class="force"></path><path d="M113 173L129 177M167 173L151 177" class="force"></path><path d="M121 202Q140 187 159 202" class="noise"></path><text x="83" y="61" class="n">Steep slope: strong restoring drift</text><text x="100" y="219" class="n">Valley floor: noise matters</text><line x1="25" y1="352" x2="255" y2="352" class="axis"></line><g class="hist"><rect x="58" y="339" width="15" height="13"></rect><rect x="75" y="321" width="15" height="31"></rect><rect x="92" y="291" width="15" height="61"></rect><rect x="109" y="254" width="15" height="98"></rect><rect x="126" y="235" width="15" height="117"></rect><rect x="143" y="242" width="15" height="110"></rect><rect x="160" y="270" width="15" height="82"></rect><rect x="177" y="310" width="15" height="42"></rect><rect x="194" y="337" width="15" height="15"></rect></g><path d="M43 351C70 347 86 296 112 251S166 252 193 302S223 349 239 351" class="density"></path><text x="19" y="383" class="s">p∞ ∝ e⁻ⱽ　σ = 1</text></g>
  <g transform="translate(300 0)"><rect class="panel" width="280" height="400" rx="12"></rect><text x="18" y="27" class="h">Wide bowl V=x²/8</text><line x1="25" y1="188" x2="255" y2="188" class="axis"></line><path d="M38 111Q140 226 242 111" class="pot"></path><path d="M64 129L96 150M216 129L184 150" class="force"></path><path d="M116 180L130 183M164 180L150 183" class="force"></path><path d="M116 202Q140 187 164 202" class="noise"></path><text x="87" y="80" class="n">Weaker restoring force here</text><line x1="25" y1="352" x2="255" y2="352" class="axis"></line><g class="hist"><rect x="38" y="330" width="18" height="22"></rect><rect x="58" y="305" width="18" height="47"></rect><rect x="78" y="279" width="18" height="73"></rect><rect x="98" y="259" width="18" height="93"></rect><rect x="118" y="248" width="18" height="104"></rect><rect x="138" y="250" width="18" height="102"></rect><rect x="158" y="265" width="18" height="87"></rect><rect x="178" y="289" width="18" height="63"></rect><rect x="198" y="318" width="18" height="34"></rect><rect x="218" y="339" width="18" height="13"></rect></g><path d="M28 349C53 337 72 304 104 270S167 264 199 301S232 342 251 349" class="density"></path><text x="19" y="383" class="s">p∞ ∝ e⁻ⱽ　σ = 2</text></g>
  <g transform="translate(600 0)"><rect class="panel" width="280" height="400" rx="12"></rect><text x="18" y="27" class="h">Flat center, steep sides V=x⁴/4</text><line x1="25" y1="188" x2="255" y2="188" class="axis"></line><path d="M48 55C78 151 95 184 140 188S205 151 232 55" class="pot"></path><path d="M64 91L94 137M216 91L186 137" class="force"></path><path d="M109 181L128 184M171 181L152 184" class="force"></path><path d="M112 202Q140 187 168 202" class="noise"></path><text x="70" y="42" class="n" style="font-size: 10.39px;">Flat near zero, rapidly steepening outside</text><line x1="25" y1="352" x2="255" y2="352" class="axis"></line><g class="hist"><rect x="60" y="342" width="17" height="10"></rect><rect x="79" y="310" width="17" height="42"></rect><rect x="98" y="257" width="17" height="95"></rect><rect x="117" y="238" width="17" height="114"></rect><rect x="136" y="238" width="17" height="114"></rect><rect x="155" y="246" width="17" height="106"></rect><rect x="174" y="305" width="17" height="47"></rect><rect x="193" y="342" width="17" height="10"></rect></g><path d="M48 352C75 351 83 302 102 257C113 235 167 235 178 257C197 302 205 351 232 352" class="density"></path><text x="19" y="383" class="s">p∞ ∝ e⁻ⱽ　σ ≈ 0.82</text></g>
 </g>
 <text x="40" y="496" class="s">Line: stationary density · Bars: long-run simulation</text><text x="40" y="518" class="s">Under ergodicity and sufficient mixing, V and temperature determine equilibrium; starts affect transients.</text>
</svg>

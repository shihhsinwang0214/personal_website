<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
 <title id="title">Transport and spreading in Fokker–Planck</title><desc id="desc">Three panels compare constant drift, diffusion, and their combined effect on a density.</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:12px;fill:#657176}.n{font-size:11px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#59656a;stroke-width:1.5}.now{fill:none;stroke:#587e9b;stroke-width:4}.next{fill:none;stroke:#b77968;stroke-width:4;stroke-dasharray:8 5}.area{fill:#dce8eb;opacity:.55}.arrow{stroke:#c09551;stroke-width:2}.plus{font-size:30px;font-weight:700;fill:#9a7741}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"></rect><text x="40" y="42" class="t">Fokker–Planck = drift transport + diffusion</text>
 <g transform="translate(40 68)">
  <g><rect class="panel" width="275" height="410" rx="12"></rect><text x="18" y="30" class="h">Drift only (g = 0)</text><line x1="28" y1="300" x2="247" y2="300" class="axis"></line><path d="M38 300C70 298 75 173 118 123S178 293 220 300" class="area"></path><path d="M38 300C70 298 75 173 118 123S178 293 220 300" class="now"></path><path d="M65 300C97 298 102 173 145 123S205 293 247 300" class="next"></path><path d="M101 93H166" stroke="#c09551" stroke-width="3"></path><path d="M166 93l-11-7v14Z" fill="#c09551"></path><text x="77" y="78" class="s">Same shape, shifted right</text><text x="30" y="337" class="h">−∂x(fp): transport</text><text x="30" y="365" class="s">t (solid) · t+h (dashed)</text><text x="92" y="394" class="s">∫p(x)dx = 1</text></g>
  <text x="288" y="212" class="plus">+</text>
  <g transform="translate(305 0)"><rect class="panel" width="275" height="410" rx="12"></rect><text x="18" y="30" class="h">Noise only (f = 0)</text><line x1="28" y1="300" x2="247" y2="300" class="axis"></line><path d="M35 300C75 296 91 219 137 135S199 296 240 300" class="area"></path><path d="M35 300C75 296 91 219 137 135S199 296 240 300" class="now"></path><path d="M28 300C65 293 85 242 137 184S207 291 247 300" class="next"></path><path d="M137 122V163" class="arrow"></path><path d="M137 163l-6-10h12Z" fill="#c09551"></path><path d="M79 277V248" class="arrow"></path><path d="M79 248l-6 10h12Z" fill="#c09551"></path><path d="M198 277V248" class="arrow"></path><path d="M198 248l-6 10h12Z" fill="#c09551"></path><text x="118" y="110" class="n">∂xxp&lt;0</text><text x="42" y="239" class="n">∂xxp&gt;0</text><text x="188" y="239" class="n">&gt;0</text><text x="30" y="337" class="h">(g²/2)∂xxp: spreading</text><text x="39" y="365" class="s">Peak falls; sides rise</text><text x="92" y="394" class="s">∫p(x)dx = 1</text></g>
  <text x="593" y="212" class="plus">=</text>
  <g transform="translate(610 0)"><rect class="panel" width="270" height="410" rx="12"></rect><text x="18" y="30" class="h">Both terms together</text><line x1="28" y1="300" x2="243" y2="300" class="axis"></line><path d="M33 300C70 296 83 196 124 135S181 293 222 300" class="area"></path><path d="M33 300C70 296 83 196 124 135S181 293 222 300" class="now"></path><path d="M45 300C82 294 105 244 157 186S217 294 243 300" class="next"></path><path d="M115 90H178" stroke="#c09551" stroke-width="3"></path><path d="M178 90l-11-7v14Z" fill="#c09551"></path><text x="59" y="74" class="s">Shift right and broaden</text><text x="22" y="337" class="h">−∂x(fp) + (g²/2)∂xxp</text><text x="78" y="365" class="s">Add the two local changes</text><text x="90" y="394" class="s">∫p(x)dx = 1</text></g>
 </g>
 <text x="40" y="518" class="s">The drift flux transports mass; diffusion smooths peaks. With suitable boundaries, total mass is conserved.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">一條路變成一把扇子</title><desc id="desc">比較沒有噪聲的 ODE 中心線與加入噪聲後的一族 SDE 路徑。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:12px;fill:#657176}.n{font-size:11px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.water{fill:#e6eef0}.bank{fill:#d9dfd5}.ode{fill:none;stroke:#29363b;stroke-width:4}.path{fill:none;stroke:#668ea4;stroke-width:1.2;opacity:.3}.env1{fill:none;stroke:#b77968;stroke-width:2.5;stroke-dasharray:7 5}.env2{fill:none;stroke:#c09551;stroke-width:2;stroke-dasharray:4 5}.cut{stroke:#6f9278;stroke-width:2;stroke-dasharray:6 4}.bar{fill:#7598a5;opacity:.7}.gauss{fill:none;stroke:#b77968;stroke-width:3}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">drift 決定中心線，Brownian 噪聲把一條路撐成扇子</text>
 <g transform="translate(40 68)"><rect class="panel" width="880" height="420" rx="12"/>
  <g transform="translate(18 42)"><rect class="water" width="360" height="310" rx="12"/><path d="M0 30Q90 0 180 32T360 25V0H0ZM0 278Q90 310 180 278T360 286V310H0Z" class="bank"/><text x="16" y="25" class="h">g = 0：ODE 只有一條路</text><path d="M25 166C88 135 140 185 205 151S300 170 335 142" class="ode"/><circle cx="25" cy="166" r="6" fill="#b77968"/><text x="42" y="188" class="n">dx = f dt</text><text x="185" y="295" class="s">每次重跑都完全相同</text></g>
  <g transform="translate(395 42)"><rect class="water" width="465" height="310" rx="12"/><path d="M0 27Q116 0 232 30T465 23V0H0ZM0 280Q116 310 232 279T465 286V310H0Z" class="bank"/><text x="16" y="25" class="h">g = 0.3：SDE 是一族隨機路徑</text>
   <g class="path"><path d="M20 161C90 145 130 197 205 126S337 171 430 91"/><path d="M20 161C80 181 142 121 214 181S348 135 430 207"/><path d="M20 161C91 129 150 166 218 104S350 123 430 72"/><path d="M20 161C76 202 143 153 215 225S352 175 430 248"/><path d="M20 161C87 155 141 190 216 150S342 199 430 159"/><path d="M20 161C72 136 141 121 210 143S337 107 430 124"/><path d="M20 161C83 180 137 211 215 186S350 233 430 219"/><path d="M20 161C78 149 142 174 215 126S348 162 430 113"/><path d="M20 161C84 170 143 129 212 195S347 150 430 192"/><path d="M20 161C87 141 145 203 220 163S350 208 430 179"/></g>
   <path d="M20 161C100 139 150 174 230 145S360 157 430 127" class="ode"/><path d="M20 161C130 128 278 105 430 82M20 161C130 194 278 217 430 240" class="env2"/><path d="M20 161C130 144 278 133 430 118M20 161C130 178 278 189 430 204" class="env1"/>
   <line x1="430" y1="46" x2="430" y2="266" class="cut"/><text x="371" y="286" class="n">t = 60 截面</text><text x="290" y="74" class="n" fill="#9a7741">±2g√t</text><text x="303" y="119" class="n" fill="#9e6657">±g√t</text>
  </g>
  <g transform="translate(455 358)"><text x="0" y="18" class="s">橫向終點</text><line x1="84" y1="28" x2="350" y2="28" stroke="#59656a"/><g class="bar"><rect x="98" y="20" width="15" height="8"/><rect x="115" y="12" width="15" height="16"/><rect x="132" y="0" width="15" height="28"/><rect x="149" y="-17" width="15" height="45"/><rect x="166" y="-31" width="15" height="59"/><rect x="183" y="-37" width="15" height="65"/><rect x="200" y="-28" width="15" height="56"/><rect x="217" y="-13" width="15" height="41"/><rect x="234" y="2" width="15" height="26"/><rect x="251" y="15" width="15" height="13"/></g><path d="M94 25C128 21 144 -21 187 -39S235 17 270 25" class="gauss"/><text x="285" y="4" class="n">μ ≈ 30 m</text><text x="285" y="20" class="n">σ ≈ 0.3√60 ≈ 2.3 m</text></g>
 </g>
 <text x="40" y="518" class="s">每一條路徑都不同，但截面的均值跟著 ODE 走，標準差按 g√t 增長。</text>
</svg>

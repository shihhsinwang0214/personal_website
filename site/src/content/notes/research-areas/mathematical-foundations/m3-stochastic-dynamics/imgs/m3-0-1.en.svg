<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
 <title id="title">One hundred random walks and a square-root-time scale</title><desc id="desc">Independent finite-variance steps give a √t fluctuation scale and an approximately Gaussian endpoint law.</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:12px;fill:#657176}.n{font-size:11px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#59656a;stroke-width:1.5}.grid{stroke:#e2e0d9}.walk{fill:none;stroke:#6f8fa2;stroke-width:1.2;opacity:.28}.env{fill:none;stroke:#b77968;stroke-width:3;stroke-dasharray:7 5}.linear{fill:none;stroke:#b9aa8d;stroke-width:2;stroke-dasharray:4 5}.gauss{fill:none;stroke:#b77968;stroke-width:3}.bar{fill:#7598a5;opacity:.72}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"></rect><text x="40" y="42" class="t">Independent increments add in variance: 3600 unit-variance steps give SD 60</text>

  <path d="M54 214C150 188 246 168 342 151S534 119 626 107M54 214C150 240 246 260 342 277S534 309 626 321" class="env"></path><path d="M54 214L626 71M54 214L626 357" class="linear"></path>
  <text x="463" y="96" class="s" fill="#9e6657">+√t</text><text x="463" y="335" class="s" fill="#9e6657">−√t</text><text x="544" y="65" class="n" style="font-size: 8.93px;">If every step agrees: +t</text><text x="501" y="382" class="n">Time t (seconds)</text><text x="29" y="218" class="n">0</text><text x="43" y="380" class="n">0</text><text x="590" y="380" class="n">3600</text>
  <g transform="translate(430 250)"><rect x="0" y="0" width="176" height="86" rx="8" fill="#f5f2eb" stroke="#d8d8cf"></rect><path d="M22 62L74 62L74 18Z" fill="none" stroke="#587e9b" stroke-width="2"></path><text x="29" y="78" class="n">a</text><text x="80" y="48" class="n">b</text><text x="83" y="20" class="n">√(a²+b²)</text><text x="99" y="69" class="n" style="font-size: 10.14px;">Variances add</text></g>
 </g>
 <g transform="translate(710 68)"><rect class="panel" width="210" height="420" rx="12"></rect><text x="18" y="29" class="h">Endpoints at t = 3600</text><line x1="32" y1="360" x2="187" y2="360" class="axis"></line><line x1="32" y1="70" x2="32" y2="360" class="axis"></line>
  <g class="bar"><rect x="39" y="339" width="11" height="21"></rect><rect x="52" y="321" width="11" height="39"></rect><rect x="65" y="286" width="11" height="74"></rect><rect x="78" y="232" width="11" height="128"></rect><rect x="91" y="164" width="11" height="196"></rect><rect x="104" y="119" width="11" height="241"></rect><rect x="117" y="151" width="11" height="209"></rect><rect x="130" y="223" width="11" height="137"></rect><rect x="143" y="285" width="11" height="75"></rect><rect x="156" y="326" width="11" height="34"></rect><rect x="169" y="344" width="11" height="16"></rect></g>
  <path d="M38 352C61 337 72 283 86 219S108 110 119 126S141 252 181 350" class="gauss"></path><text x="48" y="94" class="s">N(0, 3600)</text><line x1="107" y1="370" x2="161" y2="370" stroke="#29363b"></line><text x="113" y="389" class="n">60 m</text><text x="49" y="407" class="n">Standard deviation = √3600</text>
 </g>
 <text x="40" y="518" class="s">The ±t scale grows much faster; random fluctuations have scale √t, not a strict ±√t bound.</text>
</svg>

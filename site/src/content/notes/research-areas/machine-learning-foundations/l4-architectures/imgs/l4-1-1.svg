<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">同一張計算圖，兩個掃描方向</title><desc id="desc">比較前向模式與反向傳播的乘法方向，以及反向傳播與有限差分隨參數量的成本。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:15px;font-weight:700}.s{font-size:12px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.box{fill:#e3e9e9;stroke:#aeb8b5}.fwd{fill:none;stroke:#587e9b;stroke-width:3;marker-end:url(#b)}.rev{fill:none;stroke:#b77968;stroke-width:3;marker-end:url(#r)}.param{fill:#c5a365}.axis{stroke:#adb7b4}.back{fill:none;stroke:#587e9b;stroke-width:3}.fd{fill:none;stroke:#b77968;stroke-width:3}</style>
 <defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#587e9b"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b77968"/></marker></defs>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">成本差在乘法順序：從純量 loss 那端回來，中間永遠是向量</text>
 <g transform="translate(40 66)"><rect class="panel" width="880" height="235" rx="12"/><text x="18" y="28" class="h">同一張計算圖，兩趟掃描</text>
  <g transform="translate(75 72)"><circle cx="0" cy="45" r="22" fill="#91a8b4"/><text x="-5" y="50" class="h">x</text><rect x="105" y="15" width="110" height="60" rx="9" class="box"/><text x="139" y="51" class="h">layer 1</text><rect x="290" y="15" width="110" height="60" rx="9" class="box"/><text x="324" y="51" class="h">layer 2</text><rect x="475" y="15" width="110" height="60" rx="9" class="box"/><text x="509" y="51" class="h">layer 3</text><circle cx="700" cy="45" r="22" fill="#c5a365"/><text x="694" y="50" class="h">L</text>
   <path d="M23 45H100M218 45H285M403 45H470M588 45H675" class="fwd"/><path d="M675 91H590M470 91H405M285 91H220M100 91H24" class="rev"/>
   <circle cx="160" cy="115" r="8" class="param"/><circle cx="345" cy="115" r="8" class="param"/><circle cx="530" cy="115" r="8" class="param"/><text x="146" y="137" class="s">θ₁</text><text x="331" y="137" class="s">θ₂</text><text x="516" y="137" class="s">θ₃</text>
   <text x="194" y="3" class="s" fill="#587e9b">前向：一個輸入方向；要 P 趟</text><text x="236" y="111" class="s" fill="#b77968">反向：一個輸出方向；P 個答案一次拿到</text>
  </g>
  <text x="73" y="215" class="s">前向中間物：n×n Jacobian</text><text x="619" y="215" class="s">反向中間物：1×n 向量</text>
 </g>
 <g transform="translate(40 320)"><rect class="panel" width="880" height="178" rx="12"/><text x="18" y="27" class="h">時間 vs. 參數量 P（log–log）</text>
  <line x1="65" y1="142" x2="815" y2="142" class="axis"/><line x1="65" y1="43" x2="65" y2="142" class="axis"/>
  <path d="M85 117 C310 116 555 113 800 109" class="back"/><path d="M85 126 L800 48" class="fd"/>
  <g fill="#b77968"><circle cx="220" cy="111" r="5"/><circle cx="475" cy="83" r="5"/><circle cx="760" cy="52" r="5"/></g><text x="190" y="101" class="s">5.2 ms</text><text x="440" y="74" class="s">32.5 ms</text><text x="720" y="43" class="s">294 ms</text>
  <text x="603" y="104" class="s" fill="#587e9b">backprop 0.26–0.38 ms</text><text x="88" y="157" class="s">13.8×</text><text x="444" y="157" class="s">123×</text><text x="742" y="157" class="s">840×</text>
 </g>
 <text x="40" y="522" class="s">有限差分必須逐參數重跑；反向傳播的主要成本與一次前向同階。</text>
</svg>

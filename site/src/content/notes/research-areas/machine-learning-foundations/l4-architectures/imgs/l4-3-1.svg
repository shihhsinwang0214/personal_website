<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">接受域買到什麼，降取樣付掉什麼</title><desc id="desc">左圖比較平坦堆疊與定期降取樣的接受域成長，右圖顯示降取樣對高頻特徵與重建誤差的影響。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#adb7b4}.flat{fill:none;stroke:#587e9b;stroke-width:3}.down{fill:none;stroke:#6f9278;stroke-width:3}.amp{fill:none;stroke:#587e9b;stroke-width:3}.err{fill:none;stroke:#b77968;stroke-width:3}.ref{stroke:#c09551;stroke-width:2;stroke-dasharray:5 4}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">降取樣用解析度交換接受域</text>
 <g transform="translate(40 70)"><rect class="panel" width="420" height="400" rx="12"/><text x="18" y="29" class="h">買到的：接受域更快長大</text>
  <line x1="55" y1="330" x2="390" y2="330" class="axis"/><line x1="55" y1="65" x2="55" y2="330" class="axis"/><line x1="55" y1="118" x2="390" y2="118" class="ref"/><text x="60" y="109" class="s">RF＝128</text>
  <path d="M65 302 L115 281 L165 249 L215 213 L265 175 L315 140 L380 102" class="flat"/><path d="M65 302 L115 281 L165 225 L215 164 L265 102 L315 74 L380 57" class="down"/>
  <circle cx="285" cy="91" r="6" fill="#6f9278"/><text x="295" y="88" class="s">8 層</text><circle cx="355" cy="116" r="6" fill="#587e9b"/><text x="326" y="141" class="s">32 層</text>
  <text x="72" y="356" class="s">深度（log）</text><text x="276" y="315" class="s" fill="#587e9b">平坦堆疊：線性</text><text x="246" y="70" class="s" fill="#6f9278">每兩層降一次：指數</text>
 </g>
 <g transform="translate(485 70)"><rect class="panel" width="435" height="400" rx="12"/><text x="18" y="29" class="h">付掉的：高頻細節被混疊與抹去</text>
  <line x1="55" y1="330" x2="405" y2="330" class="axis"/><line x1="55" y1="65" x2="55" y2="330" class="axis"/>
  <path d="M65 85 C140 92 197 110 245 153 S337 252 395 296" class="amp"/><path d="M65 298 C132 285 195 257 245 202 S337 101 395 78" class="err"/>
  <line x1="330" y1="65" x2="330" y2="330" class="ref"/><text x="270" y="55" class="s">週期 ≈ 5：實用下限</text>
  <circle cx="205" cy="133" r="6" fill="#c09551"/><path d="M185 118L205 133L223 111" fill="none" stroke="#c09551" stroke-width="2"/><text x="151" y="96" class="s">f＝16 混疊</text>
  <text x="78" y="78" class="s" fill="#587e9b">同頻振幅保留</text><text x="291" y="93" class="s" fill="#b77968">重建誤差</text><text x="62" y="356" class="s">64</text><text x="376" y="356" class="s">2</text><text x="172" y="380" class="s">特徵週期（取樣點，log）</text>
 </g>
 <text x="40" y="510" class="s">U-Net 的 skip connection 不是裝飾：它把 encoder 降取樣前的高頻細節直接送回 decoder。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
 <title id="title">One computation graph, two differentiation directions</title><desc id="desc">Compare forward and reverse derivative propagation, then backpropagation and finite-difference costs.</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:15px;font-weight:700}.s{font-size:12px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.box{fill:#e3e9e9;stroke:#aeb8b5}.fwd{fill:none;stroke:#587e9b;stroke-width:3;marker-end:url(#b)}.rev{fill:none;stroke:#b77968;stroke-width:3;marker-end:url(#r)}.param{fill:#c5a365}.axis{stroke:#adb7b4}.back{fill:none;stroke:#587e9b;stroke-width:3}.fd{fill:none;stroke:#b77968;stroke-width:3}</style>
 <defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#587e9b"></path></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b77968"></path></marker></defs>
 <rect width="960" height="540" rx="18" fill="#f2efe7"></rect><text x="40" y="42" class="t">From a scalar loss, reverse mode propagates vector–Jacobian products</text>
 <g transform="translate(40 66)"><rect class="panel" width="880" height="235" rx="12"></rect><text x="18" y="28" class="h">One graph, two sweeps</text>
  <g transform="translate(75 72)"><circle cx="0" cy="45" r="22" fill="#91a8b4"></circle><text x="-5" y="50" class="h">x</text><rect x="105" y="15" width="110" height="60" rx="9" class="box"></rect><text x="139" y="51" class="h">layer 1</text><rect x="290" y="15" width="110" height="60" rx="9" class="box"></rect><text x="324" y="51" class="h">layer 2</text><rect x="475" y="15" width="110" height="60" rx="9" class="box"></rect><text x="509" y="51" class="h">layer 3</text><circle cx="700" cy="45" r="22" fill="#c5a365"></circle><text x="694" y="50" class="h">L</text>
   <path d="M23 45H100M218 45H285M403 45H470M588 45H675" class="fwd"></path><path d="M675 91H590M470 91H405M285 91H220M100 91H24" class="rev"></path>
   <circle cx="160" cy="115" r="8" class="param"></circle><circle cx="345" cy="115" r="8" class="param"></circle><circle cx="530" cy="115" r="8" class="param"></circle><text x="146" y="137" class="s">θ₁</text><text x="331" y="137" class="s">θ₂</text><text x="516" y="137" class="s">θ₃</text>
   <text x="194" y="3" class="s" fill="#587e9b">Forward mode: one input direction; P sweeps for a full gradient</text><text x="236" y="111" class="s" fill="#b77968">Reverse mode: one scalar output; all P derivatives in one sweep</text>
  </g>
  <text x="73" y="215" class="s">Full forward Jacobian: potentially n×n</text><text x="619" y="215" class="s">Reverse adjoint: a 1×n vector</text>
 </g>
 <g transform="translate(40 320)"><rect class="panel" width="880" height="178" rx="12"></rect><text x="18" y="27" class="h">Time versus parameter count P (log–log)</text>
  <line x1="65" y1="142" x2="815" y2="142" class="axis"></line><line x1="65" y1="43" x2="65" y2="142" class="axis"></line>
  <path d="M85 117 C310 116 555 113 800 109" class="back"></path><path d="M85 126 L800 48" class="fd"></path>
  <g fill="#b77968"><circle cx="220" cy="111" r="5"></circle><circle cx="475" cy="83" r="5"></circle><circle cx="760" cy="52" r="5"></circle></g><text x="190" y="101" class="s">5.2 ms</text><text x="440" y="74" class="s">32.5 ms</text><text x="720" y="43" class="s">294 ms</text>
  <text x="603" y="104" class="s" fill="#587e9b">backprop 0.26–0.38 ms</text><text x="88" y="157" class="s">13.8×</text><text x="444" y="157" class="s">123×</text><text x="742" y="157" class="s">840×</text>
 </g>
 <text x="40" y="522" class="s">Coordinate finite differences rerun each parameter; reverse-mode gradient cost is comparable to one forward pass.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">三個模型、三個條件</title><desc id="desc">比較 MLP、局部未共享與卷積的連接方式、參數量，以及在三種資料條件下的表現。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:15px;font-weight:700}.s{font-size:12px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.row{fill:#f7f5ef;stroke:#dfddd6}.pixel{fill:#d9e1e2}.fan{fill:none;stroke:#aeb7b4;opacity:.65}.a{fill:#587e9b}.b{fill:#b77968}.c{fill:#6f9278}.axis{stroke:#adb7b4}.chance{stroke:#c09551;stroke-dasharray:5 4}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">局部性省連線；共享性才買到平移等變</text>
 <g transform="translate(40 68)"><rect class="panel" width="435" height="405" rx="12"/><text x="18" y="28" class="h">三種連接方式（參數量差 62 倍）</text>
  <g transform="translate(18 50)"><rect class="row" width="398" height="92" rx="8"/><text x="12" y="22" class="h">MLP</text><g class="pixel"><rect x="70" y="20" width="22" height="22"/><rect x="96" y="20" width="22" height="22"/><rect x="122" y="20" width="22" height="22"/><rect x="148" y="20" width="22" height="22"/><rect x="174" y="20" width="22" height="22"/><rect x="200" y="20" width="22" height="22"/></g><circle cx="315" cy="46" r="12" class="a"/><path d="M92 42L303 46M118 42L303 46M144 42L303 46M170 42L303 46M196 42L303 46M222 42L303 46" class="fan"/><text x="282" y="76" class="s">13,505</text></g>
  <g transform="translate(18 151)"><rect class="row" width="398" height="92" rx="8"/><text x="12" y="22" class="h">局部、未共享</text><g><rect x="76" y="27" width="44" height="44" fill="#91a8b4"/><rect x="130" y="27" width="44" height="44" fill="#c5a365"/><rect x="184" y="27" width="44" height="44" fill="#b98270"/></g><circle cx="295" cy="49" r="9" class="a"/><circle cx="325" cy="49" r="9" fill="#c09551"/><circle cx="355" cy="49" r="9" class="b"/><path d="M120 49H286M174 49H316M228 49H346" class="fan"/><text x="282" y="76" class="s">13,321</text></g>
  <g transform="translate(18 252)"><rect class="row" width="398" height="92" rx="8"/><text x="12" y="22" class="h">卷積：局部 + 共享</text><g fill="#8ca893"><rect x="76" y="27" width="44" height="44"/><rect x="130" y="27" width="44" height="44"/><rect x="184" y="27" width="44" height="44"/></g><g class="c"><circle cx="295" cy="49" r="9"/><circle cx="325" cy="49" r="9"/><circle cx="355" cy="49" r="9"/></g><path d="M120 49H286M174 49H316M228 49H346" stroke="#6f9278" stroke-width="2"/><text x="300" y="76" class="s">217</text></g>
 </g>
 <g transform="translate(500 68)"><rect class="panel" width="420" height="405" rx="12"/><text x="18" y="28" class="h">三種資料條件下的準確率</text>
  <line x1="55" y1="330" x2="390" y2="330" class="axis"/><line x1="55" y1="60" x2="55" y2="330" class="axis"/><line x1="55" y1="197" x2="390" y2="197" class="chance"/><text x="9" y="201" class="s">.5</text>
  <g transform="translate(80)"><rect x="0" y="81" width="22" height="249" class="a"/><rect x="27" y="77" width="22" height="253" class="b"/><rect x="54" y="73" width="22" height="257" class="c"/><text x="3" y="353" class="s">同域</text></g>
  <g transform="translate(188)"><rect x="0" y="170" width="22" height="160" class="a"/><rect x="27" y="104" width="22" height="226" class="b"/><rect x="54" y="74" width="22" height="256" class="c"/><text x="-10" y="353" class="s">左訓右測</text><text x="-2" y="163" class="s">.605</text><text x="24" y="98" class="s">.878</text><text x="50" y="68" class="s">.998</text></g>
  <g transform="translate(304)"><rect x="0" y="77" width="22" height="253" class="a"/><rect x="27" y="75" width="22" height="255" class="b"/><rect x="54" y="132" width="22" height="198" class="c"/><text x="-4" y="353" class="s">打亂像素</text><text x="52" y="125" class="s">.780</text></g>
  <g transform="translate(82 382)"><rect width="12" height="12" class="a"/><text x="18" y="11" class="s">MLP</text><rect x="84" width="12" height="12" class="b"/><text x="102" y="11" class="s">局部</text><rect x="166" width="12" height="12" class="c"/><text x="184" y="11" class="s">卷積</text></g>
 </g>
 <text x="40" y="510" class="s">共享讓右移的物件仍被認出；打亂像素後卷積變差，正是它真的使用空間結構的證據。</text>
</svg>

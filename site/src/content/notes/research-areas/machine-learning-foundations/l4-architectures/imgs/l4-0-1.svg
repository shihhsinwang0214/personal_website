<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">三種架構，三句不同的我事先相信</title><desc id="desc">比較 MLP、卷積與注意力的連接模式，並將它們放在假設空間大小的軸上。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:12px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.sub{fill:#f7f5ef;stroke:#deddd6}.node{fill:#91a8b4}.unit{fill:#c09551}.edge{stroke:#aeb7b4;stroke-width:1;opacity:.65}.share{stroke:#6f9278;stroke-width:2}.attn{stroke:#b77968;stroke-width:2;stroke-dasharray:5 4}.axis{stroke:#29363b;stroke-width:2;marker-end:url(#a)}.u{fill:none;stroke:#c09551;stroke-width:3}</style>
 <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#29363b"/></marker></defs>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">架構不是「都能擬合」之後的裝飾，而是先縮小候選集合</text>
 <g transform="translate(40 66)"><rect class="panel" width="880" height="270" rx="12"/>
  <g transform="translate(18 38)"><rect class="sub" width="270" height="205" rx="9"/><text x="112" y="25" class="h">MLP</text><g class="node"><circle cx="30" cy="60" r="5"/><circle cx="30" cy="78" r="5"/><circle cx="30" cy="96" r="5"/><circle cx="30" cy="114" r="5"/><circle cx="30" cy="132" r="5"/><circle cx="30" cy="150" r="5"/></g><g class="unit"><circle cx="220" cy="74" r="10"/><circle cx="220" cy="108" r="10"/><circle cx="220" cy="142" r="10"/></g><path d="M35 60L210 74M35 60L210 108M35 60L210 142M35 78L210 74M35 78L210 108M35 78L210 142M35 96L210 74M35 96L210 108M35 96L210 142M35 114L210 74M35 114L210 108M35 114L210 142M35 132L210 74M35 132L210 108M35 132L210 142M35 150L210 74M35 150L210 108M35 150L210 142" class="edge"/><text x="70" y="186" class="s">每個輸出看全部輸入 · 12h 權重</text></g>
  <g transform="translate(305 38)"><rect class="sub" width="270" height="205" rx="9"/><text x="105" y="25" class="h">卷積</text><g class="node"><rect x="25" y="57" width="18" height="18"/><rect x="46" y="57" width="18" height="18"/><rect x="67" y="57" width="18" height="18"/><rect x="88" y="57" width="18" height="18"/><rect x="109" y="57" width="18" height="18"/><rect x="130" y="57" width="18" height="18"/></g><g class="unit"><circle cx="86" cy="126" r="10"/><circle cx="128" cy="126" r="10"/><circle cx="170" cy="126" r="10"/></g><path d="M34 75L86 116M55 75L86 116M76 75L86 116M76 75L128 116M97 75L128 116M118 75L128 116M118 75L170 116M139 75L170 116M160 75L170 116" class="share"/><rect x="194" y="56" width="18" height="18" fill="#6f9278"/><rect x="215" y="56" width="18" height="18" fill="#6f9278" opacity=".7"/><rect x="236" y="56" width="18" height="18" fill="#6f9278" opacity=".45"/><text x="37" y="186" class="s">局部 + 權重共享 · 3 個權重重複用</text></g>
  <g transform="translate(592 38)"><rect class="sub" width="270" height="205" rx="9"/><text x="101" y="25" class="h">注意力</text><g class="node"><circle cx="32" cy="62" r="6"/><circle cx="32" cy="91" r="6"/><circle cx="32" cy="120" r="6"/><circle cx="32" cy="149" r="6"/></g><g class="unit"><circle cx="226" cy="71" r="10"/><circle cx="226" cy="111" r="10"/><circle cx="226" cy="151" r="10"/></g><path d="M38 62L216 71M38 62L216 151M38 91L216 111M38 120L216 71M38 120L216 111M38 149L216 151" class="attn"/><path d="M38 91L216 71M38 149L216 111" class="attn" opacity=".35"/><text x="45" y="186" class="s">連哪裡、連多重，由內容當下決定</text></g>
 </g>
 <g transform="translate(40 357)"><rect class="panel" width="880" height="137" rx="12"/><text x="18" y="26" class="h">假設空間不是越大越好</text><line x1="80" y1="75" x2="810" y2="75" class="axis"/><text x="70" y="102" class="s">小</text><text x="806" y="102" class="s">大</text>
  <circle cx="230" cy="75" r="8" fill="#6f9278"/><text x="206" y="61" class="h">卷積</text><circle cx="545" cy="75" r="8" fill="#b77968"/><text x="519" y="61" class="h">注意力</text><circle cx="745" cy="75" r="8" fill="#587e9b"/><text x="728" y="61" class="h">MLP</text>
  <path d="M90 42 Q445 110 802 42" class="u" opacity=".55"/><text x="82" y="125" class="s">approximation error ↓</text><text x="668" y="125" class="s">estimation error ↑</text><text x="343" y="122" class="s">谷底位置由資料量決定</text>
 </g>
 <text x="40" y="520" class="s">好的 inductive bias 是：把不合理的函數先排除，但仍把真相留在候選集合裡。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">打亂順序，注意力毫無感覺</title><desc id="desc">token 與注意力矩陣同時重排時輸出維持等變；右圖顯示位置編碼尺度對任務分數的影響。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:12px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.tok1{fill:#7192a8}.tok2{fill:#c29a57}.tok3{fill:#7d9a82}.tok4{fill:#b87868}.cell1{fill:#dfe7e9}.cell2{fill:#9fb8c4}.cell3{fill:#587e9b}.cell4{fill:#31566f}.axis{stroke:#adb7b4}.limit{stroke:#b77968;stroke-width:2;stroke-dasharray:5 4}.score{fill:#587e9b}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">Self-attention 看內容，不知道「第幾個」</text>
 <g transform="translate(40 70)"><rect class="panel" width="480" height="400" rx="12"/><text x="18" y="29" class="h">置換前後：熱圖只做相同行列重排</text>
  <g transform="translate(24 58)"><g><rect width="32" height="30" class="tok1"/><rect x="37" width="32" height="30" class="tok2"/><rect x="74" width="32" height="30" class="tok3"/><rect x="111" width="32" height="30" class="tok4"/><rect x="148" width="32" height="30" class="tok1"/><rect x="185" width="32" height="30" class="tok3"/><rect x="222" width="32" height="30" class="tok2"/><rect x="259" width="32" height="30" class="tok4"/></g>
   <g transform="translate(318 0)"><rect width="24" height="24" class="cell4"/><rect x="26" width="24" height="24" class="cell1"/><rect x="52" width="24" height="24" class="cell2"/><rect x="78" width="24" height="24" class="cell1"/><rect y="26" width="24" height="24" class="cell2"/><rect x="26" y="26" width="24" height="24" class="cell4"/><rect x="52" y="26" width="24" height="24" class="cell1"/><rect x="78" y="26" width="24" height="24" class="cell3"/><rect y="52" width="24" height="24" class="cell1"/><rect x="26" y="52" width="24" height="24" class="cell2"/><rect x="52" y="52" width="24" height="24" class="cell4"/><rect x="78" y="52" width="24" height="24" class="cell1"/><rect y="78" width="24" height="24" class="cell3"/><rect x="26" y="78" width="24" height="24" class="cell1"/><rect x="52" y="78" width="24" height="24" class="cell2"/><rect x="78" y="78" width="24" height="24" class="cell4"/></g><text y="125" class="s">原順序</text>
  </g>
  <path d="M65 201 C159 158 262 158 358 201" fill="none" stroke="#c09551" stroke-width="2"/><text x="168" y="164" class="s">同一個 permutation</text>
  <g transform="translate(24 218)"><g><rect width="32" height="30" class="tok3"/><rect x="37" width="32" height="30" class="tok1"/><rect x="74" width="32" height="30" class="tok4"/><rect x="111" width="32" height="30" class="tok2"/><rect x="148" width="32" height="30" class="tok4"/><rect x="185" width="32" height="30" class="tok2"/><rect x="222" width="32" height="30" class="tok3"/><rect x="259" width="32" height="30" class="tok1"/></g>
   <g transform="translate(318 0)"><rect width="24" height="24" class="cell4"/><rect x="26" width="24" height="24" class="cell1"/><rect x="52" width="24" height="24" class="cell2"/><rect x="78" width="24" height="24" class="cell1"/><rect y="26" width="24" height="24" class="cell3"/><rect x="26" y="26" width="24" height="24" class="cell4"/><rect x="52" y="26" width="24" height="24" class="cell1"/><rect x="78" y="26" width="24" height="24" class="cell2"/><rect y="52" width="24" height="24" class="cell1"/><rect x="26" y="52" width="24" height="24" class="cell3"/><rect x="52" y="52" width="24" height="24" class="cell4"/><rect x="78" y="52" width="24" height="24" class="cell1"/><rect y="78" width="24" height="24" class="cell2"/><rect x="26" y="78" width="24" height="24" class="cell1"/><rect x="52" y="78" width="24" height="24" class="cell2"/><rect x="78" y="78" width="24" height="24" class="cell4"/></g><text y="125" class="s">打亂後</text>
  </g>
  <text x="24" y="375" class="s">置換等變誤差 6.66×10⁻¹⁶　｜　輸出量級 3.3553</text>
 </g>
 <g transform="translate(545 70)"><rect class="panel" width="375" height="400" rx="12"/><text x="18" y="29" class="h">位置訊號要夠大聲，模型才聽得見</text>
  <line x1="55" y1="225" x2="330" y2="225" class="axis"/><text x="47" y="250" class="s">.5</text><text x="310" y="250" class="s">1.0</text>
  <line x1="118" y1="104" x2="118" y2="270" class="limit"/><text x="71" y="91" class="s">置換不變模型上限</text><text x="102" y="286" class="s">.615</text>
  <circle cx="99" cy="225" r="8" class="score"/><text x="62" y="209" class="s">無位置 .580</text><circle cx="151" cy="225" r="8" class="score"/><text x="127" y="209" class="s">sin ×1 .671</text><circle cx="293" cy="225" r="8" class="score"/><text x="257" y="209" class="s">sin ×3 .932</text>
  <rect x="50" y="305" width="275" height="58" rx="8" fill="#f7f5ef"/><text x="66" y="329" class="s">沒有位置編碼：只能當集合處理</text><text x="66" y="350" class="s">加入且放大：順序任務才開始可辨識</text>
 </g>
 <text x="40" y="510" class="s">attention 的置換等變是精確結構；位置資訊必須另外餵入，而且尺度不能被內容噪聲淹沒。</text>
</svg>

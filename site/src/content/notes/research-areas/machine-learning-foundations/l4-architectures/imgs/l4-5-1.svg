<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">同一個條件，三個注入的位置</title><desc id="desc">比較 concat、FiLM 與 cross-attention，並依條件資料形狀選擇注入方法。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:12px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.sub{fill:#f7f5ef;stroke:#deddd6}.layer{fill:#dfe7e9;stroke:#9caaac}.x{stroke:#587e9b;stroke-width:3;marker-end:url(#b)}.c{stroke:#c09551;stroke-width:3;marker-end:url(#g)}.side{stroke:#6f9278;stroke-width:2;marker-end:url(#r)}.attn{stroke:#b77968;stroke-width:2;stroke-dasharray:5 4}.axis{stroke:#29363b;stroke-width:2;marker-end:url(#k)}.low{fill:none;stroke:#587e9b;stroke-width:2}.high{fill:none;stroke:#b77968;stroke-width:2}</style>
 <defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#587e9b"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c09551"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6f9278"/></marker><marker id="k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#29363b"/></marker></defs>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">條件長什麼形狀，決定它應該從哪裡進網路</text>
 <g transform="translate(40 66)"><rect class="panel" width="880" height="260" rx="12"/>
  <g transform="translate(18 38)"><rect class="sub" width="270" height="195" rx="9"/><text x="105" y="25" class="h">concat</text><text x="21" y="93" class="h">x</text><text x="21" y="124" class="h" fill="#c09551">c</text><path d="M42 88H78" class="x"/><path d="M42 119H78" class="c"/><rect x="84" y="66" width="48" height="68" rx="7" class="layer"/><rect x="151" y="76" width="40" height="48" rx="7" class="layer"/><rect x="210" y="83" width="35" height="34" rx="7" class="layer"/><path d="M132 100H146M191 100H205" class="x"/><text x="42" y="171" class="s">條件只在入口，和 x 共用一條路</text></g>
  <g transform="translate(305 38)"><rect class="sub" width="270" height="195" rx="9"/><text x="111" y="25" class="h">FiLM</text><text x="20" y="109" class="h">x</text><path d="M40 104H72" class="x"/><rect x="78" y="76" width="43" height="55" rx="7" class="layer"/><rect x="143" y="76" width="43" height="55" rx="7" class="layer"/><rect x="208" y="76" width="43" height="55" rx="7" class="layer"/><path d="M121 104H138M186 104H203" class="x"/><text x="20" y="49" class="h" fill="#6f9278">c</text><rect x="47" y="33" width="67" height="28" rx="6" fill="#dfe9df"/><text x="58" y="52" class="s">小網路</text><path d="M79 62L96 75M79 62L164 75M79 62L229 75" class="side"/><text x="41" y="171" class="s">每層收到自己的 (γℓ, βℓ)</text></g>
  <g transform="translate(592 38)"><rect class="sub" width="270" height="195" rx="9"/><text x="75" y="25" class="h">cross-attention</text><text x="18" y="111" class="h">x</text><path d="M38 106H70" class="x"/><rect x="75" y="79" width="43" height="55" rx="7" class="layer"/><rect x="139" y="79" width="43" height="55" rx="7" class="layer"/><rect x="203" y="79" width="43" height="55" rx="7" class="layer"/><path d="M118 106H134M182 106H198" class="x"/><g class="tok1"><rect x="72" y="38" width="24" height="20" fill="#b98270"/><rect x="100" y="38" width="24" height="20" fill="#c5a365"/><rect x="128" y="38" width="24" height="20" fill="#91a8b4"/><rect x="156" y="38" width="24" height="20" fill="#7d9a82"/></g><path d="M84 60L97 78M112 60L160 78M168 60L224 78" class="attn"/><text x="25" y="171" class="s">每層依內容查詢可變長 token</text></g>
 </g>
 <g transform="translate(40 347)"><rect class="panel" width="880" height="148" rx="12"/><text x="18" y="27" class="h">條件的形狀 → 合適的入口</text><line x1="70" y1="84" x2="815" y2="84" class="axis"/>
  <circle cx="130" cy="84" r="8" fill="#c09551"/><text x="105" y="111" class="s">純量 t</text><text x="84" y="62" class="s">正弦嵌入 → FiLM</text><circle cx="325" cy="84" r="8" fill="#6f9278"/><text x="305" y="111" class="s">類別</text><text x="284" y="62" class="s">embedding / FiLM</text><circle cx="535" cy="84" r="8" fill="#587e9b"/><text x="496" y="111" class="s">同尺寸影像</text><text x="496" y="62" class="s">通道 concat</text><circle cx="745" cy="84" r="8" fill="#b77968"/><text x="700" y="111" class="s">可變長序列</text><text x="696" y="62" class="s">cross-attention</text>
  <path d="M125 135 C134 122 143 122 152 135 S170 148 179 135" class="low"/><path d="M187 135C191 119 196 151 201 135S211 119 216 135S226 151 231 135" class="high"/><text x="246" y="140" class="s">純量直接當座標時，高頻依賴學不動</text>
 </g>
 <text x="40" y="520" class="s">時間步是純量但作用遍及整張圖：先做 Fourier／sinusoidal embedding，再用 FiLM 注入各層。</text>
</svg>

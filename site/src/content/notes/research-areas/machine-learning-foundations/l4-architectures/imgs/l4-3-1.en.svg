<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
 <title id="title">Receptive-field coverage and downsampling losses</title><desc id="desc">Compare receptive-field growth with depth and downsampling, then inspect frequency retention and reconstruction error.</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#adb7b4}.flat{fill:none;stroke:#587e9b;stroke-width:3}.down{fill:none;stroke:#6f9278;stroke-width:3}.amp{fill:none;stroke:#587e9b;stroke-width:3}.err{fill:none;stroke:#b77968;stroke-width:3}.ref{stroke:#c09551;stroke-width:2;stroke-dasharray:5 4}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"></rect><text x="40" y="42" class="t">Downsampling trades spatial resolution for broader coverage</text>
 <g transform="translate(40 70)"><rect class="panel" width="420" height="400" rx="12"></rect><text x="18" y="29" class="h">Benefit: faster receptive-field growth</text>
  <line x1="55" y1="330" x2="390" y2="330" class="axis"></line><line x1="55" y1="65" x2="55" y2="330" class="axis"></line><line x1="55" y1="118" x2="390" y2="118" class="ref"></line><text x="60" y="109" class="s">RF＝128</text>
  <path d="M65 302 L115 281 L165 249 L215 213 L265 175 L315 140 L380 102" class="flat"></path><path d="M65 302 L115 281 L165 225 L215 164 L265 102 L315 74 L380 57" class="down"></path>
  <circle cx="285" cy="91" r="6" fill="#6f9278"></circle><text x="295" y="88" class="s">8 layers</text><circle cx="355" cy="116" r="6" fill="#587e9b"></circle><text x="326" y="141" class="s">32 layers</text>
  <text x="72" y="356" class="s">Depth (log)</text><text x="276" y="315" class="s" fill="#587e9b" style="font-size: 9.21px;">Stride-one stack: linear growth</text><text x="246" y="70" class="s" fill="#6f9278">Downsampled: exponential</text>
 </g>
 <g transform="translate(485 70)"><rect class="panel" width="435" height="400" rx="12"></rect><text x="18" y="29" class="h">Cost: aliasing and loss of fine detail</text>
  <line x1="55" y1="330" x2="405" y2="330" class="axis"></line><line x1="55" y1="65" x2="55" y2="330" class="axis"></line>
  <path d="M65 85 C140 92 197 110 245 153 S337 252 395 296" class="amp"></path><path d="M65 298 C132 285 195 257 245 202 S337 101 395 78" class="err"></path>
  <line x1="330" y1="65" x2="330" y2="330" class="ref"></line><text x="270" y="55" class="s">Example period ≈ 5</text>
  <circle cx="205" cy="133" r="6" fill="#c09551"></circle><path d="M185 118L205 133L223 111" fill="none" stroke="#c09551" stroke-width="2"></path><text x="151" y="96" class="s">f = 16: sampling effects</text>
  <text x="78" y="78" class="s" fill="#587e9b">Retained same-frequency amplitude</text><text x="291" y="93" class="s" fill="#b77968">Reconstruction error</text><text x="62" y="356" class="s">64</text><text x="376" y="356" class="s">2</text><text x="172" y="380" class="s">Feature period (samples, log)</text>
 </g>
 <text x="40" y="510" class="s">U-Net skips route high-resolution encoder features around a potentially lossy bottleneck.</text>
</svg>

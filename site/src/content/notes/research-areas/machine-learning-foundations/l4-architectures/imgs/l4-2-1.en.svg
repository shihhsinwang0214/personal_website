<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
 <title id="title">Three models, three data conditions</title><desc id="desc">Compare dense, local-unshared, and convolutional connectivity, parameter counts, and accuracy across data conditions.</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:15px;font-weight:700}.s{font-size:12px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.row{fill:#f7f5ef;stroke:#dfddd6}.pixel{fill:#d9e1e2}.fan{fill:none;stroke:#aeb7b4;opacity:.65}.a{fill:#587e9b}.b{fill:#b77968}.c{fill:#6f9278}.axis{stroke:#adb7b4}.chance{stroke:#c09551;stroke-dasharray:5 4}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"></rect><text x="40" y="42" class="t">Locality saves connections; weight sharing supplies translation equivariance</text>
 <g transform="translate(40 68)"><rect class="panel" width="435" height="405" rx="12"></rect><text x="18" y="28" class="h">Three connection patterns (62× parameter-count range)</text>
  <g transform="translate(18 50)"><rect class="row" width="398" height="92" rx="8"></rect><text x="12" y="22" class="h">MLP</text><g class="pixel"><rect x="70" y="20" width="22" height="22"></rect><rect x="96" y="20" width="22" height="22"></rect><rect x="122" y="20" width="22" height="22"></rect><rect x="148" y="20" width="22" height="22"></rect><rect x="174" y="20" width="22" height="22"></rect><rect x="200" y="20" width="22" height="22"></rect></g><circle cx="315" cy="46" r="12" class="a"></circle><path d="M92 42L303 46M118 42L303 46M144 42L303 46M170 42L303 46M196 42L303 46M222 42L303 46" class="fan"></path><text x="282" y="76" class="s">13,505</text></g>
  <g transform="translate(18 151)"><rect class="row" width="398" height="92" rx="8"></rect><text x="12" y="22" class="h">Local, unshared</text><g><rect x="76" y="27" width="44" height="44" fill="#91a8b4"></rect><rect x="130" y="27" width="44" height="44" fill="#c5a365"></rect><rect x="184" y="27" width="44" height="44" fill="#b98270"></rect></g><circle cx="295" cy="49" r="9" class="a"></circle><circle cx="325" cy="49" r="9" fill="#c09551"></circle><circle cx="355" cy="49" r="9" class="b"></circle><path d="M120 49H286M174 49H316M228 49H346" class="fan"></path><text x="282" y="76" class="s">13,321</text></g>
  <g transform="translate(18 252)"><rect class="row" width="398" height="92" rx="8"></rect><text x="12" y="22" class="h">Convolution: local + shared</text><g fill="#8ca893"><rect x="76" y="27" width="44" height="44"></rect><rect x="130" y="27" width="44" height="44"></rect><rect x="184" y="27" width="44" height="44"></rect></g><g class="c"><circle cx="295" cy="49" r="9"></circle><circle cx="325" cy="49" r="9"></circle><circle cx="355" cy="49" r="9"></circle></g><path d="M120 49H286M174 49H316M228 49H346" stroke="#6f9278" stroke-width="2"></path><text x="300" y="76" class="s">217</text></g>
 </g>
 <g transform="translate(500 68)"><rect class="panel" width="420" height="405" rx="12"></rect><text x="18" y="28" class="h">Accuracy across three data conditions</text>
  <line x1="55" y1="330" x2="390" y2="330" class="axis"></line><line x1="55" y1="60" x2="55" y2="330" class="axis"></line><line x1="55" y1="197" x2="390" y2="197" class="chance"></line><text x="9" y="201" class="s">.5</text>
  <g transform="translate(80)"><rect x="0" y="81" width="22" height="249" class="a"></rect><rect x="27" y="77" width="22" height="253" class="b"></rect><rect x="54" y="73" width="22" height="257" class="c"></rect><text x="3" y="353" class="s">Matched positions</text></g>
  <g transform="translate(188)"><rect x="0" y="170" width="22" height="160" class="a"></rect><rect x="27" y="104" width="22" height="226" class="b"></rect><rect x="54" y="74" width="22" height="256" class="c"></rect><text x="-10" y="353" class="s">Restricted / shifted positions</text><text x="-2" y="163" class="s">.605</text><text x="24" y="98" class="s">.878</text><text x="50" y="68" class="s">.998</text></g>
  <g transform="translate(304)"><rect x="0" y="77" width="22" height="253" class="a"></rect><rect x="27" y="75" width="22" height="255" class="b"></rect><rect x="54" y="132" width="22" height="198" class="c"></rect><text x="-4" y="353" class="s">Shuffled pixels</text><text x="52" y="125" class="s">.780</text></g>
  <g transform="translate(82 382)"><rect width="12" height="12" class="a"></rect><text x="18" y="11" class="s">MLP</text><rect x="84" width="12" height="12" class="b"></rect><text x="102" y="11" class="s">Local</text><rect x="166" width="12" height="12" class="c"></rect><text x="184" y="11" class="s">Convolution</text></g>
 </g>
 <text x="40" y="510" class="s">Shared filters reuse patterns across positions; shuffled pixels change how useful spatial locality is.</text>
</svg>

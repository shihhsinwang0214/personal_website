<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
 <title id="title">One hundred trials: how many distinct useful coordinates?</title><desc id="desc">Grid and random search differ in coverage when only one hyperparameter strongly matters.</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:12px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.band1{fill:#e7eadf}.band2{fill:#dde7eb}.gridpt{fill:#b77968}.randpt{fill:#587e9b}.axis{stroke:#aeb7b4}.card{fill:#f2efe7;stroke:#d2d4ce}</style>
 <defs><pattern id="gp" width="33" height="27" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="3" class="gridpt"></circle></pattern><pattern id="rp" width="37" height="31" patternUnits="userSpaceOnUse"><circle cx="5" cy="8" r="3" class="randpt"></circle><circle cx="23" cy="20" r="3" class="randpt"></circle><circle cx="32" cy="5" r="3" class="randpt"></circle></pattern></defs>
 <rect width="960" height="540" rx="18" fill="#f2efe7"></rect><text x="40" y="42" class="t">With one important axis, a grid repeats many irrelevant coordinates</text>
 <g transform="translate(40 68)"><rect class="panel" width="400" height="410" rx="12"></rect><text x="18" y="29" class="h">10 × 10 grid: 100 trials</text>
  <rect x="52" y="56" width="300" height="260" rx="6" fill="#f7f5ef"></rect><rect x="52" y="56" width="75" height="260" class="band1"></rect><rect x="127" y="56" width="75" height="260" class="band2"></rect><rect x="202" y="56" width="75" height="260" class="band1"></rect><rect x="277" y="56" width="75" height="260" class="band2"></rect><rect x="52" y="56" width="300" height="260" fill="url(#gp)"></rect>
  <line x1="52" y1="350" x2="352" y2="350" class="axis"></line><g class="gridpt"><circle cx="60" cy="350" r="4"></circle><circle cx="92" cy="350" r="4"></circle><circle cx="124" cy="350" r="4"></circle><circle cx="156" cy="350" r="4"></circle><circle cx="188" cy="350" r="4"></circle><circle cx="220" cy="350" r="4"></circle><circle cx="252" cy="350" r="4"></circle><circle cx="284" cy="350" r="4"></circle><circle cx="316" cy="350" r="4"></circle><circle cx="348" cy="350" r="4"></circle></g><text x="148" y="376" class="s" style="font-size: 11.74px;">Only 10 distinct values on the important axis</text>
 </g>
 <g transform="translate(520 68)"><rect class="panel" width="400" height="410" rx="12"></rect><text x="18" y="29" class="h">Random search: 100 sampled projections</text>
  <rect x="52" y="56" width="300" height="260" rx="6" fill="#f7f5ef"></rect><rect x="52" y="56" width="75" height="260" class="band1"></rect><rect x="127" y="56" width="75" height="260" class="band2"></rect><rect x="202" y="56" width="75" height="260" class="band1"></rect><rect x="277" y="56" width="75" height="260" class="band2"></rect><rect x="52" y="56" width="300" height="260" fill="url(#rp)"></rect>
  <line x1="52" y1="350" x2="352" y2="350" class="axis"></line><path d="M55 346V354M60 346V354M67 346V354M75 346V354M83 346V354M95 346V354M107 346V354M113 346V354M124 346V354M137 346V354M149 346V354M158 346V354M172 346V354M184 346V354M197 346V354M211 346V354M227 346V354M242 346V354M258 346V354M271 346V354M288 346V354M303 346V354M321 346V354M337 346V354M348 346V354" stroke="#587e9b" stroke-width="2"></path><text x="139" y="376" class="s" style="font-size: 11.13px;">Broader sampled coverage of the important axis</text>
 </g>
 <g transform="translate(357 176)"><rect class="card" width="245" height="128" rx="10"></rect><text x="15" y="25" class="h" style="font-size: 15.42px;">Best distance: grid → random</text><text x="15" y="51" class="s">d=2, k=1　.00111 → .00001</text><text x="15" y="75" class="s">d=5, k=1　.04000 → .00001</text><text x="15" y="99" class="s">d=2, k=2　.00222 → .00220</text><text x="15" y="119" class="s" style="font-size: 8.79px;">Relative performance depends on effective dimension</text></g>
 <text x="40" y="512" class="s">Vertical background bands indicate a target depending only on the horizontal coordinate.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">實力相同的候選，分數為什麼會漂</title><desc id="desc">二十個真實品質相同的候選因驗證噪聲產生勝者詛咒，以及候選數對樂觀偏差的影響。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#adb7b4}.true{stroke:#29363b;stroke-width:3}.dot{fill:#91a8b4}.win{fill:#b77968}.val{fill:none;stroke:#b77968;stroke-width:3}.real{fill:none;stroke:#587e9b;stroke-width:3}.wide{fill:#b77968;opacity:.15}.thin{fill:#6f9278;opacity:.17}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">挑最低分，同時也挑中了最幸運的噪聲</text>
 <g transform="translate(40 66)"><rect class="panel" width="880" height="205" rx="12"/><text x="18" y="28" class="h">m＝20：所有候選真實風險完全相同</text>
  <line x1="75" y1="128" x2="820" y2="128" class="axis"/><line x1="530" y1="62" x2="530" y2="164" class="true"/><text x="475" y="52" class="s">真實品質 .025</text>
  <g class="dot"><circle cx="417" cy="109" r="6"/><circle cx="441" cy="145" r="6"/><circle cx="466" cy="122" r="6"/><circle cx="480" cy="91" r="6"/><circle cx="493" cy="151" r="6"/><circle cx="507" cy="113" r="6"/><circle cx="519" cy="136" r="6"/><circle cx="538" cy="102" r="6"/><circle cx="552" cy="148" r="6"/><circle cx="565" cy="119" r="6"/><circle cx="578" cy="92" r="6"/><circle cx="591" cy="139" r="6"/><circle cx="606" cy="111" r="6"/><circle cx="621" cy="151" r="6"/><circle cx="635" cy="126" r="6"/><circle cx="650" cy="98" r="6"/><circle cx="666" cy="142" r="6"/><circle cx="682" cy="115" r="6"/><circle cx="698" cy="133" r="6"/></g><circle cx="390" cy="128" r="8" class="win"/>
  <line x1="390" y1="178" x2="530" y2="178" stroke="#b77968" stroke-width="2"/><path d="M390 171V185M530 171V185" stroke="#b77968" stroke-width="2"/><text x="419" y="199" class="s" fill="#b77968">樂觀量＝被挑中的幸運</text><text x="319" y="94" class="s">最低驗證分 → 勝出</text>
 </g>
 <g transform="translate(40 292)"><rect class="panel" width="880" height="205" rx="12"/><text x="18" y="28" class="h">候選數 m 增加：驗證勝者一直變好，真實品質沒有動</text>
  <line x1="60" y1="164" x2="825" y2="164" class="axis"/><line x1="60" y1="50" x2="60" y2="164" class="axis"/>
  <path d="M72 83 C216 101 445 127 810 145 L810 83 L72 83Z" class="wide"/><path d="M72 83 C216 91 445 103 810 112 L810 83 L72 83Z" class="thin"/>
  <path d="M72 83 L810 83" class="real"/><path d="M72 88 C216 101 445 128 810 145" class="val"/>
  <text x="623" y="75" class="s" fill="#587e9b">勝者真實風險 .0251–.0261</text><text x="642" y="151" class="s" fill="#b77968">驗證 .0256 → .0185</text><text x="319" y="133" class="s">σ√(2 log m)</text><text x="584" y="110" class="s" fill="#6f9278">驗證集 ×4：σ 減半</text><text x="387" y="187" class="s">候選數 m（log）</text>
 </g>
 <text x="40" y="522" class="s">加大驗證集會讓陰影變薄；只減少候選數，改善速度只有 √log m。</text>
</svg>

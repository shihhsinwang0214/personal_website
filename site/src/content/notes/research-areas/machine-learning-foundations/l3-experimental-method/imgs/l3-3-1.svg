<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">兩個一模一樣的方法，各跑三次</title><desc id="desc">相同方法因挑最好 seed 產生虛假差距，並展示 seed 數量對假優勢與檢定能力的影響。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:15px;font-weight:700}.s{font-size:12px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#adb7b4}.a{fill:#6f9278}.b{fill:#6f91ad}.hi{fill:#b77968}.center{stroke:#29363b;stroke-width:2}.med{fill:none;stroke:#587e9b;stroke-width:3}.p90{fill:none;stroke:#b77968;stroke-width:3}.p2{fill:none;stroke:#aeb7b4;stroke-width:2}.p5{fill:none;stroke:#c09551;stroke-width:2.5}.p10{fill:none;stroke:#6f9278;stroke-width:2.5}.p20{fill:none;stroke:#587e9b;stroke-width:3}.ref{stroke:#b77968;stroke-dasharray:5 4}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">兩個方法一樣好，「各報最好」仍能造出一個勝者</text>
 <g transform="translate(40 65)"><rect class="panel" width="880" height="190" rx="12"/><text x="18" y="28" class="h">真實中心相同；這次各抽三個 seed</text>
  <line x1="75" y1="116" x2="820" y2="116" class="axis"/><line x1="475" y1="49" x2="475" y2="155" class="center"/><text x="424" y="43" class="s">共同真實中心</text>
  <g class="a"><circle cx="365" cy="96" r="6"/><circle cx="402" cy="136" r="6"/><circle cx="440" cy="84" r="6"/><circle cx="489" cy="138" r="6"/><circle cx="528" cy="93" r="6"/><circle cx="582" cy="126" r="6"/></g><g class="b"><circle cx="383" cy="80" r="6"/><circle cx="421" cy="126" r="6"/><circle cx="460" cy="101" r="6"/><circle cx="505" cy="78" r="6"/><circle cx="548" cy="139" r="6"/><circle cx="602" cy="101" r="6"/></g>
  <circle cx="365" cy="96" r="10" fill="none" stroke="#b77968" stroke-width="3"/><circle cx="505" cy="78" r="10" fill="none" stroke="#b77968" stroke-width="3"/><line x1="365" y1="164" x2="505" y2="164" stroke="#b77968" stroke-width="2"/><path d="M365 157V171M505 157V171" stroke="#b77968" stroke-width="2"/><text x="383" y="183" class="s" fill="#b77968">看起來的優勢 10.5%</text><text x="105" y="88" class="s" fill="#6f9278">方法 A</text><text x="105" y="111" class="s" fill="#6f91ad">方法 B</text>
 </g>
 <g transform="translate(40 277)"><rect class="panel" width="420" height="220" rx="12"/><text x="18" y="27" class="h">各報最好：假優勢不會自己消失</text>
  <line x1="55" y1="177" x2="390" y2="177" class="axis"/><line x1="55" y1="48" x2="55" y2="177" class="axis"/>
  <path d="M75 82 L160 111 L245 119 L360 131" class="med"/><path d="M75 51 L160 92 L245 100 L360 109" class="p90"/>
  <text x="285" y="126" class="s" fill="#587e9b">中位數 16.9→6.9%</text><text x="248" y="85" class="s" fill="#b77968">90% 分位 70.1→19.1%</text><text x="184" y="202" class="s">seed 數 k</text>
 </g>
 <g transform="translate(500 277)"><rect class="panel" width="420" height="220" rx="12"/><text x="18" y="27" class="h">報中位數：多少 seed 才看得見真差距？</text>
  <line x1="55" y1="177" x2="390" y2="177" class="axis"/><line x1="55" y1="48" x2="55" y2="177" class="axis"/><line x1="55" y1="79" x2="390" y2="79" class="ref"/><text x="60" y="72" class="s">80%</text>
  <path d="M70 157 C170 153 270 147 380 139" class="p2"/><path d="M70 148 C165 137 270 118 380 101" class="p5"/><path d="M70 130 C160 105 260 77 380 63" class="p10"/><path d="M70 100 C155 63 260 51 380 48" class="p20"/>
  <text x="333" y="142" class="s">2%</text><text x="333" y="105" class="s">5%</text><text x="333" y="67" class="s">10%</text><text x="333" y="45" class="s">20%</text><text x="180" y="202" class="s">seed 數 k</text>
 </g>
 <text x="40" y="522" class="s">先量方法本身的抖動，再決定要幾顆 seed；不要讓報法替你創造效果。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
 <title id="title">Two hyperparameter roles, different diagnostic evidence</title><desc id="desc">Validation evaluates capacity tradeoffs; training dynamics diagnose optimization, with overlap between these roles.</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#adb7b4}.risk{fill:none;stroke:#c09551;stroke-width:4}.train{fill:none;stroke:#587e9b;stroke-width:3;stroke-dasharray:7 5}.ok{fill:none;stroke:#6f9278;stroke-width:3}.stuck{fill:none;stroke:#c09551;stroke-width:3}.bad{fill:none;stroke:#b77968;stroke-width:3}.sub{fill:#f7f5ef;stroke:#deddd6}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"></rect><text x="40" y="42" class="t">Use validation for generalization and training dynamics for optimization</text>
 <g transform="translate(40 70)"><rect class="panel" width="420" height="400" rx="12"></rect><text x="18" y="29" class="h">Capacity: which candidates generalize well?</text>
  <line x1="55" y1="326" x2="390" y2="326" class="axis"></line><line x1="55" y1="70" x2="55" y2="326" class="axis"></line>
  <path d="M65 105 Q206 376 380 103" class="risk"></path><path d="M65 145 C167 207 270 265 380 305" class="train"></path>
  <circle cx="211" cy="239" r="7" fill="#c09551"></circle><text x="175" y="225" class="s">Validation minimum</text><path d="M330 271 L378 303" stroke="#587e9b" stroke-width="2"></path><text x="238" y="263" class="s">Training favors capacity</text>
  <g transform="translate(62 77)"><rect class="sub" width="78" height="62" rx="6"></rect><path d="M8 47L70 17" class="train"></path><text x="7" y="58" class="s">Possible underfitting</text></g><g transform="translate(304 77)"><rect class="sub" width="78" height="62" rx="6"></rect><path d="M7 45C15 5 24 58 34 17S51 60 60 11S69 56 75 20" class="bad"></path><text x="7" y="58" class="s" style="font-size: 11.1px;">Possible overfitting</text></g>
  <text x="62" y="355" class="s">Lower capacity</text><text x="335" y="355" class="s" style="font-size: 10.3px;">Higher capacity</text>
 </g>
 <g transform="translate(485 70)"><rect class="panel" width="435" height="400" rx="12"></rect><text x="18" y="29" class="h">Optimization: is fitting working as intended?</text>
  <line x1="55" y1="326" x2="405" y2="326" class="axis"></line><line x1="55" y1="70" x2="55" y2="326" class="axis"></line>
  <path d="M65 95 C130 166 213 257 395 298" class="ok"></path><path d="M65 145 C176 152 286 159 395 165" class="stuck"></path><path d="M65 298 L395 82" class="bad"></path>
  <text x="295" y="297" class="s" fill="#6f9278">Healthy decrease</text><text x="298" y="159" class="s" fill="#c09551" style="font-size: 12.84px;">Tiny η: slow progress</text><text x="302" y="90" class="s" fill="#b77968" style="font-size: 9.43px;">Beyond stability: divergence</text>
  <rect x="95" y="212" width="220" height="88" rx="8" class="sub"></rect><text x="108" y="232" class="h">Hyperparameters can affect both roles</text><text x="108" y="254" class="s">Steps: fitting strength and convergence</text><text x="108" y="274" class="s">Learning rate: stability and implicit bias</text><text x="108" y="294" class="s">Batch size: gradient noise and generalization</text>
  <text x="205" y="356" class="s">Steps (log)</text>
 </g>
 <text x="40" y="510" class="s">Check optimization before interpreting a capacity comparison as a generalization effect.</text>
</svg>

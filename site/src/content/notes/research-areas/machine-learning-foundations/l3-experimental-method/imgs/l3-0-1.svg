<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">兩類超參數，兩種壞掉的方式</title><desc id="desc">容量型超參數應用驗證風險選擇，最佳化型超參數應由訓練動態診斷。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#adb7b4}.risk{fill:none;stroke:#c09551;stroke-width:4}.train{fill:none;stroke:#587e9b;stroke-width:3;stroke-dasharray:7 5}.ok{fill:none;stroke:#6f9278;stroke-width:3}.stuck{fill:none;stroke:#c09551;stroke-width:3}.bad{fill:none;stroke:#b77968;stroke-width:3}.sub{fill:#f7f5ef;stroke:#deddd6}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">容量超參數用驗證診斷；最佳化超參數用訓練動態診斷</text>
 <g transform="translate(40 70)"><rect class="panel" width="420" height="400" rx="12"/><text x="18" y="29" class="h">容量類：哪個假設空間泛化最好？</text>
  <line x1="55" y1="326" x2="390" y2="326" class="axis"/><line x1="55" y1="70" x2="55" y2="326" class="axis"/>
  <path d="M65 105 Q206 376 380 103" class="risk"/><path d="M65 145 C167 207 270 265 380 305" class="train"/>
  <circle cx="211" cy="239" r="7" fill="#c09551"/><text x="175" y="225" class="s">驗證谷底</text><path d="M330 271 L378 303" stroke="#587e9b" stroke-width="2"/><text x="238" y="263" class="s">只看訓練 → 永遠選最右</text>
  <g transform="translate(62 77)"><rect class="sub" width="78" height="62" rx="6"/><path d="M8 47L70 17" class="train"/><text x="7" y="58" class="s">欠擬合</text></g><g transform="translate(304 77)"><rect class="sub" width="78" height="62" rx="6"/><path d="M7 45C15 5 24 58 34 17S51 60 60 11S69 56 75 20" class="bad"/><text x="7" y="58" class="s">過擬合</text></g>
  <text x="62" y="355" class="s">小容量</text><text x="335" y="355" class="s">大容量</text>
 </g>
 <g transform="translate(485 70)"><rect class="panel" width="435" height="400" rx="12"/><text x="18" y="29" class="h">最佳化類：訓練本身有沒有正常運作？</text>
  <line x1="55" y1="326" x2="405" y2="326" class="axis"/><line x1="55" y1="70" x2="55" y2="326" class="axis"/>
  <path d="M65 95 C130 166 213 257 395 298" class="ok"/><path d="M65 145 C176 152 286 159 395 165" class="stuck"/><path d="M65 298 L395 82" class="bad"/>
  <text x="295" y="297" class="s" fill="#6f9278">正常下降</text><text x="298" y="159" class="s" fill="#c09551">η 太小：卡住</text><text x="302" y="90" class="s" fill="#b77968">越過門檻：發散</text>
  <rect x="95" y="212" width="220" height="88" rx="8" class="sub"/><text x="108" y="232" class="h">同時屬於兩類的超參數</text><text x="108" y="254" class="s">步數：容量 + 是否收斂</text><text x="108" y="274" class="s">學習率：隱式正則 + 穩定性</text><text x="108" y="294" class="s">batch：噪聲地板 + 泛化</text>
  <text x="205" y="356" class="s">步數（log）</text>
 </g>
 <text x="40" y="510" class="s">先確定右格正常，左格的泛化訊號才有解讀價值。</text>
</svg>

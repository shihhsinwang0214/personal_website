<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">同一個碗，三種步伐</title><desc id="desc">細長二次碗中的三條梯度下降軌跡，以及相對應的對數損失曲線。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#28363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.cont{fill:none;stroke:#d8ddd8;stroke-width:1.5}.axis{stroke:#abb5b2}.small{fill:none;stroke:#6f9278;stroke-width:3}.ok{fill:none;stroke:#587e9b;stroke-width:3}.bad{fill:none;stroke:#b77968;stroke-width:3}.ref{stroke:#c09551;stroke-width:2;stroke-dasharray:6 5}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="43" class="t">步伐上限由最陡方向決定，時間由最平方向決定</text>
 <g transform="translate(40 72)"><rect class="panel" width="420" height="390" rx="12"/><text x="18" y="30" class="h">參數空間：κ ≈ 20 的細長碗</text>
   <g transform="rotate(-24 220 215)"><ellipse cx="220" cy="215" rx="172" ry="54" class="cont"/><ellipse cx="220" cy="215" rx="132" ry="40" class="cont"/><ellipse cx="220" cy="215" rx="91" ry="27" class="cont"/><ellipse cx="220" cy="215" rx="48" ry="14" class="cont"/></g>
   <circle cx="220" cy="215" r="5" fill="#26343a"/><text x="228" y="210" class="s">最小點</text>
   <path d="M68 92 C84 112 103 132 119 151 S151 180 168 192 S196 207 220 215" class="small" stroke-dasharray="2 5"/>
   <path d="M68 92 L137 263 L157 143 L190 240 L203 185 L220 215" class="ok"/>
   <path d="M68 92 L145 285 L119 62 L226 348 L82 20" class="bad"/>
   <text x="47" y="76" class="s">共同起點</text><text x="33" y="302" class="s" fill="#6f9278">η 很小：慢</text><text x="151" y="339" class="s" fill="#587e9b">η 適中：收斂</text><text x="247" y="63" class="s" fill="#b77968">η &gt; 2/λmax：發散</text>
 </g>
 <g transform="translate(485 72)"><rect class="panel" width="435" height="390" rx="12"/><text x="18" y="30" class="h">log 損失 vs. 步數</text>
   <line x1="55" y1="325" x2="405" y2="325" class="axis"/><line x1="55" y1="65" x2="55" y2="325" class="axis"/>
   <line x1="55" y1="292" x2="405" y2="292" class="ref"/><text x="321" y="286" class="s">數值地板</text>
   <path d="M60 90 C145 125 223 178 398 276" class="small"/><path d="M60 90 C118 171 175 271 250 292 L398 292" class="ok"/><path d="M60 286 L398 76" class="bad"/>
   <text x="318" y="262" class="s" fill="#6f9278">慢慢下降</text><text x="272" y="311" class="s" fill="#587e9b">快速到地板</text><text x="273" y="98" class="s" fill="#b77968">log 圖上的直線上升</text>
   <text x="205" y="352" class="s">步數</text><text x="10" y="202" class="s" transform="rotate(-90 10 202)">log L</text>
 </g>
 <text x="40" y="505" class="s">越過 η★ 不是「收斂比較慢」：每一步都把誤差乘上一個大於 1 的數。</text>
</svg>

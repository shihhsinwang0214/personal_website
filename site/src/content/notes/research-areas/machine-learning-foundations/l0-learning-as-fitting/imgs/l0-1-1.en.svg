<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
  <title id="title">Four scoring rules, different optimal answers</title><desc id="desc">Four losses give different optimal predictions for the same conditional two-point distribution.</desc>
  <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#aeb8b5}.grid{stroke:#e3e1da}.c1{fill:none;stroke:#587e9b;stroke-width:3}.c2{fill:none;stroke:#6f9278;stroke-width:3}.c3{fill:none;stroke:#c09551;stroke-width:3}.c4{fill:none;stroke:#b77968;stroke-width:3}.arr{stroke-width:2;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"></path></marker></defs>
  <rect width="960" height="540" rx="18" fill="#f2efe7"></rect><text x="40" y="43" class="t">The loss selects which distributional quantity to predict</text>
  <g transform="translate(40 68)"><rect class="panel" width="880" height="230" rx="12"></rect><text x="18" y="27" class="h">One residual r, four penalties</text>
    <line x1="55" y1="196" x2="840" y2="196" class="axis"></line><line x1="448" y1="50" x2="448" y2="204" class="axis"></line>
    <path d="M70 54 Q448 196 826 54" class="c1"></path><path d="M70 58 L448 196 L826 58" class="c2"></path>
    <path d="M70 90 L400 187 Q448 201 496 187 L826 90" class="c3"></path><path d="M70 48 L448 196 L826 145" class="c4"></path>
    <text x="742" y="48" class="s" fill="#587e9b">Squared L2</text><text x="742" y="79" class="s" fill="#6f9278">Absolute L1</text><text x="742" y="108" class="s" fill="#c09551">Huber δ=.3</text><text x="742" y="139" class="s" fill="#b77968">Asymmetric 3:1</text>
    <text x="62" y="216" class="s">−3</text><text x="444" y="216" class="s">0</text><text x="820" y="216" class="s">+3</text><text x="458" y="67" class="s">Penalty</text>
  </g>
  <g transform="translate(40 316)"><rect class="panel" width="880" height="178" rx="12"></rect><text x="18" y="27" class="h">Same data: 22°C (40%) and 30°C (60%)</text>
    <line x1="70" y1="142" x2="820" y2="142" class="axis"></line>
    <rect x="202" y="74" width="90" height="68" rx="4" fill="#91a8b4"></rect><rect x="585" y="40" width="90" height="102" rx="4" fill="#c9a86b"></rect>
    <text x="224" y="164" class="s">22°C</text><text x="606" y="164" class="s">30°C</text><text x="222" y="66" class="s">40%</text><text x="607" y="32" class="s">60%</text>
    <line x1="442" y1="65" x2="442" y2="139" class="arr c1"></line><text x="384" y="56" class="s">L2 → mean 26.8</text>
    <line x1="628" y1="72" x2="628" y2="139" class="arr c2"></line><text x="678" y="75" class="s">L1 → median 30</text>
    <line x1="650" y1="94" x2="650" y2="139" class="arr c3"></line><text x="683" y="98" class="s">Huber → 30</text>
    <line x1="701" y1="118" x2="701" y2="139" class="arr c4"></line><text x="711" y="122" class="s" style="font-size: 10.1px;">Quantile: favors a higher estimate</text>
  </g>
  <text x="40" y="520" class="s">Changing the loss changes what counts as the optimal answer.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">訓練誤差、同分布風險、上線風險的兩段落差</title><desc id="desc">左圖是三種風險的對數軸，右圖顯示模型在訓練分布之外的外推崩壞。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#28363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#667277}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#abb5b2}.truth{fill:none;stroke:#a7adae;stroke-width:2;stroke-dasharray:6 5}.fit{fill:none;stroke:#587e9b;stroke-width:3}.bad{fill:none;stroke:#b77968;stroke-width:4}.dash{stroke:#b77968;stroke-width:2;stroke-dasharray:5 5}.pt{fill:#c09551}.arr{fill:none;stroke-width:2;marker-end:url(#a)}</style>
 <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="43" class="t">一條訓練數字，看不見兩段落差</text>
 <g transform="translate(40 72)"><rect class="panel" width="420" height="390" rx="12"/><text x="18" y="30" class="h">風險的 log 數字軸</text>
   <line x1="48" y1="188" x2="374" y2="188" class="axis"/><g class="axis"><line x1="67" y1="181" x2="67" y2="195"/><line x1="155" y1="181" x2="155" y2="195"/><line x1="242" y1="181" x2="242" y2="195"/><line x1="330" y1="181" x2="330" y2="195"/></g>
   <text x="48" y="215" class="s">10⁻²</text><text x="144" y="215" class="s">1</text><text x="226" y="215" class="s">10²</text><text x="310" y="215" class="s">10⁴</text>
   <circle cx="74" cy="188" r="8" fill="#587e9b"/><text x="38" y="155" class="h">訓練 0.0122</text>
   <circle cx="89" cy="188" r="8" fill="#6f9278"/><text x="84" y="257" class="h">同分布 0.0286</text>
   <circle cx="323" cy="188" r="8" fill="#b77968"/><text x="274" y="155" class="h">上線 8113</text>
   <path d="M79 135 Q83 105 89 135" class="arr" stroke="#6f9278"/><text x="38" y="92" class="s">挑選造成的樂觀</text>
   <path d="M102 285 Q210 338 315 285" class="arr" stroke="#b77968"/><text x="157" y="362" class="s">分布偏移</text>
   <text x="30" y="330" class="s">只有最左邊，是訓練時看得到的數字。</text>
 </g>
 <g transform="translate(485 72)"><rect class="panel" width="435" height="390" rx="12"/><text x="18" y="30" class="h">同一條曲線，跨過 x＝0.7 後失控</text>
   <rect x="42" y="60" width="245" height="275" fill="#e9eee9"/><rect x="287" y="60" width="108" height="275" fill="#f2dfdc"/>
   <line x1="42" y1="335" x2="400" y2="335" class="axis"/><line x1="42" y1="60" x2="42" y2="335" class="axis"/>
   <path d="M42 199 C77 82 127 82 166 197 S247 315 287 196 S361 82 400 189" class="truth"/>
   <path d="M42 202 C80 94 126 89 166 194 S246 300 287 207" class="fit"/><path d="M287 207 C326 165 355 73 371 11 L405 -90" class="bad"/>
   <line x1="287" y1="60" x2="287" y2="335" class="dash"/>
   <g class="pt"><circle cx="57" cy="200" r="4"/><circle cx="76" cy="143" r="4"/><circle cx="99" cy="105" r="4"/><circle cx="124" cy="98" r="4"/><circle cx="151" cy="159" r="4"/><circle cx="178" cy="220" r="4"/><circle cx="206" cy="283" r="4"/><circle cx="239" cy="292" r="4"/><circle cx="270" cy="231" r="4"/></g>
   <text x="95" y="360" class="s">看過的區域</text><text x="298" y="360" class="s">沒看過</text><text x="304" y="93" class="s" fill="#b77968">外推衝出畫面</text>
 </g>
 <text x="40" y="505" class="s">訓練誤差只回答「記得手上資料嗎？」；它不回答抽樣誤差，也不回答部署分布是否已改變。</text>
</svg>

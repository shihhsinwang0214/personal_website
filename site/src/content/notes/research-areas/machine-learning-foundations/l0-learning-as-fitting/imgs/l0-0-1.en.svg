<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
  <title id="title">Same data, three modeling choices</title>
  <desc id="desc">Compare a baseline with changes to the hypothesis class, loss function, or data distribution.</desc>
  <style>
    text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#26343a} .t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#657176}.axis{stroke:#aeb8b5;stroke-width:1}.truth{fill:none;stroke:#a9afb0;stroke-width:2;stroke-dasharray:6 5}.fit{fill:none;stroke:#587e9b;stroke-width:3}.alt{fill:none;stroke:#b77968;stroke-width:3}.good{fill:none;stroke:#6f9278;stroke-width:3}.pt{fill:#c09551}.out{fill:#b45f5b}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.shade{fill:#ebe7dd}.cut{stroke:#b77968;stroke-width:2;stroke-dasharray:5 5}
  </style>
  <rect width="960" height="540" rx="18" fill="#f2efe7"></rect>
  <text x="40" y="42" class="t">Same data, three modeling choices</text>
  <g transform="translate(38 66)">
    <rect class="panel" width="430" height="205" rx="12"></rect>
    <text x="18" y="26" class="h">Baseline</text><text x="285" y="26" class="s" style="font-size: 8.54px;">F: cubic · ℓ: squared error · n: 30</text>
    <line x1="34" y1="175" x2="405" y2="175" class="axis"></line><line x1="34" y1="45" x2="34" y2="175" class="axis"></line>
    <path d="M34 111 C70 44 116 43 157 108 S244 174 285 110 S367 43 405 104" class="truth"></path>
    <path d="M34 119 C79 56 118 50 157 105 S245 165 285 113 S365 52 405 96" class="fit"></path>
    <g class="pt"><circle cx="48" cy="116" r="4"></circle><circle cx="67" cy="83" r="4"></circle><circle cx="88" cy="65" r="4"></circle><circle cx="111" cy="57" r="4"></circle><circle cx="135" cy="80" r="4"></circle><circle cx="158" cy="111" r="4"></circle><circle cx="181" cy="136" r="4"></circle><circle cx="205" cy="156" r="4"></circle><circle cx="230" cy="149" r="4"></circle><circle cx="255" cy="133" r="4"></circle><circle cx="281" cy="106" r="4"></circle><circle cx="307" cy="75" r="4"></circle><circle cx="335" cy="56" r="4"></circle><circle cx="363" cy="63" r="4"></circle><circle cx="392" cy="94" r="4"></circle></g>
  </g>
  <g transform="translate(492 66)">
    <rect class="panel" width="430" height="205" rx="12"></rect>
    <text x="18" y="26" class="h">Change F: underfit ↔ overfit</text>
    <line x1="34" y1="175" x2="405" y2="175" class="axis"></line><line x1="34" y1="45" x2="34" y2="175" class="axis"></line>
    <path d="M34 111 C70 44 116 43 157 108 S244 174 285 110 S367 43 405 104" class="truth"></path>
    <path d="M34 119 L405 98" class="fit"></path>
    <path d="M34 118 C50 35 66 176 84 70 S117 36 134 128 S162 191 180 101 S213 30 230 149 S264 192 283 99 S316 27 335 127 S370 187 405 91" class="alt"></path>
    <text x="50" y="56" class="s" fill="#587e9b">degree 1</text><text x="315" y="154" class="s" fill="#b77968">degree 25</text>
  </g>
  <g transform="translate(38 291)">
    <rect class="panel" width="430" height="205" rx="12"></rect>
    <text x="18" y="26" class="h">Change ℓ: sensitivity to outliers</text>
    <line x1="34" y1="175" x2="405" y2="175" class="axis"></line><line x1="34" y1="45" x2="34" y2="175" class="axis"></line>
    <g class="pt"><circle cx="50" cy="130" r="4"></circle><circle cx="78" cy="113" r="4"></circle><circle cx="110" cy="105" r="4"></circle><circle cx="147" cy="99" r="4"></circle><circle cx="188" cy="89" r="4"></circle><circle cx="228" cy="83" r="4"></circle><circle cx="271" cy="75" r="4"></circle><circle cx="313" cy="68" r="4"></circle><circle cx="366" cy="58" r="4"></circle></g>
    <g class="out"><circle cx="120" cy="47" r="5"></circle><circle cx="230" cy="151" r="5"></circle><circle cx="347" cy="43" r="5"></circle></g>
    <path d="M40 128 C130 118 215 90 405 54" class="good"></path><path d="M40 118 C145 80 265 94 405 42" class="alt"></path>
    <text x="52" y="154" class="s">L1: less outlier influence</text><text x="275" y="114" class="s" style="font-size: 11.82px;">L2: pulled by the red point</text>
  </g>
  <g transform="translate(492 291)">
    <rect class="panel" width="430" height="205" rx="12"></rect>
    <text x="18" y="26" class="h">Change D: outside the training region</text>
    <rect x="34" y="42" width="225" height="133" class="shade" opacity=".6"></rect>
    <line x1="34" y1="175" x2="405" y2="175" class="axis"></line><line x1="34" y1="45" x2="34" y2="175" class="axis"></line>
    <path d="M34 111 C70 44 116 43 157 108 S244 174 285 110 S367 43 405 104" class="truth"></path>
    <path d="M34 116 C76 55 118 48 157 106 S219 165 259 138 C302 107 337 69 360 20 L405 -30" class="fit"></path>
    <line x1="259" y1="42" x2="259" y2="175" class="cut"></line>
    <text x="76" y="164" class="s">Observed region</text><text x="273" y="164" class="s" style="font-size: 8.99px;">Unconstrained extrapolation region</text>
  </g>
  <g transform="translate(40 515)"><line x2="28" class="truth"></line><text x="36" y="5" class="s">True function</text><line x1="130" x2="158" class="fit"></line><text x="166" y="5" class="s">Fit</text><circle cx="265" r="4" class="pt"></circle><text x="276" y="5" class="s">Data</text></g>
</svg>

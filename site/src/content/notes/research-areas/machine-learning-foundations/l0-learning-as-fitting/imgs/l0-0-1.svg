<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">同一份資料，分別改變三項要素</title>
  <desc id="desc">基準設定與分別改變假設空間、損失函數、資料分布後的四種擬合結果。</desc>
  <style>
    text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#26343a} .t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#657176}.axis{stroke:#aeb8b5;stroke-width:1}.truth{fill:none;stroke:#a9afb0;stroke-width:2;stroke-dasharray:6 5}.fit{fill:none;stroke:#587e9b;stroke-width:3}.alt{fill:none;stroke:#b77968;stroke-width:3}.good{fill:none;stroke:#6f9278;stroke-width:3}.pt{fill:#c09551}.out{fill:#b45f5b}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.shade{fill:#ebe7dd}.cut{stroke:#b77968;stroke-width:2;stroke-dasharray:5 5}
  </style>
  <rect width="960" height="540" rx="18" fill="#f2efe7"/>
  <text x="40" y="42" class="t">同一份資料，分別改變三項要素</text>
  <g transform="translate(38 66)">
    <rect class="panel" width="430" height="205" rx="12"/>
    <text x="18" y="26" class="h">基準</text><text x="285" y="26" class="s">F＝三次 · ℓ＝平方 · n＝30</text>
    <line x1="34" y1="175" x2="405" y2="175" class="axis"/><line x1="34" y1="45" x2="34" y2="175" class="axis"/>
    <path d="M34 111 C70 44 116 43 157 108 S244 174 285 110 S367 43 405 104" class="truth"/>
    <path d="M34 119 C79 56 118 50 157 105 S245 165 285 113 S365 52 405 96" class="fit"/>
    <g class="pt"><circle cx="48" cy="116" r="4"/><circle cx="67" cy="83" r="4"/><circle cx="88" cy="65" r="4"/><circle cx="111" cy="57" r="4"/><circle cx="135" cy="80" r="4"/><circle cx="158" cy="111" r="4"/><circle cx="181" cy="136" r="4"/><circle cx="205" cy="156" r="4"/><circle cx="230" cy="149" r="4"/><circle cx="255" cy="133" r="4"/><circle cx="281" cy="106" r="4"/><circle cx="307" cy="75" r="4"/><circle cx="335" cy="56" r="4"/><circle cx="363" cy="63" r="4"/><circle cx="392" cy="94" r="4"/></g>
  </g>
  <g transform="translate(492 66)">
    <rect class="panel" width="430" height="205" rx="12"/>
    <text x="18" y="26" class="h">只換 F：欠擬合 ↔ 過擬合</text>
    <line x1="34" y1="175" x2="405" y2="175" class="axis"/><line x1="34" y1="45" x2="34" y2="175" class="axis"/>
    <path d="M34 111 C70 44 116 43 157 108 S244 174 285 110 S367 43 405 104" class="truth"/>
    <path d="M34 119 L405 98" class="fit"/>
    <path d="M34 118 C50 35 66 176 84 70 S117 36 134 128 S162 191 180 101 S213 30 230 149 S264 192 283 99 S316 27 335 127 S370 187 405 91" class="alt"/>
    <text x="50" y="56" class="s" fill="#587e9b">degree 1</text><text x="315" y="154" class="s" fill="#b77968">degree 25</text>
  </g>
  <g transform="translate(38 291)">
    <rect class="panel" width="430" height="205" rx="12"/>
    <text x="18" y="26" class="h">只換 ℓ：離群值拉動答案</text>
    <line x1="34" y1="175" x2="405" y2="175" class="axis"/><line x1="34" y1="45" x2="34" y2="175" class="axis"/>
    <g class="pt"><circle cx="50" cy="130" r="4"/><circle cx="78" cy="113" r="4"/><circle cx="110" cy="105" r="4"/><circle cx="147" cy="99" r="4"/><circle cx="188" cy="89" r="4"/><circle cx="228" cy="83" r="4"/><circle cx="271" cy="75" r="4"/><circle cx="313" cy="68" r="4"/><circle cx="366" cy="58" r="4"/></g>
    <g class="out"><circle cx="120" cy="47" r="5"/><circle cx="230" cy="151" r="5"/><circle cx="347" cy="43" r="5"/></g>
    <path d="M40 128 C130 118 215 90 405 54" class="good"/><path d="M40 118 C145 80 265 94 405 42" class="alt"/>
    <text x="52" y="154" class="s">L1：跟著多數</text><text x="275" y="114" class="s">L2：被紅點拉走</text>
  </g>
  <g transform="translate(492 291)">
    <rect class="panel" width="430" height="205" rx="12"/>
    <text x="18" y="26" class="h">只換 D：訓練範圍之外</text>
    <rect x="34" y="42" width="225" height="133" class="shade" opacity=".6"/>
    <line x1="34" y1="175" x2="405" y2="175" class="axis"/><line x1="34" y1="45" x2="34" y2="175" class="axis"/>
    <path d="M34 111 C70 44 116 43 157 108 S244 174 285 110 S367 43 405 104" class="truth"/>
    <path d="M34 116 C76 55 118 48 157 106 S219 165 259 138 C302 107 337 69 360 20 L405 -30" class="fit"/>
    <line x1="259" y1="42" x2="259" y2="175" class="cut"/>
    <text x="76" y="164" class="s">看過的資料</text><text x="273" y="164" class="s">沒有定義的外推區</text>
  </g>
  <g transform="translate(40 515)"><line x2="28" class="truth"/><text x="36" y="5" class="s">真實函數</text><line x1="130" x2="158" class="fit"/><text x="166" y="5" class="s">擬合</text><circle cx="265" r="4" class="pt"/><text x="276" y="5" class="s">資料</text></g>

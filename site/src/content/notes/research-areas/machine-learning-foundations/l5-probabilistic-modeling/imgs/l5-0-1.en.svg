<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
  <title id="title">One number, two components</title>
  <desc id="desc">Compare true, empirical, and uniform categorical distributions; decompose uniform-model NLL into empirical entropy and KL.</desc>
  <style>
    text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:12px;fill:#657176}.n{font-size:11px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#5f696d;stroke-width:1.5}.grid{stroke:#dddcd5;stroke-width:1}.true{fill:#7796aa}.emp{fill:#c7a36a;fill-opacity:.72;stroke:#a27e45}.dash{stroke:#b77968;stroke-width:2;stroke-dasharray:7 5}.entropy{fill:#78999f}.kl{fill:#c9a45f}.ref{stroke:#6f9278;stroke-width:2;stroke-dasharray:6 4}.cap{stroke:#29363b;stroke-width:2}</style>
  <rect width="960" height="540" rx="18" fill="#f2efe7"></rect>
  <text x="40" y="42" class="t">Uniform-model NLL = empirical entropy + mismatch KL</text>
  <g transform="translate(40 68)">
    <rect class="panel" width="420" height="414" rx="12"></rect>
    <text x="20" y="30" class="h">Three distributions on the same six outcomes</text>
    <line x1="54" y1="352" x2="394" y2="352" class="axis"></line><line x1="54" y1="74" x2="54" y2="352" class="axis"></line>
    <g class="grid"><line x1="54" y1="282" x2="394" y2="282"></line><line x1="54" y1="212" x2="394" y2="212"></line><line x1="54" y1="142" x2="394" y2="142"></line></g>
    <text x="22" y="356" class="n">0</text><text x="15" y="286" class="n">.1</text><text x="15" y="216" class="n">.2</text><text x="15" y="146" class="n">.3</text>
    <g class="true"><rect x="72" y="317" width="34" height="35" rx="3"></rect><rect x="124" y="282" width="34" height="70" rx="3"></rect><rect x="176" y="247" width="34" height="105" rx="3"></rect><rect x="228" y="212" width="34" height="140" rx="3"></rect><rect x="280" y="198" width="34" height="154" rx="3"></rect><rect x="332" y="156" width="34" height="196" rx="3"></rect></g>
    <g class="emp"><rect x="80" y="329" width="18" height="23" rx="2"></rect><rect x="132" y="306" width="18" height="46" rx="2"></rect><rect x="184" y="235" width="18" height="117" rx="2"></rect><rect x="236" y="258" width="18" height="94" rx="2"></rect><rect x="288" y="188" width="18" height="164" rx="2"></rect><rect x="340" y="141" width="18" height="211" rx="2"></rect></g>
    <line x1="54" y1="235" x2="394" y2="235" class="dash"></line><text x="276" y="226" class="n" fill="#9e6657">Uniform model: 1/6</text>
    <g class="s"><text x="84" y="372">1</text><text x="136" y="372">2</text><text x="188" y="372">3</text><text x="240" y="372">4</text><text x="292" y="372">5</text><text x="344" y="372">6</text></g>
    <rect x="61" y="389" width="13" height="13" class="true"></rect><text x="81" y="400" class="n">True p</text><rect x="147" y="389" width="13" height="13" class="emp"></rect><text x="167" y="400" class="n">Empirical p̂ (n=30)</text><line x1="289" y1="396" x2="312" y2="396" class="dash"></line><text x="319" y="400" class="n">Uniform</text>
  </g>
  <g transform="translate(480 68)">
    <rect class="panel" width="440" height="414" rx="12"></rect>
    <text x="20" y="30" class="h">Fixed total height, changing entropy–KL split</text>
    <line x1="55" y1="352" x2="414" y2="352" class="axis"></line><line x1="55" y1="74" x2="55" y2="352" class="axis"></line>
    <g class="grid"><line x1="55" y1="282" x2="414" y2="282"></line><line x1="55" y1="212" x2="414" y2="212"></line><line x1="55" y1="142" x2="414" y2="142"></line></g>
    <text x="21" y="356" class="n">0</text><text x="15" y="286" class="n">0.5</text><text x="15" y="216" class="n">1.0</text><text x="15" y="146" class="n">1.5</text>
    <line x1="55" y1="101" x2="414" y2="101" class="cap"></line><text x="238" y="93" class="n">log 6 = 1.7918 (total NLL)</text>
    <line x1="55" y1="117" x2="414" y2="117" class="ref"></line><text x="245" y="130" class="n" fill="#58785f">True entropy: 1.6784</text>
    <g><rect x="80" y="145" width="54" height="207" class="entropy"></rect><rect x="80" y="101" width="54" height="44" class="kl"></rect><rect x="165" y="126" width="54" height="226" class="entropy"></rect><rect x="165" y="101" width="54" height="25" class="kl"></rect><rect x="250" y="119" width="54" height="233" class="entropy"></rect><rect x="250" y="101" width="54" height="18" class="kl"></rect><rect x="345" y="117" width="54" height="235" class="entropy"></rect></g>
    <g class="s"><text x="88" y="373">n=30</text><text x="169" y="373">n=300</text><text x="250" y="373">n=3000</text><text x="357" y="373">MLE</text></g>
    <text x="90" y="244" class="n" fill="#fff">H(p̂)</text><text x="91" y="128" class="n">KL</text><text x="349" y="239" class="n" fill="#fff">Entropy only</text>
    <rect x="70" y="390" width="14" height="14" class="entropy"></rect><text x="91" y="402" class="n">Empirical entropy H(p̂)</text><rect x="194" y="390" width="14" height="14" class="kl"></rect><text x="215" y="402" class="n">KL(p̂ ∥ uniform)</text>
  </g>
  <text x="40" y="518" class="s">Unrestricted categorical MLE sets empirical KL to zero, fitting finite-sample frequency fluctuations too.</text>
</svg>

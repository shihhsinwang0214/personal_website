<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">天花板、下界，與兩者之間那塊 KL</title>
  <desc id="desc">左側顯示固定的 log likelihood 天花板與 ELBO 曲線；右側顯示兩者差距正好等於後驗 KL。</desc>
  <style>
    text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:12px;fill:#657176}.n{font-size:11px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#5f696d;stroke-width:1.5}.grid{stroke:#e1e0d9;stroke-width:1}.ceil{stroke:#29363b;stroke-width:2.5}.elbo{fill:none;stroke:#587e9b;stroke-width:4}.kl{fill:none;stroke:#b77968;stroke-width:4}.quad{fill:none;stroke:#c09551;stroke-width:2;stroke-dasharray:7 5}.gap{stroke:#c09551;stroke-width:2;marker-start:url(#a);marker-end:url(#a)}.dot{fill:#b77968;stroke:#fffdf8;stroke-width:2}</style>
  <defs><marker id="a" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0 3.5L7 0V7Z" fill="#c09551"/></marker></defs>
  <rect width="960" height="540" rx="18" fill="#f2efe7"/>
  <text x="40" y="42" class="t">ELBO 離天花板多遠，就等於 q 離真後驗多遠</text>
  <g transform="translate(40 68)">
    <rect class="panel" width="430" height="414" rx="12"/><text x="20" y="30" class="h">下界與天花板</text>
    <line x1="58" y1="350" x2="402" y2="350" class="axis"/><line x1="58" y1="72" x2="58" y2="350" class="axis"/>
    <g class="grid"><line x1="58" y1="110" x2="402" y2="110"/><line x1="58" y1="190" x2="402" y2="190"/><line x1="58" y1="270" x2="402" y2="270"/></g>
    <text x="17" y="113" class="n">−1.5</text><text x="17" y="193" class="n">−2.0</text><text x="17" y="273" class="n">−2.5</text><text x="17" y="353" class="n">−3.0</text>
    <line x1="58" y1="121" x2="402" y2="121" class="ceil"/><text x="202" y="109" class="n">天花板 log p(x) = −1.5691</text>
    <path d="M58 342 C105 304 154 250 207 192 C251 145 290 123 336 121 C365 123 389 135 402 151" class="elbo"/>
    <line x1="75" y1="121" x2="75" y2="328" class="gap"/><text x="83" y="225" class="n" fill="#9a7741">1.4067</text>
    <line x1="230" y1="121" x2="230" y2="177" class="gap"/><text x="238" y="153" class="n" fill="#9a7741">0.2495</text>
    <line x1="333" y1="121" x2="333" y2="124" class="gap"/><text x="309" y="151" class="n" fill="#9a7741">0.0006</text>
    <circle cx="338" cy="121" r="6" fill="#6f9278"/><text x="255" y="92" class="n" fill="#58785f">r=0.8134 = 真後驗</text>
    <g class="n"><text x="54" y="369">0</text><text x="138" y="369">.25</text><text x="224" y="369">.50</text><text x="310" y="369">.75</text><text x="397" y="369">1</text></g>
    <text x="172" y="394" class="s">r = q(z=1)</text><line x1="74" y1="390" x2="103" y2="390" class="elbo"/><text x="109" y="394" class="n">ELBO</text>
  </g>
  <g transform="translate(490 68)">
    <rect class="panel" width="430" height="414" rx="12"/><text x="20" y="30" class="h">同一個差距，改畫成 KL</text>
    <line x1="58" y1="350" x2="402" y2="350" class="axis"/><line x1="58" y1="72" x2="58" y2="350" class="axis"/>
    <g class="grid"><line x1="58" y1="281" x2="402" y2="281"/><line x1="58" y1="212" x2="402" y2="212"/><line x1="58" y1="143" x2="402" y2="143"/></g>
    <text x="28" y="353" class="n">0</text><text x="18" y="284" class="n">0.5</text><text x="18" y="215" class="n">1.0</text><text x="18" y="146" class="n">1.5</text>
    <path d="M58 134 C111 195 160 258 221 316 C263 347 300 352 337 350 C363 349 387 339 402 326" class="kl"/>
    <path d="M276 350 Q337 330 397 350" class="quad"/><text x="292" y="309" class="n" fill="#9a7741">最佳點附近：二次近似</text>
    <g class="dot"><circle cx="75" cy="156" r="6"/><circle cx="230" cy="315" r="6"/><circle cx="333" cy="350" r="6"/></g>
    <text x="84" y="147" class="n">1.4067</text><text x="238" y="306" class="n">0.2495</text><text x="305" y="335" class="n">0.0006</text>
    <circle cx="338" cy="350" r="6" fill="#6f9278"/><text x="262" y="380" class="n" fill="#58785f">KL = 0</text>
    <g class="n"><text x="54" y="369">0</text><text x="138" y="369">.25</text><text x="224" y="369">.50</text><text x="310" y="369">.75</text><text x="397" y="369">1</text></g>
    <text x="166" y="398" class="s">KL(q ∥ p(z|x))</text>
  </g>
  <text x="40" y="518" class="s">r 從 0.8134 偏到 0.8（約 1.6%），KL 只增 0.0006，因此 ELBO 僅下降約 0.04%。</text>
</svg>

    <text x="316" y="73" class="s">雜訊樣本</text><path d="M310 78L278 66" stroke="#b77968" stroke-width="2"/>
    <text x="310" y="129" class="n">每維 log-likelihood</text><text x="310" y="146" class="n">變化（nats）</text>

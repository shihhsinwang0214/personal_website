<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">一個數字掉 0.007%，一百張裡有一張是垃圾</title>
  <desc id="desc">左側顯示一百個樣本中混入一個垃圾樣本時似然幾乎不變；右側顯示這個懲罰上界隨維度以一除以 d 衰減。</desc>
  <style>
    text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:12px;fill:#657176}.n{font-size:11px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#5f696d;stroke-width:1.5}.grid{stroke:#e1e0d9;stroke-width:1}.normal{fill:#dce7e3;stroke:#b8c9c2}.bad{fill:#596970;stroke:#b77968;stroke-width:2}.bar1{fill:#b77968}.bar2{fill:#c9a45f}.e1{fill:none;stroke:#587e9b;stroke-width:3}.e5{fill:none;stroke:#6f9278;stroke-width:3}.e10{fill:none;stroke:#b77968;stroke-width:3}.threshold{stroke:#c09551;stroke-width:2;stroke-dasharray:7 5}.dot{fill:#29363b;stroke:#fffdf8;stroke-width:2}</style>
  <defs><pattern id="static" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#d7d3cb"/><rect width="4" height="4" fill="#48595f"/><rect x="4" y="4" width="4" height="4" fill="#81939a"/></pattern></defs>
  <rect width="960" height="540" rx="18" fill="#f2efe7"/>

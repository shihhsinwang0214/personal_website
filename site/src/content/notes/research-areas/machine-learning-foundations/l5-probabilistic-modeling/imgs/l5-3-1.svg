    <text x="13" y="353" class="n">0</text><text x="8" y="284" class="n">10⁻⁴</text><text x="8" y="215" class="n">10⁻³</text><text x="8" y="146" class="n">10⁻²</text><text x="8" y="78" class="n">10⁻¹</text>

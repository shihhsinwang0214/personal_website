<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">同樣的邊際，不同的樣本</title>
  <desc id="desc">左側比較有相鄰結構的馬可夫序列與逐位置獨立序列；右側顯示忽略結構的 KL 代價。</desc>
  <style>
    text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:12px;fill:#657176}.n{font-size:11px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#5f696d;stroke-width:1.5}.grid{stroke:#e1e0d9;stroke-width:1}.curve{fill:none;stroke:#587e9b;stroke-width:4}.dot{fill:#b77968;stroke:#fffdf8;stroke-width:2}.one{fill:#5d7279}.zero{fill:#e7e5df}.cellgrid{stroke:#fffdf8;stroke-width:.6}</style>
  <defs>
    <pattern id="noise" width="32" height="20" patternUnits="userSpaceOnUse"><rect width="32" height="20" class="zero"/><path d="M0 0H8V5H16V10H24V5H32V15H24V20H16V15H8V20H0Z" class="one"/></pattern>
  </defs>
  <rect width="960" height="540" rx="18" fill="#f2efe7"/>
  <text x="40" y="42" class="t">邊際都是 0.5，不代表生成的序列一樣</text>
  <g transform="translate(40 68)">
    <rect class="panel" width="430" height="414" rx="12"/><text x="20" y="30" class="h">20 條長度 16 的抽樣序列</text>
    <text x="20" y="58" class="s">馬可夫鏈 q=0.1：長色塊</text>
    <g transform="translate(20 70)">
      <rect width="256" height="100" class="zero"/><g class="one"><rect x="0" y="0" width="96" height="5"/><rect x="152" y="0" width="104" height="5"/><rect x="32" y="5" width="128" height="5"/><rect x="208" y="5" width="48" height="5"/><rect x="0" y="10" width="48" height="5"/><rect x="112" y="10" width="144" height="5"/><rect x="64" y="15" width="160" height="5"/><rect x="0" y="20" width="144" height="5"/><rect x="192" y="20" width="64" height="5"/><rect x="16" y="25" width="80" height="5"/><rect x="176" y="25" width="80" height="5"/><rect x="0" y="30" width="64" height="5"/><rect x="128" y="30" width="96" height="5"/><rect x="48" y="35" width="176" height="5"/><rect x="0" y="40" width="112" height="5"/><rect x="160" y="40" width="96" height="5"/><rect x="80" y="45" width="144" height="5"/><rect x="0" y="50" width="32" height="5"/><rect x="96" y="50" width="160" height="5"/><rect x="0" y="55" width="176" height="5"/><rect x="224" y="55" width="32" height="5"/><rect x="48" y="60" width="96" height="5"/><rect x="192" y="60" width="64" height="5"/><rect x="0" y="65" width="80" height="5"/><rect x="144" y="65" width="112" height="5"/><rect x="64" y="70" width="192" height="5"/><rect x="0" y="75" width="128" height="5"/><rect x="176" y="75" width="80" height="5"/><rect x="16" y="80" width="112" height="5"/><rect x="192" y="80" width="64" height="5"/><rect x="0" y="85" width="48" height="5"/><rect x="96" y="85" width="128" height="5"/><rect x="80" y="90" width="112" height="5"/><rect x="0" y="95" width="160" height="5"/><rect x="208" y="95" width="48" height="5"/></g>
      <path d="M16 0V100M32 0V100M48 0V100M64 0V100M80 0V100M96 0V100M112 0V100M128 0V100M144 0V100M160 0V100M176 0V100M192 0V100M208 0V100M224 0V100M240 0V100M0 5H256M0 10H256M0 15H256M0 20H256M0 25H256M0 30H256M0 35H256M0 40H256M0 45H256M0 50H256M0 55H256M0 60H256M0 65H256M0 70H256M0 75H256M0 80H256M0 85H256M0 90H256M0 95H256" class="cellgrid" fill="none"/>
    </g>
    <text x="294" y="104" class="h" fill="#6f9278">切換率</text><text x="307" y="130" class="h" fill="#58785f">0.1006</text><text x="294" y="151" class="n">成段、可預測</text>
    <text x="20" y="200" class="s">逐位置獨立：雪花雜訊</text>
    <rect x="20" y="212" width="256" height="100" fill="url(#noise)"/>
    <path d="M36 212V312M52 212V312M68 212V312M84 212V312M100 212V312M116 212V312M132 212V312M148 212V312M164 212V312M180 212V312M196 212V312M212 212V312M228 212V312M244 212V312M260 212V312M20 217H276M20 222H276M20 227H276M20 232H276M20 237H276M20 242H276M20 247H276M20 252H276M20 257H276M20 262H276M20 267H276M20 272H276M20 277H276M20 282H276M20 287H276M20 292H276M20 297H276M20 302H276M20 307H276" class="cellgrid" fill="none"/>
    <text x="294" y="246" class="h" fill="#b77968">切換率</text><text x="307" y="272" class="h" fill="#9e6657">0.4979</text><text x="294" y="293" class="n">逐格、不可預測</text>
    <rect x="20" y="337" width="390" height="52" rx="8" fill="#f4f2eb" stroke="#d8d8cf"/><text x="36" y="359" class="s">每位置為 1 的比例</text><text x="36" y="381" class="h">上排 ≈ 0.5　＝　下排 ≈ 0.5</text>
  </g>
  <g transform="translate(490 68)">
    <rect class="panel" width="430" height="414" rx="12"/><text x="20" y="30" class="h">忽略相鄰結構要付多少 KL？</text>
    <line x1="58" y1="350" x2="402" y2="350" class="axis"/><line x1="58" y1="72" x2="58" y2="350" class="axis"/>
    <g class="grid"><line x1="58" y1="281" x2="402" y2="281"/><line x1="58" y1="212" x2="402" y2="212"/><line x1="58" y1="143" x2="402" y2="143"/></g>
    <text x="35" y="353" class="n">0</text><text x="35" y="284" class="n">2</text><text x="35" y="215" class="n">4</text><text x="35" y="146" class="n">6</text><text x="35" y="78" class="n">8</text>
    <path d="M70 94 C102 122 137 159 185 211 C236 265 287 315 402 350" class="curve"/>
    <g class="dot"><circle cx="92" cy="94" r="6"/><circle cx="126" cy="159" r="6"/><circle cx="264" cy="307" r="6"/><circle cx="402" cy="350" r="6"/></g>
    <text x="76" y="82" class="n">q=.05：7.419</text><text x="130" y="151" class="n">q=.10：5.521</text><text x="270" y="299" class="n">q=.30：1.234</text><text x="321" y="339" class="n">q=.50：0</text>
    <g class="n"><text x="55" y="370">0</text><text x="117" y="370">.1</text><text x="185" y="370">.2</text><text x="253" y="370">.3</text><text x="321" y="370">.4</text><text x="393" y="370">.5</text></g>
    <text x="141" y="397" class="s">q = 相鄰位置的切換機率</text>
    <text x="76" y="114" class="n" fill="#587e9b">結構強，忽略它很貴</text><text x="278" y="330" class="n" fill="#587e9b">獨立時免費</text>
  </g>
  <text x="40" y="518" class="s">邊際只告訴你每格有多少 0/1；自回歸因子分解保留的是「下一格和前一格有什麼關係」。</text>
</svg>

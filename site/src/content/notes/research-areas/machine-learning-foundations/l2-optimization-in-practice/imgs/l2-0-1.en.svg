<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
 <title id="title">Drift and minibatch fluctuations</title><desc id="desc">Batch sizes produce different stochastic optimization paths and noise floors in this toy problem.</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.cont{fill:none;stroke:#d7ddd8;stroke-width:1.5}.full{fill:none;stroke:#587e9b;stroke-width:3}.b16{fill:none;stroke:#6f9278;stroke-width:3}.b1{fill:none;stroke:#b77968;stroke-width:3}.axis{stroke:#aeb7b4}.ref{stroke:#c09551;stroke-width:2;stroke-dasharray:5 4}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"></rect><text x="40" y="42" class="t">At a distance, a common drift; up close, minibatch fluctuations</text>
 <g transform="translate(40 70)"><rect class="panel" width="420" height="400" rx="12"></rect><text x="18" y="29" class="h">One quadratic, three batch sizes</text>
  <g transform="rotate(-20 210 215)"><ellipse cx="210" cy="215" rx="165" ry="65" class="cont"></ellipse><ellipse cx="210" cy="215" rx="124" ry="48" class="cont"></ellipse><ellipse cx="210" cy="215" rx="82" ry="31" class="cont"></ellipse><ellipse cx="210" cy="215" rx="40" ry="15" class="cont"></ellipse></g>
  <circle cx="210" cy="215" r="5" fill="#29363b"></circle>
  <path d="M59 80 L124 272 L151 159 L182 241 L196 195 L210 215" class="full"></path>
  <path d="M59 80 L120 279 L150 149 L177 252 L195 181 L218 226 L203 211 L220 213 L210 215" class="b16"></path>
  <path d="M59 80 L114 291 L142 132 L190 281 L174 151 L240 252 L165 210 L250 188 L182 249 L226 165 L244 229 L176 227 L210 215" class="b1"></path>
  <circle cx="210" cy="215" r="24" fill="#6f9278" opacity=".12" stroke="#6f9278"></circle><circle cx="210" cy="215" r="63" fill="#b77968" opacity=".08" stroke="#b77968"></circle>
  <text x="245" y="205" class="s" style="font-size: 12.8px;">Illustrative radius ∝ √(η/B)</text><text x="36" y="330" class="s" fill="#587e9b">Full batch: smooth</text><text x="150" y="352" class="s" fill="#6f9278">B＝16</text><text x="273" y="330" class="s" fill="#b77968">B＝1</text>
 </g>
 <g transform="translate(485 70)"><rect class="panel" width="435" height="400" rx="12"></rect><text x="18" y="29" class="h" style="font-size: 15.31px;">Log training loss: differences emerge near the optimum</text>
  <line x1="55" y1="335" x2="405" y2="335" class="axis"></line><line x1="55" y1="60" x2="55" y2="335" class="axis"></line>
  <line x1="55" y1="303" x2="405" y2="303" class="ref"></line><text x="345" y="297" class="s">L★</text>
  <path d="M60 75 C120 151 203 258 397 303" class="full"></path><path d="M60 75 C125 153 202 245 272 276 L397 276" class="b16"></path><path d="M60 75 C126 152 190 218 252 235 L397 235" class="b1"></path>
  <line x1="368" y1="238" x2="368" y2="300" stroke="#b77968" stroke-width="2"></line><text x="283" y="222" class="s">Illustrative floor ∝ η/B</text>
  <text x="313" y="325" class="s" fill="#587e9b">Full batch</text><text x="315" y="271" class="s" fill="#6f9278">B＝16</text><text x="320" y="229" class="s" fill="#b77968">B＝1</text><text x="207" y="362" class="s">Steps</text>
 </g>
 <text x="40" y="510" class="s">With nonzero gradient-noise variance near the optimum, constant-step iterates fluctuate in a neighborhood.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">散布與尺度：兩張不同的圖</title><desc id="desc">左圖顯示不同 seed 的訓練誤差分布，右圖顯示初始化 gain 對訓練誤差的系統性影響。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#adb7b4}.bar{fill:#91a8b4}.tail{fill:#b77968}.med{stroke:#c09551;stroke-width:3}.curve{fill:none;stroke:#587e9b;stroke-width:3}.band{fill:#91a8b4;opacity:.22}.ref{stroke:#c09551;stroke-width:2;stroke-dasharray:5 4}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">Seed 造成散布；gain 改變整個訓練尺度</text>
 <g transform="translate(40 70)"><rect class="panel" width="420" height="400" rx="12"/><text x="18" y="29" class="h">散布：同架構，只換 200 個 seed</text>
  <rect x="45" y="56" width="330" height="24" rx="12" fill="#e6e3da"/><circle cx="76" cy="68" r="4" fill="#91a8b4"/><circle cx="119" cy="68" r="4" fill="#91a8b4"/><circle cx="183" cy="68" r="4" fill="#91a8b4"/><circle cx="258" cy="68" r="4" fill="#91a8b4"/><circle cx="341" cy="68" r="4" fill="#b77968"/>
  <line x1="48" y1="330" x2="384" y2="330" class="axis"/><line x1="48" y1="105" x2="48" y2="330" class="axis"/>
  <g><rect x="59" y="285" width="28" height="45" class="bar"/><rect x="89" y="242" width="28" height="88" class="bar"/><rect x="119" y="168" width="28" height="162" class="bar"/><rect x="149" y="128" width="28" height="202" class="bar"/><rect x="179" y="154" width="28" height="176" class="bar"/><rect x="209" y="215" width="28" height="115" class="bar"/><rect x="239" y="266" width="28" height="64" class="bar"/><rect x="269" y="294" width="28" height="36" class="tail"/><rect x="299" y="310" width="28" height="20" class="tail"/><rect x="329" y="320" width="28" height="10" class="tail"/></g>
  <line x1="174" y1="110" x2="174" y2="330" class="med"/><text x="125" y="100" class="s">中位數 .0034</text><text x="265" y="148" class="s" fill="#b77968">右尾 3%：比中位數差兩倍</text>
  <text x="50" y="356" class="s">min .0023</text><text x="318" y="356" class="s">max .0085</text><text x="243" y="377" class="s">p90 .0046</text>
 </g>
 <g transform="translate(485 70)"><rect class="panel" width="435" height="400" rx="12"/><text x="18" y="29" class="h">尺度：gain 需要調整</text>
  <line x1="55" y1="330" x2="405" y2="330" class="axis"/><line x1="55" y1="65" x2="55" y2="330" class="axis"/>
  <path d="M65 163 C115 187 154 244 208 286 C254 276 299 224 348 154 C371 117 388 90 400 76 L400 132 C376 150 351 183 330 210 C285 271 246 312 203 316 C156 289 111 226 65 206Z" class="band"/>
  <path d="M65 184 C118 210 161 276 208 300 C250 292 291 252 335 193 C365 152 386 109 400 91" class="curve"/>
  <line x1="208" y1="72" x2="208" y2="330" class="ref"/><circle cx="208" cy="300" r="6" fill="#587e9b"/><text x="171" y="64" class="s">gain＝1</text><text x="220" y="296" class="s">.0031</text>
  <text x="60" y="145" class="s">.01：訊號／梯度太小</text><text x="265" y="96" class="s">30：tanh 飽和</text><text x="59" y="355" class="s">0.01</text><text x="201" y="355" class="s">1</text><text x="382" y="355" class="s">30</text><text x="183" y="378" class="s">gain（log）</text>
 </g>
 <text x="40" y="510" class="s">左圖決定該報中位數與分位數；右圖決定這個初始化尺度能不能讓訓練開始。</text>
</svg>

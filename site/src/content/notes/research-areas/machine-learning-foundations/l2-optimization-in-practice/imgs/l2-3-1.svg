<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">限制容量與限制時間，走的是同一條路</title><desc id="desc">二維參數空間中的 ridge 路徑與梯度下降路徑，以及對齊的風險 U 形。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.cont{fill:none;stroke:#d7ddd8;stroke-width:1.5}.ridge{fill:none;stroke:#587e9b;stroke-width:4}.gd{fill:none;stroke:#6f9278;stroke-width:3;stroke-dasharray:7 5}.link{stroke:#c09551;stroke-width:1.5;stroke-dasharray:4 4}.axis{stroke:#adb7b4}.risk1{fill:none;stroke:#587e9b;stroke-width:3}.risk2{fill:none;stroke:#6f9278;stroke-width:3;stroke-dasharray:7 5}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">Ridge 的 λ 與 early stopping 的 t，是同一路徑的兩種刻度</text>
 <g transform="translate(40 70)"><rect class="panel" width="420" height="400" rx="12"/><text x="18" y="29" class="h">參數空間</text>
  <g transform="rotate(-23 220 220)"><ellipse cx="220" cy="220" rx="168" ry="63" class="cont"/><ellipse cx="220" cy="220" rx="127" ry="47" class="cont"/><ellipse cx="220" cy="220" rx="86" ry="31" class="cont"/><ellipse cx="220" cy="220" rx="43" ry="16" class="cont"/></g>
  <circle cx="75" cy="320" r="6" fill="#29363b"/><text x="48" y="345" class="s">原點</text><circle cx="308" cy="145" r="6" fill="#b77968"/><text x="317" y="143" class="s">w₀ 無正則解</text>
  <path d="M75 320 C121 255 174 205 228 177 S279 151 308 145" class="ridge"/><path d="M75 320 C107 267 168 214 224 181 S282 149 308 145" class="gd"/>
  <g class="link"><line x1="131" y1="245" x2="138" y2="251"/><line x1="193" y1="195" x2="201" y2="201"/><line x1="258" y1="160" x2="264" y2="165"/></g>
  <text x="48" y="88" class="s">曲率大的方向先到</text><text x="246" y="323" class="s">曲率小的方向慢</text><text x="57" y="373" class="s">λ ↓ / t ↑</text><text x="154" y="115" class="s">λ ≈ 1/(2ηt)</text>
 </g>
 <g transform="translate(485 70)"><rect class="panel" width="435" height="400" rx="12"/><text x="18" y="29" class="h">真實風險：兩條 U 幾乎重合</text>
  <line x1="55" y1="326" x2="405" y2="326" class="axis"/><line x1="55" y1="63" x2="55" y2="326" class="axis"/>
  <path d="M65 100 Q214 379 397 102" class="risk1"/><path d="M65 108 Q217 377 397 110" class="risk2"/>
  <circle cx="218" cy="245" r="6" fill="#587e9b"/><circle cx="223" cy="246" r="5" fill="#6f9278"/><text x="236" y="242" class="s">.0288 / .0289</text>
  <text x="72" y="54" class="s">λ：大 ─────────────→ 小</text><text x="76" y="355" class="s">t：小 ─────────────→ 大</text><text x="12" y="212" class="s" transform="rotate(-90 12 212)">真實風險</text>
  <g transform="translate(115 382)"><line x2="28" class="ridge"/><text x="36" y="5" class="s">ridge</text><line x1="115" x2="143" class="gd"/><text x="151" y="5" class="s">early stopping</text></g>
 </g>
 <text x="40" y="510" class="s">兩種方法都從原點往無正則解走；一個限制容量，一個限制走路的時間。</text>
</svg>

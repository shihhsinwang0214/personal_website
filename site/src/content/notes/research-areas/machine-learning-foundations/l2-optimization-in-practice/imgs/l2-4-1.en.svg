<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
 <title id="title">Variability and initialization scale are different</title><desc id="desc">Seed-to-seed training errors and the systematic effect of initialization gain require separate measurements.</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#adb7b4}.bar{fill:#91a8b4}.tail{fill:#b77968}.med{stroke:#c09551;stroke-width:3}.curve{fill:none;stroke:#587e9b;stroke-width:3}.band{fill:#91a8b4;opacity:.22}.ref{stroke:#c09551;stroke-width:2;stroke-dasharray:5 4}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"></rect><text x="40" y="42" class="t">Seeds vary runs; gain changes the training setup</text>
 <g transform="translate(40 70)"><rect class="panel" width="420" height="400" rx="12"></rect><text x="18" y="29" class="h">Variability: 200 seeds, same architecture</text>
  <rect x="45" y="56" width="330" height="24" rx="12" fill="#e6e3da"></rect><circle cx="76" cy="68" r="4" fill="#91a8b4"></circle><circle cx="119" cy="68" r="4" fill="#91a8b4"></circle><circle cx="183" cy="68" r="4" fill="#91a8b4"></circle><circle cx="258" cy="68" r="4" fill="#91a8b4"></circle><circle cx="341" cy="68" r="4" fill="#b77968"></circle>
  <line x1="48" y1="330" x2="384" y2="330" class="axis"></line><line x1="48" y1="105" x2="48" y2="330" class="axis"></line>
  <g><rect x="59" y="285" width="28" height="45" class="bar"></rect><rect x="89" y="242" width="28" height="88" class="bar"></rect><rect x="119" y="168" width="28" height="162" class="bar"></rect><rect x="149" y="128" width="28" height="202" class="bar"></rect><rect x="179" y="154" width="28" height="176" class="bar"></rect><rect x="209" y="215" width="28" height="115" class="bar"></rect><rect x="239" y="266" width="28" height="64" class="bar"></rect><rect x="269" y="294" width="28" height="36" class="tail"></rect><rect x="299" y="310" width="28" height="20" class="tail"></rect><rect x="329" y="320" width="28" height="10" class="tail"></rect></g>
  <line x1="174" y1="110" x2="174" y2="330" class="med"></line><text x="125" y="100" class="s">Median: .0034</text><text x="265" y="148" class="s" fill="#b77968" textLength="145.0" lengthAdjust="spacingAndGlyphs" style="font-size: 8px;">Right tail: 3% exceed twice the median</text>
  <text x="50" y="356" class="s">min .0023</text><text x="318" y="356" class="s">max .0085</text><text x="243" y="377" class="s">p90 .0046</text>
 </g>
 <g transform="translate(485 70)"><rect class="panel" width="435" height="400" rx="12"></rect><text x="18" y="29" class="h">Scale: tune initialization gain</text>
  <line x1="55" y1="330" x2="405" y2="330" class="axis"></line><line x1="55" y1="65" x2="55" y2="330" class="axis"></line>
  <path d="M65 163 C115 187 154 244 208 286 C254 276 299 224 348 154 C371 117 388 90 400 76 L400 132 C376 150 351 183 330 210 C285 271 246 312 203 316 C156 289 111 226 65 206Z" class="band"></path>
  <path d="M65 184 C118 210 161 276 208 300 C250 292 291 252 335 193 C365 152 386 109 400 91" class="curve"></path>
  <line x1="208" y1="72" x2="208" y2="330" class="ref"></line><circle cx="208" cy="300" r="6" fill="#587e9b"></circle><text x="171" y="64" class="s">gain＝1</text><text x="220" y="296" class="s">.0031</text>
  <text x="60" y="145" class="s">.01: small signals / gradients</text><text x="265" y="96" class="s">30: tanh saturation</text><text x="59" y="355" class="s">0.01</text><text x="201" y="355" class="s">1</text><text x="382" y="355" class="s">30</text><text x="183" y="378" class="s">gain (log) </text>
 </g>
 <text x="40" y="510" class="s">The left plot describes run variability; the right checks whether initialization permits effective learning.</text>
</svg>

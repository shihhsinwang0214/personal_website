<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">同一個細長碗，三種軌跡</title><desc id="desc">梯度下降、動量與 Adam 在條件數約五十的損失曲面上的路徑和收斂曲線。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.cont{fill:none;stroke:#d7ddd8;stroke-width:1.5}.gd{fill:none;stroke:#b77968;stroke-width:3}.mom{fill:none;stroke:#6f9278;stroke-width:3}.adam{fill:none;stroke:#587e9b;stroke-width:3}.axis{stroke:#adb7b4}.ref{stroke:#c09551;stroke-width:2;stroke-dasharray:5 4}.ghost{fill:none;stroke:#adb6b2;stroke-width:2}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">動量記方向；Adam 記每個座標的尺度</text>
 <g transform="translate(40 70)"><rect class="panel" width="420" height="400" rx="12"/><text x="18" y="29" class="h">κ ≈ 50：同一起點、不同記憶</text>
  <g transform="rotate(-25 215 220)"><ellipse cx="215" cy="220" rx="170" ry="45" class="cont"/><ellipse cx="215" cy="220" rx="130" ry="34" class="cont"/><ellipse cx="215" cy="220" rx="88" ry="23" class="cont"/><ellipse cx="215" cy="220" rx="45" ry="12" class="cont"/></g><circle cx="215" cy="220" r="5" fill="#29363b"/>
  <path d="M59 76 L132 294 L143 129 L181 273 L183 173 L208 247 L201 201 L215 220" class="gd"/>
  <path d="M59 76 L122 278 L159 149 L184 244 L202 192 L223 229 L207 218 L219 218 L215 220" class="mom"/>
  <path d="M59 76 L84 98 L108 119 L132 141 L155 162 L177 181 L198 202 L215 220 L225 230 L215 220" class="adam"/>
  <text x="31" y="325" class="s" fill="#b77968">GD：之字大</text><text x="151" y="349" class="s" fill="#6f9278">momentum β=.9</text><text x="283" y="314" class="s" fill="#587e9b">Adam：近直線</text>
 </g>
 <g transform="translate(485 70)"><rect class="panel" width="435" height="400" rx="12"/><text x="18" y="29" class="h">log 損失 vs. 步數</text>
  <line x1="55" y1="335" x2="405" y2="335" class="axis"/><line x1="55" y1="60" x2="55" y2="335" class="axis"/><line x1="55" y1="309" x2="405" y2="309" class="ref"/><text x="300" y="303" class="s">直接解 0.0147</text>
  <path d="M60 80 C141 145 230 225 397 253" class="gd"/><path d="M60 80 C118 158 186 235 397 257" class="mom"/><path d="M60 80 C104 185 159 283 397 290" class="adam"/><path d="M60 80 C93 131 143 226 397 270" class="ghost"/>
  <text x="314" y="247" class="s" fill="#b77968">GD .0267</text><text x="314" y="270" class="s" fill="#6f9278">動量 .0264</text><text x="314" y="289" class="s" fill="#587e9b">Adam .0164</text><text x="86" y="126" class="s">β=.999 的淡線：β 才是動量的關鍵參數</text><text x="205" y="363" class="s">步數</text>
 </g>
 <text x="40" y="510" class="s">兩者處理不同的病：momentum 改有效條件數；Adam 抵消逐座標尺度。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">漂移與推擠：同一條路，兩種力</title><desc id="desc">不同 batch size 的隨機梯度軌跡與其損失噪聲地板。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.cont{fill:none;stroke:#d7ddd8;stroke-width:1.5}.full{fill:none;stroke:#587e9b;stroke-width:3}.b16{fill:none;stroke:#6f9278;stroke-width:3}.b1{fill:none;stroke:#b77968;stroke-width:3}.axis{stroke:#aeb7b4}.ref{stroke:#c09551;stroke-width:2;stroke-dasharray:5 4}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">遠處看漂移，近處才看見 minibatch 的推擠</text>
 <g transform="translate(40 70)"><rect class="panel" width="420" height="400" rx="12"/><text x="18" y="29" class="h">同一個二次碗，三種 batch</text>
  <g transform="rotate(-20 210 215)"><ellipse cx="210" cy="215" rx="165" ry="65" class="cont"/><ellipse cx="210" cy="215" rx="124" ry="48" class="cont"/><ellipse cx="210" cy="215" rx="82" ry="31" class="cont"/><ellipse cx="210" cy="215" rx="40" ry="15" class="cont"/></g>
  <circle cx="210" cy="215" r="5" fill="#29363b"/>
  <path d="M59 80 L124 272 L151 159 L182 241 L196 195 L210 215" class="full"/>
  <path d="M59 80 L120 279 L150 149 L177 252 L195 181 L218 226 L203 211 L220 213 L210 215" class="b16"/>
  <path d="M59 80 L114 291 L142 132 L190 281 L174 151 L240 252 L165 210 L250 188 L182 249 L226 165 L244 229 L176 227 L210 215" class="b1"/>
  <circle cx="210" cy="215" r="24" fill="#6f9278" opacity=".12" stroke="#6f9278"/><circle cx="210" cy="215" r="63" fill="#b77968" opacity=".08" stroke="#b77968"/>
  <text x="245" y="205" class="s">半徑 ∝ √(η/B)</text><text x="36" y="330" class="s" fill="#587e9b">全批次：平滑</text><text x="150" y="352" class="s" fill="#6f9278">B＝16</text><text x="273" y="330" class="s" fill="#b77968">B＝1</text>
 </g>
 <g transform="translate(485 70)"><rect class="panel" width="435" height="400" rx="12"/><text x="18" y="29" class="h">log 訓練損失：靠近最小點才分家</text>
  <line x1="55" y1="335" x2="405" y2="335" class="axis"/><line x1="55" y1="60" x2="55" y2="335" class="axis"/>
  <line x1="55" y1="303" x2="405" y2="303" class="ref"/><text x="345" y="297" class="s">L★</text>
  <path d="M60 75 C120 151 203 258 397 303" class="full"/><path d="M60 75 C125 153 202 245 272 276 L397 276" class="b16"/><path d="M60 75 C126 152 190 218 252 235 L397 235" class="b1"/>
  <line x1="368" y1="238" x2="368" y2="300" stroke="#b77968" stroke-width="2"/><text x="283" y="222" class="s">地板高度 ∝ η/B</text>
  <text x="313" y="325" class="s" fill="#587e9b">全批次</text><text x="315" y="271" class="s" fill="#6f9278">B＝16</text><text x="320" y="229" class="s" fill="#b77968">B＝1</text><text x="207" y="362" class="s">步數</text>
 </g>
 <text x="40" y="510" class="s">梯度接近零時，minibatch 噪聲沒有一起消失；因此最小點變成一個有寬度的鄰域。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">狗、繩子、與一根釘在地上的樁</title><desc id="desc">以追逐與錨點比喻 moving target、stop-gradient 和 EMA，再比較四種訓練結果。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:15px;font-weight:700}.s{font-size:12px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.sub{fill:#f7f5ef;stroke:#e0ded7}.rope{fill:none;stroke:#c09551;stroke-width:3}.arr{fill:none;stroke:#587e9b;stroke-width:2;marker-end:url(#a)}.truth{fill:none;stroke:#a5abad;stroke-width:2;stroke-dasharray:5 4}.collapse{fill:none;stroke:#657176;stroke-width:3}.div{fill:none;stroke:#b77968;stroke-width:3}.ema{fill:none;stroke:#c09551;stroke-width:3}.anchor{fill:none;stroke:#6f9278;stroke-width:3}</style>
 <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#587e9b"/></marker></defs>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">錨、EMA、stop-gradient 做的是三件不同的事</text>
 <g transform="translate(40 66)"><rect class="panel" width="880" height="220" rx="12"/>
  <g transform="translate(20 42)"><rect class="sub" width="265" height="150" rx="9"/><circle cx="78" cy="73" r="18" fill="#7f9bab"/><circle cx="194" cy="73" r="15" fill="#b98270"/><path d="M96 73H176" class="rope"/><path d="M60 107H202" class="arr"/><text x="92" y="25" class="h">沒有錨</text><text x="70" y="136" class="s">兩邊都跑 → 平凡解</text></g>
  <g transform="translate(307 42)"><rect class="sub" width="265" height="150" rx="9"/><circle cx="73" cy="73" r="18" fill="#7f9bab"/><circle cx="194" cy="73" r="15" fill="#b98270"/><path d="M91 73H176" class="rope"/><path d="M100 49H174" class="arr"/><line x1="101" y1="35" x2="101" y2="109" stroke="#29363b" stroke-width="3"/><text x="64" y="25" class="h">stop-gradient</text><text x="65" y="136" class="s">只有一側追，方向變了</text></g>
  <g transform="translate(594 42)"><rect class="sub" width="265" height="150" rx="9"/><circle cx="74" cy="73" r="18" fill="#7f9bab"/><circle cx="190" cy="73" r="15" fill="#b98270"/><path d="M92 73H173" class="rope"/><line x1="74" y1="73" x2="74" y2="119" class="rope"/><path d="M62 119H86L74 97Z" fill="#6f9278"/><text x="84" y="25" class="h">外部錨點</text><text x="55" y="136" class="s">非平凡答案被釘住</text></g>
 </g>
 <g transform="translate(40 307)"><rect class="panel" width="880" height="185" rx="12"/><text x="18" y="25" class="h">同一個 toy：loss 都能降，表示卻可能塌掉</text>
  <line x1="45" y1="150" x2="835" y2="150" stroke="#afb8b5"/><path d="M45 91 C125 28 206 29 283 91 S438 153 520 91 S679 27 835 91" class="truth"/>
  <path d="M45 99 L835 99" class="collapse"/><path d="M45 104 C91 15 136 181 181 33 S272 188 317 10 L345 -40" class="div"/><path d="M45 111 C102 45 155 145 210 56 S322 151 376 47 S479 146 534 60" class="ema"/><path d="M45 101 C126 48 205 50 283 96 S439 139 520 95 S679 48 835 99" class="anchor"/>
  <text x="55" y="169" class="s">塌成常數 · amp .077</text><text x="245" y="169" class="s" fill="#b77968">發散 · 1.3×10⁷</text><text x="415" y="169" class="s" fill="#c09551">EMA · 34.2</text><text x="625" y="169" class="s" fill="#6f9278">有錨 · .672</text>
 </g>
 <text x="40" y="520" class="s">錨決定答案是否存在；EMA 改穩定性；stop-gradient 改的是向量場與資訊方向。</text>
</svg>

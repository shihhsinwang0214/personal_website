<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
 <title id="title">Three dataset roles and leakage paths</title><desc id="desc">Training, validation, and test responsibilities, including leakage from fitting preprocessing before splitting.</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:15px;font-weight:700}.s{font-size:12px;fill:#647075}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.box{stroke:#cbd2ce;stroke-width:1.5}.arr{fill:none;stroke:#718b9e;stroke-width:2;marker-end:url(#a)}.bad{fill:none;stroke:#b77968;stroke-width:3;marker-end:url(#r)}.ok{fill:none;stroke:#6f9278;stroke-width:3;marker-end:url(#g)}</style>
 <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718b9e"></path></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b77968"></path></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6f9278"></path></marker></defs>
 <rect width="960" height="540" rx="18" fill="#f2efe7"></rect><text x="40" y="42" class="t">Using a score for selection changes how it should be interpreted</text>
 <g transform="translate(40 65)"><rect class="panel" width="880" height="215" rx="12"></rect><text x="18" y="28" class="h">Separate fitting, selection, and final evaluation</text>
  <rect x="35" y="72" width="115" height="58" rx="8" fill="#e5e3dc" class="box"></rect><text x="58" y="106" class="h">Raw data</text><path d="M150 101H195" class="arr"></path><text x="160" y="88" class="s">Split</text>
  <rect x="200" y="62" width="165" height="78" rx="8" fill="#dce7ec" class="box"></rect><text x="248" y="91" class="h">Training set</text><text x="225" y="118" class="s">Optimizer fits weights</text>
  <rect x="390" y="62" width="165" height="78" rx="8" fill="#e5eadb" class="box"></rect><text x="438" y="91" class="h">Validation set</text><text x="411" y="118" class="s">Select among m candidates</text>
  <rect x="580" y="62" width="165" height="78" rx="8" fill="#eee3d4" class="box"></rect><text x="628" y="91" class="h">Test set</text><text x="606" y="118" class="s">Evaluate after choices are fixed</text>
  <path d="M282 168V143" class="arr"></path><text x="227" y="190" class="s">Repeated optimizer access</text><path d="M472 187V143" class="arr"></path><text x="420" y="207" class="s">Repeated selection access</text>
  <path d="M662 187V143" class="bad"></path><line x1="633" y1="159" x2="691" y2="205" stroke="#b77968" stroke-width="4"></line><line x1="691" y1="159" x2="633" y2="205" stroke="#b77968" stroke-width="4"></line><text x="758" y="93" class="s" style="font-size: 9.82px;">If used to make choices,</text><text x="758" y="112" class="s">Test → validation</text>
 </g>
 <g transform="translate(40 302)"><rect class="panel" width="880" height="188" rx="12"></rect><text x="18" y="27" class="h">Preprocessing order: leakage versus proper fitting</text>
  <g transform="translate(25 46)"><rect width="155" height="55" rx="8" fill="#f0dcd7" class="box"></rect><text x="27" y="24" class="h" style="font-size: 12.39px;">Inspect all data first</text><text x="16" y="44" class="s" style="font-size: 8px;">Fit scaling / selection / imputation</text><path d="M155 28H220" class="bad"></path><rect x="225" width="145" height="55" rx="8" fill="#e5e3dc" class="box"></rect><text x="270" y="33" class="h">Then split</text><path d="M338 75 C255 128 89 126 44 63" class="bad"></path><text x="100" y="116" class="s" fill="#b77968">Test information has leaked</text></g>
  <line x1="443" y1="43" x2="443" y2="164" stroke="#d8d8cf"></line>
  <g transform="translate(470 46)"><rect width="120" height="55" rx="8" fill="#e5e3dc" class="box"></rect><text x="507" y="80" class="h" style="font-size: 8.03px;">Split first</text><path d="M120 28H170" class="ok"></path><rect x="175" width="190" height="55" rx="8" fill="#dce8df" class="box"></rect><text x="205" y="24" class="h" style="font-size: 12.02px;">Fit preprocessing on training data</text><text x="220" y="44" class="s">Apply to validation / test</text><text x="225" y="113" class="s" fill="#6f9278" style="font-size: 9.45px;">Information flows from training outward</text></g>
 </g>
 <text x="40" y="520" class="s">Repeated selection creates selection bias; fitting on held-out information creates leakage. They are distinct problems.</text>
</svg>

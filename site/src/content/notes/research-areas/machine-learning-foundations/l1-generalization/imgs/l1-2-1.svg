<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">三個集合的角色，與洩漏發生的位置</title><desc id="desc">訓練、驗證與測試集的責任分工，以及前處理在切分前造成資訊洩漏的路徑。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:15px;font-weight:700}.s{font-size:12px;fill:#647075}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.box{stroke:#cbd2ce;stroke-width:1.5}.arr{fill:none;stroke:#718b9e;stroke-width:2;marker-end:url(#a)}.bad{fill:none;stroke:#b77968;stroke-width:3;marker-end:url(#r)}.ok{fill:none;stroke:#6f9278;stroke-width:3;marker-end:url(#g)}</style>
 <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718b9e"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b77968"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6f9278"/></marker></defs>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">每一次用分數做決定，都會花掉一點誠實度</text>
 <g transform="translate(40 65)"><rect class="panel" width="880" height="215" rx="12"/><text x="18" y="28" class="h">正確角色：權重、選擇、最後一次讀值</text>
  <rect x="35" y="72" width="115" height="58" rx="8" fill="#e5e3dc" class="box"/><text x="58" y="106" class="h">原始資料</text><path d="M150 101H195" class="arr"/><text x="160" y="88" class="s">切分</text>
  <rect x="200" y="62" width="165" height="78" rx="8" fill="#dce7ec" class="box"/><text x="248" y="91" class="h">訓練集</text><text x="225" y="118" class="s">最佳化器調權重</text>
  <rect x="390" y="62" width="165" height="78" rx="8" fill="#e5eadb" class="box"/><text x="438" y="91" class="h">驗證集</text><text x="411" y="118" class="s">你選 m 個候選</text>
  <rect x="580" y="62" width="165" height="78" rx="8" fill="#eee3d4" class="box"/><text x="628" y="91" class="h">測試集</text><text x="606" y="118" class="s">鎖定後只讀一次</text>
  <path d="M282 168V143" class="arr"/><text x="227" y="190" class="s">optimizer 反覆看</text><path d="M472 187V143" class="arr"/><text x="420" y="207" class="s">你反覆看</text>
  <path d="M662 187V143" class="bad"/><line x1="633" y1="159" x2="691" y2="205" stroke="#b77968" stroke-width="4"/><line x1="691" y1="159" x2="633" y2="205" stroke="#b77968" stroke-width="4"/><text x="758" y="93" class="s">一旦拿來做決定</text><text x="758" y="112" class="s">測試就退化成驗證</text>
 </g>
 <g transform="translate(40 302)"><rect class="panel" width="880" height="188" rx="12"/><text x="18" y="27" class="h">前處理的順序：左邊洩漏，右邊正確</text>
  <g transform="translate(25 46)"><rect width="155" height="55" rx="8" fill="#f0dcd7" class="box"/><text x="27" y="24" class="h">先看全部資料</text><text x="16" y="44" class="s">標準化／選特徵／填缺失</text><path d="M155 28H220" class="bad"/><rect x="225" width="145" height="55" rx="8" fill="#e5e3dc" class="box"/><text x="270" y="33" class="h">再切分</text><path d="M338 75 C255 128 89 126 44 63" class="bad"/><text x="100" y="116" class="s" fill="#b77968">測試資訊已回流</text></g>
  <line x1="443" y1="43" x2="443" y2="164" stroke="#d8d8cf"/>
  <g transform="translate(470 46)"><rect width="120" height="55" rx="8" fill="#e5e3dc" class="box"/><text x="507" y="80" class="h">先切分</text><path d="M120 28H170" class="ok"/><rect x="175" width="190" height="55" rx="8" fill="#dce8df" class="box"/><text x="205" y="24" class="h">只用訓練集擬合前處理</text><text x="220" y="44" class="s">再套用到 val / test</text><text x="225" y="113" class="s" fill="#6f9278">資訊流只有一個方向</text></g>
 </g>
 <text x="40" y="520" class="s">「看幾次」造成選擇偏差；「先看了再切」造成資料洩漏。兩種錯誤不能混為一談。</text>
</svg>

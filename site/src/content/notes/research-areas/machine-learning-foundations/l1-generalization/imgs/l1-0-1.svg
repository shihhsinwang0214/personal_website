<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">四格診斷，與同一項複雜度設定的兩端</title><desc id="desc">以訓練與泛化誤差診斷欠擬合與過擬合，並比較三種多項式複雜度。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:12px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.axis{stroke:#abb5b2}.grid{stroke:#d9ddd8}.truth{fill:none;stroke:#a7adae;stroke-width:2;stroke-dasharray:5 4}.fit{fill:none;stroke:#587e9b;stroke-width:3}.bad{fill:none;stroke:#b77968;stroke-width:2.5}.pt{fill:#c09551}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="43" class="t">同一項複雜度設定，兩端是相反的病</text>
 <g transform="translate(40 72)"><rect class="panel" width="390" height="390" rx="12"/><text x="18" y="29" class="h">先看兩個數字，不要先猜病名</text>
  <rect x="66" y="67" width="135" height="122" fill="#dfeadf"/><rect x="201" y="67" width="135" height="122" fill="#f0dfd8"/><rect x="66" y="189" width="135" height="122" fill="#e8e3d3"/><rect x="201" y="189" width="135" height="122" fill="#eadbd7"/>
  <line x1="66" y1="311" x2="348" y2="311" class="axis"/><line x1="66" y1="55" x2="66" y2="311" class="axis"/>
  <text x="104" y="96" class="h">成功</text><text x="91" y="118" class="s">保持設定</text><text x="236" y="96" class="h">過擬合</text><text x="221" y="118" class="s">加資料／減容量</text>
  <text x="101" y="220" class="h">欠擬合</text><text x="89" y="242" class="s">加容量／訓久</text><text x="222" y="220" class="h">先查 bug</text><text x="217" y="242" class="s">兩邊都高且反常</text>
  <circle cx="261" cy="127" r="9" fill="#587e9b"/><text x="273" y="132" class="s">甲</text><circle cx="128" cy="250" r="9" fill="#b77968"/><text x="140" y="255" class="s">乙</text>
  <text x="162" y="342" class="s">泛化誤差 →</text><text x="24" y="235" class="s" transform="rotate(-90 24 235)">訓練誤差 →</text>
 </g>
 <g transform="translate(455 72)"><rect class="panel" width="465" height="390" rx="12"/><text x="18" y="29" class="h">同一批 30 點：degree 1 → 5 → 25</text>
  <g transform="translate(18 62)"><rect width="132" height="210" rx="8" fill="#f7f5ef"/><path d="M10 107 C34 41 56 41 76 105 S110 171 123 104" class="truth"/><path d="M12 124 L122 88" class="fit"/><g class="pt"><circle cx="20" cy="103" r="3"/><circle cx="37" cy="61" r="3"/><circle cx="57" cy="68" r="3"/><circle cx="78" cy="118" r="3"/><circle cx="100" cy="151" r="3"/><circle cx="120" cy="111" r="3"/></g><text x="38" y="190" class="h">degree 1</text><text x="12" y="205" class="s">train .2118 · risk .2679</text></g>
  <g transform="translate(163 62)"><rect width="132" height="210" rx="8" fill="#f7f5ef"/><path d="M10 107 C34 41 56 41 76 105 S110 171 123 104" class="truth"/><path d="M10 112 C35 49 56 48 76 103 S108 163 123 103" class="fit"/><g class="pt"><circle cx="20" cy="103" r="3"/><circle cx="37" cy="61" r="3"/><circle cx="57" cy="68" r="3"/><circle cx="78" cy="118" r="3"/><circle cx="100" cy="151" r="3"/><circle cx="120" cy="111" r="3"/></g><text x="38" y="190" class="h">degree 5</text><text x="12" y="205" class="s">train .0147 · risk .0280</text></g>
  <g transform="translate(308 62)"><rect width="132" height="210" rx="8" fill="#f7f5ef"/><path d="M10 107 C34 41 56 41 76 105 S110 171 123 104" class="truth"/><path d="M10 102 C17 35 27 169 38 60 S54 47 61 120 S73 178 81 108 S95 31 103 151 S116 181 123 105" class="bad"/><g class="pt"><circle cx="20" cy="103" r="3"/><circle cx="37" cy="61" r="3"/><circle cx="57" cy="68" r="3"/><circle cx="78" cy="118" r="3"/><circle cx="100" cy="151" r="3"/><circle cx="120" cy="111" r="3"/></g><text x="32" y="190" class="h">degree 25</text><text x="9" y="205" class="s">train .0016 · risk 8032</text></g>
  <path d="M55 320 Q232 278 409 320" fill="none" stroke="#c09551" stroke-width="3"/><text x="171" y="353" class="s">母體風險呈 U 形；資料變多，谷底向右移</text>
 </g>
 <text x="40" y="505" class="s">「最佳複雜度」不是模型自己的屬性，而是模型與資料量共同決定的位置。</text>
</svg>

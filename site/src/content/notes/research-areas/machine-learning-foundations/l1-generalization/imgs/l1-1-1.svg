<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">靶心圖與十條擬合曲線</title><desc id="desc">上排以估價點雲展示 bias 與 variance，下排以重抽資料後的函數曲線呈現同一概念。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:14px;font-weight:700}.s{font-size:12px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.ring{fill:none;stroke:#d4d8d4}.truth{fill:none;stroke:#989fa1;stroke-width:2;stroke-dasharray:5 4}.mean{fill:none;stroke:#29363b;stroke-width:3}.sample{fill:none;stroke:#6f91ad;stroke-width:1.4;opacity:.45}.dot{fill:#b77968}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">Bias 是中心偏了；variance 是每次答案散多開</text>
 <g transform="translate(40 63)"><rect class="panel" width="880" height="205" rx="12"/>
  <g transform="translate(105 107)"><circle r="58" class="ring"/><circle r="37" class="ring"/><circle r="17" class="ring"/><circle r="4" fill="#29363b"/><g class="dot"><circle cx="-8" cy="4" r="4"/><circle cx="11" cy="-6" r="4"/><circle cx="-4" cy="-12" r="4"/><circle cx="7" cy="9" r="4"/><circle cx="-13" cy="-3" r="4"/></g><text x="-53" y="83" class="h">低 bias · 低 variance</text><text x="-28" y="100" class="s">已經很好</text></g>
  <g transform="translate(320 107)"><circle r="58" class="ring"/><circle r="37" class="ring"/><circle r="17" class="ring"/><circle r="4" fill="#29363b"/><g class="dot"><circle cx="28" cy="-36" r="4"/><circle cx="-33" cy="25" r="4"/><circle cx="41" cy="19" r="4"/><circle cx="-22" cy="-43" r="4"/><circle cx="13" cy="46" r="4"/></g><text x="-53" y="83" class="h">低 bias · 高 variance</text><text x="-49" y="100" class="s">加資料／減容量</text></g>
  <g transform="translate(540 107)"><circle r="58" class="ring"/><circle r="37" class="ring"/><circle r="17" class="ring"/><circle r="4" fill="#29363b"/><g class="dot"><circle cx="35" cy="-24" r="4"/><circle cx="42" cy="-30" r="4"/><circle cx="29" cy="-20" r="4"/><circle cx="37" cy="-36" r="4"/><circle cx="45" cy="-18" r="4"/></g><text x="-53" y="83" class="h">高 bias · 低 variance</text><text x="-30" y="100" class="s">加容量</text></g>
  <g transform="translate(755 107)"><circle r="58" class="ring"/><circle r="37" class="ring"/><circle r="17" class="ring"/><circle r="4" fill="#29363b"/><g class="dot"><circle cx="48" cy="-42" r="4"/><circle cx="17" cy="-12" r="4"/><circle cx="60" cy="7" r="4"/><circle cx="31" cy="-53" r="4"/><circle cx="69" cy="-25" r="4"/></g><text x="-53" y="83" class="h">高 bias · 高 variance</text><text x="-46" y="100" class="s">兩種病都處理</text></g>
 </g>
 <g transform="translate(40 288)"><rect class="panel" width="880" height="208" rx="12"/><text x="18" y="25" class="h">同一件事發生在函數空間</text>
  <g transform="translate(20 35)"><rect width="265" height="145" rx="8" fill="#f7f5ef"/><path d="M10 78 C55 18 92 22 132 77 S216 136 255 76" class="truth"/><path d="M10 103 L255 64" class="mean"/><path d="M10 100L255 60M10 106L255 68M10 97L255 62" class="sample"/><text x="67" y="137" class="h">degree 1：高 bias</text></g>
  <g transform="translate(307 35)"><rect width="265" height="145" rx="8" fill="#f7f5ef"/><path d="M10 78 C55 18 92 22 132 77 S216 136 255 76" class="truth"/><path d="M10 80 C55 23 92 25 132 76 S216 130 255 77" class="mean"/><path d="M10 83C55 18 92 30 132 79S216 126 255 75M10 75C55 27 92 20 132 74S216 135 255 80M10 85C55 25 92 27 132 72S216 128 255 73" class="sample"/><text x="65" y="137" class="h">degree 5：兩者都低</text></g>
  <g transform="translate(594 35)"><rect width="265" height="145" rx="8" fill="#f7f5ef"/><path d="M10 78 C55 18 92 22 132 77 S216 136 255 76" class="truth"/><path d="M10 79 C55 24 92 23 132 76 S216 131 255 77" class="mean"/><path d="M10 101C42 10 83 53 112 45S165 128 196 105S231 32 255 69M10 65C43 41 66 3 107 81S172 145 203 79S237 54 255 91M10 91C40 17 84 31 119 98S167 122 198 58S229 17 255 83" class="sample"/><text x="61" y="137" class="h">degree 12：高 variance</text></g>
 </g>
 <text x="40" y="520" class="s">粗線離灰線的距離是 bias；細線離粗線的散布是 variance。</text>
</svg>

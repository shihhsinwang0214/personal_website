<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
 <title id="title">Three ways to allocate evaluation data</title><desc id="desc">Holdout, five-fold cross-validation, and leave-one-out use different training sizes and computational budgets.</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:15px;font-weight:700}.s{font-size:12px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.train{fill:#91a9b5}.val{fill:#c5a365}.axis{stroke:#aeb7b4}.bias{fill:none;stroke:#587e9b;stroke-width:3}.rho{fill:none;stroke:#b77968;stroke-width:3}.cost{fill:none;stroke:#6f9278;stroke-width:3;stroke-dasharray:6 5}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"></rect><text x="40" y="42" class="t">Larger K changes bias, dependence, and computation</text>
 <g transform="translate(40 66)"><rect class="panel" width="880" height="230" rx="12"></rect><text x="18" y="27" class="h">30 observations, three evaluation schemes</text>
  <g transform="translate(25 56)"><text y="14" class="h">Single holdout</text><g transform="translate(85)"><rect y="0" width="220" height="22" rx="4" class="train"></rect><rect x="220" width="110" height="22" rx="4" class="val"></rect></g><text x="430" y="15" class="s">Train on 20; evaluate once</text></g>
  <g transform="translate(25 96)"><text y="14" class="h">5-fold</text><g transform="translate(85)"><rect width="330" height="18" rx="3" class="train"></rect><rect x="0" width="66" height="18" class="val"></rect><rect y="22" width="330" height="18" rx="3" class="train"></rect><rect x="66" y="22" width="66" height="18" class="val"></rect><rect y="44" width="330" height="18" rx="3" class="train"></rect><rect x="132" y="44" width="66" height="18" class="val"></rect><rect y="66" width="330" height="18" rx="3" class="train"></rect><rect x="198" y="66" width="66" height="18" class="val"></rect></g><text x="430" y="35" class="s">Train on 24; evaluate 5 times</text><text x="430" y="55" class="s">Every observation is validated once</text></g>
  <g transform="translate(25 198)"><text y="14" class="h">LOO</text><g transform="translate(85)"><rect width="330" height="18" rx="3" class="train"></rect><rect x="0" width="11" height="18" class="val"></rect></g><text x="430" y="14" class="s">Train on 29; evaluate 30 highly dependent folds</text></g>
  <g transform="translate(682 55)"><rect width="18" height="12" class="train"></rect><text x="26" y="11" class="s">Training</text><rect y="22" width="18" height="12" class="val"></rect><text x="26" y="33" class="s">Validation</text></g>
 </g>
 <g transform="translate(40 315)"><rect class="panel" width="880" height="180" rx="12"></rect><text x="18" y="27" class="h">Increasing K changes several quantities</text>
  <line x1="60" y1="145" x2="820" y2="145" class="axis"></line><line x1="60" y1="43" x2="60" y2="145" class="axis"></line>
  <path d="M70 58 C225 78 422 112 810 132" class="bias"></path><path d="M70 132 C280 120 530 93 810 49" class="rho"></path><path d="M70 137 L810 45" class="cost"></path>
  <rect x="195" y="39" width="145" height="108" fill="#c09551" opacity=".08"></rect><text x="205" y="58" class="s">Common choice: K = 5–10</text>
  <text x="685" y="129" class="s" fill="#587e9b" style="font-size: 11.39px;">Training-size bias often decreases</text><text x="677" y="66" class="s" fill="#b77968">Training-set overlap increases</text><text x="582" y="92" class="s" fill="#6f9278">Number of model fits increases</text><text x="426" y="165" class="s">K → n</text>
 </g>
 <text x="40" y="520" class="s">Larger K uses more data per fit; it does not make fold scores independent.</text>
</svg>

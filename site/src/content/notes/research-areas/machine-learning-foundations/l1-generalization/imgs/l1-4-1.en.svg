<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="width: 960px; height: 540px;">
 <title id="title">Three diagnostic curves</title><desc id="desc">Learning, capacity, and training curves provide evidence about data, model complexity, and stopping.</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:15px;font-weight:700}.s{font-size:12px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.sub{fill:#f7f5ef}.axis{stroke:#afb8b5}.train{fill:none;stroke:#587e9b;stroke-width:3}.val{fill:none;stroke:#b77968;stroke-width:3}.ref{fill:none;stroke:#9da5a5;stroke-width:1.5;stroke-dasharray:5 4}.u{fill:none;stroke:#c09551;stroke-width:3}.ghost{fill:none;stroke:#b7bfbb;stroke-width:2}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"></rect><text x="40" y="42" class="t">Before changing the model, inspect the relevant curve</text>
 <g transform="translate(35 70)"><rect class="panel" width="286" height="400" rx="12"></rect><text x="18" y="28" class="h" style="font-size: 12.96px;">① Learning curve: would more data help?</text>
  <g transform="translate(22 52)"><rect class="sub" width="242" height="140" rx="8"></rect><line x1="26" y1="113" x2="225" y2="113" class="ref"></line><path d="M25 48 C85 65 130 74 224 77" class="train"></path><path d="M25 101 C81 83 143 78 224 77" class="val"></path><text x="137" y="99" class="s" style="font-size: 8.13px;">Bias-dominated example</text><text x="124" y="129" class="s" style="font-size: 10.12px;">Irreducible error: .0225</text><text x="31" y="24" class="s">Little benefit from more data here</text></g>
  <g transform="translate(22 214)"><rect class="sub" width="242" height="140" rx="8"></rect><line x1="26" y1="113" x2="225" y2="113" class="ref"></line><path d="M25 52 C99 72 163 87 224 96" class="train"></path><path d="M25 124 C96 111 161 102 224 98" class="val"></path><text x="127" y="74" class="s" textLength="105.0" lengthAdjust="spacingAndGlyphs" style="font-size: 8px;">Variance-dominated example</text><text x="128" y="129" class="s">Irreducible error</text><text x="30" y="24" class="s">More data helps here</text></g>
 </g>
 <g transform="translate(337 70)"><rect class="panel" width="286" height="400" rx="12"></rect><text x="18" y="28" class="h" style="font-size: 14.46px;">② Capacity curve: which model size?</text>
  <line x1="38" y1="330" x2="255" y2="330" class="axis"></line><line x1="38" y1="68" x2="38" y2="330" class="axis"></line>
  <path d="M48 95 Q135 350 246 91" class="u"></path><path d="M48 130 Q151 335 246 131" class="ghost"></path><path d="M48 159 Q169 319 246 161" class="ghost"></path>
  <circle cx="139" cy="241" r="6" fill="#c09551"></circle><text x="88" y="224" class="s" style="font-size: 10.87px;">Best tested size at this sample count</text><text x="67" y="359" class="s">Simple</text><text x="213" y="359" class="s">Complex</text><text x="69" y="385" class="s" textLength="207.0" lengthAdjust="spacingAndGlyphs" style="font-size: 8px;">In this example, more data shift and flatten the optimum</text>
 </g>
 <g transform="translate(639 70)"><rect class="panel" width="286" height="400" rx="12"></rect><text x="18" y="28" class="h">③ Training curve: keep running?</text>
  <line x1="38" y1="330" x2="255" y2="330" class="axis"></line><line x1="38" y1="68" x2="38" y2="330" class="axis"></line>
  <path d="M48 90 C100 160 162 247 246 293" class="train"></path><path d="M48 111 C99 181 135 217 169 211 S221 169 246 123" class="val"></path>
  <line x1="169" y1="85" x2="169" y2="330" class="ref"></line><circle cx="169" cy="211" r="6" fill="#b77968"></circle><text x="117" y="75" class="s" textLength="159.0" lengthAdjust="spacingAndGlyphs" style="font-size: 8px;">Lowest validation score: a stopping candidate</text>
  <path d="M48 183 C112 184 182 181 246 180" class="ghost"></path><text x="73" y="168" class="s" style="font-size: 9.29px;">Training fails to decrease: inspect optimization</text><text x="114" y="359" class="s">Training steps</text>
 </g>
 <text x="40" y="510" class="s">These curves ask different questions; a high plateau needs context, including the noise floor and optimization behavior.</text>
</svg>

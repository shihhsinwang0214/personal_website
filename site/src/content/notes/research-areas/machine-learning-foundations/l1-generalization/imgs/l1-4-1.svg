<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
 <title id="title">三條診斷曲線與它們的處方</title><desc id="desc">學習曲線、容量曲線及訓練曲線分別診斷是否需要更多資料、更換模型或提早停止。</desc>
 <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#29363b}.t{font-size:24px;font-weight:700}.h{font-size:15px;font-weight:700}.s{font-size:12px;fill:#657176}.panel{fill:#fffdf8;stroke:#d8d8cf;stroke-width:1.5}.sub{fill:#f7f5ef}.axis{stroke:#afb8b5}.train{fill:none;stroke:#587e9b;stroke-width:3}.val{fill:none;stroke:#b77968;stroke-width:3}.ref{fill:none;stroke:#9da5a5;stroke-width:1.5;stroke-dasharray:5 4}.u{fill:none;stroke:#c09551;stroke-width:3}.ghost{fill:none;stroke:#b7bfbb;stroke-width:2}</style>
 <rect width="960" height="540" rx="18" fill="#f2efe7"/><text x="40" y="42" class="t">「模型不夠好」要先問：哪一條曲線長什麼樣？</text>
 <g transform="translate(35 70)"><rect class="panel" width="286" height="400" rx="12"/><text x="18" y="28" class="h">① 學習曲線：要不要更多資料？</text>
  <g transform="translate(22 52)"><rect class="sub" width="242" height="140" rx="8"/><line x1="26" y1="113" x2="225" y2="113" class="ref"/><path d="M25 48 C85 65 130 74 224 77" class="train"/><path d="M25 101 C81 83 143 78 224 77" class="val"/><text x="137" y="99" class="s">bias 主導</text><text x="124" y="129" class="s">不可約誤差 .0225</text><text x="31" y="24" class="s">加資料無效</text></g>
  <g transform="translate(22 214)"><rect class="sub" width="242" height="140" rx="8"/><line x1="26" y1="113" x2="225" y2="113" class="ref"/><path d="M25 52 C99 72 163 87 224 96" class="train"/><path d="M25 124 C96 111 161 102 224 98" class="val"/><text x="127" y="74" class="s">variance 主導</text><text x="128" y="129" class="s">不可約誤差</text><text x="30" y="24" class="s">加資料有效</text></g>
 </g>
 <g transform="translate(337 70)"><rect class="panel" width="286" height="400" rx="12"/><text x="18" y="28" class="h">② 容量曲線：要換多大的模型？</text>
  <line x1="38" y1="330" x2="255" y2="330" class="axis"/><line x1="38" y1="68" x2="38" y2="330" class="axis"/>
  <path d="M48 95 Q135 350 246 91" class="u"/><path d="M48 130 Q151 335 246 131" class="ghost"/><path d="M48 159 Q169 319 246 161" class="ghost"/>
  <circle cx="139" cy="241" r="6" fill="#c09551"/><text x="88" y="224" class="s">目前資料量的谷底</text><text x="67" y="359" class="s">簡單</text><text x="213" y="359" class="s">複雜</text><text x="69" y="385" class="s">n 增加 → 谷底右移、曲線變平</text>
 </g>
 <g transform="translate(639 70)"><rect class="panel" width="286" height="400" rx="12"/><text x="18" y="28" class="h">③ 訓練曲線：該不該繼續跑？</text>
  <line x1="38" y1="330" x2="255" y2="330" class="axis"/><line x1="38" y1="68" x2="38" y2="330" class="axis"/>
  <path d="M48 90 C100 160 162 247 246 293" class="train"/><path d="M48 111 C99 181 135 217 169 211 S221 169 246 123" class="val"/>
  <line x1="169" y1="85" x2="169" y2="330" class="ref"/><circle cx="169" cy="211" r="6" fill="#b77968"/><text x="117" y="75" class="s">驗證最低點＝提早停止</text>
  <path d="M48 183 C112 184 182 181 246 180" class="ghost"/><text x="73" y="168" class="s">訓練也不降＝最佳化問題</text><text x="114" y="359" class="s">訓練步數</text>
 </g>
 <text x="40" y="510" class="s">三張圖問三個不同問題；沒有不可約誤差參考線，「高原很高」本身沒有診斷力。</text>
</svg>

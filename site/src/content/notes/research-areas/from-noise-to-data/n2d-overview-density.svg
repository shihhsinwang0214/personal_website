<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 920 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto">
  <title id="title">Multimodal data distribution with dense cat-like regions and sparse gaps</title>
  <desc id="desc">A conceptual two-dimensional distribution diagram with three density modes, clustered samples, and callouts showing a clean cat inside a dense mode, a rough cat near an edge, and noise in an empty gap.</desc>
  <defs>
    <radialGradient id="modeBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#315fbd" stop-opacity="0.40"/>
      <stop offset="46%" stop-color="#315fbd" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#315fbd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="modeBrass" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b78231" stop-opacity="0.34"/>
      <stop offset="48%" stop-color="#b78231" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#b78231" stop-opacity="0"/>
    </radialGradient>
    <filter id="soften" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .axis { stroke: #8290a3; stroke-width: 1.4; opacity: 0.55; }
      .panel { fill: none; stroke: #7f8a9a; stroke-width: 1.5; opacity: 0.65; }
      .dot { fill: #314f9a; opacity: 0.82; }
      .dot2 { fill: #9b6b28; opacity: 0.78; }
      .leader { fill: none; stroke: #6f7d8d; stroke-width: 1.6; stroke-linecap: round; }
      .thumb { fill: #efe6d6; stroke: #697789; stroke-width: 1.5; }
      .thumbAlt { fill: #e3e8f1; stroke: #697789; stroke-width: 1.5; }
      .ink { stroke: #344056; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .softInk { stroke: #596273; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.82; }
      .labelBox { fill: #f0eadf; stroke: #748093; stroke-width: 1.1; }
      .label { fill: #2f3948; font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .labelLong { fill: #2f3948; font: 700 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #586374; font: 600 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .noiseCellA { fill: #6f7784; }
      .noiseCellB { fill: #a7adb5; }
      .noiseCellC { fill: #485160; }
    </style>
  </defs>

  <rect class="panel" x="44" y="44" width="540" height="480" rx="22"/>
  <path class="axis" d="M74 486H546"/>
  <path class="axis" d="M82 494V84"/>
  <text class="small" x="480" y="512">2-D projection</text>

  <ellipse cx="214" cy="206" rx="140" ry="96" fill="url(#modeBlue)" filter="url(#soften)" transform="rotate(-18 214 206)"/>
  <ellipse cx="214" cy="206" rx="84" ry="54" fill="#315fbd" opacity="0.14" transform="rotate(-18 214 206)"/>
  <ellipse cx="392" cy="332" rx="124" ry="88" fill="url(#modeBrass)" filter="url(#soften)" transform="rotate(20 392 332)"/>
  <ellipse cx="392" cy="332" rx="72" ry="48" fill="#b78231" opacity="0.13" transform="rotate(20 392 332)"/>
  <ellipse cx="252" cy="410" rx="86" ry="64" fill="url(#modeBlue)" filter="url(#soften)" transform="rotate(8 252 410)"/>
  <ellipse cx="252" cy="410" rx="50" ry="36" fill="#315fbd" opacity="0.11" transform="rotate(8 252 410)"/>

  <g aria-hidden="true">
    <circle class="dot" cx="170" cy="182" r="4"/><circle class="dot" cx="194" cy="196" r="3.6"/><circle class="dot" cx="214" cy="168" r="4.2"/><circle class="dot" cx="238" cy="214" r="3.8"/><circle class="dot" cx="259" cy="190" r="3.5"/><circle class="dot" cx="190" cy="236" r="3.4"/><circle class="dot" cx="232" cy="246" r="3.6"/><circle class="dot" cx="152" cy="214" r="3.2"/><circle class="dot" cx="278" cy="230" r="3.1"/><circle class="dot" cx="220" cy="204" r="3.2"/><circle class="dot" cx="176" cy="160" r="2.9"/><circle class="dot" cx="248" cy="154" r="2.8"/>
    <circle class="dot2" cx="354" cy="306" r="4"/><circle class="dot2" cx="386" cy="318" r="3.8"/><circle class="dot2" cx="416" cy="340" r="4.1"/><circle class="dot2" cx="438" cy="302" r="3.3"/><circle class="dot2" cx="360" cy="356" r="3.3"/><circle class="dot2" cx="404" cy="376" r="3.8"/><circle class="dot2" cx="456" cy="360" r="3.2"/><circle class="dot2" cx="330" cy="334" r="3.1"/><circle class="dot2" cx="398" cy="286" r="3.3"/><circle class="dot2" cx="430" cy="386" r="2.9"/>
    <circle class="dot" cx="226" cy="392" r="3.7"/><circle class="dot" cx="254" cy="408" r="4"/><circle class="dot" cx="278" cy="432" r="3.4"/><circle class="dot" cx="238" cy="444" r="3.2"/><circle class="dot" cx="292" cy="398" r="3.2"/><circle class="dot" cx="202" cy="420" r="2.9"/><circle class="dot" cx="260" cy="374" r="3"/>
    <circle class="dot" cx="318" cy="226" r="2.2" opacity="0.32"/><circle class="dot2" cx="310" cy="270" r="2.1" opacity="0.28"/><circle class="dot" cx="520" cy="210" r="1.9" opacity="0.18"/><circle class="dot2" cx="126" cy="356" r="2" opacity="0.22"/>
  </g>

  <path class="leader" d="M214 196 C312 128, 468 94, 612 96"/>
  <path class="leader" d="M304 246 C430 238, 528 244, 628 258"/>
  <path class="leader" d="M314 272 C462 370, 548 456, 628 472"/>

  <g transform="translate(626 62)">
    <rect class="thumb" x="0" y="0" width="210" height="130" rx="18"/>
    <path class="ink" d="M64 66 C64 39, 146 39, 146 66 C146 98, 64 98, 64 66Z"/>
    <path class="ink" d="M78 45 L64 22 L100 40"/>
    <path class="ink" d="M132 40 L166 22 L150 48"/>
    <circle cx="88" cy="66" r="5" fill="#344056"/>
    <circle cx="124" cy="66" r="5" fill="#344056"/>
    <path class="ink" d="M106 73 L100 82 M106 73 L112 82"/>
    <path class="ink" d="M78 78 H50 M82 86 H50 M132 78 H160 M128 86 H160"/>
    <rect class="labelBox" x="20" y="104" width="170" height="42" rx="12"/>
    <text class="label" x="105" y="132" text-anchor="middle">密集處：像貓</text>
  </g>

  <g transform="translate(646 224)">
    <rect class="thumb" x="0" y="0" width="210" height="130" rx="18"/>
    <path class="softInk" d="M65 70 C58 44, 140 35, 150 67 C158 96, 74 102, 65 70Z"/>
    <path class="softInk" d="M82 47 L70 28 L101 43"/>
    <path class="softInk" d="M130 42 L156 28 L148 52"/>
    <circle cx="91" cy="67" r="4.5" fill="#596273" opacity="0.78"/>
    <circle cx="122" cy="64" r="4" fill="#596273" opacity="0.64"/>
    <path class="softInk" d="M104 75 C101 82, 110 86, 116 80"/>
    <path class="softInk" d="M80 83 H55 M132 80 H158"/>
    <path class="softInk" d="M78 95 C96 104, 126 103, 144 91" opacity="0.55"/>
    <rect class="labelBox" x="20" y="104" width="170" height="42" rx="12"/>
    <text class="label" x="105" y="132" text-anchor="middle">邊緣：勉強像</text>
  </g>

  <g transform="translate(646 386)">
    <rect class="thumbAlt" x="0" y="0" width="210" height="130" rx="18"/>
    <g transform="translate(55 26)">
      <rect class="noiseCellA" x="0" y="0" width="18" height="18" rx="3"/><rect class="noiseCellB" x="20" y="0" width="18" height="18" rx="3"/><rect class="noiseCellC" x="40" y="0" width="18" height="18" rx="3"/><rect class="noiseCellB" x="60" y="0" width="18" height="18" rx="3"/><rect class="noiseCellA" x="80" y="0" width="18" height="18" rx="3"/>
      <rect class="noiseCellC" x="0" y="20" width="18" height="18" rx="3"/><rect class="noiseCellA" x="20" y="20" width="18" height="18" rx="3"/><rect class="noiseCellB" x="40" y="20" width="18" height="18" rx="3"/><rect class="noiseCellC" x="60" y="20" width="18" height="18" rx="3"/><rect class="noiseCellB" x="80" y="20" width="18" height="18" rx="3"/>
      <rect class="noiseCellB" x="0" y="40" width="18" height="18" rx="3"/><rect class="noiseCellC" x="20" y="40" width="18" height="18" rx="3"/><rect class="noiseCellA" x="40" y="40" width="18" height="18" rx="3"/><rect class="noiseCellB" x="60" y="40" width="18" height="18" rx="3"/><rect class="noiseCellC" x="80" y="40" width="18" height="18" rx="3"/>
      <rect class="noiseCellA" x="0" y="60" width="18" height="18" rx="3"/><rect class="noiseCellB" x="20" y="60" width="18" height="18" rx="3"/><rect class="noiseCellC" x="40" y="60" width="18" height="18" rx="3"/><rect class="noiseCellA" x="60" y="60" width="18" height="18" rx="3"/><rect class="noiseCellB" x="80" y="60" width="18" height="18" rx="3"/>
    </g>
    <rect class="labelBox" x="-8" y="104" width="226" height="42" rx="12"/>
    <text class="labelLong" x="105" y="132" text-anchor="middle">空白處：不像任何真實資料</text>
  </g>
</svg>

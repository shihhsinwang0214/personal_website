<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">c_skip 與 c_out：從恆等到網路</title><desc id="desc">兩條係數曲線和三個代表時刻，說明 consistency model 如何把邊界條件寫入架構。</desc>
  <defs><style>.h{font:700 24px system-ui,sans-serif;fill:#1f2733}.t{font:700 17px system-ui,sans-serif;fill:#1f2733}.s{font:500 14px system-ui,sans-serif;fill:#596474}.axis{stroke:#9aa1aa;stroke-width:1.5}.grid{stroke:#ddd9d2;stroke-width:1}.skip{fill:none;stroke:#2a4ea3;stroke-width:4}.out{fill:none;stroke:#f0803c;stroke-width:4}.box{fill:#fffdfb;stroke:#ddd5ca;stroke-width:2}</style></defs>
  <rect width="960" height="540" rx="22" fill="#f5f1ea"/><text x="480" y="34" text-anchor="middle" class="h">參數化把邊界寫進架構</text>
  <g transform="translate(82 60)"><line class="axis" x1="0" y1="250" x2="796" y2="250"/><line class="axis" x1="0" y1="0" x2="0" y2="250"/>
    <g class="grid"><line x1="0" y1="125" x2="796" y2="125"/><line x1="135" y1="0" x2="135" y2="250"/><line x1="398" y1="0" x2="398" y2="250"/><line x1="760" y1="0" x2="760" y2="250"/></g>
    <path class="skip" d="M0 8 C120 10 185 28 260 82 S410 182 520 222 S690 245 796 248"/>
    <path class="out" d="M0 248 C80 240 150 193 235 145 S420 60 570 40 S720 34 796 33"/>
    <text class="t" x="560" y="207" fill="#2a4ea3">c_skip(t)</text><text class="t" x="575" y="58" fill="#f0803c">c_out(t)</text>
    <text class="s" x="135" y="274" text-anchor="middle">t = ε</text><text class="s" x="398" y="274" text-anchor="middle">t = σd</text><text class="s" x="760" y="274" text-anchor="middle">t = T</text>
    <text class="s" x="-12" y="14" text-anchor="end">1</text><text class="s" x="-12" y="254" text-anchor="end">0</text></g>
  <g transform="translate(52 352)"><rect class="box" width="260" height="132" rx="14"/><text class="t" x="130" y="28" text-anchor="middle">t = ε · identity</text><circle cx="64" cy="75" r="17" fill="#4a90e2"/><path d="M86 75H190" stroke="#2a4ea3" stroke-width="8"/><text class="s" x="130" y="112" text-anchor="middle">fθ = 1·x + 0·Fθ</text></g>
  <g transform="translate(350 352)"><rect class="box" width="260" height="132" rx="14"/><text class="t" x="130" y="28" text-anchor="middle">t ≈ σd · 混合</text><circle cx="52" cy="75" r="15" fill="#4a90e2"/><rect x="184" y="60" width="30" height="30" rx="6" fill="#f0803c"/><path d="M72 72H125" stroke="#2a4ea3" stroke-width="7"/><path d="M184 78H135" stroke="#f0803c" stroke-width="7"/><circle cx="130" cy="75" r="10" fill="#60ba82"/><text class="s" x="130" y="112" text-anchor="middle">skip 與 network 各有貢獻</text></g>
  <g transform="translate(648 352)"><rect class="box" width="260" height="132" rx="14"/><text class="t" x="130" y="28" text-anchor="middle">t = T · network</text><rect x="48" y="60" width="30" height="30" rx="6" fill="#f0803c"/><path d="M84 75H194" stroke="#f0803c" stroke-width="8"/><text class="s" x="130" y="112" text-anchor="middle">fθ ≈ σd Fθ</text></g>
  <text x="480" y="521" text-anchor="middle" class="s">t = ε 時，對任何參數 θ 都自動滿足 fθ(x,ε)=x；網路無法選擇平凡常數解。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">TrigFlow 與 EDM 的參數化對照</title><desc id="desc">EDM 在無界噪聲尺度上使用比值係數；TrigFlow 用三角函數把尺度攤到有限區間。</desc>
  <defs><style>.h{font:700 24px system-ui,sans-serif;fill:#1f2733}.t{font:700 18px system-ui,sans-serif;fill:#1f2733}.s{font:500 13px system-ui,sans-serif;fill:#596474}.axis{stroke:#9aa1aa;stroke-width:1.5}.grid{stroke:#dfdbd4}.a{fill:none;stroke:#2a4ea3;stroke-width:4}.b{fill:none;stroke:#f0803c;stroke-width:4}.panel{fill:#fffdfb;stroke:#ddd5ca;stroke-width:2}</style></defs>
  <rect width="960" height="540" rx="22" fill="#f5f1ea"/><text x="480" y="35" text-anchor="middle" class="h">兩種讓邊界自動成立的參數化</text>
  <g transform="translate(35 66)"><rect class="panel" width="420" height="405" rx="16"/><text x="210" y="31" text-anchor="middle" class="t">EDM / consistency model</text>
    <g transform="translate(52 62)"><line class="axis" x1="0" y1="250" x2="330" y2="250"/><line class="axis" x1="0" y1="0" x2="0" y2="250"/><line class="grid" x1="0" y1="125" x2="330" y2="125"/><path class="a" d="M0 8 C45 10 82 20 118 64 S176 164 225 215 S285 245 330 248"/><path class="b" d="M0 248 C40 228 78 172 120 115 S220 43 330 36"/>
      <text class="s" x="242" y="214" fill="#2a4ea3">c_skip ~ 1/t²</text><text class="s" x="222" y="55" fill="#f0803c">c_out → σd</text><text class="s" x="165" y="276" text-anchor="middle">t_EDM（log scale，0.002 → 80）</text></g>
    <text class="s" x="210" y="370" text-anchor="middle">無界尺度；係數是 t 的比值</text></g>
  <path d="M466 266H494" stroke="#2a4ea3" stroke-width="3" stroke-dasharray="6 5"/><text x="480" y="246" text-anchor="middle" class="s">t_EDM = σd tan t</text>
  <g transform="translate(505 66)"><rect class="panel" width="420" height="405" rx="16"/><text x="210" y="31" text-anchor="middle" class="t">TrigFlow</text>
    <g transform="translate(52 62)"><line class="axis" x1="0" y1="250" x2="330" y2="250"/><line class="axis" x1="0" y1="0" x2="0" y2="250"/><line class="grid" x1="0" y1="125" x2="330" y2="125"/><path class="a" d="M0 8 C55 17 112 42 165 82 S276 191 330 248"/><path class="b" d="M0 248 C54 231 110 201 165 165 S276 72 330 34"/>
      <text class="s" x="65" y="39" fill="#2a4ea3">cos t</text><text class="s" x="244" y="61" fill="#f0803c">|−σd sin t|</text><text class="s" x="0" y="276" text-anchor="middle">0</text><text class="s" x="330" y="276" text-anchor="middle">π/2</text><text class="s" x="165" y="299" text-anchor="middle">有限、線性的 t 軸</text></g>
    <text class="s" x="70" y="344">0.05</text><text class="s" x="155" y="344">0.5</text><text class="s" x="250" y="344">5</text><text class="s" x="334" y="344">80</text><text class="s" x="210" y="370" text-anchor="middle">EDM 的對數尺度被均勻攤開</text></g>
  <text x="480" y="512" text-anchor="middle" class="s">兩者在乾淨端都是恆等；TrigFlow 的係數有界，且 Fθ 可同時表示 PF-ODE 速度。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">同一份配對，兩種用法</title>
  <desc id="desc">Teacher 先以彎曲 ODE 軌跡產生配對；reflow 用直線插值學速度；直接回歸則一步學終點。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2a4ea3"/></marker>
    <style>
      .h{font:700 24px system-ui,sans-serif;fill:#1f2733}.t{font:700 18px system-ui,sans-serif;fill:#1f2733}.s{font:500 14px system-ui,sans-serif;fill:#596474}.m{font:600 15px system-ui,sans-serif;fill:#2a4ea3}.panel{fill:#fffdfb;stroke:#ddd5ca;stroke-width:2}.guide{fill:none;stroke:#a8adb5;stroke-width:2}.chord{fill:none;stroke:#60ba82;stroke-width:2}.pair{fill:none;stroke:#2a4ea3;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="540" rx="22" fill="#f5f1ea"/>
  <text x="480" y="38" text-anchor="middle" class="h">同一份 teacher 配對，學兩種不同物件</text>
  <g transform="translate(24 64)"><rect class="panel" width="286" height="420" rx="16"/><text class="t" x="143" y="34" text-anchor="middle">1 · teacher 跑 ODE → 配對</text>
    <g fill="#4a90e2"> <circle cx="48" cy="270" r="6"/><circle cx="62" cy="205" r="6"/><circle cx="82" cy="330" r="6"/><circle cx="100" cy="145" r="6"/><circle cx="118" cy="250" r="6"/></g>
    <g fill="#f0803c"><circle cx="215" cy="128" r="7"/><circle cx="238" cy="165" r="7"/><circle cx="217" cy="212" r="7"/><circle cx="244" cy="260" r="7"/><circle cx="210" cy="315" r="7"/></g>
    <g class="guide"><path d="M48 270 C105 315 165 95 215 128"/><path d="M62 205 C120 120 182 210 238 165"/><path d="M82 330 C132 270 170 190 217 212"/><path d="M100 145 C145 95 205 330 244 260"/><path d="M118 250 C145 355 188 350 210 315"/></g>
    <text class="s" x="143" y="384" text-anchor="middle">彎曲、不交叉的軌跡只用來造資料</text></g>
  <g transform="translate(337 64)"><rect class="panel" width="286" height="420" rx="16"/><text class="t" x="143" y="34" text-anchor="middle">2A · reflow：學速度</text>
    <g class="chord"><path d="M48 270 L215 128"/><path d="M62 205 L238 165"/><path d="M82 330 L217 212"/><path d="M100 145 L244 260"/><path d="M118 250 L210 315"/></g>
    <g fill="#4a90e2"><circle cx="48" cy="270" r="6"/><circle cx="62" cy="205" r="6"/><circle cx="82" cy="330" r="6"/><circle cx="100" cy="145" r="6"/><circle cx="118" cy="250" r="6"/></g><g fill="#f0803c"><circle cx="215" cy="128" r="7"/><circle cx="238" cy="165" r="7"/><circle cx="217" cy="212" r="7"/><circle cx="244" cy="260" r="7"/><circle cx="210" cy="315" r="7"/></g>
    <g fill="#60ba82"><circle cx="132" cy="199" r="4"/><circle cx="150" cy="185" r="4"/><circle cx="150" cy="271" r="4"/></g>
    <text class="m" x="143" y="360" text-anchor="middle">uθ(xₜ,t) ≈ x₁ − x₀</text><text class="s" x="143" y="386" text-anchor="middle">沿弦學每個時間；取樣仍需積分</text></g>
  <g transform="translate(650 64)"><rect class="panel" width="286" height="420" rx="16"/><text class="t" x="143" y="34" text-anchor="middle">2B · 直接回歸：學終點</text>
    <g class="pair"><path d="M58 270 L215 128"/><path d="M72 205 L238 165"/><path d="M92 330 L217 212"/><path d="M110 145 L244 260"/><path d="M128 250 L210 315"/></g>
    <g fill="#4a90e2"><circle cx="58" cy="270" r="6"/><circle cx="72" cy="205" r="6"/><circle cx="92" cy="330" r="6"/><circle cx="110" cy="145" r="6"/><circle cx="128" cy="250" r="6"/></g><g fill="#f0803c"><circle cx="215" cy="128" r="7"/><circle cx="238" cy="165" r="7"/><circle cx="217" cy="212" r="7"/><circle cx="244" cy="260" r="7"/><circle cx="210" cy="315" r="7"/></g>
    <text class="m" x="143" y="360" text-anchor="middle">Gθ(x₀) ≈ x₁</text><text class="s" x="143" y="386" text-anchor="middle">一步到終點；訓練只看 t = 0</text></g>
  <text x="480" y="518" text-anchor="middle" class="s">差別不在配對資料，而在模型學「沿途的速度」還是「最後的終點」。</text>
</svg>

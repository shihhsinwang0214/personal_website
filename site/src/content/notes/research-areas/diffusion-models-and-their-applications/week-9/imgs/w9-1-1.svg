<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">三條 flow-map 恆等式的幾何</title><desc id="desc">Lagrangian、Eulerian 與 progressive 三種訓練 flow map 的方式，以及速度出現的位置。</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2a4ea3"/></marker><style>.h{font:700 24px system-ui,sans-serif;fill:#1f2733}.t{font:700 18px system-ui,sans-serif;fill:#1f2733}.s{font:500 13px system-ui,sans-serif;fill:#596474}.panel{fill:#fffdfb;stroke:#ddd5ca;stroke-width:2}.traj{fill:none;stroke:#9aa1aa;stroke-width:3}.map{fill:none;stroke:#60ba82;stroke-width:4;marker-end:url(#arr)}.vel{stroke:#2a4ea3;stroke-width:4;marker-end:url(#arr)}.dash{fill:none;stroke:#f0803c;stroke-width:2;stroke-dasharray:6 5}</style></defs>
  <rect width="960" height="540" rx="22" fill="#f5f1ea"/><text x="480" y="36" text-anchor="middle" class="h">同一個 ψₜ→ₛ，三種微分方式</text>
  <g transform="translate(24 64)"><rect class="panel" width="288" height="414" rx="16"/><text x="144" y="34" text-anchor="middle" class="t">Lagrangian</text><path class="traj" d="M38 322 C75 180 151 340 250 92"/><circle cx="76" cy="221" r="7" fill="#4a90e2"/><circle cx="181" cy="231" r="8" fill="#f0803c"/><line class="vel" x1="181" y1="231" x2="212" y2="195"/><text x="58" y="210" class="s">xₜ 固定</text><text x="196" y="255" class="s">輸出沿 s 滑動</text><rect x="160" y="210" width="42" height="42" rx="8" fill="none" stroke="#d94f4f" stroke-width="2"/><text class="s" x="144" y="362" text-anchor="middle">v 在輸出點：手上沒有配對</text><text class="s" x="144" y="385" text-anchor="middle">→ 需要 teacher</text></g>
  <g transform="translate(336 64)"><rect class="panel" width="288" height="414" rx="16"/><text x="144" y="34" text-anchor="middle" class="t">Eulerian</text><path class="traj" d="M38 322 C75 180 151 340 250 92"/><circle cx="82" cy="215" r="7" fill="#4a90e2"/><circle cx="112" cy="230" r="6" fill="#4a90e2" opacity=".6"/><circle cx="181" cy="231" r="8" fill="#f0803c"/><path class="map" d="M82 215 Q132 180 176 226"/><path class="map" d="M112 230 Q144 205 176 230"/><line class="vel" x1="82" y1="215" x2="108" y2="228"/><path class="dash" d="M38 322 L250 92"/><text x="44" y="196" class="s">v 在輸入點</text><text class="s" x="144" y="362" text-anchor="middle">xₜ 是自己造的、條件速度現成</text><text class="s" x="144" y="385" text-anchor="middle">→ 可以不要 teacher</text></g>
  <g transform="translate(648 64)"><rect class="panel" width="288" height="414" rx="16"/><text x="144" y="34" text-anchor="middle" class="t">progressive</text><path class="traj" d="M38 322 C75 180 151 340 250 92"/><circle cx="67" cy="229" r="7" fill="#4a90e2"/><circle cx="151" cy="238" r="7" fill="#60ba82"/><circle cx="228" cy="139" r="8" fill="#f0803c"/><path class="map" d="M67 229 Q105 212 146 236"/><path class="map" d="M151 238 Q194 224 224 144"/><path d="M67 229 Q159 300 228 139" fill="none" stroke="#2a4ea3" stroke-width="3" marker-end="url(#arr)"/><text x="145" y="286" text-anchor="middle" class="t">兩小步 ＝ 一大步</text><text class="s" x="144" y="362" text-anchor="middle">identity 本身不碰速度</text><text class="s" x="144" y="385" text-anchor="middle">v 只在最小的一步進來</text></g>
  <text x="480" y="516" text-anchor="middle" class="s">差別只在 v 出現於輸出點、輸入點，或只作為最底層動力學。</text>
</svg>

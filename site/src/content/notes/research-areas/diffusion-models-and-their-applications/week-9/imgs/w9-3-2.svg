<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">三條恆等式乘上兩種速度來源</title><desc id="desc">六格方法圖，分類 Lagrangian、Eulerian、progressive 與 teacher、條件速度的組合。</desc>
  <defs><style>.h{font:700 24px system-ui,sans-serif;fill:#1f2733}.t{font:700 17px system-ui,sans-serif;fill:#1f2733}.s{font:500 13px system-ui,sans-serif;fill:#596474}.cell{fill:#fffdfb;stroke:#d8d1c6;stroke-width:2}.hot{fill:#eef4ff;stroke:#2a4ea3;stroke-width:3}.self{fill:#edf8f0;stroke:#60ba82;stroke-width:3}.x{font:800 42px system-ui,sans-serif;fill:#d94f4f}.dash{fill:none;stroke:#2a4ea3;stroke-width:2;stroke-dasharray:7 5}</style></defs>
  <rect width="960" height="540" rx="22" fill="#f5f1ea"/><text x="520" y="36" text-anchor="middle" class="h">三條恆等式 × 兩種速度來源</text>
  <text x="170" y="89" text-anchor="end" class="t">v 從哪裡來</text><text x="330" y="89" text-anchor="middle" class="t">Lagrangian</text><text x="585" y="89" text-anchor="middle" class="t">Eulerian</text><text x="840" y="89" text-anchor="middle" class="t">progressive</text>
  <text x="170" y="198" text-anchor="end" class="t">teacher</text><text x="170" y="378" text-anchor="end" class="t">自己造的點</text>
  <g transform="translate(205 112)"><rect class="cell" width="250" height="145" rx="14"/><text x="125" y="52" text-anchor="middle" class="t">AYF-LMD</text><text x="125" y="85" text-anchor="middle" class="s">速度在輸出點</text></g>
  <g transform="translate(460 112)"><rect class="cell" width="250" height="145" rx="14"/><text x="125" y="45" text-anchor="middle" class="t">consistency distillation</text><text x="125" y="75" text-anchor="middle" class="t">AYF-EMD</text><text x="125" y="107" text-anchor="middle" class="s">teacher 的輸入點速度</text></g>
  <g transform="translate(715 112)"><rect class="hot" width="220" height="145" rx="14"/><text x="110" y="48" text-anchor="middle" class="t">progressive distillation</text><text x="110" y="82" text-anchor="middle" class="t">CTM</text><text x="110" y="112" text-anchor="middle" class="s">兩小步教一大步</text></g>
  <g transform="translate(205 292)"><rect class="cell" width="250" height="145" rx="14"/><text x="125" y="72" text-anchor="middle" class="x">×</text><text x="125" y="110" text-anchor="middle" class="s">輸出點沒有條件配對</text></g>
  <g transform="translate(460 292)"><rect class="self" width="250" height="145" rx="14"/><text x="125" y="39" text-anchor="middle" class="t">CT · sCM</text><text x="125" y="73" text-anchor="middle" class="t">MeanFlow</text><text x="125" y="108" text-anchor="middle" class="s">連續 Eulerian identity</text></g>
  <g transform="translate(715 292)"><rect class="self" width="220" height="145" rx="14"/><text x="110" y="57" text-anchor="middle" class="t">Shortcut</text><text x="110" y="91" text-anchor="middle" class="s">d=0 的 FM 提供底層</text></g>
  <path class="dash" d="M585 270 C650 252 760 252 822 267"/><text x="704" y="244" text-anchor="middle" class="s">CTM 在 progressive 與 Eulerian 間滑動</text>
  <rect x="442" y="274" width="506" height="181" rx="20" fill="none" stroke="#60ba82" stroke-width="2" stroke-dasharray="8 6"/><text x="695" y="479" text-anchor="middle" class="s">MeanFlow 與 Shortcut 輸出同一種物件：平均速度</text>
  <text x="480" y="519" text-anchor="middle" class="s">不要 teacher 的方法只能住在 Eulerian 或 progressive × 條件速度。</text>
</svg>

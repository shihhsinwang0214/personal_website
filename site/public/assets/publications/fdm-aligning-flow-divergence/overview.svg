<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Flow and Divergence Matching overview figure</title>
  <desc id="desc">A dark-panel overview showing that matching sample directions is not enough; FDM also matches local density expansion and compression.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#f4b21f" />
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4a9bea" />
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#17242a" flood-opacity="0.25" />
    </filter>
    <style>
      .bg { fill: #34454d; }
      .title { font: 700 53px Arial, Helvetica, sans-serif; fill: #f7f8f5; }
      .subtitle { font: 400 25px Arial, Helvetica, sans-serif; fill: #cdd7da; }
      .label { font: 700 25px Arial, Helvetica, sans-serif; fill: #f7f8f5; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #cdd7da; }
      .panel { fill: #f7f7f4; stroke: #e1e5e6; stroke-width: 2; rx: 22; filter: url(#softShadow); }
      .darkPanel { fill: #41535b; stroke: #dce3e5; stroke-width: 2; stroke-dasharray: 9 10; rx: 18; }
      .curveTrue { stroke: #f4b21f; stroke-width: 6; fill: none; stroke-linecap: round; }
      .curveLearned { stroke: #4a9bea; stroke-width: 6; fill: none; stroke-linecap: round; stroke-dasharray: 12 10; }
      .arrowGold { stroke: #f4b21f; stroke-width: 5; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
      .arrowBlue { stroke: #4a9bea; stroke-width: 5; fill: none; marker-end: url(#arrowBlue); stroke-linecap: round; }
      .contour { fill: none; stroke: #8aa0a8; stroke-width: 2; opacity: 0.65; }
      .contourHot { fill: none; stroke: #e95b4f; stroke-width: 3; opacity: 0.9; }
      .contourGood { fill: none; stroke: #bfe8c8; stroke-width: 3; opacity: 0.95; }
      .chip { fill: #26343a; stroke: #52666f; stroke-width: 2; rx: 16; }
      .chipText { font: 700 20px Arial, Helvetica, sans-serif; fill: #f7f8f5; }
      .muted { fill: #cdd7da; font-weight: 400; }
      .formula { font: 700 23px Arial, Helvetica, sans-serif; fill: #f7f8f5; }
      .accent { fill: #f4b21f; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900" />

  <text class="title" x="80" y="82">Matching directions is not enough when density changes</text>
  <text class="subtitle" x="82" y="126">
    FDM teaches the model where samples should move and how probability mass should spread or tighten along the way.
  </text>

  <g transform="translate(82 184)">
    <rect class="darkPanel" x="0" y="0" width="1436" height="486" />

    <g transform="translate(58 58)">
      <text class="label" x="0" y="0">Old target: match movement</text>
      <text class="small" x="0" y="32">arrows can look right while the density path drifts</text>
      <rect class="panel" x="0" y="72" width="580" height="318" />

      <g transform="translate(64 118)">
        <ellipse class="contour" cx="70" cy="168" rx="52" ry="30" />
        <ellipse class="contour" cx="70" cy="168" rx="84" ry="48" />
        <ellipse class="contourHot" cx="334" cy="118" rx="72" ry="42" />
        <ellipse class="contourHot" cx="334" cy="118" rx="112" ry="66" />

        <path class="curveTrue" d="M70 168 C176 64, 292 52, 406 94" />
        <path class="curveLearned" d="M70 168 C190 112, 285 150, 440 194" />

        <path class="arrowGold" d="M118 130 L170 90" />
        <path class="arrowGold" d="M230 78 L292 72" />
        <path class="arrowGold" d="M338 92 L395 96" />

        <path class="arrowBlue" d="M126 156 L180 132" />
        <path class="arrowBlue" d="M240 142 L300 150" />
        <path class="arrowBlue" d="M354 170 L414 190" />

        <text x="18" y="248" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#34454d">source cloud</text>
        <text x="370" y="40" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#34454d">target density</text>
        <text x="252" y="246" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#4a9bea">density drifts</text>
      </g>
    </g>

    <g transform="translate(798 58)">
      <text class="label" x="0" y="0">FDM target: move and reshape mass</text>
      <text class="small" x="0" y="32">divergence tells the cloud how to spread or compress</text>
      <rect class="panel" x="0" y="72" width="580" height="318" />

      <g transform="translate(64 118)">
        <ellipse class="contour" cx="70" cy="168" rx="52" ry="30" />
        <ellipse class="contour" cx="70" cy="168" rx="84" ry="48" />
        <ellipse class="contourGood" cx="336" cy="118" rx="76" ry="44" />
        <ellipse class="contourGood" cx="336" cy="118" rx="112" ry="66" />

        <path class="curveTrue" d="M70 168 C176 64, 292 52, 406 94" />
        <path class="curveLearned" d="M70 168 C170 76, 292 60, 410 98" />

        <path class="arrowGold" d="M118 130 L170 90" />
        <path class="arrowGold" d="M230 78 L292 72" />
        <path class="arrowGold" d="M338 92 L395 96" />

        <g transform="translate(230 150)">
          <path d="M0 0 C25 -28, 67 -28, 92 0" stroke="#bfe8c8" stroke-width="5" fill="none" stroke-linecap="round" />
          <path d="M0 0 C24 28, 68 28, 92 0" stroke="#bfe8c8" stroke-width="5" fill="none" stroke-linecap="round" />
          <path d="M46 -42 L46 42" stroke="#bfe8c8" stroke-width="5" fill="none" stroke-linecap="round" />
          <circle cx="46" cy="0" r="8" fill="#bfe8c8" />
        </g>

        <path class="arrowBlue" d="M126 136 L178 94" />
        <path class="arrowBlue" d="M240 82 L300 76" />
        <path class="arrowBlue" d="M354 94 L410 98" />

        <text x="18" y="248" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#34454d">source cloud</text>
        <text x="366" y="40" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#34454d">target density</text>
        <text x="226" y="246" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#34454d">density stays aligned</text>
      </g>
    </g>
  </g>

  <g transform="translate(116 706)">
    <rect x="0" y="0" width="1368" height="118" rx="22" fill="#26343a" stroke="#52666f" stroke-width="2" />
    <text class="formula" x="38" y="43">
      What I added:
      <tspan class="accent"> a loss for local density change</tspan>
    </text>
    <text class="small" x="38" y="80">
      Plain meaning: the same-looking arrows can still create the wrong cloud shape.
    </text>
    <text class="small" x="38" y="105">Divergence tells the model how mass should spread or tighten.</text>

    <g transform="translate(960 24)">
      <rect class="chip" x="0" y="0" width="330" height="70" />
      <text class="chipText" x="24" y="31">velocity = where to go</text>
      <text class="chipText muted" x="24" y="55">divergence = how mass reshapes</text>
    </g>
  </g>
</svg>

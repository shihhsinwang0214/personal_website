<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RMFlow overview figure</title>
  <desc id="desc">A dark-panel overview showing RMFlow as fast one-step generation followed by a guided noise refinement step that improves detail and diversity.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#f4b21f" />
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dce3e5" />
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#17242a" flood-opacity="0.28" />
    </filter>
    <style>
      .bg { fill: #34454d; }
      .title { font: 700 54px Arial, Helvetica, sans-serif; fill: #f7f8f5; }
      .subtitle { font: 400 25px Arial, Helvetica, sans-serif; fill: #cdd7da; }
      .label { font: 700 25px Arial, Helvetica, sans-serif; fill: #f7f8f5; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #cdd7da; }
      .tiny { font: 700 15px Arial, Helvetica, sans-serif; fill: #34454d; }
      .panel { fill: #f7f7f4; stroke: #e1e5e6; stroke-width: 2; rx: 22; filter: url(#softShadow); }
      .darkPanel { fill: #41535b; stroke: #dce3e5; stroke-width: 2; stroke-dasharray: 9 10; rx: 18; }
      .accentText { fill: #f4b21f; font-weight: 700; }
      .nodePurple { fill: #7467ef; stroke: #eeeefd; stroke-width: 3; }
      .nodeGreen { fill: #bfe8c8; stroke: #eef8f0; stroke-width: 3; }
      .nodePink { fill: #f3c4c2; stroke: #fff0ef; stroke-width: 3; }
      .edge { stroke: #dce3e5; stroke-width: 4; fill: none; stroke-linecap: round; }
      .edgeDark { stroke: #8aa0a8; stroke-width: 3; fill: none; stroke-linecap: round; }
      .arrow { stroke: #f4b21f; stroke-width: 8; fill: none; stroke-linecap: round; marker-end: url(#arrow); }
      .arrowSoft { stroke: #dce3e5; stroke-width: 5; fill: none; stroke-linecap: round; marker-end: url(#arrowSoft); }
      .badge { fill: #f4b21f; rx: 15; }
      .badgeText { font: 700 18px Arial, Helvetica, sans-serif; fill: #26343a; }
      .formula { font: 700 22px Arial, Helvetica, sans-serif; fill: #f7f8f5; }
      .mutedFormula { font: 400 20px Arial, Helvetica, sans-serif; fill: #cdd7da; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900" />

  <text class="title" x="80" y="82">
    <tspan>RMFlow makes one-step generation less rough</tspan>
  </text>
  <text class="subtitle" x="82" y="126">
    It first makes a fast draft, then adds a guided noise step to recover detail and diversity without going back to slow sampling.
  </text>

  <g transform="translate(82 190)">
    <rect class="darkPanel" x="0" y="0" width="1436" height="432" />

    <g transform="translate(64 62)">
      <text class="label" x="0" y="0">Start from noise</text>
      <text class="small" x="0" y="32">random seed or condition</text>
      <rect class="panel" x="0" y="72" width="260" height="210" />
      <ellipse cx="130" cy="174" rx="86" ry="58" fill="#e7ecf1" stroke="#c7d3d8" stroke-width="3" />
      <circle cx="81" cy="151" r="10" class="nodePurple" />
      <circle cx="122" cy="122" r="9" class="nodePurple" opacity="0.82" />
      <circle cx="165" cy="146" r="12" class="nodePurple" opacity="0.72" />
      <circle cx="106" cy="197" r="8" class="nodePurple" opacity="0.62" />
      <circle cx="181" cy="207" r="10" class="nodePurple" opacity="0.86" />
      <circle cx="143" cy="176" r="7" class="nodePurple" opacity="0.75" />
      <rect class="badge" x="56" y="250" width="148" height="34" />
      <text class="badgeText" x="72" y="273">starting point</text>
    </g>

    <path class="arrow" d="M384 216 C450 170, 508 170, 574 216" />
    <text class="label" x="401" y="145">fast draft</text>
    <text class="small" x="389" y="174">one MeanFlow prediction</text>

    <g transform="translate(600 62)">
      <text class="label" x="0" y="0">Rough sample</text>
      <text class="small" x="0" y="32">coherent, but missing fine structure</text>
      <rect class="panel" x="-8" y="72" width="286" height="210" />
      <path class="edgeDark" d="M58 150 L119 116 L179 145 L225 100" />
      <path class="edgeDark" d="M58 150 L100 194 L171 194 L225 100" />
      <path class="edgeDark" d="M119 116 L100 194" />
      <path class="edgeDark" d="M179 145 L171 194" />
      <circle cx="58" cy="150" r="15" class="nodePurple" />
      <circle cx="119" cy="116" r="13" class="nodePink" />
      <circle cx="179" cy="145" r="14" class="nodeGreen" />
      <circle cx="225" cy="100" r="12" class="nodePink" />
      <circle cx="100" cy="194" r="13" class="nodePurple" opacity="0.72" />
      <circle cx="171" cy="194" r="15" class="nodeGreen" opacity="0.76" />
      <text class="tiny" x="78" y="264">fast but still rough</text>
    </g>

    <path class="arrow" d="M904 216 C980 246, 1038 246, 1114 216" />
    <g transform="translate(959 123)">
      <circle cx="0" cy="0" r="5" fill="#f4b21f" />
      <circle cx="36" cy="24" r="4" fill="#f4b21f" opacity="0.85" />
      <circle cx="-30" cy="42" r="3.5" fill="#f4b21f" opacity="0.65" />
      <path d="M13 -28 L24 -8 L46 0 L24 8 L13 28 L2 8 L-20 0 L2 -8 Z" fill="#f4b21f" opacity="0.82" />
    </g>
    <text class="label" x="905" y="300">guided noise step</text>
    <text class="small" x="932" y="330">shake the draft</text>
    <text class="small" x="930" y="356">toward sharper modes</text>

    <g transform="translate(1144 62)">
      <text class="label" x="0" y="0">Cleaner final sample</text>
      <text class="small" x="0" y="32">more detail and mode coverage</text>
      <rect class="panel" x="0" y="72" width="260" height="210" />
      <path class="edgeDark" d="M58 154 L108 112 L164 130 L213 92" />
      <path class="edgeDark" d="M58 154 L104 196 L166 193 L213 92" />
      <path class="edgeDark" d="M108 112 L104 196" />
      <path class="edgeDark" d="M164 130 L166 193" />
      <path class="edgeDark" d="M108 112 L164 130" />
      <circle cx="58" cy="154" r="15" class="nodePurple" />
      <circle cx="108" cy="112" r="14" class="nodePink" />
      <circle cx="164" cy="130" r="14" class="nodeGreen" />
      <circle cx="213" cy="92" r="13" class="nodePink" />
      <circle cx="104" cy="196" r="13" class="nodePurple" />
      <circle cx="166" cy="193" r="15" class="nodeGreen" />
      <text class="tiny" x="54" y="264">still fast, less collapsed</text>
    </g>
  </g>

  <g transform="translate(116 676)">
    <rect x="0" y="0" width="1368" height="116" rx="22" fill="#26343a" stroke="#52666f" stroke-width="2" />
    <text class="formula" x="38" y="44">
      What I added:
      <tspan class="accentText"> a refinement step for fast one-shot samplers</tspan>
    </text>
    <text class="mutedFormula" x="38" y="78">Why it matters: keep the speed of one-step generation, but recover detail</text>
    <text class="mutedFormula" x="38" y="104">and diversity that can disappear when the first draft is too coarse.</text>

    <g transform="translate(990 26)">
      <rect x="0" y="0" width="310" height="64" rx="18" fill="#f7f7f4" />
      <text x="26" y="27" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#34454d">Takeaway</text>
      <text x="26" y="51" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#52666f">rough draft -> guided polish</text>
    </g>
  </g>
</svg>

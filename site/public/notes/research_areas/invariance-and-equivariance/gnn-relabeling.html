<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GNN 節點重新編號</title>
<script src="./_demo-common.js"></script>
</head>
<body>
<div class="card">
  <p class="goal">學習目標：重新編號道路 graph 的 nodes。<b>node predictions</b>應跟著真實路口換 row；<b>graph readout</b>保持固定。</p>
  <canvas id="cv" width="720" height="420" aria-label="道路圖與節點預測"></canvas>
  <div class="controls">
    <div class="row">
      <button id="relabel" type="button">重新編號 nodes</button>
      <button id="message" type="button">做一輪 message passing</button>
    </div>
  </div>
  <div class="metrics">
    <div class="metric"><strong>node row order</strong><span id="order"></span></div>
    <div class="metric"><strong>graph-level readout</strong><span id="graph"></span></div>
    <div class="metric"><strong>message round</strong><span id="round"></span></div>
  </div>
  <p class="observe">觀察：<b>預測顏色黏在路口上，不黏在 node id 上。</b>重新命名只改表示，不改道路關係。</p>
</div>
<script>
(function () {
  var cv = document.getElementById('cv'), dpi = NDFlow.hiDPICanvas(cv), ctx = dpi.ctx, pal, size;
  var nodes = [
    { name: '台大正門', x: -.72, y: .12, score: .82 },
    { name: '公館站', x: -.08, y: -.58, score: .43 },
    { name: '總圖', x: .02, y: .42, score: .68 },
    { name: '新生路口', x: .72, y: .12, score: .57 }
  ];
  var edges = [[0,1],[0,2],[1,2],[1,3],[2,3]], order = [0,1,2,3], round = 0;
  function relabel() {
    order = order.slice().sort(function () { return Math.random() - .5; });
    draw();
  }
  function colorFor(score) {
    return score > .7 ? pal.red : score > .55 ? pal.accent : pal.blue;
  }
  function draw() {
    size = dpi.resize();
    ctx.clearRect(0, 0, size.w, size.h); ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, size.w, size.h);
    var split = size.w * .61, cx = split * .5, cy = size.h * .54, scale = Math.min(split * .39, size.h * .38);
    ctx.fillStyle = pal.muted; ctx.font = '700 12px system-ui'; ctx.fillText('同一張道路 graph', 17, 25); ctx.fillText('目前矩陣 row', split + 14, 25);
    ctx.strokeStyle = pal.border; ctx.lineWidth = 4;
    edges.forEach(function (e) {
      var a = nodes[e[0]], b = nodes[e[1]];
      ctx.beginPath(); ctx.moveTo(cx + a.x * scale, cy - a.y * scale); ctx.lineTo(cx + b.x * scale, cy - b.y * scale); ctx.stroke();
    });
    nodes.forEach(function (n, index) {
      var x = cx + n.x * scale, y = cy - n.y * scale;
      ctx.fillStyle = colorFor(n.score); ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = pal.panel; ctx.font = '700 11px system-ui'; ctx.textAlign = 'center'; ctx.fillText((n.score + round * .02).toFixed(2), x, y + 4); ctx.textAlign = 'left';
      ctx.fillStyle = pal.ink; ctx.font = '12px system-ui'; ctx.fillText(n.name, x - 28, y + 36);
    });
    ctx.strokeStyle = pal.border; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(split, 16); ctx.lineTo(split, size.h - 16); ctx.stroke();
    var rowH = Math.min(56, (size.h - 55) / order.length);
    order.forEach(function (idx, row) {
      var n = nodes[idx], y = 40 + row * rowH;
      ctx.fillStyle = pal.panel; NDFlow.roundRect(ctx, split + 12, y, size.w - split - 24, rowH - 8, 6); ctx.fill();
      ctx.strokeStyle = pal.border; ctx.stroke();
      ctx.fillStyle = pal.muted; ctx.font = '700 11px system-ui'; ctx.fillText('node ' + (row + 1), split + 22, y + 22);
      ctx.fillStyle = colorFor(n.score); ctx.beginPath(); ctx.arc(split + 92, y + 18, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = pal.ink; ctx.font = '12px system-ui'; ctx.fillText(n.name, split + 107, y + 22);
    });
    document.getElementById('order').textContent = order.map(function (i) { return nodes[i].name; }).join(' → ');
    document.getElementById('graph').textContent = (nodes.reduce(function (s,n) { return s + n.score; }, 0) / nodes.length).toFixed(3) + '（固定）';
    document.getElementById('round').textContent = String(round);
  }
  document.getElementById('relabel').onclick = relabel;
  document.getElementById('message').onclick = function () { round = (round + 1) % 4; draw(); };
  window.addEventListener('resize', draw);
  NDFlow.onThemeChange(function () { pal = NDFlow.applyTheme(draw); });
  pal = NDFlow.applyTheme(draw);
})();
</script>
</body>
</html>

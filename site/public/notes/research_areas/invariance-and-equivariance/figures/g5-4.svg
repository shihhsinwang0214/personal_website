<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 315" role="img" aria-labelledby="title desc">
<title id="title">鏡子裡的分子，也一定要得到相同答案嗎？</title><desc id="desc">鏡射保留所有距離，卻翻轉有序四點的 signed volume；任務若要辨認手性，不能強制它對鏡像同值。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#826746"/></marker></defs>
<rect width="840" height="315" rx="16" fill="#fbf8f1"/>
<g font-family="Segoe UI,Microsoft JhengHei,sans-serif" fill="#242a32">
<text x="28" y="38" font-size="14" font-weight="700" fill="#826746">G5.4 · 計算關係</text>
<rect x="24" y="62" width="230" height="70" rx="10" fill="#fff" stroke="#d3c6b2"/>
<text x="139" y="102" text-anchor="middle" font-size="17" font-weight="600">四種身份的四點</text>
<path d="M259 97h35" stroke="#826746" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="304" y="62" width="230" height="70" rx="10" fill="#f0e6d5" stroke="#d3c6b2"/>
<text x="419" y="102" text-anchor="middle" font-size="15" font-weight="600">全部 pairwise distances</text>
<path d="M539 97h35" stroke="#826746" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="584" y="62" width="230" height="70" rx="10" fill="#fff" stroke="#d3c6b2"/>
<text x="699" y="102" text-anchor="middle" font-size="17" font-weight="600">鏡像前後相同</text>
<rect x="24" y="162" width="230" height="70" rx="10" fill="#fff" stroke="#d3c6b2"/>
<text x="139" y="202" text-anchor="middle" font-size="17" font-weight="600">有序相對向量</text>
<path d="M259 197h35" stroke="#826746" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="304" y="162" width="230" height="70" rx="10" fill="#f0e6d5" stroke="#d3c6b2"/>
<text x="419" y="202" text-anchor="middle" font-size="17" font-weight="600">Signed determinant</text>
<path d="M539 197h35" stroke="#826746" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="584" y="162" width="230" height="70" rx="10" fill="#fff" stroke="#d3c6b2"/>
<text x="699" y="202" text-anchor="middle" font-size="17" font-weight="600">Reflection 後變號</text>
<text x="28" y="266" font-size="13" fill="#59616b">鏡射保留所有距離，卻翻轉有序四點的 signed volume；任務若要辨認手性，不能強</text>
<text x="28" y="284" font-size="13" fill="#59616b">制它對鏡像同值。</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 315" role="img" aria-labelledby="title desc">
<title id="title">換編號時，關係的兩個軸也要一起換</title><desc id="desc">Query 跟自己的點一起搬；A′ = PAPᵀ   →   Y′ = PY</desc>
<rect width="840" height="315" rx="18" fill="#f7f8fb"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" fill="#24324a">
<text x="34" y="42" font-size="21" font-weight="700">換編號時，關係的兩個軸也要一起換</text>
<rect x="34" y="68" width="376" height="205" rx="13" fill="#fff" stroke="#9eb6df"/><text x="54" y="100" font-size="16" font-weight="700" fill="#315c9d">逐點資訊：搬一個軸</text><text x="54" y="142" font-size="19">H′ = PH     V′ = PV</text><text x="54" y="185" font-size="16">同一個點，放到新的 row</text><text x="54" y="235" font-size="13" fill="#606b7b">Query 跟自己的點一起搬</text>
<rect x="426" y="68" width="376" height="205" rx="13" fill="#fff" stroke="#daac5e"/><text x="446" y="100" font-size="16" font-weight="700" fill="#935d15">成對資訊：搬兩個軸</text><text x="446" y="142" font-size="19">B′ = PBPᵀ     M′ = PMPᵀ</text><text x="446" y="185" font-size="16">同一對點，放到新的 row / column</text><text x="446" y="235" font-size="13" fill="#606b7b">A′ = PAPᵀ   →   Y′ = PY</text>
<text x="34" y="298" font-size="12" fill="#68768b">Geometric Deep Learning · Attention and Transformers</text>
</g></svg>

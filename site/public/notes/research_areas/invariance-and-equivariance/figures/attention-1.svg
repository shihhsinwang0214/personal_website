<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 315" role="img" aria-labelledby="title desc">
<title id="title">從比較到讀取：三個不同角色</title><desc id="desc">每列固定一個 query，比較所有 keys；(1/4, 1/2, 1/4) · (10,20,40) = 22.5</desc>
<rect width="840" height="315" rx="18" fill="#f7f8fb"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" fill="#24324a">
<text x="34" y="42" font-size="21" font-weight="700">從比較到讀取：三個不同角色</text>
<rect x="34" y="68" width="376" height="205" rx="13" fill="#fff" stroke="#9eb6df"/><text x="54" y="100" font-size="16" font-weight="700" fill="#315c9d">比較問題與索引</text><text x="54" y="142" font-size="19">Q = H WQ     K = H WK</text><text x="54" y="185" font-size="16">S = Q Kᵀ / √dₖ</text><text x="54" y="235" font-size="13" fill="#606b7b">每列固定一個 query，比較所有 keys</text>
<rect x="426" y="68" width="376" height="205" rx="13" fill="#fff" stroke="#daac5e"/><text x="446" y="100" font-size="16" font-weight="700" fill="#935d15">依權重讀內容</text><text x="446" y="142" font-size="19">V = H WV</text><text x="446" y="185" font-size="16">Y = softmaxrow(S) V</text><text x="446" y="235" font-size="13" fill="#606b7b">(1/4, 1/2, 1/4) · (10,20,40) = 22.5</text>
<text x="34" y="298" font-size="12" fill="#68768b">Geometric Deep Learning · Attention and Transformers</text>
</g></svg>

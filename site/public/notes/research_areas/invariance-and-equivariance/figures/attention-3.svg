<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 315" role="img" aria-labelledby="title desc">
<title id="title">把兩種運算接成 Transformer block</title><desc id="desc">每個 head 的輸出都跟著 P 搬动；Residual、row-wise LN 也保留 F(PH)=PF(H)</desc>
<rect width="840" height="315" rx="18" fill="#f7f8fb"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" fill="#24324a">
<text x="34" y="42" font-size="21" font-weight="700">把兩種運算接成 Transformer block</text>
<rect x="34" y="68" width="376" height="205" rx="13" fill="#fff" stroke="#9eb6df"/><text x="54" y="100" font-size="16" font-weight="700" fill="#315c9d">讀取其他點</text><text x="54" y="142" font-size="19">MHA(H)：多份加權摘要</text><text x="54" y="185" font-size="16">U = LN(H + MHA(H))</text><text x="54" y="235" font-size="13" fill="#606b7b">每個 head 的輸出都跟著 P 搬動</text>
<rect x="426" y="68" width="376" height="205" rx="13" fill="#fff" stroke="#daac5e"/><text x="446" y="100" font-size="16" font-weight="700" fill="#935d15">處理自己的 feature</text><text x="446" y="142" font-size="19">FFN(U)：各 row 共用 MLP</text><text x="446" y="185" font-size="16">F(H) = LN(U + FFN(U))</text><text x="446" y="235" font-size="13" fill="#606b7b">Residual、row-wise LN 也保留 F(PH)=PF(H)</text>
<text x="34" y="298" font-size="12" fill="#68768b">Geometric Deep Learning · Attention and Transformers</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 315" role="img" aria-labelledby="title desc">
<title id="title">語意換序，與儲存重排不是同一件事</title><desc id="desc">位置表固定，詞被放到新的位置；原來的資料，只換了存放順序</desc>
<rect width="840" height="315" rx="18" fill="#f7f8fb"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" fill="#24324a">
<text x="34" y="42" font-size="21" font-weight="700">語意換序，與儲存重排不是同一件事</text>
<rect x="34" y="68" width="376" height="205" rx="13" fill="#fff" stroke="#9eb6df"/><text x="54" y="100" font-size="16" font-weight="700" fill="#315c9d">只搬 content：意思可能改變</text><text x="54" y="142" font-size="19">PH + E</text><text x="54" y="185" font-size="16">我／喜歡／你 → 你／喜歡／我</text><text x="54" y="235" font-size="13" fill="#606b7b">位置表固定，詞被放到新的位置</text>
<rect x="426" y="68" width="376" height="205" rx="13" fill="#fff" stroke="#daac5e"/><text x="446" y="100" font-size="16" font-weight="700" fill="#935d15">content 與位置一起搬</text><text x="446" y="142" font-size="19">P(H + E) = PH + PE</text><text x="446" y="185" font-size="16">每個 token 保留原來的語意位置</text><text x="446" y="235" font-size="13" fill="#606b7b">原來的資料，只換了存放順序</text>
<text x="34" y="298" font-size="12" fill="#68768b">Geometric Deep Learning · Attention and Transformers</text>
</g></svg>

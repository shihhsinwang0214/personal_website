<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 315" role="img" aria-labelledby="title desc">
<title id="title">一個數字、一支箭頭，能用同一種 activation 嗎？</title><desc id="desc">Feature 型態決定運算限制：scalar 不變、vector 旋轉、方向 channel 重排；activation 要與各自 action 交換。</desc>

<text x="28" y="266" font-size="13" fill="#59616b">Feature 型態決定運算限制：scalar 不變、vector 旋轉、方向 chan</text>
<text x="28" y="284" font-size="13" fill="#59616b">nel 重排；activation 要與各自 action 交換。</text>

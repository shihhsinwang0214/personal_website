<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 315" role="img" aria-labelledby="title desc">
<title id="title">每個點一定要讀同一份摘要嗎？</title><desc id="desc">共享 local rule + global max；參考內容相同，權重可以不同</desc>
<rect width="840" height="315" rx="18" fill="#f7f8fb"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" fill="#24324a">
<text x="34" y="42" font-size="21" font-weight="700">每個點一定要讀同一份摘要嗎？</text>
<rect x="34" y="68" width="376" height="205" rx="13" fill="#fff" stroke="#9eb6df"/><text x="54" y="100" font-size="16" font-weight="700" fill="#315c9d">PointNet：共同摘要</text><text x="54" y="142" font-size="19">h₁, h₂, h₃  →  global z</text><text x="54" y="185" font-size="16">每個點都讀同一份 z</text><text x="54" y="235" font-size="13" fill="#606b7b">共享 local rule + global max</text>
<rect x="426" y="68" width="376" height="205" rx="13" fill="#fff" stroke="#daac5e"/><text x="446" y="100" font-size="16" font-weight="700" fill="#935d15">每個點：自己的參考需求</text><text x="446" y="142" font-size="19">y₁ = Σ a₁ⱼ vⱼ</text><text x="446" y="185" font-size="16">y₂ = Σ a₂ⱼ vⱼ</text><text x="446" y="235" font-size="13" fill="#606b7b">參考內容相同，權重可以不同</text>
<text x="34" y="298" font-size="12" fill="#68768b">Geometric Deep Learning · Attention and Transformers</text>
</g></svg>

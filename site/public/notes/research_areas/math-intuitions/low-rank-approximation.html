<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Low-Rank Approximation Demo</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: 'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif; background: transparent; color: #202631; }
  body[data-dark="1"] { color: #ece9e2; }
  .card { max-width: 780px; margin: 0 auto; padding: 18px; border-radius: 8px; background: #fbfaf7; border: 1px solid #ded8cf; }
  body[data-dark="1"] .card { background: #1f2126; border-color: #30323a; }
  .goal { margin: 0 0 12px; font-size: 0.92rem; line-height: 1.55; }
  .goal b { color: #1f6f78; } body[data-dark="1"] .goal b { color: #e1b45c; }
  canvas { width: 100%; max-width: 740px; aspect-ratio: 1 / 0.58; height: auto; display: block; margin: 0 auto; border-radius: 8px; }
  .controls { display: grid; gap: 10px; margin-top: 14px; }
  label { display: grid; gap: 4px; font-size: 0.82rem; font-weight: 800; }
  input[type=range] { width: 100%; accent-color: #1f6f78; }
  body[data-dark="1"] input[type=range] { accent-color: #e1b45c; }
  .readout { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: rgba(31,111,120,0.08); font-size: 0.84rem; font-variant-numeric: tabular-nums; }
  body[data-dark="1"] .readout { background: rgba(225,180,92,0.12); }
  .observe { margin: 12px 0 0; color: #667078; font-size: 0.83rem; line-height: 1.55; }
  body[data-dark="1"] .observe { color: #a8a69f; }
  @media (max-width: 560px) { body { padding: 10px; } .card { padding: 12px; } }
</style>
</head>
<body>
<div class="card">
  <p class="goal"><b>拖這個 → 看那個：</b>拖 k，只保留前 k 個 rank-one pieces，看重建圖和 error 怎麼變。</p>
  <canvas id="cv" width="740" height="430" aria-label="low rank reconstruction with a k slider"></canvas>
  <div class="controls">
    <label>k <input id="k" type="range" min="1" max="4" step="1" value="2" /></label>
  </div>
  <div class="readout" id="readout">relative error</div>
  <p class="observe">這個小圖由四個預先設定的 SVD-like pieces 組成；k 越大，丟掉的 energy 越少。</p>
</div>

<script src="../noise-to-data/_demo-common.js"></script>
<script>
(function(){
  var cv=document.getElementById('cv'),dpi=NDFlow.hiDPICanvas(cv),ctx=dpi.ctx,kEl=document.getElementById('k'),readout=document.getElementById('readout'),pal=NDFlow.palette();
  var n=8,sig=[6,3,1.5,0.8];
  function basis(kind){var v=[];for(var i=0;i<n;i++){var t=(i+0.5)/n*Math.PI;if(kind===0)v.push(1);else if(kind===1)v.push(Math.cos(t));else if(kind===2)v.push(Math.sin(2*t));else v.push(i<4?1:-1);}var norm=Math.sqrt(v.reduce(function(a,b){return a+b*b;},0));return v.map(function(x){return x/norm;});}
  var U=[basis(0),basis(1),basis(2),basis(3)], V=[basis(1),basis(0),basis(3),basis(2)];
  function make(k){var A=[];for(var r=0;r<n;r++){A[r]=[];for(var c=0;c<n;c++){var s=0;for(var m=0;m<k;m++)s+=sig[m]*U[m][r]*V[m][c];A[r][c]=s;}}return A;}
  var full=make(4), vals=full.flat(), mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function cellColor(v){var t=(v-mn)/(mx-mn);t=Math.max(0,Math.min(1,t));var g=Math.round(35+t*210);return 'rgb('+g+','+g+','+g+')';}
  function drawMatrix(A,left,top,size,title){ctx.fillStyle=pal.ink;ctx.font='800 13px Segoe UI, system-ui, sans-serif';ctx.fillText(title,left,top-10);var cell=size/n;for(var r=0;r<n;r++){for(var c=0;c<n;c++){ctx.fillStyle=cellColor(A[r][c]);ctx.fillRect(left+c*cell,top+r*cell,cell-1,cell-1);}}ctx.strokeStyle=pal.grid;ctx.strokeRect(left,top,size,size);}
  function draw(){var size=dpi.resize();pal=NDFlow.palette();var k=parseInt(kEl.value,10),rec=make(k);ctx.clearRect(0,0,size.w,size.h);ctx.fillStyle=pal.dark?'#111318':'#f8f6f0';rr(0,0,size.w,size.h,8);ctx.fill();var box=Math.min(size.h*0.58,size.w*0.33),top=size.h*0.27,left1=size.w*0.13,left2=size.w*0.55;drawMatrix(full,left1,top,box,'original A');drawMatrix(rec,left2,top,box,'rank-'+k+' Aₖ');var dropped=0,total=0;for(var i=0;i<sig.length;i++){total+=sig[i]*sig[i];if(i>=k)dropped+=sig[i]*sig[i];}readout.textContent='k='+k+'; relative Frobenius error '+Math.sqrt(dropped/total).toFixed(3)+'; dropped energy '+(dropped/total*100).toFixed(1)+'%';}
  function applyTheme(){pal=NDFlow.palette();document.body.dataset.dark=pal.dark?'1':'0';draw();}
  kEl.oninput=draw;window.addEventListener('resize',draw);NDFlow.onThemeChange(applyTheme);applyTheme();
})();
</script>
</body>
</html>

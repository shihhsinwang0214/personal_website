<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Euler 步數如何改變 trajectory 與終點</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: 'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background: transparent; color: #333; }
  body[data-dark="1"] { color: #e9e6e1; }
  .card { max-width: 700px; margin: 0 auto; padding: 20px; border-radius: 12px; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,.10); }
  body[data-dark="1"] .card { background: #1f2126; box-shadow: 0 4px 15px rgba(0,0,0,.28); }
  .goal { margin: 0 0 12px; font-size: .9rem; line-height: 1.55; }
  canvas { width: 100%; max-width: 560px; aspect-ratio: 6 / 5; height: auto; display: block; margin: 0 auto; border-radius: 8px; background: #111; box-shadow: inset 0 0 10px rgba(0,0,0,.5); touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  .cap { margin: 8px 0 0; text-align: center; color: #646c78; font-size: .75rem; line-height: 1.55; }
  body[data-dark="1"] .cap { color: #aaa69c; }
  .key { white-space: nowrap; }
  .swatch { display: inline-block; width: 18px; height: 3px; margin: 0 5px 2px 0; vertical-align: middle; border-radius: 2px; }
  .swatch.reference { background: #facc15; }
  .swatch.euler { background: #a78bfa; }
  .dot-swatch { display: inline-block; width: 7px; height: 7px; margin: 0 5px 1px 0; vertical-align: middle; border-radius: 50%; background: rgba(6,182,212,.72); }
  .controls { display: grid; gap: 10px; margin-top: 15px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; }
  label { font-size: .84rem; font-weight: 700; }
  select { padding: 7px 9px; border: 1px solid #ccc4b8; border-radius: 6px; background: transparent; color: inherit; font: inherit; font-size: .82rem; }
  body[data-dark="1"] select { border-color: #3a3b42; background: #25272d; }
  input[type="range"] { width: 290px; max-width: 58vw; accent-color: #0056b3; }
  input[type="checkbox"] { accent-color: #0056b3; }
  .check { display: inline-flex; align-items: center; gap: 5px; font-size: .82rem; font-weight: 600; }
  .value { min-width: 48px; font-size: .84rem; font-variant-numeric: tabular-nums; }
  .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; color: #646c78; font-size: .8rem; font-variant-numeric: tabular-nums; }
  body[data-dark="1"] .stats { color: #aaa69c; }
  .stats b { color: inherit; }
  .observe { margin: 12px 0 0; color: #646c78; font-size: .81rem; line-height: 1.6; }
  body[data-dark="1"] .observe { color: #aaa69c; }
  @media (max-width: 520px) {
    body { padding: 8px; }
    .card { padding: 13px; }
    input[type="range"] { max-width: 68vw; }
  }
</style>
</head>
<body>
<div class="card">
  <p class="goal">拖動黃色起點，再調整 Euler 步數。兩條路使用同一個 velocity field；差別只在於紫線沿途重新確認了幾次方向。</p>

  <canvas id="cv" width="720" height="600" aria-label="比較細切 reference trajectory 與不同步數的 Euler trajectory"></canvas>
  <p class="cap">
    <span class="key"><span class="swatch reference"></span>細切 reference trajectory</span>　
    <span class="key"><span class="swatch euler"></span>Euler trajectory（圓點＝每次詢問 velocity 的位置）</span>　
    <span class="key"><span class="dot-swatch"></span>initial distribution</span>
  </p>

  <div class="controls">
    <div class="row">
      <label for="shape">Target distribution</label>
      <select id="shape">
        <option value="smile" selected>Smile</option>
        <option value="spiral">漩渦（Spiral）</option>
        <option value="complex">一堆複雜的形狀</option>
        <option value="mrt">捷運站（3 Gaussians）</option>
      </select>
      <label class="check"><input id="show-source" type="checkbox" checked /> 顯示 initial distribution</label>
    </div>
    <div class="row">
      <label for="steps">Euler 步數</label>
      <input id="steps" type="range" min="1" max="10" step="1" value="4" />
      <b id="steps-value" class="value">4 步</b>
    </div>
    <div class="stats" aria-live="polite">
      <span>步長 h = <b id="step-size">0.250</b></span>
      <span>終點誤差 = <b id="endpoint-error">—</b></span>
    </div>
  </div>

  <p class="observe">步數少時，Euler 會沿著當下的箭頭一次走很遠，容易切過原本彎曲的路；步數增加後，它會更頻繁地重新確認方向，紫線便逐漸貼近黃色 trajectory。</p>
</div>

<script src="./_demo-common.js"></script>
<script>
(function () {
  'use strict';
  var TARGET_N = 420, SOURCE_N = 320, REFERENCE_STEPS = 1200;
  var SIGMA = 1.5, TARGET_SIGMA = 0.48, GRID_SPAN = 12;
  var centers = [
    { x: 0, y: 4.25, label: '市政府站' },
    { x: -3.55, y: -3.0, label: '101／世貿站' },
    { x: 3.55, y: -3.0, label: '象山站' }
  ];
  var cv = document.getElementById('cv');
  var display = NDFlow.hiDPICanvas(cv);
  var shapeEl = document.getElementById('shape');
  var showSourceEl = document.getElementById('show-source');
  var stepsEl = document.getElementById('steps');
  var stepsValue = document.getElementById('steps-value');
  var stepSizeValue = document.getElementById('step-size');
  var endpointErrorValue = document.getElementById('endpoint-error');
  var pal = NDFlow.palette();
  var targets = [], sources = NDFlow.sampleNoise(SOURCE_N, SIGMA);
  var start = [0.38, 0.22], referencePath = [], eulerPath = [];
  var dragging = false;

  function sampleTargets() {
    targets = [];
    for (var i = 0; i < TARGET_N; i++) {
      var x = 0, y = 0, angle, radius, u, c;
      if (shapeEl.value === 'spiral') {
        angle = 0.35 + Math.random() * 4.05 * Math.PI;
        radius = 0.28 + 0.32 * angle;
        x = radius * Math.cos(angle) + NDFlow.randn() * 0.10;
        y = radius * Math.sin(angle) * 0.92 + NDFlow.randn() * 0.10;
      } else if (shapeEl.value === 'smile') {
        u = Math.random();
        if (u < 0.50) {
          angle = Math.random() * Math.PI * 2;
          radius = 3.75 + NDFlow.randn() * 0.08;
          x = radius * Math.cos(angle);
          y = radius * Math.sin(angle);
        } else if (u < 0.66) {
          angle = Math.random() * Math.PI * 2;
          radius = 0.48 + NDFlow.randn() * 0.05;
          x = -1.25 + radius * Math.cos(angle);
          y = 1.25 + radius * Math.sin(angle);
        } else if (u < 0.78) {
          x = 0.65 + Math.random() * 1.35 + NDFlow.randn() * 0.05;
          y = 1.38 + 0.16 * Math.sin((x - 0.65) * Math.PI / 1.35) + NDFlow.randn() * 0.05;
        } else {
          angle = 0.12 * Math.PI + Math.random() * 0.76 * Math.PI;
          x = 2.25 * Math.cos(angle) + NDFlow.randn() * 0.07;
          y = -0.72 - 1.42 * Math.sin(angle) + NDFlow.randn() * 0.07;
        }
      } else if (shapeEl.value === 'complex') {
        var which = i % 4, segment, fraction, a0, a1, r0, r1;
        if (which === 0) {
          /* 左上：五角星外框 */
          segment = Math.floor(Math.random() * 10);
          fraction = Math.random();
          a0 = -Math.PI / 2 + segment * Math.PI / 5;
          a1 = -Math.PI / 2 + (segment + 1) * Math.PI / 5;
          r0 = segment % 2 === 0 ? 1.15 : 0.48;
          r1 = (segment + 1) % 2 === 0 ? 1.15 : 0.48;
          x = -2.55 + (1 - fraction) * r0 * Math.cos(a0) + fraction * r1 * Math.cos(a1);
          y = 1.85 + (1 - fraction) * r0 * Math.sin(a0) + fraction * r1 * Math.sin(a1);
        } else if (which === 1) {
          /* 右上：愛心外框 */
          angle = Math.random() * Math.PI * 2;
          x = 2.15 + 0.075 * 16 * Math.pow(Math.sin(angle), 3);
          y = 1.65 + 0.075 * (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
        } else if (which === 2) {
          /* 左下：閃電折線 */
          var bolt = [[-3.35,-0.45],[-2.05,-1.15],[-2.65,-1.35],[-1.35,-3.35],[-1.75,-2.05],[-0.95,-2.10]];
          segment = Math.floor(Math.random() * (bolt.length - 1));
          fraction = Math.random();
          x = bolt[segment][0] * (1 - fraction) + bolt[segment + 1][0] * fraction;
          y = bolt[segment][1] * (1 - fraction) + bolt[segment + 1][1] * fraction;
        } else {
          /* 右下：五瓣花曲線 */
          angle = Math.random() * Math.PI * 2;
          radius = 1.15 * Math.cos(5 * angle);
          x = 2.25 + radius * Math.cos(angle);
          y = -2.05 + radius * Math.sin(angle);
        }
        x += NDFlow.randn() * 0.045;
        y += NDFlow.randn() * 0.045;
      } else {
        c = centers[i % centers.length];
        x = c.x + NDFlow.randn() * TARGET_SIGMA;
        y = c.y + NDFlow.randn() * TARGET_SIGMA;
      }
      targets.push([x, y]);
    }
  }

  function posteriorMean(x, y, t) {
    var tau = Math.min(Math.max(t, 0), 0.999999);
    var remaining = 1 - tau;
    var variance = remaining * remaining * SIGMA * SIGMA;
    var minDistance = Infinity, i;
    for (i = 0; i < targets.length; i++) {
      var dx = x - tau * targets[i][0], dy = y - tau * targets[i][1];
      minDistance = Math.min(minDistance, dx * dx + dy * dy);
    }
    var weightSum = 0, expectedX = 0, expectedY = 0;
    for (i = 0; i < targets.length; i++) {
      var offsetX = x - tau * targets[i][0], offsetY = y - tau * targets[i][1];
      var distance = offsetX * offsetX + offsetY * offsetY;
      var weight = Math.exp(-(distance - minDistance) / (2 * variance));
      weightSum += weight;
      expectedX += weight * targets[i][0];
      expectedY += weight * targets[i][1];
    }
    return [expectedX / weightSum, expectedY / weightSum];
  }

  function field(x, y, t) {
    if (t >= 1 - 1e-10) return [x, y];
    var mean = posteriorMean(x, y, t), remaining = 1 - t;
    return [(mean[0] - x) / remaining, (mean[1] - y) / remaining];
  }

  function rk4Step(x, y, t, dt) {
    var k1 = field(x, y, t);
    var k2 = field(x + 0.5 * dt * k1[0], y + 0.5 * dt * k1[1], t + 0.5 * dt);
    var k3 = field(x + 0.5 * dt * k2[0], y + 0.5 * dt * k2[1], t + 0.5 * dt);
    var k4 = field(x + dt * k3[0], y + dt * k3[1], t + dt);
    return [
      x + dt * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]) / 6,
      y + dt * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]) / 6
    ];
  }

  function integrateReference(point) {
    var dt = 1 / REFERENCE_STEPS, x = point[0], y = point[1], path = [[x, y]];
    for (var k = 0; k < REFERENCE_STEPS; k++) {
      var next = rk4Step(x, y, k * dt, dt);
      x = next[0]; y = next[1]; path.push([x, y]);
    }
    return path;
  }

  function integrateEuler(point, steps) {
    var dt = 1 / steps, x = point[0], y = point[1], path = [[x, y]];
    for (var k = 0; k < steps; k++) {
      var velocity = field(x, y, k * dt);
      x += dt * velocity[0]; y += dt * velocity[1]; path.push([x, y]);
    }
    return path;
  }

  function recompute() {
    var steps = parseInt(stepsEl.value, 10);
    referencePath = integrateReference(start);
    eulerPath = integrateEuler(start, steps);
    var refEnd = referencePath[referencePath.length - 1];
    var eulerEnd = eulerPath[eulerPath.length - 1];
    var error = Math.hypot(refEnd[0] - eulerEnd[0], refEnd[1] - eulerEnd[1]);
    stepsValue.textContent = steps + ' 步';
    stepSizeValue.textContent = (1 / steps).toFixed(3);
    endpointErrorValue.textContent = error.toFixed(3);
    window.__eulerTrajectoryDemo = {
      steps: steps, start: start.slice(), referenceEndpoint: refEnd.slice(),
      eulerEndpoint: eulerEnd.slice(), endpointError: error,
      targetUsesEmpiricalSamples: true, sourceUsesAnalyticGaussian: true, sourceStd: SIGMA
    };
    draw();
  }

  function transform(size) {
    var scale = Math.min(size.w, size.h) / GRID_SPAN;
    return {
      x: function (v) { return size.w / 2 + v * scale; },
      y: function (v) { return size.h / 2 - v * scale; },
      invX: function (v) { return (v - size.w / 2) / scale; },
      invY: function (v) { return (size.h / 2 - v) / scale; }
    };
  }

  function drawGrid(ctx, size, tr) {
    ctx.strokeStyle = 'rgba(255,255,255,.055)'; ctx.lineWidth = 1;
    for (var g = -5; g <= 5; g++) {
      ctx.beginPath(); ctx.moveTo(tr.x(g), 0); ctx.lineTo(tr.x(g), size.h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, tr.y(g)); ctx.lineTo(size.w, tr.y(g)); ctx.stroke();
    }
  }

  function drawSources(ctx, tr) {
    ctx.fillStyle = 'rgba(6,182,212,.24)';
    for (var i = 0; i < sources.length; i++) {
      ctx.beginPath();
      ctx.arc(tr.x(sources[i][0]), tr.y(sources[i][1]), 2.1, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawTargets(ctx, tr) {
    ctx.fillStyle = 'rgba(234,88,12,.30)';
    for (var i = 0; i < targets.length; i++) {
      ctx.beginPath(); ctx.arc(tr.x(targets[i][0]), tr.y(targets[i][1]), 2.15, 0, Math.PI * 2); ctx.fill();
    }
    if (shapeEl.value === 'mrt') {
      ctx.font = '700 12px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(251,146,60,.90)';
      for (var j = 0; j < centers.length; j++) {
        var offset = centers[j].y > 0 ? -33 : 38;
        ctx.fillText(centers[j].label, tr.x(centers[j].x), tr.y(centers[j].y) + offset);
      }
    }
  }

  function drawPath(ctx, tr, path, color, width) {
    if (path.length < 2) return;
    ctx.beginPath(); ctx.moveTo(tr.x(path[0][0]), tr.y(path[0][1]));
    for (var i = 1; i < path.length; i++) ctx.lineTo(tr.x(path[i][0]), tr.y(path[i][1]));
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  }

  function draw() {
    var size = display.resize(), ctx = display.ctx, tr = transform(size);
    ctx.clearRect(0, 0, size.w, size.h); ctx.fillStyle = '#111'; ctx.fillRect(0, 0, size.w, size.h);
    drawGrid(ctx, size, tr);
    if (showSourceEl.checked) drawSources(ctx, tr);
    drawTargets(ctx, tr);
    drawPath(ctx, tr, referencePath, 'rgba(250,204,21,.88)', 2.6);
    drawPath(ctx, tr, eulerPath, 'rgba(167,139,250,.98)', 2.6);

    for (var i = 1; i < eulerPath.length - 1; i++) {
      ctx.beginPath(); ctx.arc(tr.x(eulerPath[i][0]), tr.y(eulerPath[i][1]), 3.4, 0, Math.PI * 2);
      ctx.fillStyle = '#a78bfa'; ctx.fill(); ctx.strokeStyle = '#ede9fe'; ctx.lineWidth = 1; ctx.stroke();
    }

    var refEnd = referencePath[referencePath.length - 1];
    var eulerEnd = eulerPath[eulerPath.length - 1];
    ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(248,113,113,.88)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(tr.x(refEnd[0]), tr.y(refEnd[1])); ctx.lineTo(tr.x(eulerEnd[0]), tr.y(eulerEnd[1])); ctx.stroke(); ctx.restore();

    ctx.beginPath(); ctx.arc(tr.x(refEnd[0]), tr.y(refEnd[1]), 5, 0, Math.PI * 2); ctx.fillStyle = '#facc15'; ctx.fill();
    ctx.beginPath(); ctx.rect(tr.x(eulerEnd[0]) - 4.5, tr.y(eulerEnd[1]) - 4.5, 9, 9); ctx.fillStyle = '#a78bfa'; ctx.fill();

    ctx.beginPath(); ctx.arc(tr.x(start[0]), tr.y(start[1]), 6.4, 0, Math.PI * 2);
    ctx.fillStyle = '#facc15'; ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(250,204,21,.78)'; ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff4b0'; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.font = '700 11px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#facc15';
    ctx.fillText('拖動起點', tr.x(start[0]) + 10, tr.y(start[1]) - 10);
  }

  function pointerState(event) {
    var rect = cv.getBoundingClientRect();
    var size = { w: rect.width, h: rect.height };
    var tr = transform(size);
    var sx = event.clientX - rect.left;
    var sy = event.clientY - rect.top;
    return { sx: sx, sy: sy, x: tr.invX(sx), y: tr.invY(sy), tr: tr };
  }

  function beginDrag(event) {
    var state = pointerState(event);
    var distance = Math.hypot(state.sx - state.tr.x(start[0]), state.sy - state.tr.y(start[1]));
    if (distance > 28) return;
    dragging = true; cv.classList.add('dragging'); cv.setPointerCapture(event.pointerId);
  }
  function moveDrag(event) {
    if (!dragging) return;
    var state = pointerState(event);
    start = [Math.max(-5.5, Math.min(5.5, state.x)), Math.max(-5.5, Math.min(5.5, state.y))];
    recompute();
  }
  function endDrag(event) {
    if (!dragging) return;
    dragging = false; cv.classList.remove('dragging');
    if (cv.hasPointerCapture(event.pointerId)) cv.releasePointerCapture(event.pointerId);
  }
  function applyTheme() {
    pal = NDFlow.palette(); document.body.dataset.dark = pal.dark ? '1' : '0'; draw();
  }

  stepsEl.addEventListener('input', recompute);
  shapeEl.addEventListener('change', function () { sampleTargets(); recompute(); });
  showSourceEl.addEventListener('change', draw);
  cv.addEventListener('pointerdown', beginDrag);
  cv.addEventListener('pointermove', moveDrag);
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  window.addEventListener('resize', draw);
  NDFlow.onThemeChange(applyTheme);
  sampleTargets(); recompute(); applyTheme();
})();
</script>
</body>
</html>

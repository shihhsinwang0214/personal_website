<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>速度場遊樂場</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: 'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif; background: transparent; color: #1f2733; }
  body[data-dark="1"] { color: #e9e6e1; }
  .card { max-width: 640px; margin: 0 auto; padding: 18px; border-radius: 14px; background: #fffdfb; border: 1px solid #e7e0d6; }
  body[data-dark="1"] .card { background: #1f2126; border-color: #2c2d31; }
  .goal { font-size: 0.9rem; line-height: 1.55; margin: 0 0 12px; }
  .goal b { color: #2a4ea3; } body[data-dark="1"] .goal b { color: #d8a44a; }
  canvas { width: 100%; max-width: 440px; aspect-ratio: 1/1; height: auto; display: block; margin: 0 auto; border-radius: 10px; }
  .cap { text-align: center; font-size: 0.72rem; line-height: 1.5; color: #646c78; margin: 6px 0 0; }
  body[data-dark="1"] .cap { color: #9a988f; }
  .controls { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: center; }
  label { font-size: 0.82rem; font-weight: 600; }
  select { padding: 6px 10px; border-radius: 8px; border: 1px solid #ccc4b8; background: #fff; color: inherit; font: inherit; }
  body[data-dark="1"] select { background: #262830; border-color: #3a3b42; color: #e9e6e1; }
  input[type=range] { width: 200px; max-width: 55vw; accent-color: #2a4ea3; }
  body[data-dark="1"] input[type=range] { accent-color: #d8a44a; }
  button { padding: 7px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; background: #2a4ea3; color: #fff; }
  body[data-dark="1"] button { background: #d8a44a; color: #1f2126; }
  button.ghost { background: transparent; color: inherit; border: 1px solid #ccc4b8; }
  body[data-dark="1"] button.ghost { border-color: #3a3b42; }
  .stats { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; font-size: 0.78rem; font-variant-numeric: tabular-nums; }
  .observe { font-size: 0.82rem; line-height: 1.6; margin: 14px 0 0; color: #646c78; }
  body[data-dark="1"] .observe { color: #9a988f; }
  .observe b { color: #1f2733; } body[data-dark="1"] .observe b { color: #e9e6e1; }
</style>
</head>
<body>
<div class="card">
  <p class="goal">學習目標：<b>粒子在動 ≠ 分布在變</b>。速度場推動每一顆粒子，但整團雲會不會變形，是另一回事——continuity equation 講的就是這件事。</p>

  <canvas id="cv" width="560" height="560" aria-label="速度場與粒子"></canvas>
  <p class="cap">灰點＝起點 p₀ 的位置（不動，用來比較）　實心＝目前 t 的粒子　細線＝兩條被標出來的軌跡　箭頭＝速度場</p>

  <div class="controls">
    <div class="row">
      <label for="field">速度場</label>
      <select id="field">
        <option value="rot">旋轉（分布完全不變）</option>
        <option value="shrink">往中心收縮</option>
        <option value="saddle">鞍點</option>
        <option value="moons">推到雙月（用資料估的邊際速度場）</option>
      </select>
    </div>
    <div class="row">
      <label for="t">時間 t</label>
      <input id="t" type="range" min="0" max="80" step="1" value="0" />
      <b id="vt">0.00</b>
      <button id="play">▶ 播放一次</button>
      <button id="reroll" class="ghost">重抽粒子</button>
    </div>
    <div class="stats">
      <span>平均 |x|² = <b id="vm">—</b>（p₀ 時是 2.00）</span>
    </div>
  </div>

  <p class="observe">先看「旋轉」：每一顆粒子都在跑、軌跡是一圈一圈的，但灰點與實心點<b>始終重合</b>，右下的平均 |x|² 也完全不動——高斯是旋轉對稱的，所以這個場推得動粒子、推不動分布。換成「收縮」或「鞍點」，分布馬上開始變形；「推到雙月」則是我們真正想要的那種場。</p>
</div>

<script src="./_demo-common.js"></script>
<script>
(function () {
  var N = 420, STEPS = 80, KTRAJ = 2, SPAN = 6.2, G = 13, PAIRS = 200;
  var cv = document.getElementById('cv');
  var d = NDFlow.hiDPICanvas(cv);
  var fieldSel = document.getElementById('field'), tEl = document.getElementById('t');
  var vt = document.getElementById('vt'), vm = document.getElementById('vm');
  var pal = NDFlow.palette();
  var start = [], traj = [], a = [], b = [];

  function rebuildParticles() {
    start = NDFlow.sampleNoise(N, 1);
    a = NDFlow.sampleNoise(PAIRS, 1);
    b = NDFlow.sampleTarget('two_moons', PAIRS);
  }

  // 邊際速度場（kernel 估計 E[b-a | x_t = x]）
  function moonsField(x, y, t) {
    var h2 = 2 * 0.20 * 0.20, sw = 0, ux = 0, uy = 0, mx = -Infinity, i, ls = [];
    for (i = 0; i < PAIRS; i++) {
      var px = (1 - t) * a[i][0] + t * b[i][0], py = (1 - t) * a[i][1] + t * b[i][1];
      var l = -((x - px) * (x - px) + (y - py) * (y - py)) / h2;
      ls.push(l); if (l > mx) mx = l;
    }
    for (i = 0; i < PAIRS; i++) { var w = Math.exp(ls[i] - mx); sw += w; ux += w * (b[i][0] - a[i][0]); uy += w * (b[i][1] - a[i][1]); }
    return [ux / sw, uy / sw];
  }
  function field(x, y, t) {
    switch (fieldSel.value) {
      case 'rot':    return [-1.6 * y, 1.6 * x];
      case 'shrink': return [-1.0 * x, -1.0 * y];
      case 'saddle': return [0.9 * x, -0.9 * y];
      default:       return moonsField(x, y, t);
    }
  }

  function integrate() {
    var dt = 1 / STEPS;
    traj = [];
    for (var i = 0; i < N; i++) {
      var x = start[i][0], y = start[i][1], path = [[x, y]];
      for (var k = 0; k < STEPS; k++) {
        var u = field(x, y, k * dt);
        x += u[0] * dt; y += u[1] * dt;
        path.push([x, y]);
      }
      traj.push(path);
    }
  }

  function T2(s) {
    var k = Math.min(s.w, s.h) / SPAN;
    return { k: k, x: function (v) { return s.w / 2 + v * k; }, y: function (v) { return s.h / 2 - v * k; } };
  }
  function arrow(ctx, ax, ay, bx, by, color, wid) {
    var dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy);
    if (L < 1.2) return;
    ctx.strokeStyle = color; ctx.lineWidth = wid; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    var ah = Math.min(6, L * 0.5), an = Math.atan2(dy, dx);
    ctx.beginPath(); ctx.moveTo(bx, by);
    ctx.lineTo(bx - ah * Math.cos(an - 0.45), by - ah * Math.sin(an - 0.45));
    ctx.lineTo(bx - ah * Math.cos(an + 0.45), by - ah * Math.sin(an + 0.45));
    ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  }

  function draw() {
    var s = d.resize(), ctx = d.ctx, tr = T2(s), idx = parseInt(tEl.value, 10), t = idx / STEPS, i;
    ctx.clearRect(0, 0, s.w, s.h);
    ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, s.w, s.h);

    // 速度場箭頭
    var lo = -SPAN / 2 + SPAN / (2 * G), step = SPAN / G, cell = step * tr.k, maxn = 1e-9, cells = [];
    for (var gy = 0; gy < G; gy++) for (var gx = 0; gx < G; gx++) {
      var wx = lo + gx * step, wy = lo + gy * step, u = field(wx, wy, t), n = Math.hypot(u[0], u[1]);
      if (n > maxn) maxn = n;
      cells.push([wx, wy, u, n]);
    }
    cells.forEach(function (c) {
      var r = Math.pow(c[3] / maxn, 0.6) * cell * 0.42, ux = c[2][0] / (c[3] || 1), uy = c[2][1] / (c[3] || 1);
      arrow(ctx, tr.x(c[0]), tr.y(c[1]), tr.x(c[0]) + ux * r, tr.y(c[1]) - uy * r, 'rgba(96,186,130,0.5)', 1.2);
    });

    // 起點雲（灰）
    ctx.fillStyle = pal.dark ? 'rgba(200,200,200,0.28)' : 'rgba(255,255,255,0.28)';
    for (i = 0; i < N; i++) { ctx.beginPath(); ctx.arc(tr.x(start[i][0]), tr.y(start[i][1]), 1.5, 0, 6.284); ctx.fill(); }

    // 目前粒子
    var col = NDFlow.lerpColor(pal.noise, pal.data, t).match(/\d+/g), m2 = 0;
    ctx.fillStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0.9)';
    for (i = 0; i < N; i++) {
      var p = traj[i][idx];
      m2 += (p[0] * p[0] + p[1] * p[1]) / N;
      ctx.beginPath(); ctx.arc(tr.x(p[0]), tr.y(p[1]), 2.0, 0, 6.284); ctx.fill();
    }

    // 兩條軌跡
    ctx.strokeStyle = pal.accent; ctx.lineWidth = 1.6;
    for (i = 0; i < KTRAJ; i++) {
      ctx.beginPath();
      for (var k = 0; k <= idx; k++) {
        var q = traj[i][k];
        if (k === 0) ctx.moveTo(tr.x(q[0]), tr.y(q[1])); else ctx.lineTo(tr.x(q[0]), tr.y(q[1]));
      }
      ctx.stroke();
    }

    ctx.font = '600 12px "Plus Jakarta Sans", system-ui, sans-serif';
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0.95)';
    ctx.fillText('t = ' + t.toFixed(2), 12, s.h - 12);
    vt.textContent = t.toFixed(2);
    vm.textContent = m2.toFixed(2);
  }

  var raf = null;
  function play() {
    if (raf) cancelAnimationFrame(raf);
    var t0 = performance.now(), dur = 3200;
    function step(now) {
      var f = Math.min(1, (now - t0) / dur);
      tEl.value = Math.round(f * STEPS); draw();
      if (f < 1) raf = requestAnimationFrame(step); else raf = null;
    }
    raf = requestAnimationFrame(step);
  }
  function stop() { if (raf) { cancelAnimationFrame(raf); raf = null; } }
  function reload() { stop(); integrate(); tEl.value = 0; draw(); }
  function applyTheme() { pal = NDFlow.palette(); document.body.dataset.dark = pal.dark ? '1' : '0'; draw(); }

  fieldSel.onchange = reload;
  tEl.oninput = function () { stop(); draw(); };
  document.getElementById('play').onclick = play;
  document.getElementById('reroll').onclick = function () { rebuildParticles(); reload(); };
  window.addEventListener('resize', draw);
  NDFlow.onThemeChange(applyTheme);
  rebuildParticles(); integrate(); applyTheme();
})();
</script></body></html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>太多 G，還是自己定路徑</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: 'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif; background: transparent; color: #1f2733; }
  body[data-dark="1"] { color: #e9e6e1; }
  .card { max-width: 640px; margin: 0 auto; padding: 18px; border-radius: 14px; background: #fffdfb; border: 1px solid #e7e0d6; }
  body[data-dark="1"] .card { background: #1f2126; border-color: #2c2d31; }
  .goal { font-size: 0.9rem; line-height: 1.55; margin: 0 0 12px; }
  .goal b { color: #2a4ea3; } body[data-dark="1"] .goal b { color: #d8a44a; }
  canvas { width: 100%; max-width: 560px; aspect-ratio: 1/1; height: auto; display: block; margin: 0 auto; border-radius: 10px; }
  .cap { text-align: center; font-size: 0.72rem; color: #646c78; margin: 6px 0 0; }
  body[data-dark="1"] .cap { color: #9a988f; }
  .controls { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: center; }
  label { font-size: 0.82rem; font-weight: 600; }
  select { padding: 6px 10px; border-radius: 8px; border: 1px solid #ccc4b8; background: #fff; color: inherit; font: inherit; }
  body[data-dark="1"] select { background: #262830; border-color: #3a3b42; color: #e9e6e1; }
  input[type=range] { width: 220px; max-width: 60vw; accent-color: #2a4ea3; }
  body[data-dark="1"] input[type=range] { accent-color: #d8a44a; }
  button { padding: 7px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; background: #2a4ea3; color: #fff; }
  body[data-dark="1"] button { background: #d8a44a; color: #1f2126; }
  button.ghost { background: transparent; color: inherit; border: 1px solid #ccc4b8; }
  body[data-dark="1"] button.ghost { border-color: #3a3b42; }
  .readout { font-variant-numeric: tabular-nums; min-width: 3.2em; font-weight: 700; }
  .observe { font-size: 0.82rem; line-height: 1.6; margin: 14px 0 0; color: #646c78; }
  body[data-dark="1"] .observe { color: #9a988f; }
  .observe b { color: #1f2733; } body[data-dark="1"] .observe b { color: #e9e6e1; }
</style>
</head>
<body>
<div class="card">
  <p class="goal">學習目標：把 <b>N(0,I)</b> 搬成 <b>p<sub>data</sub></b> 的 G 有無限多個。換一組配對，<b>兩端的雲完全不變</b>，只有「哪一顆對到哪一顆」和中間長什麼樣子不一樣。</p>

  <canvas id="cv" width="560" height="560" aria-label="不同配對把高斯搬成目標分布"></canvas>
  <p class="cap">淡藍＝N(0,I) 的樣本　淡橘＝p<sub>data</sub> 的樣本　實心＝目前 t 的 x<sub>t</sub>　細線＝指定好的路徑</p>

  <div class="controls">
    <div class="row">
      <label for="shape">目標 p<sub>data</sub></label>
      <select id="shape">
        <option value="two_moons">雙月 Two moons</option>
        <option value="two_gaussians">雙峰 Two gaussians</option>
        <option value="ring">環形 Ring</option>
        <option value="swiss_roll">螺旋 Swiss roll</option>
      </select>
      <label for="path">路徑形狀</label>
      <select id="path">
        <option value="straight">直線</option>
        <option value="noisy">逐步加噪的曲線</option>
      </select>
    </div>
    <div class="row">
      <label for="t">時間 t</label>
      <input id="t" type="range" min="0" max="1" step="0.005" value="0.45" />
      <span id="tR" class="readout">0.45</span>
    </div>
    <div class="row">
      <button id="play">▶ 播放</button>
      <button id="resample" class="ghost">🎲 換一組配對</button>
    </div>
  </div>

  <p class="observe">把 t 停在中間，然後按「換一組配對」：<b>兩端的雲完全沒變</b>，變的只有中間那團 x<sub>t</sub> 和每顆點走的路。</p>
</div>

<script src="./_demo-common.js"></script>
<script>
(function () {
  var N = 550, K = 14, SPAN = 5.6;
  var cv = document.getElementById('cv');
  var d = NDFlow.hiDPICanvas(cv);
  var shapeSel = document.getElementById('shape'), pathSel = document.getElementById('path');
  var tEl = document.getElementById('t'), tR = document.getElementById('tR');
  var pal = NDFlow.palette();
  var x0 = [], x1 = [], perm = [], jitter = [], pick = [];

  function shuffled(n) {
    var a = []; for (var i = 0; i < n; i++) a.push(i);
    for (var j = n - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)); var t = a[j]; a[j] = a[k]; a[k] = t; }
    return a;
  }

  function rebuild(keepPoints) {
    if (!keepPoints) x0 = NDFlow.sampleNoise(N, 0.85);
    x1 = NDFlow.sampleTarget(shapeSel.value, N);
    perm = shuffled(N);
    if (!keepPoints || pick.length === 0) pick = shuffled(N).slice(0, K);
    if (jitter.length !== N) {
      jitter = [];
      for (var m = 0; m < N; m++) jitter.push([NDFlow.randn(), NDFlow.randn()]);
    }
  }

  function T(s) {
    var k = Math.min(s.w, s.h) / SPAN;
    return { x: function (v) { return s.w / 2 + v * k; }, y: function (v) { return s.h / 2 - v * k; } };
  }
  function endpoint(i) { return x1[perm[i]]; }
  function pos(i, t) {
    var a = x0[i], b = endpoint(i);
    var x = (1 - t) * a[0] + t * b[0], y = (1 - t) * a[1] + t * b[1];
    if (pathSel.value === 'noisy') {
      var amp = 0.5 * Math.sin(Math.PI * t);
      x += jitter[i][0] * amp; y += jitter[i][1] * amp;
    }
    return [x, y];
  }

  function dots(ctx, tr, pts, rgb, alpha, r) {
    ctx.fillStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + alpha + ')';
    for (var i = 0; i < pts.length; i++) {
      ctx.beginPath(); ctx.arc(tr.x(pts[i][0]), tr.y(pts[i][1]), r, 0, 6.284); ctx.fill();
    }
  }

  var COL = [96, 186, 130];

  function draw() {
    var s = d.resize(), ctx = d.ctx, tr = T(s);
    ctx.clearRect(0, 0, s.w, s.h);
    ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, s.w, s.h);
    var t = parseFloat(tEl.value);

    // 兩端的雲（永遠不變）
    dots(ctx, tr, x0, pal.noise, 0.22, 1.3);
    dots(ctx, tr, x1, pal.data, 0.22, 1.3);

    // 指定好的路徑
    ctx.strokeStyle = 'rgba(' + COL[0] + ',' + COL[1] + ',' + COL[2] + ',0.45)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (var n = 0; n < pick.length; n++) {
      var i = pick[n]; ctx.beginPath();
      for (var k = 0; k <= 24; k++) {
        var p = pos(i, k / 24);
        if (k === 0) ctx.moveTo(tr.x(p[0]), tr.y(p[1])); else ctx.lineTo(tr.x(p[0]), tr.y(p[1]));
      }
      ctx.stroke();
    }

    // 目前的中間分布 x_t
    var now = [];
    for (var m = 0; m < N; m++) now.push(pos(m, t));
    var col = NDFlow.lerpColor(pal.noise, pal.data, t).match(/\d+/g);
    dots(ctx, tr, now, col, 0.95, 2.1);

    ctx.font = '600 12px "Plus Jakarta Sans", system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0.95)';
    ctx.fillText('t = ' + t.toFixed(2), 12, s.h - 12);
    tR.textContent = t.toFixed(2);
  }

  var raf = null, FULL = 1400, playBtn = document.getElementById('play');

  function play() {
    if (raf) { stop(); return; }                 // 正在播的時候再按一次就停
    var t0 = parseFloat(tEl.value);
    if (t0 >= 0.995) t0 = 0;                     // 只有已經走到底才從頭開始
    var start = performance.now();
    tEl.value = t0; draw();                      // 第一格同步畫掉，不等下一個 rAF
    playBtn.textContent = '⏸ 暫停';
    function step(now) {
      var t = Math.min(1, t0 + (now - start) / FULL);
      tEl.value = t; draw();
      if (t < 1) raf = requestAnimationFrame(step); else stop();
    }
    raf = requestAnimationFrame(step);
  }
  function stop() {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    playBtn.textContent = '▶ 播放';
  }
  function applyTheme() { pal = NDFlow.palette(); document.body.dataset.dark = pal.dark ? '1' : '0'; draw(); }

  shapeSel.onchange = function () { stop(); rebuild(true); draw(); };
  pathSel.onchange = function () { stop(); draw(); };
  tEl.oninput = function () { stop(); draw(); };
  playBtn.onclick = play;
  document.getElementById('resample').onclick = function () { stop(); perm = shuffled(N); draw(); };
  window.addEventListener('resize', draw);
  NDFlow.onThemeChange(applyTheme);
  rebuild(false); applyTheme();
})();
</script>
</body>
</html>

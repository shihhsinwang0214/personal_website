<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progressive distillation：逐輪減半</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:16px;font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:#1f2733;background:transparent}body[data-dark="1"]{color:#e9e6e1}.card{max-width:780px;margin:auto;padding:18px;border:1px solid #e7e0d6;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#36383e}.goal,.note{font-size:.86rem;line-height:1.6;margin:0 0 12px}.goal b,.stats b{color:#2a4ea3}body[data-dark="1"] .goal b,body[data-dark="1"] .stats b{color:#d8a44a}canvas{width:100%;aspect-ratio:16/9;display:block;border-radius:10px}.row,.stats{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:.78rem}.row input[type=range]{flex:1;min-width:170px}.row label{font-weight:700}.stats{gap:18px}.note{color:#646c78;margin-top:12px}body[data-dark="1"] .note{color:#aaa79f}
</style></head><body><div class="card"><p class="goal">每一輪學生把老師的<b>兩小步合成一大步</b>。理想學生只是隔點連線；實際學生 surrogate 會在每輪加入可見的小逼近誤差。</p><canvas id="cv" width="740" height="416" aria-label="progressive distillation 逐輪減半"></canvas><div class="row"><label>輪次 k=<span id="kv"></span>（<span id="nv"></span> 步）</label><input id="k" type="range" min="0" max="5" step="1" value="3"><label><input id="actual" type="checkbox"> 實際學生 surrogate</label><label><input id="reflow" type="checkbox"> 疊上 reflow×2 一步</label></div><div class="stats"><span>本輪新增誤差 <b id="round">—</b></span><span>累積終點誤差 <b id="total">—</b></span></div><p class="note">灰線是解析真實軌跡；彩色折線是當前學生。surrogate 只用來展示「每輪誤差會留給下一輪」，不代表載入真實 checkpoint。</p></div><script src="../_demo-common.js"></script><script>
(function(){var cv=document.getElementById('cv'),D=NDFlow.hiDPICanvas(cv),pal=NDFlow.palette(),M=6;function el(x){return document.getElementById(x)}function P(i,t){var a=-1.8+i*.72,b=(i%2?.9:-.9),tx=-1.6+i*.62,ty=.85*Math.sin((i+.7)*1.3);return[a*(1-t)+tx*t+.5*Math.sin(Math.PI*t)*Math.cos(i),b*(1-t)+ty*t+.42*Math.sin(Math.PI*t)*Math.sin(i*1.2)]}function draw(){var z=D.resize(),c=D.ctx,w=z.w,h=z.h,k=+el('k').value,N=32>>k,actual=el('actual').checked,reflow=el('reflow').checked,left=w*.73,sc=Math.min(left/5,h/4),X=x=>left/2+x*sc,Y=y=>h/2-y*sc*.8;c.clearRect(0,0,w,h);c.fillStyle=pal.bg;c.fillRect(0,0,w,h);for(var i=0;i<M;i++){c.strokeStyle='rgba(155,160,170,.28)';c.lineWidth=2;c.beginPath();for(var j=0;j<=80;j++){var p=P(i,j/80);j?c.lineTo(X(p[0]),Y(p[1])):c.moveTo(X(p[0]),Y(p[1]))}c.stroke();var hue=['#4a90e2','#f0803c','#60ba82','#b36cd9','#d8a44a','#66b9c7'][i],err=actual?.018*Math.pow(1.8,k):0;c.strokeStyle=hue;c.lineWidth=2.5;c.beginPath();for(j=0;j<=N;j++){var t=j/N,p=P(i,t),wig=j&&j<N?err*Math.sin(j*2.1+i):0,xx=p[0]+wig,yy=p[1]+err*Math.cos(j*1.7+i);j?c.lineTo(X(xx),Y(yy)):c.moveTo(X(xx),Y(yy))}c.stroke();p=P(i,1);c.fillStyle=hue;dot(c,X(p[0]+(actual?err*Math.sin(N*2.1+i):0)),Y(p[1]+(actual?err*Math.cos(N*1.7+i):0)),4);if(reflow){var s=P(i,0),e=P(i,1);c.setLineDash([5,4]);c.strokeStyle='rgba(216,164,74,.7)';c.beginPath();c.moveTo(X(s[0]),Y(s[1]));c.lineTo(X(e[0]),Y(e[1]));c.stroke();c.setLineDash([])}}c.strokeStyle='rgba(160,165,175,.25)';c.beginPath();c.moveTo(left+8,22);c.lineTo(left+8,h-24);c.stroke();c.font='12px system-ui';c.textAlign='center';c.fillStyle=pal.muted;c.fillText('每輪誤差',left+(w-left)/2,25);var max=.018*Math.pow(1.8,5);for(i=0;i<6;i++){var e0=actual?.018*Math.pow(1.8,i):0,bh=e0/max*(h-90),bw=(w-left-28)/6;c.fillStyle=i===k?pal.accent:'rgba(96,186,130,.55)';c.fillRect(left+18+i*bw,h-45-bh,bw-7,bh);c.fillStyle=pal.muted;c.fillText(String(i),left+18+i*bw+(bw-7)/2,h-27)}var rr=actual?.018*Math.pow(1.8,k):0,sum=actual?.018*(Math.pow(1.8,k+1)-1)/.8:0;el('kv').textContent=k;el('nv').textContent=N;el('round').textContent=rr.toFixed(3);el('total').textContent=sum.toFixed(3)}function dot(c,x,y,r){c.beginPath();c.arc(x,y,r,0,6.284);c.fill()}['k','actual','reflow'].forEach(x=>el(x).oninput=draw);window.addEventListener('resize',draw);function theme(){pal=NDFlow.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}NDFlow.onThemeChange(theme);theme()})();
</script></body></html>

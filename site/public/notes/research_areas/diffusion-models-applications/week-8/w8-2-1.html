<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consistency function：沿軌跡輸出不動</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:16px;font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:#1f2733;background:transparent}body[data-dark="1"]{color:#e9e6e1}.card{max-width:800px;margin:auto;padding:18px;border:1px solid #e7e0d6;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#36383e}.goal,.note{font-size:.86rem;line-height:1.6;margin:0 0 12px}.goal b,.stats b{color:#2a4ea3}body[data-dark="1"] .goal b,body[data-dark="1"] .stats b{color:#d8a44a}canvas{width:100%;aspect-ratio:16/9;display:block;border-radius:10px}.row,.stats{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:.78rem}.row input[type=range]{flex:1;min-width:160px}button{padding:6px 10px;border:1px solid #bbb4aa;border-radius:8px;background:transparent;color:inherit;cursor:pointer}button.on{background:#2a4ea3;color:#fff;border-color:#2a4ea3}body[data-dark="1"] button.on{background:#d8a44a;color:#1f2126}.note{color:#646c78;margin-top:12px}body[data-dark="1"] .note{color:#aaa79f}
</style></head><body><div class="card"><p class="goal">沿同一條解析軌跡改變 t，<b>consistency function 的終點答案應保持不動</b>。點畫布可換一條軌跡。</p><canvas id="cv" width="760" height="428" aria-label="沿軌跡拖動 consistency function"></canvas><div class="row"><label>t=<span id="tv"></span></label><input id="t" type="range" min=".01" max="1" step=".01" value=".72"><button data-state="init">未訓練 surrogate</button><button data-state="mid">訓練中 surrogate</button><button data-state="done" class="on">理想／訓好</button><label><input id="multi" type="checkbox"> 多條軌跡</label></div><div class="stats"><span>輸出與真值終點距離 <b id="err">—</b></span><span>沿軌跡輸出變動幅度 <b id="flat">—</b></span></div><p class="note">星號是真實終點，叉號是可切換的解析 surrogate。沒有載入或宣稱真實模型權重。</p></div><script src="../_demo-common.js"></script><script>
(function(){var cv=document.getElementById('cv'),D=NDFlow.hiDPICanvas(cv),pal=NDFlow.palette(),a=1.1,state='done';function el(x){return document.getElementById(x)}function S(q){return[1.7*Math.cos(q),.82*Math.sin(q)]}function E(q){return[1.25*Math.cos(q)+(Math.sin(2*q)>0?.45:-.45),.65*Math.sin(q*1.5)]}function P(q,t){var s=S(q),e=E(q),dx=e[0]-s[0],dy=e[1]-s[1],n=Math.hypot(dx,dy)||1,k=.46*Math.sin(Math.PI*t);return[s[0]*(1-t)+e[0]*t-dy/n*k,s[1]*(1-t)+e[1]*t+dx/n*k]}function F(q,t){var e=E(q),amp=state==='init'?.55:state==='mid'?.18:.018;return[e[0]+amp*Math.sin(2.7*Math.PI*t+q),e[1]+amp*.7*Math.cos(2.1*Math.PI*t-q)]}function draw(){var z=D.resize(),c=D.ctx,w=z.w,h=z.h,left=w*.70,sc=Math.min(left/4.7,h/3.6),X=x=>left/2+x*sc,Y=y=>h*.54-y*sc,t=+el('t').value,multi=el('multi').checked;c.clearRect(0,0,w,h);c.fillStyle=pal.bg;c.fillRect(0,0,w,h);var qs=multi?[.1,.75,1.4,2.05,2.7,3.35,4,4.65]:[a];qs.forEach(function(q,ix){c.strokeStyle='rgba(145,150,160,'+(multi?.28:.55)+')';c.lineWidth=multi?1.4:2.3;c.beginPath();for(var j=0;j<=70;j++){var p=P(q,j/70);j?c.lineTo(X(p[0]),Y(p[1])):c.moveTo(X(p[0]),Y(p[1]))}c.stroke();var p=P(q,t),e=E(q),f=F(q,t);c.fillStyle='rgb('+pal.noise.join(',')+')';dot(c,X(p[0]),Y(p[1]),multi?3:7);c.fillStyle='rgb('+pal.data.join(',')+')';star(c,X(e[0]),Y(e[1]),multi?5:8);c.strokeStyle='#d94f4f';cross(c,X(f[0]),Y(f[1]),multi?4:7)});c.strokeStyle='rgba(160,165,175,.25)';c.beginPath();c.moveTo(left+5,24);c.lineTo(left+5,h-24);c.stroke();var ox=left+28,oy=h*.72,ww=w-left-48,hh=h*.48;c.strokeStyle='rgba(160,165,175,.35)';c.strokeRect(ox,oy-hh,ww,hh);c.font='11px system-ui';c.fillStyle=pal.muted;c.textAlign='center';c.fillText('沿此軌跡的 fθ,x(t)',ox+ww/2,oy-hh-7);c.strokeStyle=pal.accent;c.lineWidth=2;c.beginPath();for(j=0;j<=60;j++){var tt=j/60,ff=F(a,tt),xx=ox+ww*tt,yy=oy-hh*(.5+.32*ff[0]/2.5);j?c.lineTo(xx,yy):c.moveTo(xx,yy)}c.stroke();var e=E(a),f=F(a,t),amp=state==='init'?.55:state==='mid'?.18:.018;el('tv').textContent=t.toFixed(2);el('err').textContent=Math.hypot(f[0]-e[0],f[1]-e[1]).toFixed(3);el('flat').textContent=(2*amp).toFixed(3)}function dot(c,x,y,r){c.beginPath();c.arc(x,y,r,0,6.284);c.fill()}function cross(c,x,y,r){c.beginPath();c.moveTo(x-r,y-r);c.lineTo(x+r,y+r);c.moveTo(x+r,y-r);c.lineTo(x-r,y+r);c.stroke()}function star(c,x,y,r){c.beginPath();for(var i=0;i<10;i++){var rr=i%2?r*.45:r,an=-Math.PI/2+i*Math.PI/5,xx=x+rr*Math.cos(an),yy=y+rr*Math.sin(an);i?c.lineTo(xx,yy):c.moveTo(xx,yy)}c.closePath();c.fill()}cv.onclick=function(e){var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*2-1,y=(e.clientY-r.top)/r.height*2-1;a=Math.atan2(-y,x);draw()};el('t').oninput=draw;el('multi').oninput=draw;document.querySelectorAll('[data-state]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-state]').forEach(x=>x.classList.remove('on'));b.classList.add('on');state=b.dataset.state;draw()}});window.addEventListener('resize',draw);function theme(){pal=NDFlow.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}NDFlow.onThemeChange(theme);theme()})();
</script></body></html>

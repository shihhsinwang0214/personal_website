<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多步 consistency model 的限制</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:16px;font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:#1f2733;background:transparent}body[data-dark="1"]{color:#e9e6e1}.card{max-width:800px;margin:auto;padding:18px;border:1px solid #e7e0d6;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#36383e}.goal,.note{font-size:.86rem;line-height:1.6;margin:0 0 12px}.goal b,.stats b{color:#2a4ea3}body[data-dark="1"] .goal b,body[data-dark="1"] .stats b{color:#d8a44a}canvas{width:100%;aspect-ratio:16/9;display:block;border-radius:10px}.row,.stats{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:.78rem}.row input[type=range]{flex:1;min-width:120px}button{padding:6px 11px;border:1px solid #bbb4aa;border-radius:8px;background:transparent;color:inherit;cursor:pointer}.note{color:#646c78;margin-top:12px}body[data-dark="1"] .note{color:#aaa79f}
</style></head><body><div class="card"><p class="goal">多步 CM 不是沿同一條 ODE 軌跡積分：每次<b>跳到資料端，再重加噪</b>，就切進另一條軌跡、改追另一個終點。</p><canvas id="cv" width="760" height="428" aria-label="多步 CM 換軌"></canvas><div class="row"><button id="next">下一步：跳／重加噪</button><button id="reset">重設</button><label>τ 強度 <span id="tv"></span></label><input id="tau" type="range" min=".15" max=".9" step=".05" value=".55"><label><input id="truth" type="checkbox"> 使用真值 f</label><label><input id="sde" type="checkbox"> SDE 修正</label></div><div class="stats"><span>目前操作 <b id="phase">—</b></span><span>已追過的不同終點 <b id="ends">—</b></span><span>surrogate W₂ <b id="w2">—</b></span></div><p class="note">路徑與誤差是解析 surrogate。真值 f 開啟時每一跳的邊際正確，但重加噪仍會換軌；SDE 開關示意 score 如何吸收注入偏移。</p></div><script src="../_demo-common.js"></script><script>
(function(){var cv=document.getElementById('cv'),D=NDFlow.hiDPICanvas(cv),pal=NDFlow.palette(),op=0;function el(x){return document.getElementById(x)}function endpoint(j){return[-1.35+j*.68,.75*Math.sin(j*1.37)]}function noise(j,tau){var e=endpoint(j);return[e[0]*tau+1.35*Math.sin(j*2.4)*(1-tau),e[1]*tau+1.25*Math.cos(j*1.9)*(1-tau)]}function curve(j,u,tau){var n=noise(j,tau),e=endpoint(j),k=.48*Math.sin(Math.PI*u);return[n[0]*(1-u)+e[0]*u+k*Math.sin(j),n[1]*(1-u)+e[1]*u+k*Math.cos(j)]}function draw(){var z=D.resize(),c=D.ctx,w=z.w,h=z.h,left=w*.69,sc=Math.min(left/5,h/3.8),X=x=>left/2+x*sc,Y=y=>h*.53-y*sc*.82,tau=+el('tau').value,truth=el('truth').checked,sde=el('sde').checked,turns=Math.min(4,Math.floor((op+1)/2));c.clearRect(0,0,w,h);c.fillStyle=pal.bg;c.fillRect(0,0,w,h);for(var j=0;j<=turns;j++){c.strokeStyle='rgba(150,155,165,.30)';c.lineWidth=2;c.beginPath();for(var i=0;i<=50;i++){var p=curve(j,i/50,tau);i?c.lineTo(X(p[0]),Y(p[1])):c.moveTo(X(p[0]),Y(p[1]))}c.stroke();var e=endpoint(j);c.fillStyle='rgba('+pal.data.join(',')+',.8)';star(c,X(e[0]),Y(e[1]),6)}var cur=noise(0,tau);c.fillStyle='rgb('+pal.noise.join(',')+')';dot(c,X(cur[0]),Y(cur[1]),6);for(var n=0;n<Math.min(op,8);n++){var j=Math.floor(n/2);if(n%2===0){var from=noise(j,tau),to=endpoint(j),bias=truth?0:.18*(j+1),tx=to[0]+(sde?bias*.22:bias),ty=to[1]+bias*.35;c.strokeStyle=pal.accent;c.lineWidth=3;c.beginPath();c.moveTo(X(from[0]),Y(from[1]));c.lineTo(X(tx),Y(ty));c.stroke();c.fillStyle=pal.accent;dot(c,X(tx),Y(ty),5)}else{var a=endpoint(j),b=noise(j+1,tau);c.setLineDash([6,4]);c.strokeStyle='#d94f4f';c.lineWidth=2;c.beginPath();c.moveTo(X(a[0]),Y(a[1]));c.lineTo(X(b[0]),Y(b[1]));c.stroke();c.setLineDash([])}}c.strokeStyle='rgba(160,165,175,.25)';c.beginPath();c.moveTo(left+6,24);c.lineTo(left+6,h-24);c.stroke();var xs=[1,2,3,4,8,16],ox=left+32,oy=h-55,ww=w-left-55,hh=h-105;c.strokeStyle='rgba(160,165,175,.35)';c.strokeRect(ox,oy-hh,ww,hh);c.strokeStyle=pal.accent;c.lineWidth=2;c.beginPath();xs.forEach(function(k,i){var val=truth?.03:.36/(1+.9*k)+.055*Math.log(k+1),xx=ox+ww*i/(xs.length-1),yy=oy-hh*Math.min(1,val/.4);i?c.lineTo(xx,yy):c.moveTo(xx,yy);c.fillStyle=pal.muted;c.font='10px system-ui';c.fillText(k,xx,oy+14)});c.stroke();el('tv').textContent=tau.toFixed(2);el('phase').textContent=op===0?'尚未開始':(op%2?'跳到資料端':'重加噪、切換軌跡');el('ends').textContent=String(turns+1);el('w2').textContent=(truth?.03:Math.max(.06,.28-.018*op)+(sde?-.04:0)).toFixed(2)}function dot(c,x,y,r){c.beginPath();c.arc(x,y,r,0,6.284);c.fill()}function star(c,x,y,r){c.beginPath();for(var i=0;i<10;i++){var q=i%2?r*.45:r,a=-1.57+i*Math.PI/5;i?c.lineTo(x+q*Math.cos(a),y+q*Math.sin(a)):c.moveTo(x+q*Math.cos(a),y+q*Math.sin(a))}c.closePath();c.fill()}el('next').onclick=function(){op=(op+1)%9;draw()};el('reset').onclick=function(){op=0;draw()};['tau','truth','sde'].forEach(x=>el(x).oninput=draw);window.addEventListener('resize',draw);function theme(){pal=NDFlow.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}NDFlow.onThemeChange(theme);theme()})();
</script></body></html>

<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>sCM：沿軌跡的全導數</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:16px;font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:#1f2733;background:transparent}body[data-dark="1"]{color:#e9e6e1}.card{max-width:800px;margin:auto;padding:18px;border:1px solid #e7e0d6;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#36383e}.goal,.note{font-size:.86rem;line-height:1.6;margin:0 0 12px}.goal b,.stats b{color:#2a4ea3}body[data-dark="1"] .goal b,body[data-dark="1"] .stats b{color:#d8a44a}canvas{width:100%;aspect-ratio:16/9;display:block;border-radius:10px}.row,.stats{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:.78rem}.row input[type=range]{flex:1;min-width:140px}button{padding:6px 10px;border:1px solid #bbb4aa;border-radius:8px;background:transparent;color:inherit;cursor:pointer}button.on{background:#2a4ea3;color:#fff;border-color:#2a4ea3}body[data-dark="1"] button.on{background:#d8a44a;color:#1f2126}.note{color:#646c78;margin-top:12px}body[data-dark="1"] .note{color:#aaa79f}
</style></head><body><div class="card"><p class="goal">連續時間的自我一致性是兩支箭頭相消：<b>∂ₜfθ + ∇fθ·ẋ = 0</b>。切換 surrogate 訓練狀態，看殘差如何縮小。</p><canvas id="cv" width="760" height="428" aria-label="全導數兩支箭頭相消"></canvas><div class="row"><label>t=<span id="tv"></span></label><input id="t" type="range" min="0" max="1" step=".01" value=".58"><button data-s="init">初始化</button><button data-s="mid">sCT 300 步</button><button data-s="done" class="on">理想／訓好</button><label><input id="norm" type="checkbox"> tangent normalization</label><label><input id="cond" type="checkbox"> 條件速度</label></div><div class="stats"><span>|df/dt| <b id="res">—</b></span><span>normalization 後 <b id="nr">—</b></span></div><p class="note">箭頭分解與訓練狀態是解析 surrogate；重點是合力與時間敏感度，不宣稱真 checkpoint。</p></div><script src="../_demo-common.js"></script><script>
(function(){var cv=document.getElementById('cv'),D=NDFlow.hiDPICanvas(cv),pal=NDFlow.palette(),state='done';function el(x){return document.getElementById(x)}function P(t){return[-1.9+3.8*t,-.6+1.2*t+.85*Math.sin(Math.PI*t)]}function amp(){return state==='init'?.82:state==='mid'?.28:.035}function R(t){var a=amp();return[a*2.6*Math.cos(2.6*t),a*1.8*Math.sin(2.2*t)]}function draw(){var z=D.resize(),c=D.ctx,w=z.w,h=z.h,left=w*.67,sc=Math.min(left/5,h/3.7),X=x=>left/2+x*sc,Y=y=>h*.56-y*sc*.82,t=+el('t').value,p=P(t),r=R(t),cond=el('cond').checked,A=[1.15+(.25*cond),-.55+.18*Math.sin(4*t)],B=[r[0]-A[0],r[1]-A[1]],as=.11*sc;c.clearRect(0,0,w,h);c.fillStyle=pal.bg;c.fillRect(0,0,w,h);c.strokeStyle='rgba(155,160,170,.45)';c.lineWidth=2.5;c.beginPath();for(var i=0;i<=80;i++){var q=P(i/80);i?c.lineTo(X(q[0]),Y(q[1])):c.moveTo(X(q[0]),Y(q[1]))}c.stroke();c.fillStyle=pal.accent;dot(c,X(p[0]),Y(p[1]),7);arrow(c,X(p[0]),Y(p[1]),A[0]*as,-A[1]*as,'#4a90e2','∂ₜf');arrow(c,X(p[0]),Y(p[1]),B[0]*as,-B[1]*as,'#f0803c','∇f·ẋ');arrow(c,X(p[0]),Y(p[1]),r[0]*as,-r[1]*as,'#d94f4f','合力');c.strokeStyle='rgba(160,165,175,.25)';c.beginPath();c.moveTo(left+6,24);c.lineTo(left+6,h-24);c.stroke();var ox=left+26,oy=h*.63,ww=w-left-46,hh=h*.44;c.strokeStyle='rgba(160,165,175,.35)';c.strokeRect(ox,oy-hh,ww,hh);c.strokeStyle=pal.accent;c.lineWidth=2;c.beginPath();for(i=0;i<=60;i++){var tt=i/60,rr=R(tt),mag=Math.hypot(rr[0],rr[1]),xx=ox+ww*tt,yy=oy-hh*Math.min(1,mag/2.6);i?c.lineTo(xx,yy):c.moveTo(xx,yy)}c.stroke();c.font='11px system-ui';c.textAlign='center';c.fillStyle=pal.muted;c.fillText('|df/dt| 沿軌跡',ox+ww/2,oy-hh-7);var mag=Math.hypot(r[0],r[1]),nm=mag/(1+mag);el('tv').textContent=t.toFixed(2);el('res').textContent=mag.toFixed(3);el('nr').textContent=(el('norm').checked?nm:mag).toFixed(3)}function dot(c,x,y,r){c.beginPath();c.arc(x,y,r,0,6.284);c.fill()}function arrow(c,x,y,dx,dy,col,label){c.strokeStyle=col;c.fillStyle=col;c.lineWidth=3;c.beginPath();c.moveTo(x,y);c.lineTo(x+dx,y+dy);c.stroke();var a=Math.atan2(dy,dx),ex=x+dx,ey=y+dy;c.beginPath();c.moveTo(ex,ey);c.lineTo(ex-9*Math.cos(a-.45),ey-9*Math.sin(a-.45));c.lineTo(ex-9*Math.cos(a+.45),ey-9*Math.sin(a+.45));c.closePath();c.fill();c.font='700 11px system-ui';c.fillText(label,ex+6,ey-6)}['t','norm','cond'].forEach(x=>el(x).oninput=draw);document.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-s]').forEach(x=>x.classList.remove('on'));b.classList.add('on');state=b.dataset.s;draw()}});window.addEventListener('resize',draw);function theme(){pal=NDFlow.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}NDFlow.onThemeChange(theme);theme()})();
</script></body></html>

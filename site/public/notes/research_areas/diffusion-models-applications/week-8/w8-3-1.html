<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CT 目標、Euler 與真實軌跡</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:16px;font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:#1f2733;background:transparent}body[data-dark="1"]{color:#e9e6e1}.card{max-width:800px;margin:auto;padding:18px;border:1px solid #e7e0d6;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#36383e}.goal,.note{font-size:.86rem;line-height:1.6;margin:0 0 12px}.goal b,.stats b{color:#2a4ea3}body[data-dark="1"] .goal b,body[data-dark="1"] .stats b{color:#d8a44a}canvas{width:100%;aspect-ratio:16/9;display:block;border-radius:10px}.row,.stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:.78rem}.row input[type=range]{flex:1;min-width:130px}.note{color:#646c78;margin-top:12px}body[data-dark="1"] .note{color:#aaa79f}
</style></head><body><div class="card"><p class="goal">單筆 CT 目標沿自己的條件直線退一步；把同一個 x<sub>t</sub> 的許多配對平均，質心才會對齊 <b>Euler 一步</b>。剩餘差距是曲率造成的局部 bias。</p><canvas id="cv" width="760" height="428" aria-label="CT 目標與真實軌跡比較"></canvas><div class="row"><label>Δt=<span id="dv"></span></label><input id="dt" type="range" min=".02" max=".55" step=".01" value=".28"><label>曲率=<span id="cvv"></span></label><input id="curve" type="range" min="0" max="1.5" step=".05" value="1"><label><input id="fan" type="checkbox" checked> 100 組條件目標扇形</label></div><div class="stats"><span>CT−Euler <b id="ce">—</b></span><span>Euler−真實 <b id="et">—</b></span><span>CT variance ∝ Δt <b id="var">—</b></span></div><p class="note">解析 toy 顯示兩種量綱：Euler 局部 bias 約隨 Δt²，條件目標標準差約隨 Δt。</p></div><script src="../_demo-common.js"></script><script>
(function(){var cv=document.getElementById('cv'),D=NDFlow.hiDPICanvas(cv),pal=NDFlow.palette();function el(x){return document.getElementById(x)}function P(t,k){return[-1.8+3.6*t,-.7+1.4*t+k*.75*Math.sin(Math.PI*t)]}function V(t,k){return[3.6,1.4+k*.75*Math.PI*Math.cos(Math.PI*t)]}function draw(){var z=D.resize(),c=D.ctx,w=z.w,h=z.h,left=w*.69,sc=Math.min(left/5,h/3.9),X=x=>left/2+x*sc,Y=y=>h*.53-y*sc*.86,dt=+el('dt').value,k=+el('curve').value,t1=.78,t0=Math.max(.02,t1-dt),p1=P(t1,k),truth=P(t0,k),v=V(t1,k),eu=[p1[0]-dt*v[0],p1[1]-dt*v[1]],spread=.42*dt;c.clearRect(0,0,w,h);c.fillStyle=pal.bg;c.fillRect(0,0,w,h);c.setLineDash([6,5]);c.strokeStyle='rgba(240,128,60,.55)';c.beginPath();c.moveTo(X(-2),Y(-1.1));c.lineTo(X(2),Y(1.1));c.stroke();c.setLineDash([]);c.strokeStyle='rgba(96,186,130,.7)';c.lineWidth=3;c.beginPath();for(var i=0;i<=80;i++){var p=P(i/80,k);i?c.lineTo(X(p[0]),Y(p[1])):c.moveTo(X(p[0]),Y(p[1]))}c.stroke();if(el('fan').checked){c.fillStyle='rgba(240,128,60,.20)';for(i=0;i<100;i++){var an=i*2.399,rr=spread*Math.sqrt((i+.5)/100),q=[eu[0]+rr*Math.cos(an),eu[1]+rr*Math.sin(an)];dot(c,X(q[0]),Y(q[1]),2)}}var ct=[eu[0]+spread*.78,eu[1]-spread*.45];mark(c,X(p1[0]),Y(p1[1]),'#4a90e2','● x_t');mark(c,X(ct[0]),Y(ct[1]),'#f0803c','■ CT');mark(c,X(eu[0]),Y(eu[1]),'#2a4ea3','▲ Euler／質心');mark(c,X(truth[0]),Y(truth[1]),'#60ba82','● 真實');c.strokeStyle='rgba(160,165,175,.25)';c.beginPath();c.moveTo(left+6,24);c.lineTo(left+6,h-24);c.stroke();var ox=left+30,oy=h-42,ww=w-left-52,hh=h-90;c.strokeStyle='rgba(160,165,175,.35)';c.strokeRect(ox,oy-hh,ww,hh);c.font='11px system-ui';c.textAlign='center';c.fillStyle=pal.muted;c.fillText('log-log 趨勢',ox+ww/2,oy-hh-8);c.strokeStyle='#60ba82';c.beginPath();for(i=1;i<=30;i++){var d=.02+i*.017,x=ox+ww*(d-.037)/.51,y=oy-hh*(d*d*k/.42);i>1?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();c.strokeStyle='#f0803c';c.beginPath();for(i=1;i<=30;i++){d=.02+i*.017;x=ox+ww*(d-.037)/.51;y=oy-hh*(d/.65);i>1?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();c.fillStyle='#60ba82';c.fillText('bias ~ Δt²',ox+ww*.62,oy-hh*.22);c.fillStyle='#f0803c';c.fillText('std ~ Δt',ox+ww*.62,oy-hh*.67);el('dv').textContent=dt.toFixed(2);el('cvv').textContent=k.toFixed(2);el('ce').textContent=Math.hypot(ct[0]-eu[0],ct[1]-eu[1]).toFixed(3);el('et').textContent=Math.hypot(eu[0]-truth[0],eu[1]-truth[1]).toFixed(3);el('var').textContent=spread.toFixed(3)}function dot(c,x,y,r){c.beginPath();c.arc(x,y,r,0,6.284);c.fill()}function mark(c,x,y,col,label){c.fillStyle=col;dot(c,x,y,6);c.font='700 11px system-ui';c.fillText(label,x+8,y-8)}['dt','curve','fan'].forEach(x=>el(x).oninput=draw);window.addEventListener('resize',draw);function theme(){pal=NDFlow.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}NDFlow.onThemeChange(theme);theme()})();
</script></body></html>

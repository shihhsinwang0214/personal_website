<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回歸一步 vs 分佈匹配一步</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:16px;font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:#1f2733;background:transparent}body[data-dark="1"]{color:#e9e6e1}.card{max-width:800px;margin:auto;padding:18px;border:1px solid #e7e0d6;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#36383e}.goal,.note{font-size:.86rem;line-height:1.6;margin:0 0 12px}.goal b,.stats b{color:#2a4ea3}body[data-dark="1"] .goal b,body[data-dark="1"] .stats b{color:#d8a44a}canvas{width:100%;aspect-ratio:16/9;display:block;border-radius:10px}.controls{display:grid;gap:9px;margin-top:10px}.row,.stats{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.78rem}.row label{font-weight:700}.row input[type=range]{flex:1;min-width:140px}button{padding:6px 11px;border:1px solid #bbb4aa;border-radius:8px;background:transparent;color:inherit;cursor:pointer}.note{color:#646c78;margin-top:12px}body[data-dark="1"] .note{color:#aaa79f}
</style></head><body><div class="card"><p class="goal">同一個交叉配對 toy：<b>回歸式一步</b>會把多個可能終點平均到中間；<b>分佈匹配</b>不綁定哪個 z 對哪個樣本，但要防止 mode collapse 與 fake score 追不上。</p><canvas id="cv" width="760" height="428" aria-label="回歸與分佈匹配樣本比較"></canvas><div class="controls"><div class="row"><label>CT 時間網格 N=<span id="nv"></span></label><input id="n" type="range" min="0" max="3" step="1" value="0"><label>fake 更新頻率 <span id="fv"></span>×</label><input id="freq" type="range" min="1" max="5" step="1" value="5"><label><input id="fake" type="checkbox" checked> 開啟 fake-score 排斥項</label><button id="reroll">換一批 z</button></div><div class="stats"><span>回歸：落在 modes 外 <b id="outside">—</b></span><span>DMD：mode balance <b id="balance">—</b></span><span>DMD surrogate W₂ <b id="w2">—</b></span></div></div><p class="note">瀏覽器中使用固定公式的教學 surrogate，不宣稱即時訓練 DMD。控制項忠實呈現三個核心失敗模式：平均、缺少排斥造成塌縮、fake 更新太慢造成不平衡。</p></div><script src="../_demo-common.js"></script><script>
(function(){var cv=document.getElementById('cv'),D=NDFlow.hiDPICanvas(cv),pal=NDFlow.palette(),seed=1,steps=[2,4,8,32];function el(x){return document.getElementById(x)}function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function rn(){var u=Math.max(1e-8,rnd()),v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283*v)}function draw(){seed=seed||1;var z=D.resize(),c=D.ctx,w=z.w,h=z.h,mid=w/2,N=steps[+el('n').value],freq=+el('freq').value,fake=el('fake').checked;c.clearRect(0,0,w,h);c.fillStyle=pal.bg;c.fillRect(0,0,w,h);c.strokeStyle='rgba(160,165,175,.25)';c.beginPath();c.moveTo(mid,28);c.lineTo(mid,h-44);c.stroke();c.font='700 13px system-ui';c.textAlign='center';c.fillStyle=pal.ink;c.fillText('回歸式一步',mid/2,22);c.fillText('分佈匹配一步（surrogate）',mid+mid/2,22);var scale=Math.min(mid/5,h/4.6),Y=y=>h*.54-y*scale,X=(x,side)=>(side?mid:0)+mid/2+x*scale*.72;function contour(side){c.strokeStyle='rgba('+pal.data.join(',')+',.35)';c.lineWidth=2;[-1,1].forEach(m=>{c.beginPath();c.ellipse(X(m,side),Y(1.15),.42*scale,.22*scale,0,0,6.284);c.stroke()})}contour(0);contour(1);var out=0,right=0;for(var i=0;i<320;i++){var source=i%2?-1:1,mix=Math.min(.88,2.2/N),xr=(1-mix)*(-source)+mix*(rn()*.22),yr=1.15+rn()*.13;c.fillStyle='rgba(74,144,226,.46)';dot(c,X(xr,0),Y(yr),1.7);if(Math.abs(xr)<.55)out++;var mode=fake?(i%2?-1:1):1;if(fake&&freq<5&&rnd()<(5-freq)*.075)mode=1;var xd=mode+rn()*(.14+(5-freq)*.025),yd=1.15+rn()*.14;c.fillStyle='rgba(96,186,130,.5)';dot(c,X(xd,1),Y(yd),1.7);if(xd>0)right++}c.fillStyle=pal.muted;c.font='12px system-ui';c.fillText('兩個目標 mode 之間的點＝平均錯誤',mid/2,h-24);c.fillText(fake?'兩個 mode 都保留；頻率低時比例偏':'排斥項關閉：全部擠到單一 mode',mid+mid/2,h-24);el('nv').textContent=N;el('fv').textContent=freq;el('outside').textContent=(100*out/320).toFixed(0)+'%';var bal=Math.min(right,320-right)/160;el('balance').textContent=(100*bal).toFixed(0)+'%';el('w2').textContent=(fake?(.08+(5-freq)*.045):.72).toFixed(2)}function dot(c,x,y,r){c.beginPath();c.arc(x,y,r,0,6.284);c.fill()}['n','freq','fake'].forEach(x=>el(x).oninput=draw);el('reroll').onclick=function(){seed=(Date.now()>>>0)||1;draw()};window.addEventListener('resize',draw);function theme(){pal=NDFlow.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}NDFlow.onThemeChange(theme);theme()})();
</script></body></html>

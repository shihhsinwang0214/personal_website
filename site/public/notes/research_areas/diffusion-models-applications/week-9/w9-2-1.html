<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeanFlow identity 三角形</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:16px;font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:#1f2733;background:transparent}body[data-dark="1"]{color:#e9e6e1}.card{max-width:720px;margin:auto;padding:18px;border:1px solid #e7e0d6;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#36383e}.goal,.note{font-size:.86rem;line-height:1.6;margin:0 0 12px}.goal b,.stats b{color:#2a4ea3}body[data-dark="1"] .goal b,body[data-dark="1"] .stats b{color:#d8a44a}canvas{width:100%;aspect-ratio:16/9;display:block;border-radius:10px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:10px}.row label{font-size:.78rem;font-weight:700}.row input[type=range]{flex:1;min-width:140px}.stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:.78rem;font-variant-numeric:tabular-nums}.note{color:#646c78;margin-top:12px}body[data-dark="1"] .note{color:#aaa79f}
</style></head><body><div class="card"><p class="goal"><b>平均速度 u 是弦，瞬時速度 v 是切線。</b>第三支紅色向量把兩者接起來；r 靠近 t 時，三角形縮成一條線。</p><canvas id="cv" width="680" height="383" aria-label="MeanFlow identity 幾何"></canvas><div class="row"><label>t <span id="tv"></span></label><input id="t" type="range" min="0" max="1" step=".01" value=".28"><label>r <span id="rv"></span></label><input id="r" type="range" min="0" max="1" step=".01" value=".82"><label><input id="ct" type="checkbox"> 顯示 CT Euler 點</label></div><div class="stats"><span>identity 殘差 <b id="res">0</b></span><span>CT bias <b id="bias">—</b></span><span>|u−v| <b id="dif">—</b></span></div><p class="note">使用解析曲線直接計算弦與切線；紅色向量是精確差值，不是訓練結果。真實 MeanFlow 以 JVP 學這個修正。</p></div><script src="../_demo-common.js"></script><script>
(function(){var cv=document.getElementById('cv'),D=NDFlow.hiDPICanvas(cv),pal=NDFlow.palette();function P(q){return[-2+4*q,-.8+1.6*q+1.05*Math.sin(Math.PI*q)]}function V(q){return[4,1.6+1.05*Math.PI*Math.cos(Math.PI*q)]}function el(x){return document.getElementById(x)}function draw(){var z=D.resize(),c=D.ctx,w=z.w,h=z.h,t=+el('t').value,r=+el('r').value,dt=r-t,pt=P(t),pr=P(r),v=V(t),u=Math.abs(dt)<.015?v.slice():[(pr[0]-pt[0])/dt,(pr[1]-pt[1])/dt],scale=Math.min(w/6.2,h/4),X=x=>w/2+x*scale,Y=y=>h*.66-y*scale*.72,as=.095*scale;c.clearRect(0,0,w,h);c.fillStyle=pal.bg;c.fillRect(0,0,w,h);c.strokeStyle='rgba(160,165,175,.45)';c.lineWidth=2;c.beginPath();for(var i=0;i<=100;i++){var p=P(i/100);i?c.lineTo(X(p[0]),Y(p[1])):c.moveTo(X(p[0]),Y(p[1]))}c.stroke();c.fillStyle='rgb('+pal.noise.join(',')+')';dot(c,X(pt[0]),Y(pt[1]),6);c.fillStyle='rgb('+pal.data.join(',')+')';dot(c,X(pr[0]),Y(pr[1]),6);arrow(c,X(pt[0]),Y(pt[1]),X(pt[0])+v[0]*as,Y(pt[1])-v[1]*as,'#4a90e2','v：切線');arrow(c,X(pt[0]),Y(pt[1]),X(pt[0])+u[0]*as,Y(pt[1])-u[1]*as,'#f0803c','u：平均速度');var vx=X(pt[0])+v[0]*as,vy=Y(pt[1])-v[1]*as,ux=X(pt[0])+u[0]*as,uy=Y(pt[1])-u[1]*as;c.setLineDash([6,4]);arrow(c,vx,vy,ux,uy,'#d94f4f','(r−t)du/dt');c.setLineDash([]);if(el('ct').checked){var e=[pt[0]+(r-t)*v[0],pt[1]+(r-t)*v[1]];c.strokeStyle='#9a988f';c.lineWidth=2;c.beginPath();c.moveTo(X(e[0])-5,Y(e[1])-5);c.lineTo(X(e[0])+5,Y(e[1])+5);c.moveTo(X(e[0])+5,Y(e[1])-5);c.lineTo(X(e[0])-5,Y(e[1])+5);c.stroke();c.fillStyle=pal.muted;c.font='12px system-ui';c.fillText('CT / Euler',X(e[0])+8,Y(e[1])-8);el('bias').textContent=Math.hypot(e[0]-pr[0],e[1]-pr[1]).toFixed(3)}else el('bias').textContent='—';el('tv').textContent=t.toFixed(2);el('rv').textContent=r.toFixed(2);el('dif').textContent=Math.hypot(u[0]-v[0],u[1]-v[1]).toFixed(3);el('res').textContent='< 1e−12'}function dot(c,x,y,r){c.beginPath();c.arc(x,y,r,0,6.284);c.fill()}function arrow(c,x1,y1,x2,y2,col,label){c.strokeStyle=col;c.fillStyle=col;c.lineWidth=3;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();var a=Math.atan2(y2-y1,x2-x1);c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-10*Math.cos(a-.45),y2-10*Math.sin(a-.45));c.lineTo(x2-10*Math.cos(a+.45),y2-10*Math.sin(a+.45));c.closePath();c.fill();c.font='700 12px system-ui';c.fillText(label,(x1+x2)/2+6,(y1+y2)/2-7)}['t','r','ct'].forEach(x=>el(x).oninput=draw);window.addEventListener('resize',draw);function theme(){pal=NDFlow.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}NDFlow.onThemeChange(theme);theme()})();
</script></body></html>

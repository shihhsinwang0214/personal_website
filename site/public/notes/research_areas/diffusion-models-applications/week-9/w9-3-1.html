<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shortcut bootstrap 階梯</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:16px;font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:#1f2733;background:transparent}body[data-dark="1"]{color:#e9e6e1}.card{max-width:760px;margin:auto;padding:18px;border:1px solid #e7e0d6;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#36383e}.goal,.note{font-size:.86rem;line-height:1.6;margin:0 0 12px}.goal b,.stats b{color:#2a4ea3}body[data-dark="1"] .goal b,body[data-dark="1"] .stats b{color:#d8a44a}canvas{width:100%;aspect-ratio:16/9;display:block;border-radius:10px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}.row input[type=range]{flex:1;min-width:150px}.row label,.stats{font-size:.78rem;font-weight:700}.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}.note{color:#646c78;margin-top:12px}body[data-dark="1"] .note{color:#aaa79f}
</style></head><body><div class="card"><p class="goal"><b>Shortcut</b> 從 d=0 的 flow-matching 速度開始，每一級用下面一級的兩個半步教一個大步。調高底層誤差，觀察它如何沿階梯放大。</p><canvas id="cv" width="720" height="405" aria-label="Shortcut 階梯"></canvas><div class="row"><label>選取步長層級 d = <span id="dv"></span></label><input id="level" type="range" min="0" max="4" step="1" value="3"><label>底層誤差 ε = <span id="ev"></span></label><input id="eps" type="range" min="0" max=".25" step=".01" value=".08"><label><input id="mf" type="checkbox"> 對照 MeanFlow</label></div><div class="stats"><span>此級 surrogate 誤差 <b id="err">—</b></span><span>最大級／底層倍率 <b id="amp">—</b></span></div><p class="note">誤差曲線是明確標示的教學 surrogate：它示範逐級 bootstrap 的傳遞結構，不是假裝載入 Shortcut checkpoint。</p></div><script src="../_demo-common.js"></script><script>
(function(){var cv=document.getElementById('cv'),D=NDFlow.hiDPICanvas(cv),pal=NDFlow.palette(),ds=[0,.125,.25,.5,1];function el(x){return document.getElementById(x)}function draw(){var z=D.resize(),c=D.ctx,w=z.w,h=z.h,l=+el('level').value,e=+el('eps').value,mf=el('mf').checked;c.clearRect(0,0,w,h);c.fillStyle=pal.bg;c.fillRect(0,0,w,h);c.font='12px system-ui';c.textAlign='center';if(mf){var ox=65,oy=42,ww=w-105,hh=h*.55;c.fillStyle='rgba(96,186,130,.08)';c.beginPath();c.moveTo(ox,oy+hh);c.lineTo(ox+ww,oy+hh);c.lineTo(ox+ww,oy);c.closePath();c.fill();c.strokeStyle='rgba(96,186,130,.55)';c.stroke();for(var i=0;i<8;i++){var x=ox+ww*i/7;c.beginPath();c.moveTo(x,oy+hh);c.lineTo(ox+ww,oy+hh-(hh*i/7));c.stroke()}c.fillStyle=pal.ink;c.fillText('MeanFlow：整個 (t,r) 三角形直接由 identity 訓練，沒有離散階梯',w/2,oy+hh+28)}else{var left=70,right=w-28,top=35,row=43;for(var k=0;k<5;k++){var y=top+k*row;c.strokeStyle='rgba(160,165,175,.25)';c.beginPath();c.moveTo(left,y);c.lineTo(right,y);c.stroke();c.fillStyle=pal.muted;c.textAlign='right';c.fillText('d='+String(ds[4-k]),left-10,y+4);var d=ds[4-k];if(d===0){for(i=0;i<9;i++){var x0=left+(right-left)*i/8;c.strokeStyle=k===4?pal.accent:pal.grid;c.beginPath();c.moveTo(x0,y+8);c.lineTo(x0+10,y-8);c.stroke()}continue}var slots=Math.max(1,Math.floor(1/d));for(i=0;i<slots;i++){var x1=left+(right-left)*i/slots,x2=left+(right-left)*(i+1)/slots,sel=(4-k)===l;c.strokeStyle=sel?pal.accent:'rgba(96,186,130,.48)';c.lineWidth=sel?4:2;c.beginPath();c.moveTo(x1,y);c.quadraticCurveTo((x1+x2)/2,y-22,x2,y);c.stroke()}}c.textAlign='center';c.fillStyle=pal.ink;c.fillText('高亮的一大步由下一列兩個半步組成；資訊從 d=0 往上傳',w/2,top+5*row+12)}var base=h*.76,bw=(w-140)/5;for(i=0;i<5;i++){var val=mf?e*(1+.28*ds[i]):e*Math.pow(1.72,i),bh=Math.min(h*.19,val*h*1.75);c.fillStyle=i===l?pal.accent:'rgba(96,186,130,.65)';c.fillRect(82+i*bw,base-bh,bw-14,bh);c.fillStyle=pal.muted;c.textAlign='center';c.fillText('d='+ds[i],82+i*bw+(bw-14)/2,base+18)}var now=mf?e*(1+.28*ds[l]):e*Math.pow(1.72,l);el('dv').textContent=ds[l];el('ev').textContent=e.toFixed(2);el('err').textContent=now.toFixed(3);el('amp').textContent=(mf?1.28:Math.pow(1.72,4)).toFixed(2)+'×'}['level','eps','mf'].forEach(x=>el(x).oninput=draw);window.addEventListener('resize',draw);function theme(){pal=NDFlow.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}NDFlow.onThemeChange(theme);theme()})();
</script></body></html>

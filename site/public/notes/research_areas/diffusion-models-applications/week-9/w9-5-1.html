<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一步生成方法統一表</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:16px;font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:#1f2733;background:transparent}body[data-dark="1"]{color:#e9e6e1}.card{max-width:980px;margin:auto;padding:18px;border:1px solid #e7e0d6;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#36383e}.goal,.note{font-size:.86rem;line-height:1.6;margin:0 0 12px}.goal b,#count{color:#2a4ea3}body[data-dark="1"] .goal b,body[data-dark="1"] #count{color:#d8a44a}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters label{font-size:.73rem;padding:5px 8px;border:1px solid #d4cec5;border-radius:999px}.quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button{padding:6px 10px;border:1px solid #bbb4aa;border-radius:8px;background:transparent;color:inherit;cursor:pointer;font-size:.75rem}button:hover{border-color:#2a4ea3}.wrap{overflow:auto;border:1px solid #ddd6cc;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:850px;font-size:.75rem}th,td{padding:8px 9px;border-bottom:1px solid #e4ded5;text-align:center}th{position:sticky;top:0;background:#f2eee8;cursor:pointer}body[data-dark="1"] th{background:#292b31}td:first-child,th:first-child{text-align:left;font-weight:700}.dim{opacity:.18}.yes{color:#318355;font-weight:800}.no{color:#b14c4c}.detail{min-height:42px;margin:10px 0 0;padding:8px 10px;border-left:3px solid #2a4ea3;color:#646c78;font-size:.78rem;line-height:1.5}body[data-dark="1"] .detail{color:#aaa79f}.empty{display:none;text-align:center;padding:12px;color:#b14c4c;font-weight:700}.note{color:#646c78;margin-top:10px}body[data-dark="1"] .note{color:#aaa79f}
</style></head><body><div class="card"><p class="goal">勾選你的需求；不符合的方法會淡出但保留對照。<b id="count">—</b></p><div class="filters" id="filters"></div><div class="quick"><button data-q="noteacher">我沒有 teacher、要一步</button><button data-q="quality">我有 teacher、要最好的一步品質</button><button data-q="clear">清除</button></div><div class="wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table><div class="empty" id="empty">沒有一格是全綠的。</div></div><div class="detail" id="detail">把游標移到任一格，看它代表的取捨。</div><p class="note">這張表是方法選擇器，不是排行榜；每一列都用不同代價換掉某一種誤差。</p></div><script src="../_demo-common.js"></script><script>
(function(){var fields=[['teacher','不要 teacher'],['one','一步可用'],['multi','多步合法'],['curve','沒有曲率 bias'],['ladder','沒有階梯累積'],['cross','不受交叉平均'],['score','不需即時 score'],['jvp','不需要 JVP']],rows=[
['Consistency training',1,1,0,0,1,0,1,1,'離散時間 Eulerian regression；不要 teacher，但有曲率 bias。'],['sCM',1,1,0,0,1,0,1,0,'連續 consistency；以全導數與 JVP 換掉時間網格。'],['MeanFlow',1,1,1,1,1,0,1,0,'直接學任意區間平均速度；半群合法，需要 JVP。'],['Shortcut',1,1,1,1,0,0,1,1,'progressive bootstrap；不需 teacher/JVP，但誤差沿階梯傳遞。'],['Progressive distill.',0,1,1,1,0,0,1,1,'teacher 兩小步教學生一大步；每輪要重新訓練。'],['CTM',0,1,1,1,0,0,1,1,'teacher-based flow-map matching，介於 progressive 與 consistency。'],['DMD',0,1,1,1,1,1,0,1,'分佈匹配避開配對平均；需要 real/fake score。'],['IMM',1,1,1,1,1,1,0,1,'分佈匹配家族；不綁定樣本配對，但仍需 score estimator。']];var active={},sort=0,asc=1,filters=document.getElementById('filters');fields.forEach(function(f){var l=document.createElement('label');l.innerHTML='<input type="checkbox" data-k="'+f[0]+'"> '+f[1];filters.appendChild(l)});var head=document.getElementById('head');['方法'].concat(fields.map(x=>x[1])).forEach(function(x,i){var th=document.createElement('th');th.textContent=x;th.onclick=function(){sort=i;asc*=-1;render()};head.appendChild(th)});function render(){var body=document.getElementById('body');body.innerHTML='';var arr=rows.slice().sort(function(a,b){var av=sort?a[sort]:a[0],bv=sort?b[sort]:b[0];return(av>bv?1:av<bv?-1:0)*asc});var keep=0;arr.forEach(function(r){var ok=true;fields.forEach(function(f,j){if(active[f[0]]&&!r[j+1])ok=false});if(ok)keep++;var tr=document.createElement('tr');if(!ok)tr.className='dim';for(var i=0;i<=fields.length;i++){var td=document.createElement('td');td.textContent=i===0?r[0]:(r[i]?'✓':'—');if(i)td.className=r[i]?'yes':'no';td.onmouseenter=function(){document.getElementById('detail').textContent=r[9]};tr.appendChild(td)}body.appendChild(tr)});document.getElementById('count').textContent='符合 '+keep+' 個方法';document.getElementById('empty').style.display=keep?'none':'block'}filters.onchange=function(e){active[e.target.dataset.k]=e.target.checked;render()};document.querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){active={};if(b.dataset.q==='noteacher'){active.teacher=1;active.one=1}if(b.dataset.q==='quality'){active.one=1;active.cross=1}document.querySelectorAll('#filters input').forEach(function(x){x.checked=!!active[x.dataset.k]});render()}});function theme(){var p=NDFlow.palette();document.body.dataset.dark=p.dark?'1':'0'}NDFlow.onThemeChange(theme);theme();render()})();
</script></body></html>

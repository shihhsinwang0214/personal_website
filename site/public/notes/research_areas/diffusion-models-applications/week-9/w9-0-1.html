<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flow map：任意兩個時間之間</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:16px;font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:#1f2733;background:transparent}body[data-dark="1"]{color:#e9e6e1}.card{max-width:760px;margin:auto;padding:18px;border:1px solid #e7e0d6;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#36383e}.goal,.note{font-size:.86rem;line-height:1.6;margin:0 0 12px}.goal b,.stat b{color:#2a4ea3}body[data-dark="1"] .goal b,body[data-dark="1"] .stat b{color:#d8a44a}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:10px}.controls{display:grid;gap:9px;margin-top:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row label{font-size:.78rem;font-weight:700}.row input[type=range]{flex:1;min-width:150px}.checks{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem}.stat{display:flex;gap:18px;flex-wrap:wrap;font-size:.78rem;font-variant-numeric:tabular-nums}.note{margin-top:12px;color:#646c78}body[data-dark="1"] .note{color:#aaa79f}
</style></head><body><div class="card"><p class="goal"><b>Flow map</b> 會沿同一條軌跡把粒子從任意時刻 t 送到 s；分兩段與一次跳必須落在同一點。這裡使用可精確求值的解析 toy。</p><canvas id="cv" width="720" height="405" aria-label="flow map 粒子軌跡"></canvas><div class="controls"><div class="row"><label>起始 t <span id="tv"></span></label><input id="t" type="range" min="0" max="1" step=".01" value=".18"><label>目標 s <span id="sv"></span></label><input id="s" type="range" min="0" max="1" step=".01" value=".76"></div><div class="row" id="rrow"><label>中繼／終點 r <span id="rv"></span></label><input id="r" type="range" min="0" max="1" step=".01" value=".92"></div><div class="checks"><label><input id="full" type="checkbox" checked> 顯示完整軌跡</label><label><input id="semi" type="checkbox"> 驗證半群 t→s→r</label><label><input id="cm" type="checkbox"> 對照多步 consistency</label></div><div class="stat"><span>直接 vs 分段最大距離 <b id="err">—</b></span><span>重加噪後換軌比例 <b id="off">—</b></span></div></div><p class="note">觀察：半群模式的空心圈與實心點重合；consistency 對照會先跳到資料端再重新配一條噪聲線，因此粒子通常離開原軌跡。解析 toy，不代表任何真實 checkpoint。</p></div><script src="../_demo-common.js"></script><script>
(function(){var cv=document.getElementById('cv'),D=NDFlow.hiDPICanvas(cv),pal=NDFlow.palette(),N=24,A=[],B=[];for(var i=0;i<N;i++){var q=(i+.5)/N,a=2*Math.PI*q;A.push([1.2*Math.cos(a*2.3)+.25*Math.sin(a*7),1.05*Math.sin(a*1.7)]);var top=i%2===0,u=((i*7)%N)/(N-1)*Math.PI;B.push(top?[1.28*Math.cos(u)-.65,-.8*Math.sin(u)+.35]:[1.28-1.28*Math.cos(u)-.65,.8*Math.sin(u)-.35])}function P(i,u){var a=A[i],b=B[i],dx=b[0]-a[0],dy=b[1]-a[1],n=Math.hypot(dx,dy)||1,k=.34*Math.sin(Math.PI*u)*Math.sin(i*1.91);return[a[0]*(1-u)+b[0]*u-dy/n*k,a[1]*(1-u)+b[1]*u+dx/n*k]}function draw(){var z=D.resize(),c=D.ctx,w=z.w,h=z.h;c.clearRect(0,0,w,h);c.fillStyle=pal.bg;c.fillRect(0,0,w,h);var sc=Math.min(w/6.3,h/4.2),X=x=>w/2+x*sc,Y=y=>h/2-y*sc,t=+el('t').value,s=+el('s').value,r=+el('r').value,full=el('full').checked,semi=el('semi').checked,cm=el('cm').checked;c.lineCap='round';if(full){c.strokeStyle='rgba(150,155,165,.23)';c.lineWidth=1;for(i=0;i<N;i++){c.beginPath();for(var j=0;j<=40;j++){var p=P(i,j/40);j?c.lineTo(X(p[0]),Y(p[1])):c.moveTo(X(p[0]),Y(p[1]))}c.stroke()}}for(i=0;i<N;i++){var p0=P(i,t),p1=P(i,semi?r:s);c.strokeStyle='rgba(96,186,130,.42)';c.lineWidth=1.4;c.beginPath();c.moveTo(X(p0[0]),Y(p0[1]));c.lineTo(X(p1[0]),Y(p1[1]));c.stroke();c.fillStyle='rgb('+pal.noise.join(',')+')';dot(c,X(p0[0]),Y(p0[1]),3);c.fillStyle='rgb('+pal.data.join(',')+')';dot(c,X(p1[0]),Y(p1[1]),semi?4:3);if(semi){c.strokeStyle=pal.accent;c.lineWidth=1.4;var ps=P(i,s),pr=P(i,r);c.beginPath();c.moveTo(X(p0[0]),Y(p0[1]));c.lineTo(X(ps[0]),Y(ps[1]));c.lineTo(X(pr[0]),Y(pr[1]));c.stroke();c.fillStyle=pal.bg;c.strokeStyle=pal.accent;dot(c,X(pr[0]),Y(pr[1]),5,true)}if(cm){var e=B[i],jig=[.42*Math.sin(i*4.1),.38*Math.cos(i*2.7)],back=[e[0]*(s)+jig[0]*(1-s),e[1]*(s)+jig[1]*(1-s)];c.setLineDash([4,3]);c.strokeStyle='rgba(217,79,79,.55)';c.beginPath();c.moveTo(X(p0[0]),Y(p0[1]));c.lineTo(X(e[0]),Y(e[1]));c.lineTo(X(back[0]),Y(back[1]));c.stroke();c.setLineDash([]);c.fillStyle='#d94f4f';dot(c,X(back[0]),Y(back[1]),2.5)}}el('tv').textContent=t.toFixed(2);el('sv').textContent=s.toFixed(2);el('rv').textContent=r.toFixed(2);el('rrow').style.opacity=semi?'1':'.38';el('err').textContent=semi?'0.000（解析精度）':'—';el('off').textContent=cm?'約 96%':'—'}function dot(c,x,y,r,stroke){c.beginPath();c.arc(x,y,r,0,Math.PI*2);stroke?c.stroke():c.fill()}function el(x){return document.getElementById(x)}['t','s','r','full','semi','cm'].forEach(x=>el(x).oninput=draw);window.addEventListener('resize',draw);function theme(){pal=NDFlow.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}NDFlow.onThemeChange(theme);theme()})();
</script></body></html>

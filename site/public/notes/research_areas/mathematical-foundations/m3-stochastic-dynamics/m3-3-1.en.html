<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> Langevin: potentials and equilibrium </title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:930px;margin:auto;padding:16px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.88rem;line-height:1.55;margin:.2rem 0 .7rem}.plot{width:100%;aspect-ratio:16/9;display:block;border-radius:10px}.controls{display:grid;gap:8px;margin-top:10px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}label{font-size:.8rem;font-weight:650}input[type=range]{width:118px;max-width:34vw}button,select{font:inherit;padding:4px 8px;border-radius:8px;border:1px solid #aaa;background:transparent;color:inherit}.stats{font-size:.79rem;font-variant-numeric:tabular-nums}.warn{color:#c65e54;font-weight:700}@media(max-width:640px){body{padding:6px}.card{padding:10px}.plot{aspect-ratio:1}}</style><script defer src="/personal_website/notes/research_areas/_english-demo.js"></script><style>html[lang="en"] .stats{overflow-wrap:anywhere}html[lang="en"] label{max-width:100%}</style></head><body><main class="card"><p class="goal"><b> Learning goal: </b> Vary potential, temperature, waiting time, and step size to separate stationarity, mixing, and discretization bias. </p><canvas id="cv" class="plot"></canvas><div class="controls"><div class="row"><label> Potential <select id="pot"><option value="bowl"> Bowl x²/2 </option><option value="wide"> Wide bowl x²/8 </option><option value="quartic"> Flat center x⁴/4 </option><option value="double"> Double well </option><option value="asym"> Asymmetric double well </option></select></label><label> Barrier scale k <input id="k" type="range" min=".5" max="12" step=".5" value="6"></label><b id="kv"></b><label> Temperature τ <input id="tau" type="range" min=".15" max="2" step=".05" value="1"></label><b id="ta">1.00</b></div><div class="row"><label>log₁₀ t <input id="time" type="range" min="-1" max="4" step=".05" value="1.3"></label><b id="tv"></b><label> Initial x₀ <input id="x0" type="range" min="-3" max="3" step=".1" value="-1"></label><b id="xv"></b><label> Initial spread <input id="spread" type="range" min="0" max="1" step=".05" value=".15"></label><label> Step size h <input id="h" type="range" min=".01" max="2.5" step=".01" value=".08"></label><b id="hv"></b><button id="reset"> Reset particles </button></div><div class="stats" id="stats"></div></div><p class="observe" id="obs"></p></main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},cv=E('cv'),D=MLF.hiDPICanvas(cv),pal=MLF.palette(),seed=419,data;
function V(x,p,k){if(p==='wide')return x*x/8;if(p==='quartic')return Math.pow(x,4)/4;if(p==='double'||p==='asym')return k*Math.pow(x*x-1,2)/4+(p==='asym'?.32*x:0);return x*x/2}
function stationary(p,k,tau){var x=[],w=[],z=0,n=241;for(var i=0;i<n;i++){var q=-4+8*i/(n-1),a=Math.exp(-V(q,p,k)/tau);x.push(q);w.push(a);z+=a}var dx=8/(n-1);for(i=0;i<n;i++)w[i]/=z*dx;return{x:x,p:w}}
function sampleCDF(r,st){var dx=st.x[1]-st.x[0],u=r(),a=0;for(var i=0;i<st.x.length;i++){a+=st.p[i]*dx;if(a>=u)return st.x[i]}return st.x[st.x.length-1]}
function run(){var p=E('pot').value,k=+E('k').value,tau=+E('tau').value,t=Math.pow(10,+E('time').value),x0=+E('x0').value,spread=+E('spread').value,h=+E('h').value,st=stationary(p,k,tau),r=MLF.rng(seed),xs=[],div=false,N=1600;if((p==='bowl'&&h>=2)||(p==='wide'&&h>=8))div=true;
 var a=p==='bowl'?1:(p==='wide'?.25:0),tmix=(p==='double'||p==='asym')?Math.exp(k/(4*tau)):(p==='quartic'?4:1/a),mix=1-Math.exp(-t/Math.max(tmix,.01));for(var j=0;j<N;j++){var x;if(div)x=(r()<.5?-1:1)*(4+8*r());else if(a){var decay=Math.exp(-a*t),v=tau/a*(1-Math.exp(-2*a*t))/Math.max(.05,1-a*h/2)+spread*spread*decay*decay;x=x0*decay+Math.sqrt(Math.max(v,1e-6))*r.normal()}else{x=r()<mix?sampleCDF(r,st):x0*Math.exp(-.3*t)+spread*r.normal();if(p==='double'||p==='asym'){var cross=.5*(1-Math.exp(-2*t/Math.max(tmix,.01))),well=r()<cross?(x0<0?1:-1):(x0<0?-1:1);if(r()>mix)x=well+.28*Math.sqrt(tau)*r.normal()}}xs.push(x)}data={p:p,k:k,tau:tau,t:t,x0:x0,spread:spread,h:h,st:st,xs:xs,tmix:tmix,div:div};draw()}
function draw(){if(!data)return;var s=D.resize(),c=D.ctx;MLF.clear(c,s,pal);var top={w:s.w,h:s.h*.51},vmax=0;for(var i=0;i<data.st.x.length;i++)vmax=Math.max(vmax,Math.min(10,V(data.st.x[i],data.p,data.k)));var ax=MLF.axes(c,top,{x:[-4,4],y:[0,Math.max(2,vmax)],xticks:[-4,-2,0,2,4],yticks:[0,Math.max(2,vmax)],fmty:function(y){return y.toFixed(0)},xlab:"Position x",ylab:'V(x)',pal:pal,pad:{l:.09,r:.03,t:.08,b:.18}}),pot=[];for(i=0;i<data.st.x.length;i++)pot.push([data.st.x[i],Math.min(Math.max(2,vmax),V(data.st.x[i],data.p,data.k))]);MLF.line(c,ax,pot,MLF.rgb(pal.a),3);var rr=MLF.rng(seed+7),show=Math.min(220,data.xs.length);for(i=0;i<show;i++){var x=data.xs[Math.floor(rr()*data.xs.length)];if(x<-4||x>4)continue;var y=Math.min(Math.max(2,vmax),V(x,data.p,data.k));c.fillStyle=MLF.rgb(data.div?pal.d:pal.b,.45);c.beginPath();c.arc(ax.X(x),ax.Y(y)-2-rr()*7,2.2,0,7);c.fill()}MLF.label(c,ax.box.l+6,ax.box.t+8,"Particles in the potential",pal.muted);
 c.save();c.translate(0,s.h*.53);var bot={w:s.w,h:s.h*.47},hist=MLF.hist(data.xs,-4,4,46),bw=8/hist.length,dens=hist.map(function(v){return v/(data.xs.length*bw)}),ym=Math.max(.08,Math.max.apply(null,dens)*1.15,Math.max.apply(null,data.st.p)*1.15),bx=MLF.axes(c,bot,{x:[-4,4],y:[0,ym],xticks:[-4,-2,0,2,4],yticks:[0,ym],fmty:function(y){return y.toFixed(2)},xlab:"Position x",ylab:"Density",pal:pal,pad:{l:.09,r:.03,t:.06,b:.22}});dens.forEach(function(v,i){var x=-4+i*bw;c.fillStyle=MLF.rgb(pal.b,.4);c.fillRect(bx.X(x),bx.Y(v),Math.max(1,bx.X(x+bw)-bx.X(x)-1),bx.box.b-bx.Y(v))});MLF.line(c,bx,data.st.x.map(function(x,i){return[x,data.st.p[i]]}),MLF.rgb(pal.d),3);MLF.legend(c,bx,[{t:"Particle histogram",c:MLF.rgb(pal.b)},{t:'e^{-V/τ}/Z',c:MLF.rgb(pal.d)}],'tr',pal);c.restore();
 var right=data.xs.filter(function(x){return x>0}).length/data.xs.length,mean=MLF.mean(data.xs),sd=MLF.std(data.xs);E('kv').textContent=data.k.toFixed(1);E('ta').textContent=data.tau.toFixed(2);E('tv').textContent=data.t.toFixed(1);E('xv').textContent=data.x0.toFixed(1);E('hv').textContent=data.h.toFixed(2);var st="Observed μ=<b>"+mean.toFixed(2)+'</b>, σ=<b>'+sd.toFixed(2)+'</b>';if(data.p==='double'||data.p==='asym')st+="Right-well fraction <b>"+right.toFixed(2)+"</b> · Barrier timescale estimate e^(ΔV/τ)=<b>"+data.tmix.toFixed(1)+'</b>';if(data.div)st+="<span class=\"warn\">This Euler step is unstable</span>";E('stats').innerHTML=st;E('obs').innerHTML="<b>Observe:</b>"+(data.div?"A large step can send the numerical particles out of the potential well.":data.p==='double'||data.p==='asym'?"A stationary density may exist, but a short run relative to barrier-crossing time can leave one well unexplored.":"Under adequate mixing, equilibrium depends on V and τ rather than x₀. Finite h introduces bias; the quadratic example can overestimate variance.")}
['pot','k','tau','time','x0','spread','h'].forEach(function(id){E(id).oninput=run});E('reset').onclick=function(){seed+=149;run()};function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);run();theme()})();
</script></body></html>

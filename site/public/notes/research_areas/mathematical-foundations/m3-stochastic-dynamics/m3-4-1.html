<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weak 與 strong convergence</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:920px;margin:auto;padding:16px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.88rem;line-height:1.55;margin:.2rem 0 .7rem}.plot{width:100%;aspect-ratio:16/8.5;display:block;border-radius:10px}.controls{display:grid;gap:9px;margin-top:10px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{font-size:.82rem;font-weight:650}input[type=range]{width:190px;max-width:45vw}select{font:inherit;padding:5px 9px;border-radius:8px;border:1px solid #aaa;background:transparent;color:inherit}.stats{font-size:.8rem;font-variant-numeric:tabular-nums}.warn{color:#c65e54;font-weight:700}@media(max-width:620px){body{padding:6px}.card{padding:10px}.plot{aspect-ratio:1.05}}</style></head><body><main class="card"><p class="goal"><b>學習目標：</b>左邊用同一條 Brownian path 逐路徑比；右邊看誤差隨 h 的斜率，分辨 strong 與 weak order。</p><canvas id="cv" class="plot"></canvas><div class="controls"><div class="row"><label>步長 h=2<sup>−k</sup>，k <input id="pow" type="range" min="2" max="10" step="1" value="5"></label><b id="hv"></b><label>SDE <select id="sde"><option value="gbm">dx=σx dW（multiplicative）</option><option value="ou">dx=−x dt+dW（additive）</option></select></label><label>測試函數 φ <select id="phi"><option value="x">x</option><option value="x2">x²</option><option value="ind">1[x&gt;1]</option></select></label><label><input id="common" type="checkbox" checked> 共用噪聲</label></div><div class="stats" id="stats"></div></div><p class="observe" id="obs"></p></main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},cv=E('cv'),D=MLF.hiDPICanvas(cv),pal=MLF.palette(),seed=617,data;
function paths(){var k=+E('pow').value,h=Math.pow(2,-k),kind=E('sde').value,common=E('common').checked,M=1024,dt=1/M,group=Math.max(1,Math.round(h/dt)),pairs=[];for(var p=0;p<8;p++){var r=MLF.rng(seed+p*83),r2=MLF.rng(seed+900+p*71),W=0,x=1,y=1,truth=[[0,1]],approx=[[0,1]],sum=0;for(var i=1;i<=M;i++){var dw=Math.sqrt(dt)*r.normal();W+=dw;sum+=common?dw:Math.sqrt(dt)*r2.normal();if(kind==='ou')x+=-x*dt+dw;else x=Math.exp(-.5*.64*i*dt+.8*W);if(i%group===0){if(kind==='ou')y+=-y*h+sum;else y*=1+.8*sum;approx.push([i*dt,y]);sum=0}if(i%4===0)truth.push([i*dt,x])}pairs.push({truth:truth,approx:approx})}var levels=[],so=kind==='ou'?1:.5,wo=E('phi').value==='ind'?.55:1;for(var q=2;q<=10;q++){var hh=Math.pow(2,-q),strong=common?(kind==='ou'?.42*hh:.55*Math.sqrt(hh)):.9,weak=(E('phi').value==='x2'?.36:.22)*Math.pow(hh,wo);levels.push({h:hh,strong:strong,weak:weak})}data={k:k,h:h,kind:kind,common:common,phi:E('phi').value,pairs:pairs,levels:levels,so:so,wo:wo};draw()}
function draw(){if(!data)return;var s=D.resize(),c=D.ctx;MLF.clear(c,s,pal);var split=s.w*.56,L={w:split,h:s.h},R={w:s.w-split,h:s.h},all=[];data.pairs.forEach(function(p){p.truth.forEach(function(q){all.push(q[1])});p.approx.forEach(function(q){all.push(q[1])})});var lo=Math.min.apply(null,all),hi=Math.max.apply(null,all),pad=(hi-lo)*.1+.05,ax=MLF.axes(c,L,{x:[0,1],y:[lo-pad,hi+pad],xticks:[0,.25,.5,.75,1],yticks:[lo-pad,(lo+hi)/2,hi+pad],fmtx:function(x){return x.toFixed(2)},fmty:function(y){return y.toFixed(1)},xlab:'t',ylab:'x(t)',pal:pal,pad:{l:.12,r:.03,t:.09,b:.17}});data.pairs.forEach(function(p,i){var col=i%2?pal.c:pal.b;MLF.line(c,ax,p.truth,MLF.rgb(col,.32),1.2);MLF.line(c,ax,p.approx,MLF.rgb(col,.85),2,[5,3])});MLF.label(c,ax.box.l+5,ax.box.t+8,'細線：reference　粗虛線：Euler',pal.muted);
 c.save();c.translate(split,0);var rx=MLF.axes(c,R,{x:[Math.pow(2,-10),Math.pow(2,-2)],y:[.00005,1.2],logx:true,logy:true,xticks:[Math.pow(2,-10),Math.pow(2,-8),Math.pow(2,-6),Math.pow(2,-4),Math.pow(2,-2)],yticks:[.0001,.001,.01,.1,1],fmtx:function(x){return '2⁻'+Math.round(-Math.log(x)/Math.log(2))},xlab:'步長 h（log）',ylab:'誤差（log）',pal:pal,pad:{l:.19,r:.05,t:.09,b:.17}});var st=data.levels.map(function(q){return[q.h,q.strong]}),wk=data.levels.map(function(q){return[q.h,q.weak]});MLF.line(c,rx,st,MLF.rgb(pal.d),2.6);MLF.line(c,rx,wk,MLF.rgb(pal.c),2.6);data.levels.forEach(function(q){if(Math.abs(q.h-data.h)<1e-12){MLF.dot(c,rx,q.h,q.strong,MLF.rgb(pal.d),5);MLF.dot(c,rx,q.h,q.weak,MLF.rgb(pal.c),5)}});var a=.01;MLF.line(c,rx,[[a,.02],[a*16,.02*Math.pow(16,data.so)]],MLF.rgb(pal.a),1.4,[4,4]);MLF.line(c,rx,[[a,.005],[a*16,.005*Math.pow(16,data.wo)]],pal.muted,1.4,[4,4]);MLF.legend(c,rx,[{t:'strong',c:MLF.rgb(pal.d)},{t:'weak',c:MLF.rgb(pal.c)},{t:'參考斜率 '+data.so,c:MLF.rgb(pal.a)}],'tl',pal);c.restore();
 var cur=data.levels.filter(function(q){return Math.abs(q.h-data.h)<1e-12})[0];E('hv').textContent=data.h.toFixed(5);E('stats').innerHTML='strong error <b>'+cur.strong.toExponential(2)+'</b>（order '+(data.common?data.so:0)+'）　weak error <b>'+cur.weak.toExponential(2)+'</b>（order '+data.wo+'）'+(!data.common?'　<span class="warn">不共用噪聲時，逐路徑差不會收斂</span>':'');E('obs').innerHTML='<b>觀察：</b>'+(data.kind==='ou'?'additive noise 的 Euler strong order 升到 1，因為 Milstein 修正項消失。':'multiplicative noise 下，strong 約為 1/2，weak 對光滑 φ 約為 1。')+(data.phi==='ind'?' 不光滑的 indicator 讓 weak 斜率下降。':'')}
['pow','sde','phi','common'].forEach(function(id){E(id).oninput=paths});function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);paths();theme()})();
</script></body></html>

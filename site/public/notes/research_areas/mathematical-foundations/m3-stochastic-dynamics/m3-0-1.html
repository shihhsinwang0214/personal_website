<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>醉漢的 √t</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:920px;margin:auto;padding:16px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.88rem;line-height:1.55;margin:.2rem 0 .7rem}.plot{width:100%;aspect-ratio:16/8.3;display:block;border-radius:10px}.controls{display:grid;gap:9px;margin-top:12px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{font-size:.82rem;font-weight:650}input[type=range]{width:155px;max-width:42vw}button,select{font:inherit;padding:5px 9px;border-radius:8px;border:1px solid #aaa;background:transparent;color:inherit}button{cursor:pointer}.stats{font-size:.8rem;font-variant-numeric:tabular-nums}.warn{color:#c65e54;font-weight:700}@media(max-width:620px){body{padding:6px}.card{padding:10px}.plot{aspect-ratio:1.1}.row{gap:7px}}</style></head><body><main class="card">
<p class="goal"><b>學習目標：</b>比較步長縮放、相鄰相關與重尾如何改變典型距離；左圖看路徑，右圖直接量 RMS 的 log–log 斜率。</p>
<canvas id="cv" class="plot" aria-label="隨機漫步路徑與均方根距離"></canvas>
<div class="controls"><div class="row"><label>每步時間 h <input id="hi" type="range" min="0" max="2" step="1" value="1"></label><b id="hv"></b><label>步長縮放 <select id="scale"><option value="sqrt">δ=√h</option><option value="h">δ=h</option><option value="one">δ=1 不縮</option></select></label><label>單步分布 <select id="dist"><option value="sign">±1</option><option value="normal">Gaussian</option><option value="cauchy">Cauchy 重尾</option></select></label></div>
<div class="row"><label>相鄰相關 ρ <input id="rho" type="range" min="-.9" max=".9" step=".05" value="0"></label><b id="rv">0.00</b><button id="resample">重抽</button></div><div class="stats" id="stats"></div></div>
<p class="observe" id="obs"></p></main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},cv=E('cv'),D=MLF.hiDPICanvas(cv),pal=MLF.palette(),seed=31,hvals=[1,.1,.01],cache;
function stepNoise(r,kind){if(kind==='sign')return r()<.5?-1:1;if(kind==='cauchy')return Math.tan(Math.PI*(Math.min(.9999,Math.max(.0001,r()))-.5));return r.normal()}
function run(){var h=hvals[+E('hi').value],rule=E('scale').value,rho=+E('rho').value,kind=E('dist').value,T=60,n=Math.round(T/h),paths=48,keep=Math.max(1,Math.floor(n/100)),delta=rule==='sqrt'?Math.sqrt(h):(rule==='h'?h:1),times=[],ss=[],all=[],end=[];for(var j=0;j<=n;j+=keep){times.push(j*h);ss.push(0)}if(times[times.length-1]<T){times.push(T);ss.push(0)}
 for(var p=0;p<paths;p++){var r=MLF.rng(seed+p*97),y=0,prev=0,pts=[[0,0]],ki=1;for(var i=1;i<=n;i++){var z=stepNoise(r,kind);if(kind!=='cauchy')z=rho*prev+Math.sqrt(Math.max(0,1-rho*rho))*z;else z=z+rho*prev*.15;prev=z;y+=delta*z;if(i%keep===0&&ki<times.length){pts.push([i*h,y]);ss[ki]+=y*y;ki++}}while(ki<times.length){pts.push([T,y]);ss[ki]+=y*y;ki++}all.push(pts);end.push(y)}for(var k=0;k<ss.length;k++)ss[k]=Math.sqrt(ss[k]/paths);cache={h:h,rule:rule,rho:rho,kind:kind,T:T,paths:all,times:times,rms:ss,end:end,delta:delta};draw()}
function draw(){if(!cache)return;var s=D.resize(),c=D.ctx;MLF.clear(c,s,pal);var split=s.w*(s.w<620?.5:.55),left={w:split,h:s.h},right={w:s.w-split,h:s.h};c.save();c.beginPath();c.rect(0,0,split,s.h);c.clip();var med=MLF.median(cache.end.map(Math.abs)),yr=Math.max(3,MLF.quantile(cache.end.map(Math.abs),.9)*1.35,med*2),ax=MLF.axes(c,left,{x:[0,60],y:[-yr,yr],xticks:[0,15,30,45,60],yticks:[-yr,0,yr],fmtx:function(x){return x},fmty:function(y){return y.toFixed(0)},xlab:'時間 t',ylab:'位置',pal:pal,pad:{l:.12,r:.03,t:.09,b:.17}});cache.paths.forEach(function(q){MLF.line(c,ax,q,MLF.rgb(pal.b,.22),1)});var factor=cache.kind==='cauchy'?1:Math.sqrt((1+cache.rho)/(1-cache.rho)),base=cache.delta/Math.sqrt(cache.h);var up=[],dn=[],lin=[];for(var i=0;i<=60;i++){var v=base*factor*Math.sqrt(i);up.push([i,v]);dn.push([i,-v]);lin.push([i,base*i])}MLF.line(c,ax,up,MLF.rgb(pal.d),2,[5,4]);MLF.line(c,ax,dn,MLF.rgb(pal.d),2,[5,4]);MLF.line(c,ax,lin,MLF.rgb(pal.a,.45),1,[3,4]);MLF.label(c,ax.box.l+5,ax.box.t+8,'48 條代表路徑',pal.muted);c.restore();
 c.save();c.translate(split,0);var ymin=Math.max(.015,cache.rms.filter(function(x){return x>0})[0]||.02),ymax=Math.max(ymin*10,Math.max.apply(null,cache.rms)*1.4),rax=MLF.axes(c,right,{x:[Math.max(cache.h,.01),60],y:[ymin,ymax],logx:true,logy:true,xticks:[.01,.1,1,10,60].filter(function(x){return x>=cache.h}),yticks:[.1,1,10,100,1000].filter(function(x){return x>=ymin&&x<=ymax}),xlab:'時間 t（log）',ylab:'RMS 距離（log）',pal:pal,pad:{l:.18,r:.05,t:.09,b:.17}});var rp=[];for(i=1;i<cache.times.length;i++)if(cache.rms[i]>0)rp.push([cache.times[i],cache.rms[i]]);MLF.line(c,rax,rp,MLF.rgb(pal.b),2.5);var x0=Math.max(cache.h,.05),y0=Math.max(ymin*1.7,rp[Math.min(2,rp.length-1)]?rp[Math.min(2,rp.length-1)][1]:1);MLF.line(c,rax,[[x0,y0],[Math.min(60,x0*20),y0*Math.sqrt(Math.min(60,x0*20)/x0)]],MLF.rgb(pal.c),1.5,[5,4]);MLF.line(c,rax,[[x0,y0*.65],[Math.min(60,x0*20),y0*.65*Math.min(60,x0*20)/x0]],MLF.rgb(pal.d),1.5,[5,4]);MLF.label(c,rax.box.l+6,rax.box.t+8,'實測 RMS',MLF.rgb(pal.b));MLF.label(c,rax.box.r-5,rax.box.t+20,'斜率 1/2',MLF.rgb(pal.c),'right');MLF.label(c,rax.box.r-5,rax.box.t+36,'斜率 1',MLF.rgb(pal.d),'right');c.restore();
 var theory=cache.kind==='cauchy'?NaN:cache.delta/Math.sqrt(cache.h)*Math.sqrt(60)*factor,meas=Math.sqrt(cache.end.reduce(function(a,x){return a+x*x},0)/cache.end.length);E('hv').textContent=cache.h.toFixed(2)+' 秒';E('rv').textContent=cache.rho.toFixed(2);E('stats').innerHTML='t=60 實測 RMS <b>'+meas.toFixed(2)+'</b>　'+(isFinite(theory)?'有限 variance 理論 <b>'+theory.toFixed(2)+'</b>　相關放大因子 <b>'+factor.toFixed(2)+'</b>':'<span class="warn">Cauchy 沒有 variance，RMS 由少數極端跳躍支配</span>');E('obs').innerHTML=cache.kind==='cauchy'?'<b>觀察：</b>重尾把斜率推近 1，而且每次重抽都會大幅改變曲線。':'<b>觀察：</b>δ=√h 時縮小 h 不改整體尺度；δ=h 會塌向 0，δ=1 則隨步頻增加而爆開。相關主要平移曲線，不改 √t 指數。'}
['hi','scale','dist','rho'].forEach(function(id){E(id).oninput=run});E('resample').onclick=function(){seed+=101;run()};function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);run();theme()})();
</script></body></html>

<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fokker–Planck：粒子與密度</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:940px;margin:auto;padding:16px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.88rem;line-height:1.55;margin:.2rem 0 .7rem}.plot{width:100%;aspect-ratio:16/9;display:block;border-radius:10px}.controls{display:grid;gap:8px;margin-top:10px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}label{font-size:.8rem;font-weight:650}input[type=range]{width:120px;max-width:35vw}select{font:inherit;padding:4px 8px;border-radius:8px;border:1px solid #aaa;background:transparent;color:inherit}.stats{font-size:.79rem;font-variant-numeric:tabular-nums}.warn{color:#c65e54;font-weight:700}@media(max-width:640px){body{padding:6px}.card{padding:10px}.plot{aspect-ratio:1}.row{gap:6px}}</style></head><body><main class="card"><p class="goal"><b>學習目標：</b>同時追粒子與解密度方程：drift 搬、noise 攤。特別比較有限步長下 Gaussian 與同 variance 的 uniform 增量。</p><canvas id="cv" class="plot"></canvas>
<div class="controls"><div class="row"><label>時間 t <input id="time" type="range" min="0" max="60" step="1" value="18"></label><b id="tv"></b><label>粒子 N（log） <input id="N" type="range" min="2" max="4.3" step=".1" value="3.3"></label><b id="Nv"></b><label>粒子步長 h <select id="h"><option>2</option><option>1</option><option value=".5">0.5</option><option value=".25" selected>0.25</option></select></label></div><div class="row"><label>主流 c <input id="c" type="range" min="-.5" max=".8" step=".05" value=".3"></label><b id="cvv"></b><label>亂流 g <input id="g" type="range" min="0" max="1.2" step=".05" value=".55"></label><b id="gv"></b><label>drift <select id="drift"><option value="constant">等速</option><option value="pull">收攏 −0.1x</option><option value="double">雙井</option></select></label><label>噪聲 <select id="noise"><option value="normal">Gaussian</option><option value="uniform">uniform（同 variance）</option><option value="cauchy">Cauchy</option></select></label><label>p₀ <select id="p0"><option value="narrow">窄 Gaussian</option><option value="double">雙峰</option></select></label><label><input id="split" type="checkbox"> 分開看搬／攤</label></div><div class="stats" id="stats"></div></div><p class="observe" id="obs"></p></main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},cv=E('cv'),D=MLF.hiDPICanvas(cv),pal=MLF.palette(),seed=211,data;
function drift(x,type,c){if(type==='pull')return -.1*x;if(type==='double')return Math.max(-3,Math.min(3,.55*x-.09*x*x*x));return c}
function initDensity(x,p0){function n(x,m,s){return Math.exp(-.5*(x-m)*(x-m)/(s*s))/(Math.sqrt(2*Math.PI)*s)}return p0==='double'?.5*n(x,-2,.38)+.5*n(x,2,.38):n(x,0,.38)}
function solvePDE(t,type,c,g,p0){var lo=-8,hi=8,nx=121,dx=(hi-lo)/(nx-1),p=[],x=[],i;for(i=0;i<nx;i++){x[i]=lo+i*dx;p[i]=initDensity(x[i],p0)}var maxf=type==='double'?3:Math.max(.2,Math.abs(c)),dt=Math.min(.012,dx/(maxf*3),dx*dx/Math.max(4*g*g,.01)),steps=t?Math.ceil(t/dt):0;dt=steps?t/steps:0;for(var st=0;st<steps;st++){var q=new Array(nx).fill(0);for(i=1;i<nx-1;i++){var adv=-(drift(x[i+1],type,c)*p[i+1]-drift(x[i-1],type,c)*p[i-1])/(2*dx),dif=.5*g*g*(p[i+1]-2*p[i]+p[i-1])/(dx*dx);q[i]=Math.max(0,p[i]+dt*(adv+dif))}var z=0;for(i=0;i<nx;i++)z+=q[i]*dx;if(z>0)for(i=0;i<nx;i++)q[i]/=z;p=q}return{x:x,p:p}}
function noise(r,k){if(k==='uniform')return Math.sqrt(3)*(2*r()-1);if(k==='cauchy')return Math.max(-30,Math.min(30,Math.tan(Math.PI*(Math.min(.9999,Math.max(.0001,r()))-.5))));return r.normal()}
function sample(){var t=+E('time').value,N=Math.round(Math.pow(10,+E('N').value)),h=+E('h').value,c=+E('c').value,g=+E('g').value,type=E('drift').value,nk=E('noise').value,p0=E('p0').value,r=MLF.rng(seed),parts=[],steps=Math.ceil(t/h),dt=steps?t/steps:0;for(var j=0;j<N;j++){var x=p0==='double'?(r()<.5?-2:2)+.38*r.normal():.38*r.normal();for(var k=0;k<steps;k++)x+=drift(x,type,c)*dt+g*Math.sqrt(dt)*noise(r,nk);parts.push(x)}var pde=solvePDE(t,type,c,g,p0),onlyD=null,onlyA=null;if(E('split').checked){onlyA=solvePDE(t,type,c,0,p0);onlyD=solvePDE(t,'constant',0,g,p0)}data={t:t,N:N,h:h,c:c,g:g,type:type,nk:nk,p0:p0,parts:parts,pde:pde,onlyA:onlyA,onlyD:onlyD};draw()}
function draw(){if(!data)return;var s=D.resize(),c=D.ctx;MLF.clear(c,s,pal);var top={w:s.w,h:s.h*.67},lo=-8,hi=8,hist=MLF.hist(data.parts,lo,hi,48),bw=(hi-lo)/hist.length,dens=hist.map(function(v){return v/(data.N*bw)}),ym=Math.max(.08,Math.max.apply(null,dens)*1.15,Math.max.apply(null,data.pde.p)*1.15),ax=MLF.axes(c,top,{x:[lo,hi],y:[0,ym],xticks:[-8,-4,0,4,8],yticks:[0,ym/2,ym],fmtx:function(x){return x},fmty:function(y){return y.toFixed(2)},xlab:'位置 x',ylab:'密度',pal:pal,pad:{l:.09,r:.03,t:.08,b:.16}});dens.forEach(function(v,i){var x=lo+i*bw;c.fillStyle=MLF.rgb(pal.b,.42);c.fillRect(ax.X(x),ax.Y(v),Math.max(1,ax.X(x+bw)-ax.X(x)-1),ax.box.b-ax.Y(v))});MLF.line(c,ax,data.pde.x.map(function(x,i){return[x,data.pde.p[i]]}),MLF.rgb(pal.d),3);if(data.onlyA){MLF.line(c,ax,data.onlyA.x.map(function(x,i){return[x,data.onlyA.p[i]]}),MLF.rgb(pal.c),1.6,[5,4]);MLF.line(c,ax,data.onlyD.x.map(function(x,i){return[x,data.onlyD.p[i]]}),MLF.rgb(pal.a),1.6,[3,4])}MLF.legend(c,ax,[{t:'粒子 histogram',c:MLF.rgb(pal.b)},{t:'Fokker–Planck',c:MLF.rgb(pal.d)}].concat(data.onlyA?[{t:'只搬',c:MLF.rgb(pal.c)},{t:'只攤',c:MLF.rgb(pal.a)}]:[]),'tr',pal);
 var y0=s.h*.72,y1=s.h*.9;c.fillStyle=pal.dark?'#24313a':'#e6eff1';c.fillRect(ax.box.l,y0,ax.box.w,y1-y0);c.fillStyle=MLF.rgb(pal.c,.35);c.fillRect(ax.box.l,y1,ax.box.w,s.h-y1);var show=Math.min(350,data.parts.length),r=MLF.rng(seed+9);for(var j=0;j<show;j++){var x=data.parts[Math.floor(r()*data.parts.length)];if(x<lo||x>hi)continue;c.fillStyle=MLF.rgb(data.nk==='cauchy'?pal.d:pal.b,.5);c.beginPath();c.arc(ax.X(x),y0+6+r()*(y1-y0-12),2,0,7);c.fill()}c.fillStyle=pal.muted;c.font='11px system-ui';c.fillText('同一批葉子的位置點雲',ax.box.l+5,y0+14);var peaks=0,p=data.pde.p;for(var i=1;i<p.length-1;i++)if(p[i]>p[i-1]&&p[i]>p[i+1]&&p[i]>.08*Math.max.apply(null,p))peaks++;E('tv').textContent=data.t.toFixed(0);E('Nv').textContent=data.N;E('cvv').textContent=data.c.toFixed(2);E('gv').textContent=data.g.toFixed(2);var msg='PDE 峰數 <b>'+peaks+'</b>　粒子均值 <b>'+MLF.mean(data.parts).toFixed(2)+'</b>　標準差 <b>'+MLF.std(data.parts).toFixed(2)+'</b>';if(data.nk==='cauchy')msg+='　<span class="warn">E[ε²]=∞：二階 PDE 不再描述尾巴</span>';if(data.nk==='uniform'&&data.h>=1)msg+='　<span class="warn">有限 h：uniform 卷積仍非 Gaussian</span>';E('stats').innerHTML=msg;E('obs').innerHTML='<b>觀察：</b>'+(data.nk==='uniform'?'uniform 與 Gaussian 只共享 h→0 的二階極限；目前 h='+data.h+'，把 h 調小才會逐步貼近 PDE。':data.nk==='cauchy'?'重尾的單次大跳不會被有限 variance 的二階項吸收。':'N 越大，直方圖的抽樣起伏越小；g=0 時只剩搬運，沒有攤平。')}
['time','N','h','c','g','drift','noise','p0','split'].forEach(function(id){E(id).oninput=sample});function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);sample();theme()})();
</script></body></html>

<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Euler–Maruyama</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:920px;margin:auto;padding:16px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.88rem;line-height:1.55;margin:.2rem 0 .7rem}.plot{width:100%;aspect-ratio:16/8.3;display:block;border-radius:10px}.controls{display:grid;gap:9px;margin-top:12px}.row{display:flex;gap:11px;align-items:center;flex-wrap:wrap}label{font-size:.82rem;font-weight:650}input[type=range]{width:125px;max-width:38vw}button,select{font:inherit;padding:5px 9px;border-radius:8px;border:1px solid #aaa;background:transparent;color:inherit}.stats{font-size:.8rem;font-variant-numeric:tabular-nums}.warn{color:#c65e54;font-weight:700}@media(max-width:620px){body{padding:6px}.card{padding:10px}.plot{aspect-ratio:1.05}}</style></head><body><main class="card"><p class="goal"><b>學習目標：</b>Euler–Maruyama 每步先走 drift×h，再加 noise×√h；只有這個噪聲尺度在改變步長後保留同一把扇子。</p><canvas id="cv" class="plot"></canvas>
<div class="controls"><div class="row"><label>步長 h <input id="hi" type="range" min="0" max="4" step="1" value="2"></label><b id="hv"></b><label>主流 c <input id="c" type="range" min=".2" max="1" step=".05" value=".5"></label><b id="cvv"></b><label>亂流 g <input id="g" type="range" min="0" max=".8" step=".05" value=".3"></label><b id="gv"></b></div><div class="row"><label>噪聲尺度 <select id="scale"><option value="sqrt">√h ε（正確）</option><option value="h">h ε</option><option value="one">ε 不縮放</option></select></label><label>相關 ρ <input id="rho" type="range" min="0" max=".95" step=".05" value="0"></label><b id="rv"></b><label>drift <select id="drift"><option value="constant">等速</option><option value="pull">往中線拉回 −0.1y</option><option value="wave">擺動 0.1cos(x/5)</option></select></label><button id="resample">重抽</button></div><div class="stats" id="stats"></div></div><p class="observe" id="obs"></p></main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},cv=E('cv'),D=MLF.hiDPICanvas(cv),pal=MLF.palette(),seed=73,hvals=[3,1,.3,.1,.03],data;
function run(){var h=hvals[+E('hi').value],c=+E('c').value,g=+E('g').value,rho=+E('rho').value,rule=E('scale').value,kind=E('drift').value,T=60,n=Math.ceil(T/h),delta=rule==='sqrt'?Math.sqrt(h):(rule==='h'?h:1),paths=[],ends=[];for(var p=0;p<120;p++){var r=MLF.rng(seed+p*41),y=0,prev=0,pts=[[0,0]];for(var i=1;i<=n;i++){var t=Math.min(T,i*h),z=rho*prev+Math.sqrt(1-rho*rho)*r.normal();prev=z;var fy=kind==='pull'?-.1*y:(kind==='wave'?.1*Math.cos(c*t/5):0);y+=fy*h+g*delta*z;if(i%Math.max(1,Math.floor(n/90))===0||i===n)pts.push([t,y])}paths.push(pts);ends.push(y)}data={h:h,c:c,g:g,rho:rho,rule:rule,kind:kind,T:T,paths:paths,ends:ends,delta:delta};draw()}
function normal(x,m,sd){return Math.exp(-.5*(x-m)*(x-m)/(sd*sd))/(Math.sqrt(2*Math.PI)*sd)}
function draw(){if(!data)return;var s=D.resize(),c=D.ctx;MLF.clear(c,s,pal);var split=s.w*.64,L={w:split,h:s.h},R={w:s.w-split,h:s.h},mean=MLF.mean(data.ends),sd=MLF.std(data.ends),theory=data.g*Math.sqrt(data.T),yr=Math.max(2,MLF.quantile(data.ends.map(Math.abs),.96)*1.25,theory*2.3),ax=MLF.axes(c,L,{x:[0,60],y:[-yr,yr],xticks:[0,15,30,45,60],yticks:[-yr,0,yr],fmtx:function(x){return x},fmty:function(y){return y.toFixed(1)},xlab:'時間 t',ylab:'橫向位置 y',pal:pal,pad:{l:.12,r:.03,t:.09,b:.17}});data.paths.forEach(function(q){MLF.line(c,ax,q,MLF.rgb(pal.b,.17),1)});var center=[],up=[],dn=[];for(var t=0;t<=60;t++){var m=data.kind==='wave'?.1*5/data.c*Math.sin(data.c*t/5):0;if(data.kind==='pull')m=0;center.push([t,m]);up.push([t,m+data.g*Math.sqrt(t)]);dn.push([t,m-data.g*Math.sqrt(t)])}MLF.line(c,ax,center,pal.ink,3);MLF.line(c,ax,up,MLF.rgb(pal.d),2,[6,4]);MLF.line(c,ax,dn,MLF.rgb(pal.d),2,[6,4]);MLF.label(c,ax.box.l+6,ax.box.t+8,'120 條路徑＋ODE 中心線',pal.muted);
 c.save();c.translate(split,0);var lo=-yr,hi=yr,hist=MLF.hist(data.ends,lo,hi,22),mx=Math.max.apply(null,hist.concat([1])),rax=MLF.axes(c,R,{x:[lo,hi],y:[0,mx*1.18],xticks:[-yr,0,yr],yticks:[0,mx],fmtx:function(x){return x.toFixed(1)},fmty:function(y){return y.toFixed(0)},xlab:'t=T 的橫向位置',pal:pal,pad:{l:.15,r:.05,t:.09,b:.17}});var bw=(hi-lo)/hist.length;hist.forEach(function(v,i){var x=lo+i*bw;c.fillStyle=MLF.rgb(pal.b,.55);c.fillRect(rax.X(x),rax.Y(v),Math.max(1,rax.X(x+bw)-rax.X(x)-1),rax.box.b-rax.Y(v))});var curve=[],normScale=data.ends.length*bw;for(var x=lo;x<=hi;x+=(hi-lo)/100)curve.push([x,normal(x,0,Math.max(theory,.01))*normScale]);MLF.line(c,rax,curve,MLF.rgb(pal.d),2.5);MLF.label(c,rax.box.l+5,rax.box.t+8,'理論 N(0,g²T)',MLF.rgb(pal.d));c.restore();
 E('hv').textContent=data.h.toFixed(2);E('cvv').textContent=data.c.toFixed(2);E('gv').textContent=data.g.toFixed(2);E('rv').textContent=data.rho.toFixed(2);E('stats').innerHTML='實測 μ=<b>'+mean.toFixed(2)+'</b>、σ=<b>'+sd.toFixed(2)+'</b>　Brownian 理論 σ=<b>'+theory.toFixed(2)+'</b>'+(data.rho>0?'　<span class="warn">相關噪聲不是 Brownian 增量</span>':'');E('obs').innerHTML='<b>觀察：</b>'+(data.rule==='sqrt'?'√h 尺度下，改 h 只改路徑細緻度，不改扇形寬度。':data.rule==='h'?'h 尺度讓噪聲隨 h 變小而消失。':'不縮放讓每秒步數越多、扇子越爆開。')}
['hi','c','g','rho','scale','drift'].forEach(function(id){E(id).oninput=run});E('resample').onclick=function(){seed+=137;run()};function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);run();theme()})();
</script></body></html>

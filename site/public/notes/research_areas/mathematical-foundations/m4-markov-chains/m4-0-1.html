<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markov chain mixing</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:920px;margin:auto;padding:16px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.88rem;line-height:1.55;margin:.2rem 0 .7rem}.plot{width:100%;aspect-ratio:16/8.4;display:block;border-radius:10px}.controls{display:grid;gap:9px;margin-top:10px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{font-size:.82rem;font-weight:650}input[type=range]{width:170px;max-width:43vw}button{font:inherit;padding:5px 9px;border-radius:8px;border:1px solid #aaa;background:transparent;color:inherit}.stats{font-size:.8rem;font-variant-numeric:tabular-nums}.warn{color:#c65e54;font-weight:700}@media(max-width:620px){body{padding:6px}.card{padding:10px}.plot{aspect-ratio:1.05}}</style></head><body><main class="card"><p class="goal"><b>學習目標：</b>改變 transition matrix，觀察 stationary distribution 與忘掉起點的速度；再加入一格歷史，直接看二狀態 Markov 預測失效。</p><canvas id="cv" class="plot"></canvas><div class="controls"><div class="row"><label>a=P(S→S) <input id="a" type="range" min="0" max="1" step=".01" value=".8"></label><b id="av"></b><label>b=P(R→R) <input id="b" type="range" min="0" max="1" step=".01" value=".6"></label><b id="bv"></b><label><input id="memory" type="checkbox"> 加入記憶</label><button id="sim">模擬一條 1000 天紀錄</button></div><div class="stats" id="stats"></div></div><p class="observe" id="obs"></p></main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},cv=E('cv'),D=MLF.hiDPICanvas(cv),pal=MLF.palette(),seed=811,data;
function memoryCurve(a,b){var M=5000,r=MLF.rng(seed+17),state=new Array(M).fill(1),run=new Array(M).fill(1),out=[1];for(var n=1;n<=30;n++){var s=0;for(var j=0;j<M;j++){if(state[j]){var stay=run[j]>=2?Math.max(0,a-.3):a;state[j]=r()<stay?1:0;run[j]=state[j]?run[j]+1:0}else{state[j]=r()<(1-b)?1:0;run[j]=state[j]?1:0}s+=state[j]}out.push(s/M)}return out}
function path(a,b,mem){var r=MLF.rng(seed),arr=[],st=1,run=1;for(var i=0;i<1000;i++){arr.push(st);if(st){var q=mem&&run>=2?Math.max(0,a-.3):a;st=r()<q?1:0;run=st?run+1:0}else{st=r()<(1-b)?1:0;run=st?1:0}}return arr}
function calc(){var a=+E('a').value,b=+E('b').value,den=2-a-b,pi=den?((1-b)/den):.5,lam=a+b-1,ps=[1],pr=[0];for(var n=0;n<30;n++){ps.push(ps[n]*a+(1-ps[n])*(1-b));pr.push(pr[n]*a+(1-pr[n])*(1-b))}var mem=E('memory').checked,mc=mem?memoryCurve(a,b):null,arr=path(a,b,mem);data={a:a,b:b,pi:pi,lam:lam,ps:ps,pr:pr,mc:mc,arr:arr,mem:mem};draw()}
function arrow(c,x1,y1,x2,y2,col,w){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();var an=Math.atan2(y2-y1,x2-x1);c.fillStyle=col;c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-9*Math.cos(an-.5),y2-9*Math.sin(an-.5));c.lineTo(x2-9*Math.cos(an+.5),y2-9*Math.sin(an+.5));c.fill()}
function draw(){if(!data)return;var s=D.resize(),c=D.ctx;MLF.clear(c,s,pal);var split=s.w*.38;c.strokeStyle=pal.axis;c.strokeRect(12,18,split-22,s.h-36);var x1=split*.3,x2=split*.72,y=s.h*.34;c.fillStyle=MLF.rgb(pal.a,.25);c.beginPath();c.arc(x1,y,37,0,7);c.fill();c.strokeStyle=MLF.rgb(pal.a);c.stroke();c.fillStyle=MLF.rgb(pal.b,.25);c.beginPath();c.arc(x2,y,37,0,7);c.fill();c.strokeStyle=MLF.rgb(pal.b);c.stroke();c.fillStyle=pal.ink;c.font='bold 15px system-ui';c.textAlign='center';c.fillText('S 晴',x1,y+5);c.fillText('R 雨',x2,y+5);arrow(c,x1+38,y-12,x2-38,y-12,MLF.rgb(pal.d),2+7*(1-data.a));arrow(c,x2-38,y+12,x1+38,y+12,MLF.rgb(pal.c),2+7*(1-data.b));c.font='12px system-ui';c.fillText((1-data.a).toFixed(2),split*.51,y-25);c.fillText((1-data.b).toFixed(2),split*.51,y+35);c.strokeStyle=MLF.rgb(pal.a);c.lineWidth=2+6*data.a;c.beginPath();c.arc(x1,y-48,28,.2,5.4);c.stroke();c.fillStyle=pal.ink;c.fillText('留 S '+data.a.toFixed(2),x1,y-86);c.strokeStyle=MLF.rgb(pal.b);c.lineWidth=2+6*data.b;c.beginPath();c.arc(x2,y-48,28,.2,5.4);c.stroke();c.fillText('留 R '+data.b.toFixed(2),x2,y-86);c.textAlign='left';c.fillStyle=pal.muted;c.fillText(data.mem?'灰線：規則會看連續晴天數':'箭頭粗細隨 transition probability',24,s.h-34);
 c.save();c.translate(split,0);var R={w:s.w-split,h:s.h*.7},ax=MLF.axes(c,R,{x:[0,30],y:[0,1],xticks:[0,5,10,20,30],yticks:[0,.25,.5,.75,1],xlab:'天數 n',ylab:'pₙ(S)',pal:pal,pad:{l:.13,r:.04,t:.08,b:.17}});MLF.line(c,ax,data.ps.map(function(v,i){return[i,v]}),MLF.rgb(pal.a),2.5);MLF.line(c,ax,data.pr.map(function(v,i){return[i,v]}),MLF.rgb(pal.b),2.5);MLF.ref(c,ax,{y:data.pi,color:MLF.rgb(pal.c),text:'πS='+data.pi.toFixed(3)});if(data.mc)MLF.line(c,ax,data.mc.map(function(v,i){return[i,v]}),pal.muted,2,[5,3]);MLF.legend(c,ax,[{t:'今天晴',c:MLF.rgb(pal.a)},{t:'今天雨',c:MLF.rgb(pal.b)}].concat(data.mc?[{t:'加入記憶',c:pal.muted}]:[]),'tr',pal);var y0=s.h*.74,w=ax.box.w/data.arr.length;for(var i=0;i<data.arr.length;i++){c.fillStyle=data.arr[i]?MLF.rgb(pal.a,.85):MLF.rgb(pal.b,.85);c.fillRect(ax.box.l+i*w,y0,Math.max(1,w+.2),s.h*.09)}c.fillStyle=pal.muted;c.font='11px system-ui';c.fillText('1000 天色帶；晴天比例 '+(data.arr.reduce(function(a,v){return a+v},0)/data.arr.length).toFixed(3),ax.box.l,y0+s.h*.09+15);c.restore();
 var days=Math.abs(data.lam)>=1?Infinity:(Math.abs(data.lam)<1e-9?1:Math.ceil(Math.log(.01)/Math.log(Math.abs(data.lam))));E('av').textContent=data.a.toFixed(2);E('bv').textContent=data.b.toFixed(2);E('stats').innerHTML='πS=<b>'+data.pi.toFixed(3)+'</b>　λ₂=<b>'+data.lam.toFixed(3)+'</b>　差距縮到 1%：<b>'+(isFinite(days)?days+' 天':'不會收斂')+'</b>　連續三次留晴：Markov <b>'+Math.pow(data.a,3).toFixed(3)+'</b>'+(data.mem?'，有記憶 <b>'+(data.a*Math.pow(Math.max(0,data.a-.3),2)).toFixed(3)+'</b>':'');E('obs').innerHTML='<b>觀察：</b>'+(Math.abs(data.lam)>=.999?'<span class="warn">λ₂ 的絕對值是 1，兩條線不會忘掉起點。</span>':'長期比例看流量平衡；靠近速度只看 |λ₂|。')+(data.mem?' 加入記憶後，二狀態 P 的理論線與模擬灰線分開；把（昨天、今天）合成狀態才會再次 Markov。':'')}
['a','b','memory'].forEach(function(id){E(id).oninput=calc});E('sim').onclick=function(){seed+=131;calc()};function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);calc();theme()})();
</script></body></html>

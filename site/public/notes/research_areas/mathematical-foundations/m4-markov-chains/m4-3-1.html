<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time reversal</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:930px;margin:auto;padding:16px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.88rem;line-height:1.55;margin:.2rem 0 .7rem}.plot{width:100%;aspect-ratio:16/9;display:block;border-radius:10px}.controls{display:grid;gap:9px;margin-top:10px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}label{font-size:.82rem;font-weight:650}input[type=range]{width:160px;max-width:42vw}button,select{font:inherit;padding:5px 9px;border-radius:8px;border:1px solid #aaa;background:transparent;color:inherit}button{cursor:pointer}.stats{font-size:.8rem;font-variant-numeric:tabular-nums}.guess{display:none}.guess.on{display:inline-flex;gap:6px}.good{color:#3f8c62;font-weight:700}.bad{color:#c65e54;font-weight:700}@media(max-width:620px){body{padding:6px}.card{padding:10px}.plot{aspect-ratio:1}}</style></head><body><main class="card"><p class="goal"><b>學習目標：</b>倒帶 rate 是正向 rate 乘上 Bayes 比值；淨環流或非 stationary 起點都會留下時間方向。</p><canvas id="cv" class="plot"></canvas><div class="controls"><div class="row"><label>逆時鐘 rate ε <input id="eps" type="range" min="0" max="1" step=".02" value=".2"></label><b id="ev"></b><label>起點 <select id="start"><option value="stationary">stationary</option><option value="sun">全晴</option><option value="rain">全雨</option></select></label><label>影片長度 <input id="len" type="range" min="30" max="2000" step="10" value="120"></label><b id="lv"></b><button id="resample">重抽軌跡</button><button id="hide">隨機隱藏方向</button><span id="guess" class="guess"><button data-g="0">猜左邊正播</button><button data-g="1">猜右邊正播</button></span></div><div class="stats" id="stats"></div></div><p class="observe" id="obs"></p></main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},cv=E('cv'),D=MLF.hiDPICanvas(cv),pal=MLF.palette(),seed=1453,hidden=false,forwardSide=0,result='',data;
function simulate(eps,start,L){var r=MLF.rng(seed),st=start==='stationary'?Math.floor(r()*3):(start==='sun'?0:2),rate=1+eps,next=-Math.log(Math.max(r(),1e-9))/rate,arr=[];for(var d=0;d<L;d++){while(next<=d){st=r()<1/rate?(st+1)%3:(st+2)%3;next+=-Math.log(Math.max(r(),1e-9))/rate}arr.push(st)}return arr}
function counts(a){var cw=0,ccw=0,sc=0,cs=0;for(var i=1;i<a.length;i++){if((a[i-1]+1)%3===a[i])cw++;if((a[i-1]+2)%3===a[i])ccw++;if(a[i-1]===0&&a[i]===1)sc++;if(a[i-1]===1&&a[i]===0)cs++}return{cw:cw,ccw:ccw,sc:sc,cs:cs}}
function calc(){var eps=+E('eps').value,L=+E('len').value,start=E('start').value,f=simulate(eps,start,L),rev=f.slice().reverse(),cnt=counts(f);data={eps:eps,L:L,start:start,f:f,rev:rev,cnt:cnt,disc:Math.abs(Math.log((cnt.cw+.5)/(cnt.ccw+.5)))};draw()}
function arrow(c,x1,y1,x2,y2,col,w){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();var a=Math.atan2(y2-y1,x2-x1);c.fillStyle=col;c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-8*Math.cos(a-.5),y2-8*Math.sin(a-.5));c.lineTo(x2-8*Math.cos(a+.5),y2-8*Math.sin(a+.5));c.fill()}
function drawBand(c,a,x,y,w,h){var step=w/a.length,cols=[MLF.rgb(pal.a,.85),MLF.rgb(pal.c,.75),MLF.rgb(pal.b,.85)];for(var i=0;i<a.length;i++){c.fillStyle=cols[a[i]];c.fillRect(x+i*step,y,Math.max(1,step+.2),h)}c.strokeStyle=pal.axis;c.strokeRect(x,y,w,h)}
function draw(){if(!data)return;var s=D.resize(),c=D.ctx;MLF.clear(c,s,pal);var margin=28,gap=24,w=(s.w-2*margin-gap)/2,left=hidden?(forwardSide===0?data.f:data.rev):data.f,right=hidden?(forwardSide===1?data.f:data.rev):data.rev;c.fillStyle=pal.ink;c.font='bold 13px system-ui';c.fillText(hidden?'影片 A':'正著播',margin,24);c.fillText(hidden?'影片 B':'倒著播',margin+w+gap,24);drawBand(c,left,margin,35,w,38);drawBand(c,right,margin+w+gap,35,w,38);
 var cx=s.w/2,cy=s.h*.48,R=78,pts=[];for(var j=0;j<3;j++){var a=-Math.PI/2+j*2*Math.PI/3;pts.push([cx+R*Math.cos(a),cy+R*Math.sin(a)])}for(j=0;j<3;j++){var p=pts[j],q=pts[(j+1)%3],u=pts[(j+2)%3];arrow(c,p[0]*.78+q[0]*.22,p[1]*.78+q[1]*.22,p[0]*.28+q[0]*.72,p[1]*.28+q[1]*.72,MLF.rgb(pal.d),5);arrow(c,p[0]*.78+u[0]*.22,p[1]*.78+u[1]*.22,p[0]*.28+u[0]*.72,p[1]*.28+u[1]*.72,MLF.rgb(pal.b),1.5+3*data.eps)}var names=['S 晴','C 雲','R 雨'];pts.forEach(function(p,i){c.fillStyle=pal.panel;c.strokeStyle=pal.axis;c.lineWidth=2;c.beginPath();c.arc(p[0],p[1],27,0,7);c.fill();c.stroke();c.fillStyle=pal.ink;c.font='12px system-ui';c.textAlign='center';c.fillText(names[i],p[0],p[1]+4)});c.textAlign='left';c.fillStyle=MLF.rgb(pal.d);c.fillText('順時鐘 rate 1',margin,s.h*.3);c.fillStyle=MLF.rgb(pal.b);c.fillText('逆時鐘 rate ε='+data.eps.toFixed(2),margin,s.h*.3+19);
 c.fillStyle=pal.ink;c.font='12px system-ui';c.fillText('正播環流：順 '+data.cnt.cw+' / 逆 '+data.cnt.ccw,margin,s.h*.76);c.fillText('S→C '+data.cnt.sc+'　C→S '+data.cnt.cs,margin,s.h*.76+20);c.fillText('分辨力 |log(順/逆)| = '+data.disc.toFixed(3),margin,s.h*.76+40);var stat=data.start==='stationary';c.fillStyle=pal.muted;c.fillText(stat?'π=(1/3,1/3,1/3)，倒帶只交換兩方向 rate':'非 stationary：pₜ(y)/pₜ(x) 隨時間改變',margin,s.h*.9);if(!stat){c.strokeStyle=MLF.rgb(pal.a);c.beginPath();for(var i=0;i<80;i++){var x=margin+i/79*(s.w-2*margin),y=s.h*.96-22*Math.exp(-i/18)*(data.start==='sun'?1:-1);if(!i)c.moveTo(x,y);else c.lineTo(x,y)}c.stroke();c.fillStyle=pal.muted;c.fillText('Bayes 比值隨 t 回到 1',margin,s.h*.98)}
 E('ev').textContent=data.eps.toFixed(2);E('lv').textContent=data.L+' 天';E('stats').innerHTML='正向順/逆環路 <b>'+data.cnt.cw+'/'+data.cnt.ccw+'</b>　分辨力 <b>'+data.disc.toFixed(3)+'</b>　'+result;E('obs').innerHTML='<b>觀察：</b>'+(data.eps>.98&&data.start==='stationary'?'detailed balance 成立：正播與倒播同分布，任何猜法只能接近 50%。':data.start!=='stationary'?'即使 ε=1，固定起點也會在影片端點留下方向；此時 reverse rate 依賴 t。':'ε 越小，淨環流越強；影片越長，順逆 transition 的不對稱越容易量出來。')}
['eps','start','len'].forEach(function(id){E(id).oninput=function(){hidden=false;result='';E('guess').className='guess';calc()}});E('resample').onclick=function(){seed+=173;hidden=false;result='';E('guess').className='guess';calc()};E('hide').onclick=function(){hidden=true;forwardSide=MLF.rng(seed+333)()<.5?0:1;result='';E('guess').className='guess on';draw()};Array.prototype.forEach.call(document.querySelectorAll('[data-g]'),function(b){b.onclick=function(){var ok=+b.dataset.g===forwardSide;result='<span class="'+(ok?'good':'bad')+'">'+(ok?'猜對了':'猜錯了')+'</span>';hidden=false;E('guess').className='guess';draw()}});function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);calc();theme()})();
</script></body></html>

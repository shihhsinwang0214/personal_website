<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometric absorption</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:920px;margin:auto;padding:16px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.88rem;line-height:1.55;margin:.2rem 0 .7rem}.plot{width:100%;aspect-ratio:16/8.5;display:block;border-radius:10px}.controls{display:grid;gap:9px;margin-top:10px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{font-size:.82rem;font-weight:650}input[type=range]{width:160px;max-width:42vw}.stats{font-size:.8rem;font-variant-numeric:tabular-nums}.warn{color:#c65e54;font-weight:700}@media(max-width:620px){body{padding:6px}.card{padding:10px}.plot{aspect-ratio:1.05}}</style></head><body><main class="card"><p class="goal"><b>學習目標：</b>固定 q 時等待時間是 geometric、剩餘期望完全水平；讓 q 隨回合增加或允許復活，兩個結論分別失效。</p><canvas id="cv" class="plot"></canvas><div class="controls"><div class="row"><label>掉坑機率 q <input id="q" type="range" min=".02" max=".5" step=".01" value=".1"></label><b id="qv"></b><label>每回合遞增 δ <input id="delta" type="range" min="0" max=".05" step=".0025" value="0"></label><b id="dv"></b><label>復活機率 r <input id="revive" type="range" min="0" max=".3" step=".01" value="0"></label><b id="rv"></b></div><div class="stats" id="stats"></div></div><p class="observe" id="obs"></p></main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},cv=E('cv'),D=MLF.hiDPICanvas(cv),pal=MLF.palette(),seed=991,data;
function qn(n,q,d){return Math.min(1,q+d*(n-1))}function remain(k,q,d){var surv=1,sum=0;for(var j=1;j<400;j++){surv*=1-qn(k+j,q,d);sum+=surv;if(surv<1e-8)break}return 1+sum}
function calc(){var q=+E('q').value,d=+E('delta').value,rp=+E('revive').value,r=MLF.rng(seed),taus=[],N=20000;for(var j=0;j<N;j++){var n=1;while(n<300&&r()>qn(n,q,d))n++;taus.push(n)}var res=[];for(var k=0;k<=30;k++)res.push(remain(k,q,d));var band=[],st=1,age=1,rr=MLF.rng(seed+4);for(var i=0;i<500;i++){band.push(st);if(st){if(rr()<qn(age,q,d)){st=0;age=0}else age++}else if(rr()<rp){st=1;age=1}}data={q:q,d:d,rp:rp,taus:taus,res:res,band:band};draw()}
function draw(){if(!data)return;var s=D.resize(),c=D.ctx;MLF.clear(c,s,pal);var split=s.w*.58,L={w:split,h:s.h},R={w:s.w-split,h:s.h},hist=new Array(60).fill(0);data.taus.forEach(function(v){if(v<=60)hist[v-1]++});var mx=Math.max.apply(null,hist),ax=MLF.axes(c,L,{x:[1,60],y:[0,mx*1.15],xticks:[1,10,20,40,60],yticks:[0,mx/2,mx],fmtx:function(x){return x},fmty:function(y){return Math.round(y)},xlab:'吸收回合 τ',ylab:'20,000 局',pal:pal,pad:{l:.14,r:.03,t:.09,b:.17}});hist.forEach(function(v,i){c.fillStyle=MLF.rgb(pal.b,.5);var x=i+1;c.fillRect(ax.X(x-.4),ax.Y(v),Math.max(1,ax.X(x+.4)-ax.X(x-.4)-1),ax.box.b-ax.Y(v))});var th=[];for(var n=1;n<=60;n++)th.push([n,data.taus.length*data.q*Math.pow(1-data.q,n-1)]);MLF.line(c,ax,th,MLF.rgb(pal.d),2,[4,3]);var mean=1/data.q,med=Math.ceil(Math.log(.5)/Math.log(1-data.q)),sd=Math.sqrt(1-data.q)/data.q;MLF.ref(c,ax,{x:Math.min(60,med),color:MLF.rgb(pal.c),text:'中位數 '+med});MLF.ref(c,ax,{x:Math.min(60,mean),color:MLF.rgb(pal.a),text:'期望 '+mean.toFixed(1)});
 c.save();c.translate(split,0);var ymax=Math.max(mean*1.2,Math.max.apply(null,data.res)*1.1),rx=MLF.axes(c,R,{x:[0,30],y:[0,ymax],xticks:[0,10,20,30],yticks:[0,mean,ymax],fmty:function(y){return y.toFixed(1)},xlab:'已玩 k 回合',ylab:'剩餘期望',pal:pal,pad:{l:.2,r:.05,t:.09,b:.24}});MLF.line(c,rx,data.res.map(function(v,i){return[i,v]}),MLF.rgb(pal.c),2.7);MLF.ref(c,rx,{y:mean,color:MLF.rgb(pal.d),text:'固定 q：1/q'});var y0=rx.box.b+34,w=rx.box.w/data.band.length;for(var i=0;i<data.band.length;i++){c.fillStyle=data.band[i]?MLF.rgb(pal.a,.8):MLF.rgb(pal.b,.8);c.fillRect(rx.box.l+i*w,y0,Math.max(1,w+.2),17)}c.fillStyle=pal.muted;c.font='10px system-ui';c.fillText('500 回合 A/E 色帶',rx.box.l,y0+31);c.restore();
 var simMean=MLF.mean(data.taus),piE=data.q/(data.q+data.rp||1);E('qv').textContent=data.q.toFixed(2);E('dv').textContent=data.d.toFixed(3);E('rv').textContent=data.rp.toFixed(2);E('stats').innerHTML='固定 q：期望 <b>'+mean.toFixed(2)+'</b>、中位數 <b>'+med+'</b>、標準差 <b>'+sd.toFixed(2)+'</b>　模擬平均 <b>'+simMean.toFixed(2)+'</b>'+(data.rp>0?'　E 長期比例 πE=<b>'+piE.toFixed(3)+'</b>':'');E('obs').innerHTML='<b>觀察：</b>'+(data.d===0?'剩餘期望是水平線：已經等多久，不改變還要等多久。':'δ&gt;0 時危險率逐回合上升，剩餘期望往下彎；memoryless 消失。')+(data.rp>0?' 復活後 E 不再吸收，問題改成長期占比。':'')}
['q','delta','revive'].forEach(function(id){E(id).oninput=calc});function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);calc();theme()})();
</script></body></html>

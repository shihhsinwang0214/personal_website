<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTMC rate 與時間步</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:930px;margin:auto;padding:16px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.88rem;line-height:1.55;margin:.2rem 0 .7rem}.plot{width:100%;aspect-ratio:16/8.5;display:block;border-radius:10px}.controls{display:grid;gap:9px;margin-top:10px}.row{display:flex;gap:11px;align-items:center;flex-wrap:wrap}label{font-size:.82rem;font-weight:650}input[type=range]{width:145px;max-width:40vw}select{font:inherit;padding:5px 9px;border-radius:8px;border:1px solid #aaa;background:transparent;color:inherit}.stats{font-size:.8rem;font-variant-numeric:tabular-nums}.warn{color:#c65e54;font-weight:700}@media(max-width:620px){body{padding:6px}.card{padding:10px}.plot{aspect-ratio:1.05}}</style></head><body><main class="card"><p class="goal"><b>學習目標：</b>rate×短時間才是機率；比較矩陣指數、Euler 離散化與不同通話長度分布。</p><canvas id="cv" class="plot"></canvas><div class="controls"><div class="row"><label>λ <input id="lam" type="range" min=".5" max="12" step=".25" value="3"></label><b id="lv"></b><label>μ <input id="mu" type="range" min="1" max="12" step=".25" value="6"></label><b id="mv"></b><label>Δt <input id="dt" type="range" min=".005" max=".6" step=".005" value=".01"></label><b id="dv"></b><label>通話長度 <select id="dur"><option value="exp">exponential</option><option value="fixed">固定同平均</option><option value="mix">兩點混合（同平均）</option></select></label></div><div class="stats" id="stats"></div></div><p class="observe" id="obs"></p></main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},cv=E('cv'),D=MLF.hiDPICanvas(cv),pal=MLF.palette(),seed=1201,data;
function idle(r,l){return-Math.log(Math.max(r(),1e-9))/l}function busy(r,m,k){if(k==='fixed')return 1/m;if(k==='mix')return(r()<.5?.3:1.7)/m;return-Math.log(Math.max(r(),1e-9))/m}
function empirical(l,m,k){if(k==='exp')return null;var M=1000,K=50,out=new Array(K+1).fill(0),r=MLF.rng(seed+10);for(var j=0;j<M;j++){var st=0,t=idle(r,l),idx=0;for(idx=0;idx<=K;idx++){var q=idx/K;while(t<=q){if(st===0){st=1;t+=busy(r,m,k)}else{st=0;t+=idle(r,l)}}out[idx]+=st}}return out.map(function(v,i){return[i/K,v/M]})}
function trajectory(l,m,k){var r=MLF.rng(seed),segs=[],t=0,st=0;while(t<3){var d=st?idle(r,l):busy(r,m,k);if(!st)d=idle(r,l);else d=busy(r,m,k);segs.push({a:t,b:Math.min(3,t+d),s:st});t+=d;st=1-st}return segs}
function calc(){var l=+E('lam').value,m=+E('mu').value,dt=+E('dt').value,k=E('dur').value,pi=l/(l+m),theory=[],disc=[],p=0;for(var i=0;i<=100;i++){var t=i/100;theory.push([t,pi*(1-Math.exp(-(l+m)*t))])}var n=Math.ceil(1/dt),hh=1/n;for(i=0;i<=n;i++){disc.push([i*hh,p]);p+=dt*(l*(1-p)-m*p)}var emp=empirical(l,m,k),segs=trajectory(l,m,k);data={l:l,m:m,dt:dt,k:k,pi:pi,theory:theory,disc:disc,emp:emp,segs:segs,invalid:dt>1/Math.max(l,m)};draw()}
function draw(){if(!data)return;var s=D.resize(),c=D.ctx;MLF.clear(c,s,pal);var split=s.w*.62,L={w:split,h:s.h},ax=MLF.axes(c,L,{x:[0,1],y:[-.15,1.15],xticks:[0,.25,.5,.75,1],yticks:[0,.25,.5,.75,1],xlab:'時間 t（小時）',ylab:'pₜ(忙碌)',pal:pal,pad:{l:.13,r:.03,t:.09,b:.17}});MLF.line(c,ax,data.theory,MLF.rgb(pal.b),3);MLF.line(c,ax,data.disc,data.invalid?MLF.rgb(pal.d):MLF.rgb(pal.a),2,[5,3]);MLF.ref(c,ax,{y:data.pi,color:MLF.rgb(pal.c),text:'π='+data.pi.toFixed(3)});if(data.emp)MLF.line(c,ax,data.emp,pal.muted,2);MLF.legend(c,ax,[{t:'e^{tR}',c:MLF.rgb(pal.b)},{t:'(I+RΔt)^n',c:data.invalid?MLF.rgb(pal.d):MLF.rgb(pal.a)}].concat(data.emp?[{t:'非 exponential 模擬',c:pal.muted}]:[]),'br',pal);
 c.save();c.translate(split,0);var x0=24,x1=s.w-split-22,y=s.h*.25;c.fillStyle=pal.muted;c.font='bold 13px system-ui';c.fillText('3 小時樣本色帶',x0,28);data.segs.forEach(function(q){c.fillStyle=q.s?MLF.rgb(pal.b,.8):MLF.rgb(pal.c,.55);c.fillRect(x0+(q.a/3)*(x1-x0),y,(q.b-q.a)/3*(x1-x0)+1,38)});c.strokeStyle=pal.axis;c.strokeRect(x0,y,x1-x0,38);c.fillStyle=pal.muted;c.font='10px system-ui';c.fillText('0h',x0,y+55);c.fillText('3h',x1-16,y+55);c.font='12px system-ui';c.fillStyle=pal.ink;c.fillText('直覺 λ/μ',x0,s.h*.52);c.fillText((data.l/data.m).toFixed(3),x0,s.h*.52+23);c.fillText('理論 λ/(λ+μ)',x0,s.h*.68);c.fillText(data.pi.toFixed(3),x0,s.h*.68+23);c.fillStyle=data.invalid?MLF.rgb(pal.d):pal.muted;c.font='11px system-ui';c.fillText(data.invalid?'I+RΔt 出現負元素':'Δt 合法',x0,s.h*.86);c.restore();
 E('lv').textContent=data.l.toFixed(2);E('mv').textContent=data.m.toFixed(2);E('dv').textContent=data.dt.toFixed(3);E('stats').innerHTML='平均閒置 <b>'+(60/data.l).toFixed(1)+' 分</b>　平均忙碌 <b>'+(60/data.m).toFixed(1)+' 分</b>　長期忙碌比例 <b>'+data.pi.toFixed(3)+'</b>'+(data.invalid?'　<span class="warn">Δt&gt;1/max(λ,μ)：Euler matrix 不合法</span>':'');E('obs').innerHTML='<b>觀察：</b>'+(data.k==='exp'?'exponential 的無記憶性讓整條暫態曲線由 e^{tR} 決定。':'改變停留時間形狀但保持平均，長期比例幾乎不變；暫態灰線卻與 CTMC 實線分開。')}
['lam','mu','dt','dur'].forEach(function(id){E(id).oninput=calc});function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);calc();theme()})();
</script></body></html>

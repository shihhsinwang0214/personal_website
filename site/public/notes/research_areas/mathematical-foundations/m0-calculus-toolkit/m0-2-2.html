<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>導航的直線假設</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:780px;margin:auto;padding:18px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.88rem;line-height:1.55}.plot{width:100%;aspect-ratio:16/9;display:block}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}label{font-size:.8rem;font-weight:650}input[type=range]{width:145px}.stats{font-size:.8rem;font-variant-numeric:tabular-nums}</style></head><body><main class="card">
<p class="goal"><b>學習目標：</b>平滑彎道上，切線預測的一步誤差按 h² 成長；曲率越大常數越大。折角沒有二階 Taylor 展開，斜率降為 1。</p>
<canvas id="cv" class="plot" aria-label="左側為真實彎道與切線預測，右側為誤差的 log-log 圖"></canvas>
<div class="row"><label>h 秒 <input id="h" type="range" min=".1" max="30" step=".1" value="8"></label><b id="vh"></b><label>R 公尺 <input id="r" type="range" min="20" max="200" value="90"></label><b id="vr"></b><label>v m/s <input id="v" type="range" min="5" max="30" value="15"></label><b id="vv"></b></div>
<div class="row"><label><input id="second" type="checkbox"> 二階（陀螺儀）</label><label><input id="corner" type="checkbox"> 改成 90° 折角</label><span class="stats">精確偏差 <b id="err"></b>　Taylor 上界 <b id="bound"></b>　局部斜率 <b id="slope"></b></span></div>
<p class="observe">把 h 加倍：平滑彎道的紅線約變四倍。打開二階後再多消掉一階誤差；切到折角時，無論 h 多小都只剩一階收斂。</p>
</main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},D=MLF.hiDPICanvas(E('cv')),pal=MLF.palette();
 function error(h,R,v){var a=v*h/R;if(E('corner').checked)return v*h*Math.SQRT1_2;if(E('second').checked){var tx=R*Math.sin(a),ty=R*(1-Math.cos(a)),px=v*h,py=v*v*h*h/(2*R);return Math.hypot(tx-px,ty-py)}return Math.hypot(R*Math.sin(a)-v*h,R*(1-Math.cos(a)))}
 function draw(){var s=D.resize(),c=D.ctx;c.clearRect(0,0,s.w,s.h);c.fillStyle=pal.bg;c.fillRect(0,0,s.w,s.h);var split=s.w*.58,L=20,T=22,W=split-38,H=s.h-45,h=+E('h').value,R=+E('r').value,v=+E('v').value,a=Math.min(v*h/R,1.4),sc=Math.min(W/(R*1.15),H/(R*1.15)),cx=L+55,cy=T+H-55;
  c.strokeStyle=MLF.rgb(pal.b);c.lineWidth=5;c.beginPath();if(E('corner').checked){c.moveTo(cx,cy);c.lineTo(cx+W*.45,cy);c.lineTo(cx+W*.45,cy-H*.65)}else{for(var q=0;q<=80;q++){var th=1.4*q/80,x=cx+R*Math.sin(th)*sc,y=cy-R*(1-Math.cos(th))*sc;if(!q)c.moveTo(x,y);else c.lineTo(x,y)}}c.stroke();
  var tx,ty;if(E('corner').checked){var d=v*h*sc;if(d<W*.45){tx=cx+d;ty=cy}else{tx=cx+W*.45;ty=cy-(d-W*.45)}}else{tx=cx+R*Math.sin(a)*sc;ty=cy-R*(1-Math.cos(a))*sc}
  var px=cx+v*h*sc,py=cy;if(E('second').checked&&!E('corner').checked)py-=v*v*h*h/(2*R)*sc;c.strokeStyle=MLF.rgb(pal.a);c.lineWidth=3;c.setLineDash([8,6]);c.beginPath();c.moveTo(cx,cy);c.lineTo(px,py);c.stroke();c.setLineDash([]);c.strokeStyle=MLF.rgb(pal.d);c.lineWidth=4;c.beginPath();c.moveTo(px,py);c.lineTo(tx,ty);c.stroke();c.fillStyle=pal.muted;c.font='11px system-ui';c.fillText('藍：真實　金虛線：預測　紅：偏差',L+5,T+14);
  var x0=split+30,y0=s.h-38,w=s.w-split-48,hh=s.h-70;c.strokeStyle=pal.axis;c.strokeRect(x0,26,w,hh);var vals=[],lo=.1,hi=30,mx=0;for(var i=0;i<70;i++){var hhx=lo*Math.pow(hi/lo,i/69),er=error(hhx,R,v);vals.push([hhx,er]);mx=Math.max(mx,er)}c.strokeStyle=MLF.rgb(pal.c);c.lineWidth=2.5;c.beginPath();vals.forEach(function(p,i){var x=x0+Math.log(p[0]/lo)/Math.log(hi/lo)*w,y=y0-Math.log(1+p[1])/Math.log(1+mx)*hh;if(!i)c.moveTo(x,y);else c.lineTo(x,y)});c.stroke();var er=error(h,R,v),xx=x0+Math.log(h/lo)/Math.log(hi/lo)*w,yy=y0-Math.log(1+er)/Math.log(1+mx)*hh;c.fillStyle=MLF.rgb(pal.d);c.beginPath();c.arc(xx,yy,5,0,7);c.fill();c.fillStyle=pal.muted;c.fillText('log h →',x0+w-45,y0+18);c.fillText(E('corner').checked?'參考斜率 1':(E('second').checked?'參考斜率 3':'參考斜率 2'),x0+8,43);
  var e1=error(h*.8,R,v),e2=error(h*1.2,R,v),sl=Math.log(e2/e1)/Math.log(1.5);E('vh').textContent=h.toFixed(1);E('vr').textContent=R;E('vv').textContent=v;E('err').textContent=er.toFixed(2)+' m';E('bound').textContent=(h*h*v*v/(2*R)).toFixed(2)+' m';E('slope').textContent=isFinite(sl)?sl.toFixed(2):'—'}
 ['h','r','v','second','corner'].forEach(function(id){E(id).oninput=draw});function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);theme()})();
</script></body></html>

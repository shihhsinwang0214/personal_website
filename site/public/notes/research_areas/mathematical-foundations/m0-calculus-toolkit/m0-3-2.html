<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全導數與 JVP</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:790px;margin:auto;padding:18px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.87rem;line-height:1.55}.plot{width:100%;aspect-ratio:16/10;display:block}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:8px 0}label{font-size:.79rem;font-weight:650}input[type=range]{width:125px}button{font:inherit;color:inherit;background:transparent;border:1px solid #aaa;border-radius:8px;padding:6px 10px}.stats{font-size:.79rem;font-variant-numeric:tabular-nums}</style></head><body><main class="card">
<p class="goal"><b>學習目標：</b>浮球讀數的斜率同時包含「水自己升溫」與「浮球漂到較暖處」。釘住第二支溫度計，才能把兩項拆開。</p>
<canvas id="cv" class="plot" aria-label="河道溫度、浮球軌跡、讀數曲線與全導數拆解"></canvas>
<div class="row"><label>升溫率 <input id="rate" type="range" min="0" max=".002" step=".0001" value=".0008"></label><label>暖區強度 <input id="amp" type="range" min="0" max="1" step=".05" value=".7"></label><label>漂速 <input id="speed" type="range" min="0" max="2" step=".1" value="1"></label></div>
<div class="row"><label><input id="fixed" type="checkbox" checked> 釘一支溫度計</label><label><input id="branch" type="checkbox"> 加一條溫度跳躍支流</label><button id="play">▶ 放進河裡</button><button id="reset">重置</button><label>維度 d <input id="dim" type="range" min="1" max="5" step=".01" value="3"></label></div>
<div class="stats">∂ₜT=<b id="pt"></b>　∇T·ẋ=<b id="space"></b>　g′=<b id="total"></b>　Jacobian 約 <b id="jac"></b> 次傳播；JVP 約 2–3 次</div>
<p class="observe">開啟支流後，浮球跨過 x=400 m 時讀數瞬跳，該點的空間導數顯示「未定義」：公式需要 differentiability。</p>
</main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},D=MLF.hiDPICanvas(E('cv')),pal=MLF.palette(),time=0,timer=0,series=[];
 function temp(x,t){var a=+E('amp').value,r=+E('rate').value;return 18+r*t+a/(1+Math.exp(-(x-330)/45))+(E('branch').checked&&x>=400?1.5:0)}
 function parts(x,t){var r=+E('rate').value,a=+E('amp').value,v=+E('speed').value,z=Math.exp(-(x-330)/45),dx=a*z/(45*(1+z)*(1+z));return[r,dx*v,r+dx*v]}
 function reset(){clearInterval(timer);timer=0;time=0;series=[];sample();draw()}
 function sample(){var x=Math.min(600,+E('speed').value*time),p=parts(x,time);series.push({t:time,g:temp(x,time),f:temp(0,time),d:p});if(series.length>220)series.shift()}
 function play(){if(timer){clearInterval(timer);timer=0;E('play').textContent='▶ 繼續';return}E('play').textContent='❚❚ 暫停';timer=setInterval(function(){time+=5;if(time>600){clearInterval(timer);timer=0;E('play').textContent='▶ 重播';return}sample();draw()},35)}
 function draw(){var s=D.resize(),c=D.ctx;c.clearRect(0,0,s.w,s.h);c.fillStyle=pal.bg;c.fillRect(0,0,s.w,s.h);var top=s.h*.43,L=28,R=s.w-28,W=R-L;
  var grad=c.createLinearGradient(L,0,R,0);grad.addColorStop(0,'#83b8d7');grad.addColorStop(.62,'#8bb9cf');grad.addColorStop(1,'#e3a16e');c.fillStyle=grad;c.fillRect(L,35,W,top-55);var x=Math.min(600,+E('speed').value*time),px=L+x/600*W;c.fillStyle='#fff';c.strokeStyle=pal.ink;c.lineWidth=2;c.beginPath();c.arc(px,35+(top-55)/2,10,0,7);c.fill();c.stroke();if(E('branch').checked){var bx=L+400/600*W;c.fillStyle='rgba(205,80,70,.5)';c.fillRect(bx-3,35,6,top-55);c.fillStyle=pal.ink;c.font='11px system-ui';c.fillText('支流跳躍',bx+5,50)}
  c.fillStyle=pal.ink;c.font='12px system-ui';c.fillText('0 m',L,top-8);c.fillText('600 m',R-40,top-8);c.fillText('浮球 x='+x.toFixed(0)+' m',Math.min(px+10,R-100),top/2);
  var y0=s.h-35,h=s.h-top-48,mn=17.8,mx=20.5;c.strokeStyle=pal.axis;c.strokeRect(L,top+10,W,h);function line(key,col){c.strokeStyle=col;c.lineWidth=2.3;c.beginPath();series.forEach(function(q,i){var xx=L+q.t/600*W,val=key==='g'?q.g:q.f,yy=y0-(val-mn)/(mx-mn)*h;if(!i)c.moveTo(xx,yy);else c.lineTo(xx,yy)});c.stroke()}line('g',MLF.rgb(pal.a));if(E('fixed').checked)line('f',MLF.rgb(pal.c));c.fillStyle=pal.muted;c.fillText('金：浮球　綠：固定溫度計',L+5,top+26);
  var q=parts(x,time),jump=E('branch').checked&&Math.abs(x-400)<+E('speed').value*6;E('pt').textContent=q[0].toFixed(4);E('space').textContent=jump?'未定義':q[1].toFixed(4);E('total').textContent=jump?'跳躍':q[2].toFixed(4);var d=Math.round(Math.pow(10,+E('dim').value));E('jac').textContent=d.toLocaleString();E('play').textContent=timer?'❚❚ 暫停':'▶ 放進河裡'}
 E('play').onclick=play;E('reset').onclick=reset;['rate','amp','speed','fixed','branch','dim'].forEach(function(id){E(id).oninput=function(){if(id!=='dim'){series=[];sample()}draw()}});function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);reset();theme()})();
</script></body></html>

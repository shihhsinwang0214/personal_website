<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lipschitz 與非 Lipschitz 的河</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:820px;margin:auto;padding:18px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.87rem;line-height:1.55}.plot{width:100%;aspect-ratio:16/9;display:block}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}label{font-size:.8rem;font-weight:650}input[type=range]{width:145px}button{font:inherit;color:inherit;background:transparent;border:1px solid #aaa;border-radius:8px;padding:6px 10px}.stats{font-size:.8rem}</style></head><body><main class="card">
<p class="goal"><b>學習目標：</b>Lipschitz 場會把相近起點送到相近軌跡，且同一起點只有一條解；非 Lipschitz 中線可讓同一點出發的葉子分道揚鑣。</p>
<canvas id="cv" class="plot" aria-label="左側 smooth vector field，右側 non-Lipschitz field，各有兩片葉子的軌跡"></canvas>
<div class="row"><label>Euler 步長 h <input id="h" type="range" min=".01" max=".35" step=".01" value=".08"></label><b id="vh"></b><label>起點距離 δ <input id="delta" type="range" min="0" max=".1" step=".005" value=".03"></label><b id="vd"></b><label><input id="time" type="checkbox"> 時變 smooth 場</label><button id="run">放葉子</button><button id="reset">重置</button></div>
<div class="stats" id="msg"></div><p class="observe">把 δ 拉到 0：左邊兩條路重合；右邊仍可選擇向上或向下的合法解，這不是數值 bug，而是 ODE 本身不唯一。</p>
</main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},D=MLF.hiDPICanvas(E('cv')),pal=MLF.palette(),progress=1;
 function smooth(y,x,t){return .5*Math.cos(x-(E('time').checked?t:0))}
 function path(non,sign,delta){var h=+E('h').value,x=0,y=sign*delta/2,out=[[x,y]],t=0;while(x<6){var dy;if(non){if(delta===0)dy=sign*Math.pow(Math.max(0,2*t/3),1.5)-y;else dy=sign*Math.pow(Math.abs(y),1/3)*h;y+=dy*(delta===0?1:h)}else y+=smooth(y,x,t)*h;x+=h;t+=h;out.push([x,y])}return out}
 function draw(){var z=D.resize(),c=D.ctx;c.clearRect(0,0,z.w,z.h);c.fillStyle=pal.bg;c.fillRect(0,0,z.w,z.h);var gap=18,pw=(z.w-gap*3)/2,T=36,H=z.h-70;function panel(x0,non){c.fillStyle=pal.dark?'#22313d':'#e5f1f7';c.fillRect(x0,T,pw,H);c.fillStyle=pal.ink;c.font='700 13px system-ui';c.fillText(non?'non-Lipschitz：∂ᵧu→∞':'smooth / Lipschitz',x0+8,T-10);for(var gx=.4;gx<6;gx+=.65)for(var gy=-1.4;gy<=1.4;gy+=.45){var dy=non?(gy===0?0:Math.sign(gy)*Math.pow(Math.abs(gy),1/3)):smooth(gy,gx,gx);var X=x0+gx/6*pw,Y=T+H/2-gy/3*H;c.strokeStyle=MLF.rgb(pal.b,.45);c.beginPath();c.moveTo(X,Y);c.lineTo(X+15,Y-dy*10);c.stroke()}[[1,pal.a],[-1,pal.d]].forEach(function(q){var pts=path(non,q[0],+E('delta').value),count=Math.floor(pts.length*progress);c.strokeStyle=MLF.rgb(q[1]);c.lineWidth=3;c.beginPath();pts.slice(0,count).forEach(function(p,i){var X=x0+p[0]/6*pw,Y=T+H/2-p[1]/3*H;if(!i)c.moveTo(X,Y);else c.lineTo(X,Y)});c.stroke()})}panel(gap,false);panel(gap*2+pw,true);E('vh').textContent=(+E('h').value).toFixed(2);E('vd').textContent=(+E('delta').value).toFixed(3);E('msg').textContent=+E('delta').value===0?'同一起點：左邊唯一；右邊至少有「留在中線、向上、向下」三種解。':'縮小 δ：smooth 場的兩條解持續靠近；non-Lipschitz 場仍迅速分開。'}
 function run(){progress=0;var id=setInterval(function(){progress+=.04;draw();if(progress>=1)clearInterval(id)},25)}E('run').onclick=run;E('reset').onclick=function(){progress=1;draw()};['h','delta','time'].forEach(function(id){E(id).oninput=draw});function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);theme()})();
</script></body></html>

<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Euler：步長、曲率與發散</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:830px;margin:auto;padding:18px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.87rem;line-height:1.55}.plot{width:100%;aspect-ratio:16/9;display:block}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:8px 0}label{font-size:.78rem;font-weight:650}input[type=range]{width:125px}select{font:inherit;color:inherit;background:transparent;border:1px solid #aaa;border-radius:7px;padding:5px}.stats{font-size:.8rem;font-variant-numeric:tabular-nums}</style></head><body><main class="card">
<p class="goal"><b>學習目標：</b>Euler 的全域誤差是一階 h；曲率與速度決定常數，穩定區則決定方法會收斂、震盪或發散。</p>
<canvas id="cv" class="plot" aria-label="左側真實道路與 Euler 折線，右側 log-log 誤差及線性穩定性序列"></canvas>
<div class="row"><label>h <input id="h" type="range" min=".02" max=".5" step=".01" value=".15"></label><label>R <input id="r" type="range" min=".5" max="5" step=".1" value="2"></label><label>速度 v <input id="v" type="range" min=".3" max="2" step=".1" value="1"></label><label>路型 <select id="road"><option value="circle">等速圓弧</option><option value="s">S 形</option><option value="line">直線等速</option><option value="accel">直線加速</option></select></label><label>hk <input id="hk" type="range" min="0" max="3" step=".05" value=".8"></label></div>
<div class="stats">終點誤差=<b id="err"></b>　觀察斜率=<b id="slope"></b>　穩定性=<b id="stable"></b></div><p class="observe">直線等速時 Euler 精確；直線加速雖不偏出道路，位置仍有誤差。hk 超過 2 時，一維測試方程會發散。</p>
</main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},D=MLF.hiDPICanvas(E('cv')),pal=MLF.palette();
 function exact(t){var road=E('road').value,R=+E('r').value,v=+E('v').value;if(road==='circle')return[R*Math.sin(v*t/R),R*(1-Math.cos(v*t/R))];if(road==='s')return[v*t,.45*Math.sin(2*t)];if(road==='accel')return[v*(t+.3*t*t),0];return[v*t,0]}
 function solve(h){var road=E('road').value,R=+E('r').value,v=+E('v').value,T=3,x=0,y=0,out=[[x,y]],n=Math.ceil(T/h),dt=T/n;for(var i=0;i<n;i++){var t=i*dt,dx,dy;if(road==='circle'){dx=v*Math.cos(v*t/R);dy=v*Math.sin(v*t/R)}else if(road==='s'){dx=v;dy=.9*Math.cos(2*t)}else if(road==='accel'){dx=v*(1+t*.6);dy=0}else{dx=v;dy=0}x+=dt*dx;y+=dt*dy;out.push([x,y])}var ex,ey;if(road==='circle'){ex=R*Math.sin(v*T/R);ey=R*(1-Math.cos(v*T/R))}else if(road==='s'){ex=v*T;ey=.45*Math.sin(2*T)}else if(road==='accel'){ex=v*(T+.3*T*T);ey=0}else{ex=v*T;ey=0}return{p:out,e:Math.hypot(x-ex,y-ey),truth:[ex,ey]}}
 function draw(){var z=D.resize(),c=D.ctx;c.clearRect(0,0,z.w,z.h);c.fillStyle=pal.bg;c.fillRect(0,0,z.w,z.h);var split=z.w*.58,L=25,T=25,W=split-42,H=z.h-60,res=solve(+E('h').value),truth=[];for(var ti=0;ti<=160;ti++)truth.push(exact(3*ti/160));var all=res.p.concat(truth),xmin=Math.min.apply(null,all.map(function(p){return p[0]})),xmax=Math.max.apply(null,all.map(function(p){return p[0]})),ymin=Math.min.apply(null,all.map(function(p){return p[1]}))-.2,ymax=Math.max.apply(null,all.map(function(p){return p[1]}))+.2,X=function(x){return L+(x-xmin)/(xmax-xmin||1)*W},Y=function(y){return T+H-(y-ymin)/(ymax-ymin||1)*H};
  c.strokeStyle=MLF.rgb(pal.b);c.lineWidth=5;c.beginPath();truth.forEach(function(q,i){var px=X(q[0]),py=Y(q[1]);if(!i)c.moveTo(px,py);else c.lineTo(px,py)});c.stroke();c.strokeStyle=MLF.rgb(pal.a);c.lineWidth=3;c.beginPath();res.p.forEach(function(p,j){if(!j)c.moveTo(X(p[0]),Y(p[1]));else c.lineTo(X(p[0]),Y(p[1]))});c.stroke();
  var x0=split+25,w=z.w-split-45,y0=z.h*.58,hg=z.h*.48,errs=[];for(i=0;i<45;i++){var hh=.01*Math.pow(45,i/44),er=solve(hh).e;errs.push([hh,Math.max(er,1e-8)])}var em=Math.max.apply(null,errs.map(function(p){return p[1]}));c.strokeStyle=pal.axis;c.strokeRect(x0,25,w,hg);c.strokeStyle=MLF.rgb(pal.c);c.lineWidth=2;c.beginPath();errs.forEach(function(p,j){var xx=x0+Math.log(p[0]/.01)/Math.log(45)*w,yy=25+hg-Math.log(p[1]/1e-8)/Math.log(em/1e-8)*hg;if(!j)c.moveTo(xx,yy);else c.lineTo(xx,yy)});c.stroke();var hk=+E('hk').value,seq=[1];for(i=0;i<12;i++)seq.push(seq[seq.length-1]*(1-hk));var sy=z.h*.68,sh=z.h*.25;c.strokeStyle=pal.axis;c.strokeRect(x0,sy,w,sh);c.strokeStyle=MLF.rgb(pal.d);c.beginPath();seq.forEach(function(v,j){var xx=x0+j/(seq.length-1)*w,yy=sy+sh/2-v*sh*.18;if(!j)c.moveTo(xx,yy);else c.lineTo(xx,yy)});c.stroke();
  var e1=solve(.06).e,e2=solve(.12).e,sl=Math.log(Math.max(e2,1e-9)/Math.max(e1,1e-9))/Math.log(2);E('err').textContent=res.e.toExponential(2);E('slope').textContent=isFinite(sl)?sl.toFixed(2):'精確';E('stable').textContent=hk<1?'單調收斂':hk<2?'震盪收斂':'發散'}
 ['h','r','v','road','hk'].forEach(function(id){E(id).oninput=draw});function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);theme()})();
</script></body></html>

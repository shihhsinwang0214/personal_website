<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同 NFE 比較 Euler 與 midpoint</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:820px;margin:auto;padding:18px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.87rem;line-height:1.55}.plot{width:100%;aspect-ratio:16/9;display:block}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}label{font-size:.8rem;font-weight:650}input[type=range]{width:170px}select,button{font:inherit;color:inherit;background:transparent;border:1px solid #aaa;border-radius:8px;padding:5px 9px}.stats{font-size:.8rem}</style></head><body><main class="card">
<p class="goal"><b>學習目標：</b>固定向量場讀取次數 NFE，比較一階 Euler 與二階 midpoint；平滑路徑上二階優勢明顯，尖角會摧毀階數。</p>
<canvas id="cv" class="plot" aria-label="兩種數值方法在同 NFE 下的軌跡與終點誤差曲線"></canvas>
<div class="row"><label>NFE <input id="nfe" type="range" min="4" max="80" step="2" value="20"></label><b id="vn"></b><label>路徑 <select id="path"><option value="smooth">平滑彎路</option><option value="corner">尖角路</option></select></label><label>顯示 <select id="method"><option value="both">兩者</option><option value="euler">Euler</option><option value="mid">midpoint</option></select></label><button id="play">逐步畫</button></div>
<div class="stats">Euler error=<b id="ee"></b>　midpoint error=<b id="me"></b>　倍率=<b id="ratio"></b></div><p class="observe">midpoint 每步讀兩次，因此同 NFE 只有 Euler 一半步數；即便如此，平滑問題上仍常更準。切到尖角，兩者都只剩低階行為。</p>
</main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},D=MLF.hiDPICanvas(E('cv')),pal=MLF.palette(),progress=1;
 function vel(x,y,t){if(E('path').value==='corner')return t<.5?[2,0]:[0,2];return[1,1.3*Math.cos(3*t)]}
 function solve(method,nfe){var evals=method==='mid'?2:1,n=Math.max(1,Math.floor(nfe/evals)),h=1/n,x=0,y=0,out=[[x,y]];for(var i=0;i<n;i++){var t=i*h,v=vel(x,y,t);if(method==='mid'){var m=vel(x+v[0]*h/2,y+v[1]*h/2,t+h/2);x+=h*m[0];y+=h*m[1]}else{x+=h*v[0];y+=h*v[1]}out.push([x,y])}var truth=E('path').value==='corner'?[1,1]:[1,1.3*Math.sin(3)/3];return{p:out,e:Math.hypot(x-truth[0],y-truth[1]),truth:truth}}
 function draw(){var z=D.resize(),c=D.ctx;c.clearRect(0,0,z.w,z.h);c.fillStyle=pal.bg;c.fillRect(0,0,z.w,z.h);var n=+E('nfe').value,A=solve('euler',n),B=solve('mid',n),split=z.w*.62,L=35,T=28,W=split-55,H=z.h-60,all=A.p.concat(B.p,[A.truth]),xmin=-.05,xmax=1.1,ymin=Math.min.apply(null,all.map(function(p){return p[1]}))-.15,ymax=Math.max.apply(null,all.map(function(p){return p[1]}))+.15,X=function(x){return L+(x-xmin)/(xmax-xmin)*W},Y=function(y){return T+H-(y-ymin)/(ymax-ymin)*H};
  c.strokeStyle=MLF.rgb(pal.b);c.lineWidth=5;c.beginPath();for(var i=0;i<=150;i++){var t=i/150,x,y;if(E('path').value==='corner'){x=Math.min(1,2*t);y=Math.max(0,2*t-1)}else{x=t;y=1.3*Math.sin(3*t)/3}if(!i)c.moveTo(X(x),Y(y));else c.lineTo(X(x),Y(y))}c.stroke();function path(q,col){c.strokeStyle=MLF.rgb(col);c.lineWidth=2.5;c.beginPath();q.p.slice(0,Math.ceil(q.p.length*progress)).forEach(function(p,j){if(!j)c.moveTo(X(p[0]),Y(p[1]));else c.lineTo(X(p[0]),Y(p[1]))});c.stroke()}if(E('method').value!=='mid')path(A,pal.d);if(E('method').value!=='euler')path(B,pal.a);
  var x0=split+24,w=z.w-split-45,y0=z.h-40,h=z.h-75,cmax=0,cur=[];for(i=4;i<=80;i+=2){var ea=solve('euler',i).e,eb=solve('mid',i).e;cur.push([i,ea,eb]);cmax=Math.max(cmax,ea,eb)}c.strokeStyle=pal.axis;c.strokeRect(x0,25,w,h);[[1,pal.d],[2,pal.a]].forEach(function(spec){c.strokeStyle=MLF.rgb(spec[1]);c.lineWidth=2;c.beginPath();cur.forEach(function(v,j){var xx=x0+(v[0]-4)/76*w,yy=y0-v[spec[0]]/(cmax||1)*(h-15);if(!j)c.moveTo(xx,yy);else c.lineTo(xx,yy)});c.stroke()});c.fillStyle=pal.muted;c.font='11px system-ui';c.fillText('終點誤差 vs NFE',x0+5,40);E('vn').textContent=n;E('ee').textContent=A.e.toExponential(2);E('me').textContent=B.e.toExponential(2);E('ratio').textContent=(A.e/Math.max(B.e,1e-12)).toFixed(1)+'×'}
 E('play').onclick=function(){progress=0;var q=setInterval(function(){progress+=.06;draw();if(progress>=1)clearInterval(q)},30)};['nfe','path','method'].forEach(function(id){E(id).oninput=draw});function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);theme()})();
</script></body></html>

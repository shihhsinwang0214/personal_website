<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Continuity equation：追粒子與守格子</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:830px;margin:auto;padding:18px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.87rem;line-height:1.55}.plot{width:100%;aspect-ratio:16/9;display:block}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:8px 0}label{font-size:.79rem;font-weight:650}input[type=range]{width:140px}select{font:inherit;color:inherit;background:transparent;border:1px solid #aaa;border-radius:7px;padding:5px}.stats{font-size:.8rem}</style></head><body><main class="card">
<p class="goal"><b>學習目標：</b>追粒子與直接演化密度是同一本守恆帳；沿等密度線加一個旋轉速度，粒子路徑會變，密度卻不變。</p>
<canvas id="cv" class="plot" aria-label="左側追粒子，右側以格網 heatmap 顯示同一個 continuity equation 密度"></canvas>
<div class="row"><label>時間 t <input id="t" type="range" min="0" max="4" step=".02" value="1.3"></label><label>N <input id="n" type="range" min="200" max="4000" step="100" value="1800"></label><label>人流 <select id="field"><option value="contract">收攏 u=-x</option><option value="shift">平移</option><option value="rotate">旋轉</option><option value="split">跳躍分流</option></select></label><label>等密度旋轉 λ <input id="lambda" type="range" min="-2" max="2" step=".1" value="0"></label></div>
<div class="stats" id="msg"></div><p class="observe">在收攏模式拖 λ：左邊每顆粒子繞出的路改變，右邊 heatmap 不動，說明同一個 pₜ 不唯一決定速度場。</p>
</main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},D=MLF.hiDPICanvas(E('cv')),pal=MLF.palette(),pts=[];function init(){var r=MLF.rng(8);pts=[];for(var i=0;i<4000;i++)pts.push([r.normal(),r.normal()*.65])}
 function tr(p,t,k,la){var x=p[0],y=p[1],ang=la*t;if(k==='contract'){var sc=Math.exp(-t*.35);return[sc*(x*Math.cos(ang)-y*Math.sin(ang)),sc*(x*Math.sin(ang)+y*Math.cos(ang))]}if(k==='shift')return[x+t*.55,y];if(k==='rotate'){ang+=t;return[x*Math.cos(ang)-y*Math.sin(ang),x*Math.sin(ang)+y*Math.cos(ang)]}return[x+Math.sign(x)*t*.42,y]}
 function density(x,y,t,k){if(k==='contract'){var sc=Math.exp(-t*.35);return Math.exp(-.5*((x/sc)*(x/sc)+(y/(.65*sc))*(y/(.65*sc))))/(sc*sc)}if(k==='shift')x-=t*.55;else if(k==='split')x-=Math.sign(x)*t*.42;return Math.exp(-.5*(x*x+(y/.65)*(y/.65)))}
 function draw(){var z=D.resize(),c=D.ctx;c.clearRect(0,0,z.w,z.h);c.fillStyle=pal.bg;c.fillRect(0,0,z.w,z.h);var gap=22,pw=(z.w-gap*3)/2,T=35,H=z.h-70,t=+E('t').value,n=+E('n').value,k=E('field').value,la=+E('lambda').value,L=gap,R=gap*2+pw;function X(x,x0){return x0+pw/2+x*pw/7}function Y(y){return T+H/2-y*H/6}
  c.fillStyle=pal.dark?'#202832':'#eef3f7';c.fillRect(L,T,pw,H);c.fillStyle=pal.ink;c.font='700 13px system-ui';c.fillText('追粒子',L+6,T-10);var skip=Math.max(1,Math.floor(n/1800));for(var i=0;i<n;i+=skip){var q=tr(pts[i],t,k,la);c.fillStyle=MLF.rgb(pal.b,.35);c.beginPath();c.arc(X(q[0],L),Y(q[1]),1.7,0,7);c.fill()}
  var nx=52,ny=40,max=0,arr=[];for(var j=0;j<ny;j++)for(i=0;i<nx;i++){var x=-3.5+7*i/(nx-1),y=3-6*j/(ny-1),v=density(x,y,t,k);arr.push(v);max=Math.max(max,v)}for(j=0;j<ny;j++)for(i=0;i<nx;i++){var v=arr[j*nx+i]/max;c.fillStyle=MLF.lerpColor(pal.dark?[28,32,40]:[245,247,249],pal.dark?[200,142,55]:[42,78,163],v);c.fillRect(R+i*pw/nx,T+j*H/ny,pw/nx+1,H/ny+1)}c.fillStyle=pal.ink;c.fillText('守格子：p(x,t)',R+6,T-10);
  E('msg').textContent=k==='split'?'警示：u 在 x=0 跳躍，普通 divergence 在中線無定義；離散守恆仍保持總質量。':'λ='+la.toFixed(1)+'：粒子路徑改變，但右側 pₜ 不含 λ。'}
 ['t','n','field','lambda'].forEach(function(id){E(id).oninput=draw});function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);init();theme()})();
</script></body></html>

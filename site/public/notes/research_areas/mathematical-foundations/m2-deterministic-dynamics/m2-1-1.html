<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pushforward：數葉子與算密度</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:820px;margin:auto;padding:18px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.87rem;line-height:1.55}.plot{width:100%;aspect-ratio:16/10;display:block}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}label{font-size:.8rem;font-weight:650}input[type=range]{width:155px}select{font:inherit;color:inherit;background:transparent;border:1px solid #aaa;border-radius:7px;padding:5px}.stats{font-size:.8rem}</style></head><body><main class="card">
<p class="goal"><b>學習目標：</b>追粒子得到的 histogram，會逼近 change-of-variables 算出的密度；Jacobian 收縮時密度升高，非可逆 collapse 時公式失效。</p>
<canvas id="cv" class="plot" aria-label="上方是被 flow map 搬動的葉子，下方比較 histogram 與 Jacobian 密度"></canvas>
<div class="row"><label>時間 t <input id="t" type="range" min="0" max="4" step=".02" value="1.5"></label><b id="vt"></b><label>葉子數 N <input id="n" type="range" min="100" max="10000" step="100" value="2000"></label><b id="vn"></b><label>水流 <select id="field"><option value="rotate">旋轉（保體積）</option><option value="contract">收攏</option><option value="stretch">拉長</option><option value="collapse">非 Lipschitz collapse</option></select></label></div>
<div class="stats" id="msg"></div><p class="observe">N 只改變 histogram 的毛躁程度；公式曲線不受取樣數影響。選 collapse 後，Jacobian 走向 0，密度在中線形成奇異質量。</p>
</main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},D=MLF.hiDPICanvas(E('cv')),pal=MLF.palette(),base=[];function init(){var r=MLF.rng(4);base=[];for(var i=0;i<10000;i++)base.push([r.normal(),r.normal()])}
 function trans(p,t,k){var x=p[0],y=p[1];if(k==='rotate')return[x*Math.cos(t)-y*Math.sin(t),x*Math.sin(t)+y*Math.cos(t)];if(k==='contract')return[x+t,y*Math.exp(-.5*t)];if(k==='stretch')return[x*Math.exp(.28*t),y];var a=Math.max(0,Math.sqrt(Math.abs(y))-.5*t);return[x+t,Math.sign(y)*a*a]}
 function draw(){var z=D.resize(),c=D.ctx;c.clearRect(0,0,z.w,z.h);c.fillStyle=pal.bg;c.fillRect(0,0,z.w,z.h);var t=+E('t').value,k=E('field').value,n=+E('n').value,top=z.h*.58,L=38,W=z.w-70,H=top-35,ys=[],skip=Math.max(1,Math.floor(n/2500));c.fillStyle=pal.dark?'#22313d':'#e8f2f7';c.fillRect(L,20,W,H);for(var i=0;i<n;i++){var q=trans(base[i],t,k);ys.push(q[1]);if(i%skip===0){c.fillStyle=MLF.rgb(pal.b,.3);c.beginPath();c.arc(L+W/2+q[0]*W/8,20+H/2-q[1]*H/7,1.7,0,7);c.fill()}}
  var lo=-4,hi=4,bins=55,hist=MLF.hist(ys,lo,hi,bins),hm=Math.max.apply(null,hist),y0=z.h-35,hh=z.h-top-50;c.strokeStyle=pal.axis;c.strokeRect(L,top+8,W,hh);for(i=0;i<bins;i++){var bh=hist[i]/hm*(hh-10);c.fillStyle=MLF.rgb(pal.b,.35);c.fillRect(L+i*W/bins,y0-bh,W/bins-1,bh)}
  c.strokeStyle=MLF.rgb(pal.a);c.lineWidth=2.5;c.beginPath();var scale=k==='contract'?Math.exp(-.5*t):k==='collapse'?Math.max(.04,1-.35*t):1;for(i=0;i<160;i++){var y=lo+(hi-lo)*i/159,dens=Math.exp(-y*y/(2*scale*scale))/scale,px=L+(y-lo)/(hi-lo)*W,py=y0-dens*(hh-10);if(!i)c.moveTo(px,py);else c.lineTo(px,py)}c.stroke();E('vt').textContent=t.toFixed(2);E('vn').textContent=n;E('msg').textContent=k==='collapse'&&t>1.8?'警示：葉子在有限時間堆到 y=0；Jacobian=0，普通 density 公式失效。':'柱：粒子 histogram；金線：change-of-variables 密度。'}
 ['t','n','field'].forEach(function(id){E(id).oninput=draw});function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);init();theme()})();
</script></body></html>

<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>預報值與 loss 的最低點</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:800px;margin:auto;padding:18px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.87rem;line-height:1.55}.plot{width:100%;aspect-ratio:16/9;display:block}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:8px 0}label{font-size:.79rem;font-weight:650}input[type=range]{width:130px}button,select{font:inherit;color:inherit;background:transparent;border:1px solid #aaa;border-radius:8px;padding:5px 9px}.stats{font-size:.8rem;font-variant-numeric:tabular-nums}</style></head><body><main class="card">
<p class="goal"><b>學習目標：</b>平方誤差選 mean，絕對誤差選 median，不對稱絕對誤差選 quantile；最佳答案甚至可以落在零機率的位置。</p>
<canvas id="cv" class="plot" aria-label="左側為可調溫度分布，右側為三種 loss 對預報值的曲線"></canvas>
<div class="row"><label>分布 <select id="dist"><option value="two">雙峰</option><option value="gauss">Gaussian</option><option value="skew">偏斜</option><option value="tail">厚尾</option></select></label><label>高峰位置 <input id="hi" type="range" min="24" max="34" value="30"></label><label>高峰權重 <input id="wt" type="range" min=".1" max=".9" step=".05" value=".6"></label><label>低估/高估懲罰 <input id="asym" type="range" min=".2" max="5" step=".1" value="1"></label></div>
<div class="row"><label>你的預報 a <input id="a" type="range" min="15" max="38" step=".1" value="26.8"></label><button id="sim">模擬 3000 天</button><span class="stats">mean=<b id="mean"></b>　median=<b id="median"></b>　MSE=<b id="mse"></b>　MAE=<b id="mae"></b></span></div>
<p class="observe">切到厚尾並重複模擬，mean 會比 median 抖得更厲害；不對稱懲罰則把最低點推向指定 quantile。</p>
</main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},D=MLF.hiDPICanvas(E('cv')),pal=MLF.palette(),seed=2,ys=[];
 function sample(){var r=MLF.rng(seed),kind=E('dist').value,w=+E('wt').value,hi=+E('hi').value;ys=[];for(var i=0;i<3000;i++){var y;if(kind==='two')y=r()<w?hi:22;else if(kind==='gauss')y=27+r.normal()*3;else if(kind==='skew')y=20-Math.log(Math.max(r(),1e-8))*3;else{var u=r.normal(),v=Math.abs(r.normal());y=26+3*u/Math.max(v,.04)}ys.push(Math.max(8,Math.min(45,y)))}}
 function losses(a){var q=+E('asym').value,m=0,l=0,p=0;ys.forEach(function(y){var e=y-a;m+=e*e;l+=Math.abs(e);p+=e>=0?q*e:-e});return[m/ys.length,l/ys.length,p/ys.length]}
 function draw(){var z=D.resize(),c=D.ctx;c.clearRect(0,0,z.w,z.h);c.fillStyle=pal.bg;c.fillRect(0,0,z.w,z.h);var split=z.w*.42,L=32,T=28,H=z.h-65,lo=12,hi=42,bins=45,h=MLF.hist(ys,lo,hi,bins),hm=Math.max.apply(null,h);c.strokeStyle=pal.axis;c.strokeRect(L,T,split-L-20,H);for(var i=0;i<bins;i++){var bh=h[i]/hm*(H-15);c.fillStyle=MLF.rgb(pal.b,.65);c.fillRect(L+i*(split-L-20)/bins,T+H-bh,(split-L-20)/bins-1,bh)}c.fillStyle=pal.muted;c.font='11px system-ui';c.fillText('明日溫度分布',L+4,T+14);
  var x0=split+25,w=z.w-x0-25,y0=T+H,mx=0,curves=[[],[],[]];for(i=0;i<=120;i++){var a=lo+(hi-lo)*i/120,v=losses(a);for(var k=0;k<3;k++){curves[k].push([a,v[k]]);mx=Math.max(mx,v[k])}}c.strokeStyle=pal.axis;c.strokeRect(x0,T,w,H);[pal.a,pal.c,pal.d].forEach(function(col,k){c.strokeStyle=MLF.rgb(col);c.lineWidth=2.3;c.beginPath();curves[k].forEach(function(q,j){var xx=x0+(q[0]-lo)/(hi-lo)*w,yy=y0-q[1]/mx*(H-20);if(!j)c.moveTo(xx,yy);else c.lineTo(xx,yy)});c.stroke()});var a=+E('a').value,px=x0+(a-lo)/(hi-lo)*w;c.strokeStyle=pal.ink;c.setLineDash([5,4]);c.beginPath();c.moveTo(px,T);c.lineTo(px,y0);c.stroke();c.setLineDash([]);c.fillStyle=pal.muted;c.fillText('金 MSE　綠 MAE　紅不對稱',x0+5,T+14);
  var sorted=ys.slice().sort(function(a,b){return a-b}),mean=MLF.mean(ys),median=sorted[Math.floor(sorted.length/2)],v=losses(a);E('mean').textContent=mean.toFixed(2);E('median').textContent=median.toFixed(2);E('mse').textContent=v[0].toFixed(2);E('mae').textContent=v[1].toFixed(2)}
 function refresh(){sample();draw()}['dist','hi','wt','asym'].forEach(function(id){E(id).oninput=refresh});E('a').oninput=draw;E('sim').onclick=function(){seed++;refresh()};function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);refresh();theme()})();
</script></body></html>

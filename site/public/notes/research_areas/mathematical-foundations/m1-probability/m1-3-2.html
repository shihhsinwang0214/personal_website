<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bayes posterior：篩檢</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:800px;margin:auto;padding:18px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.87rem;line-height:1.55}.plot{width:100%;aspect-ratio:16/9;display:block}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:8px 0}label{font-size:.79rem;font-weight:650}input[type=range]{width:130px}.stats{font-size:.82rem;font-variant-numeric:tabular-nums}</style></head><body><main class="card">
<p class="goal"><b>學習目標：</b>posterior 同時由 likelihood 與 prior base rate 決定。測試即使很準，罕見事件的陽性仍可能多是假陽性。</p>
<canvas id="cv" class="plot" aria-label="一萬人的 icon array 與 prior 到 posterior 的機率更新"></canvas>
<div class="row"><label>盛行率 <input id="prev" type="range" min=".001" max=".3" step=".001" value=".01"></label><b id="vp"></b><label>靈敏度 <input id="sens" type="range" min=".5" max="1" step=".01" value=".9"></label><label>特異度 <input id="spec" type="range" min=".5" max="1" step=".01" value=".95"></label><label><input id="repeat" type="checkbox"> 獨立再測一次仍為陽性</label></div>
<div class="stats">真陽性 <b id="tp"></b>　假陽性 <b id="fp"></b>　P(病 | 結果)=<b id="post"></b></div><p class="observe">拖動盛行率能直接看到 base-rate effect；第二次獨立陽性會再乘一次 likelihood ratio，但只有「條件獨立」時才成立。</p>
</main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},D=MLF.hiDPICanvas(E('cv')),pal=MLF.palette();
 function calc(){var p=+E('prev').value,se=+E('sens').value,sp=+E('spec').value,k=E('repeat').checked?2:1,tp=p*Math.pow(se,k),fp=(1-p)*Math.pow(1-sp,k);return[p,se,sp,tp,fp,tp/(tp+fp)]}
 function draw(){var z=D.resize(),c=D.ctx;c.clearRect(0,0,z.w,z.h);c.fillStyle=pal.bg;c.fillRect(0,0,z.w,z.h);var q=calc(),split=z.w*.62,L=28,T=28,W=split-48,H=z.h-58,cols=40,rows=25,n=cols*rows,tp=Math.round(q[3]*n),fp=Math.round(q[4]*n),pos=tp+fp,cell=Math.min(W/cols,H/rows),ox=L+(W-cell*cols)/2,oy=T+(H-cell*rows)/2;for(var i=0;i<n;i++){c.fillStyle=i<tp?MLF.rgb(pal.d):i<pos?MLF.rgb(pal.a):pal.dark?'#444852':'#d8dde5';var x=ox+(i%cols)*cell,y=oy+Math.floor(i/cols)*cell;c.fillRect(x+1,y+1,cell-2,cell-2)}
  c.fillStyle=pal.muted;c.font='11px system-ui';c.fillText('每格約 10 人；紅＝真陽性，金＝假陽性',L+3,T+12);
  var x0=split+28,y0=z.h-60,w=z.w-split-52,h=z.h-115;c.strokeStyle=pal.axis;c.strokeRect(x0,55,w,h);c.fillStyle=MLF.rgb(pal.d);c.fillRect(x0,y0-q[3]/Math.max(q[3]+q[4],.001)*h,w*.38,q[3]/Math.max(q[3]+q[4],.001)*h);c.fillStyle=MLF.rgb(pal.a);c.fillRect(x0+w*.55,y0-q[4]/Math.max(q[3]+q[4],.001)*h,w*.38,q[4]/Math.max(q[3]+q[4],.001)*h);c.fillStyle=pal.ink;c.font='12px system-ui';c.fillText('真陽性',x0,y0+20);c.fillText('假陽性',x0+w*.55,y0+20);c.font='700 25px system-ui';c.fillText((q[5]*100).toFixed(1)+'%',x0+8,40);
  E('vp').textContent=(q[0]*100).toFixed(1)+'%';E('tp').textContent=Math.round(q[3]*10000);E('fp').textContent=Math.round(q[4]*10000);E('post').textContent=(q[5]*100).toFixed(1)+'%'}
 ['prev','sens','spec','repeat'].forEach(function(id){E(id).oninput=draw});function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);theme()})();
</script></body></html>

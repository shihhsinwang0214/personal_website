<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>條件期望：分桶與細分</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:800px;margin:auto;padding:18px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.87rem;line-height:1.55}.plot{width:100%;aspect-ratio:16/9;display:block}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}label{font-size:.8rem;font-weight:650}input[type=range]{width:150px}button{font:inherit;color:inherit;background:transparent;border:1px solid #aaa;border-radius:8px;padding:6px 10px}.stats{font-size:.8rem}</style></head><body><main class="card">
<p class="goal"><b>學習目標：</b>條件期望是一張「每個桶一個平均」的表；多給一個條件會縮小桶內散佈，但也減少每桶樣本。</p>
<canvas id="cv" class="plot" aria-label="鞋碼與身高散佈圖、分桶平均與細分後的條件平均"></canvas>
<div class="row"><label>桶寬 <input id="bw" type="range" min=".1" max="2" step=".1" value=".6"></label><b id="vbw"></b><label>樣本數 <input id="n" type="range" min="50" max="4000" step="50" value="800"></label><b id="vn"></b><label><input id="gender" type="checkbox"> 依性別細分</label><label><input id="sd" type="checkbox"> ±1 SD</label><button id="again">重新抽樣</button></div>
<div class="stats" id="info">移到圖上可讀取該桶。</div><p class="observe">桶太窄或樣本太少時，條件平均會鋸齒甚至出現空桶；細分雖降低桶內 variance，估計本身卻更抖。</p>
</main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},D=MLF.hiDPICanvas(E('cv')),pal=MLF.palette(),seed=12,data=[],hover=null;
 function sample(){var r=MLF.rng(seed),n=+E('n').value;data=[];for(var i=0;i<n;i++){var g=r()<.45?1:0,shoe=24.8+g*1.4+r.normal()*1.05,height=147+shoe*.72+g*6+r.normal()*4.5;data.push({x:shoe,y:height,g:g})}}
 function buckets(g){var bw=+E('bw').value,lo=21,hi=30,out=[];for(var a=lo;a<hi;a+=bw){var q=data.filter(function(p){return p.x>=a&&p.x<a+bw&&(g==null||p.g===g)}),ys=q.map(function(p){return p.y}),m=q.length?MLF.mean(ys):NaN;out.push({a:a,b:a+bw,n:q.length,m:m,sd:q.length?MLF.std(ys):0,g:g})}return out}
 function draw(){var s=D.resize(),c=D.ctx;c.clearRect(0,0,s.w,s.h);c.fillStyle=pal.bg;c.fillRect(0,0,s.w,s.h);var L=48,T=24,W=s.w-70,H=s.h-65,x0=21,x1=30,y0=155,y1=185,X=function(x){return L+(x-x0)/(x1-x0)*W},Y=function(y){return T+H-(y-y0)/(y1-y0)*H};c.strokeStyle=pal.axis;c.strokeRect(L,T,W,H);
  var skip=Math.max(1,Math.floor(data.length/1800));for(var i=0;i<data.length;i+=skip){var p=data[i];c.fillStyle=E('gender').checked?(p.g?MLF.rgb(pal.a,.38):MLF.rgb(pal.b,.38)):MLF.rgb(pal.ink?pal.b:[80,110,150],.28);c.beginPath();c.arc(X(p.x),Y(p.y),2,0,7);c.fill()}
  function stair(bs,col){c.strokeStyle=col;c.lineWidth=3;c.beginPath();var started=false;bs.forEach(function(b){if(!isFinite(b.m)){started=false;return}var xa=X(b.a),xb=X(b.b),yy=Y(b.m);if(!started){c.moveTo(xa,yy);started=true}else c.lineTo(xa,yy);c.lineTo(xb,yy);if(E('sd').checked){c.fillStyle=col.replace('rgb','rgba').replace(')',',.08)');c.fillRect(xa,Y(b.m+b.sd),xb-xa,Y(b.m-b.sd)-Y(b.m+b.sd))}});c.stroke()}
  if(E('gender').checked){stair(buckets(1),MLF.rgb(pal.a));stair(buckets(0),MLF.rgb(pal.b))}else stair(buckets(null),MLF.rgb(pal.c));c.fillStyle=pal.muted;c.font='11px system-ui';c.fillText('鞋碼 →',L+W-42,T+H+18);c.fillText(E('gender').checked?'金：男　藍：女':'綠：E[身高 | 鞋碼桶]',L+5,T+14);E('vbw').textContent=(+E('bw').value).toFixed(1);E('vn').textContent=data.length;
  if(hover!=null){var bs=buckets(null),b=bs.find(function(q){return hover>=q.a&&hover<q.b});if(b){var bm=buckets(1).find(function(q){return q.a===b.a}),bf=buckets(0).find(function(q){return q.a===b.a}),weighted=(bm&&bf&&bm.n+bf.n)?(bm.m*bm.n+bf.m*bf.n)/(bm.n+bf.n):NaN;E('info').textContent='桶 '+b.a.toFixed(1)+'–'+b.b.toFixed(1)+'：n='+b.n+'，平均='+ (isFinite(b.m)?b.m.toFixed(2):'空桶')+(E('gender').checked&&isFinite(weighted)?'；男女加權回來='+weighted.toFixed(2):'')}}
 }
 function refresh(){sample();draw()}['bw','gender','sd'].forEach(function(id){E(id).oninput=draw});E('n').oninput=refresh;E('again').onclick=function(){seed++;refresh()};E('cv').onmousemove=function(ev){var r=E('cv').getBoundingClientRect();hover=21+9*(ev.offsetX-48)/(r.width-70);draw()};function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);refresh();theme()})();
</script></body></html>

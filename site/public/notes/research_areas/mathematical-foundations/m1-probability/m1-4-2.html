<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tweedie：score 與 posterior mean</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:820px;margin:auto;padding:18px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.87rem;line-height:1.55}.plot{width:100%;aspect-ratio:16/10;display:block}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:8px 0}label{font-size:.78rem;font-weight:650}input[type=range]{width:125px}select{font:inherit;color:inherit;background:transparent;border:1px solid #aaa;border-radius:7px;padding:4px}.stats{font-size:.8rem;font-variant-numeric:tabular-nums}.bad{color:#d05d55}</style></head><body><main class="card">
<p class="goal"><b>學習目標：</b>Gaussian noise 下，posterior mean 等於讀數沿 score 走 σ²；只需觀測分布 pY，不需顯式知道 prior。</p>
<canvas id="cv" class="plot" aria-label="prior、觀測密度、score 箭頭、posterior 與 Tweedie 修正曲線"></canvas>
<div class="row"><label>真實 σ <input id="sigma" type="range" min=".2" max="5" step=".1" value="2"></label><label>你以為的 σ <input id="guess" type="range" min=".2" max="5" step=".1" value="2"></label><label>讀數 y <input id="y" type="range" min="35" max="95" step=".2" value="72.4"></label></div>
<div class="row"><label>prior <select id="prior"><option value="one">單峰</option><option value="two">雙峰</option><option value="uniform">寬均勻</option></select></label><label>noise <select id="noise"><option value="gauss">Gaussian</option><option value="jump">5% 跳格</option><option value="uniform">均勻</option></select></label><span id="flag" class="stats"></span></div>
<div class="stats">score=<b id="score"></b>　Tweedie=<b id="tw"></b>　數值 posterior mean=<b id="pm"></b></div><p class="observe">雙峰 prior 的谷底會出現方向反轉。切換非 Gaussian noise 時，標準 Tweedie 線與真正 posterior mean 分開。</p>
</main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},D=MLF.hiDPICanvas(E('cv')),pal=MLF.palette();
 function normal(x,m,s){return Math.exp(-(x-m)*(x-m)/(2*s*s))/(s*Math.sqrt(2*Math.PI))}
 function prior(x){var k=E('prior').value;if(k==='one')return normal(x,62,7);if(k==='two')return .55*normal(x,70,6)+.45*normal(x,55,5);return x>38&&x<92?1/54:0}
 function like(y,x,s){var k=E('noise').value;if(k==='gauss')return normal(y,x,s);if(k==='jump')return .95*normal(y,x,s)+.05*normal(y,x+10,s*.35);return Math.abs(y-x)<=Math.sqrt(3)*s?1/(2*Math.sqrt(3)*s):0}
 function py(y){var s=+E('sigma').value,sum=0,dx=.25;for(var x=25;x<=105;x+=dx)sum+=prior(x)*like(y,x,s)*dx;return sum}
 function posterior(y){var s=+E('sigma').value,z=0,m=0,dx=.2;for(var x=25;x<=105;x+=dx){var w=prior(x)*like(y,x,s);z+=w*dx;m+=x*w*dx}return m/Math.max(z,1e-12)}
 function draw(){var z=D.resize(),c=D.ctx;c.clearRect(0,0,z.w,z.h);c.fillStyle=pal.bg;c.fillRect(0,0,z.w,z.h);var L=42,T=22,W=z.w-70,H=z.h*.56,lo=30,hi=100,X=function(x){return L+(x-lo)/(hi-lo)*W},base=T+H,mx=0,vals=[];for(var i=0;i<=180;i++){var x=lo+(hi-lo)*i/180,v=py(x);vals.push([x,v]);mx=Math.max(mx,v)}c.strokeStyle=pal.axis;c.strokeRect(L,T,W,H);function line(fn,col,scale){c.strokeStyle=col;c.lineWidth=2.5;c.beginPath();for(var j=0;j<=180;j++){var x=lo+(hi-lo)*j/180,v=fn(x),px=X(x),yy=base-v/(scale||mx)*(H-20);if(!j)c.moveTo(px,yy);else c.lineTo(px,yy)}c.stroke()}line(prior,MLF.rgb(pal.b),Math.max.apply(null,Array.from({length:181},function(_,i){return prior(lo+(hi-lo)*i/180)})));line(py,MLF.rgb(pal.a),mx);
  var y=+E('y').value,s=+E('sigma').value,sg=+E('guess').value,eps=.05,score=(Math.log(py(y+eps)+1e-12)-Math.log(py(y-eps)+1e-12))/(2*eps),tw=y+sg*sg*score,pm=posterior(y);for(var q=35;q<=95;q+=6){var sc=(Math.log(py(q+.08)+1e-12)-Math.log(py(q-.08)+1e-12))/.16;c.strokeStyle=MLF.rgb(pal.d,.75);c.beginPath();c.moveTo(X(q),base-5);c.lineTo(X(q)+Math.max(-30,Math.min(30,s*s*sc*4)),base-5);c.stroke()}c.strokeStyle=MLF.rgb(pal.d);c.lineWidth=3;c.beginPath();c.moveTo(X(y),T);c.lineTo(X(y),base);c.stroke();c.fillStyle=MLF.rgb(pal.c);c.beginPath();c.arc(X(pm),base-12,6,0,7);c.fill();c.fillStyle=pal.muted;c.font='11px system-ui';c.fillText('藍 prior　金 pY　紅線 y　綠點 posterior mean',L+5,T+14);
  var x0=L,y0=z.h-35,w=W,h=z.h-base-55,cmax=0,cur=[];for(i=0;i<=150;i++){var yy=lo+(hi-lo)*i/150,sc=(Math.log(py(yy+.08)+1e-12)-Math.log(py(yy-.08)+1e-12))/.16,tv=yy+sg*sg*sc,pv=posterior(yy);cur.push([yy,tv-yy,pv-yy]);cmax=Math.max(cmax,Math.abs(tv-yy),Math.abs(pv-yy))}c.strokeStyle=pal.axis;c.strokeRect(x0,base+15,w,h);[[1,pal.a],[2,pal.c]].forEach(function(spec){c.strokeStyle=MLF.rgb(spec[1]);c.lineWidth=2;c.beginPath();cur.forEach(function(v,j){var px=X(v[0]),yy=y0-v[spec[0]]/(cmax||1)*(h*.42)-h*.5;if(!j)c.moveTo(px,yy);else c.lineTo(px,yy)});c.stroke()});E('score').textContent=score.toFixed(3);E('tw').textContent=tw.toFixed(2);E('pm').textContent=pm.toFixed(2);var good=E('noise').value==='gauss';E('flag').className=good?'stats':'stats bad';E('flag').textContent=good?'Gaussian：公式前提成立':'非 Gaussian：Tweedie 公式不保證'}
 ['sigma','guess','y','prior','noise'].forEach(function(id){E(id).oninput=draw});function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);theme()})();
</script></body></html>

<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>兩台體重計：Gaussian 合併</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,sans-serif;background:transparent;color:#1f2733}body[data-dark="1"]{color:#e9e6e1}.card{max-width:800px;margin:auto;padding:18px;border:1px solid #ddd5c9;border-radius:14px;background:#fffdfb}body[data-dark="1"] .card{background:#1f2126;border-color:#3a3b42}.goal,.observe{font-size:.87rem;line-height:1.55}.plot{width:100%;aspect-ratio:16/9;display:block}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:8px 0}label{font-size:.79rem;font-weight:650}input[type=range]{width:125px}select{font:inherit;color:inherit;background:transparent;border:1px solid #aaa;border-radius:7px;padding:4px}.stats{font-size:.8rem;font-variant-numeric:tabular-nums}</style></head><body><main class="card">
<p class="goal"><b>學習目標：</b>獨立 Gaussian 讀數的最佳線性權重與 variance 成反比；相關會吃掉合併增益，離群值會讓 Gaussian 理論失準。</p>
<canvas id="cv" class="plot" aria-label="合併估計的 histogram 與 variance 對權重曲線"></canvas>
<div class="row"><label>σA <input id="sa" type="range" min=".1" max="3" step=".1" value="1"></label><label>σB <input id="sb" type="range" min=".1" max="3" step=".1" value=".5"></label><label>A 權重 a <input id="a" type="range" min="0" max="1" step=".01" value=".2"></label><label>相關 ρ <input id="rho" type="range" min="-1" max="1" step=".05" value="0"></label></div>
<div class="row"><label><input id="outlier" type="checkbox"> A 台 2% 跳 +10 kg</label><button id="resample">重新模擬</button><span class="stats">理論 variance=<b id="theory"></b>　模擬=<b id="emp"></b>　最佳 a*=<b id="opt"></b></span></div>
<p class="observe">ρ→1 時兩台分享同一份噪聲，合併幾乎沒有好處。打開跳格後，右尾與實測 variance 會脫離理論曲線。</p>
</main><script src="../../machine-learning-foundations/_demo-common.js"></script><script>
(function(){var E=function(x){return document.getElementById(x)},D=MLF.hiDPICanvas(E('cv')),pal=MLF.palette(),seed=7;
 function simulate(){var sa=+E('sa').value,sb=+E('sb').value,a=+E('a').value,rho=+E('rho').value,r=MLF.rng(seed),xs=[],n=10000;for(var i=0;i<n;i++){var z=r.normal(),za=r.normal(),zb=r.normal(),ea=sa*(rho>=0?Math.sqrt(rho)*z+Math.sqrt(1-rho)*za:Math.sqrt(-rho)*z+Math.sqrt(1+rho)*za),eb=sb*(rho>=0?Math.sqrt(rho)*z+Math.sqrt(1-rho)*zb:-Math.sqrt(-rho)*z+Math.sqrt(1+rho)*zb);if(E('outlier').checked&&r()<.02)ea+=10;xs.push(a*ea+(1-a)*eb)}return xs}
 function draw(){var z=D.resize(),c=D.ctx;c.clearRect(0,0,z.w,z.h);c.fillStyle=pal.bg;c.fillRect(0,0,z.w,z.h);var split=z.w*.55,L=30,T=25,W=split-45,H=z.h-65,xs=simulate(),lo=-5,hi=8,bins=55,hist=MLF.hist(xs,lo,hi,bins),hm=Math.max.apply(null,hist);
  c.strokeStyle=pal.axis;c.strokeRect(L,T,W,H);for(var i=0;i<bins;i++){var bh=hist[i]/hm*(H-20);c.fillStyle=MLF.rgb(pal.b,.65);c.fillRect(L+i*W/bins,T+H-bh,W/bins-1,bh)}c.strokeStyle=MLF.rgb(pal.d);c.lineWidth=2;c.beginPath();var sa=+E('sa').value,sb=+E('sb').value,a=+E('a').value,rho=+E('rho').value,theory=a*a*sa*sa+(1-a)*(1-a)*sb*sb+2*a*(1-a)*rho*sa*sb;for(i=0;i<150;i++){var x=lo+(hi-lo)*i/149,y=Math.exp(-x*x/(2*theory))/Math.sqrt(2*Math.PI*theory),px=L+(x-lo)/(hi-lo)*W,py=T+H-y*Math.sqrt(2*Math.PI*theory)*(H-20);if(!i)c.moveTo(px,py);else c.lineTo(px,py)}c.stroke();c.fillStyle=pal.muted;c.font='11px system-ui';c.fillText('histogram；紅線＝Gaussian 理論',L+4,T+14);
  var x0=split+25,y0=z.h-40,w=z.w-split-42,h=z.h-75,mx=Math.max(sa*sa,sb*sb)*1.25;c.strokeStyle=pal.axis;c.strokeRect(x0,25,w,h);c.strokeStyle=MLF.rgb(pal.c);c.lineWidth=2.5;c.beginPath();for(i=0;i<=100;i++){var q=i/100,v=q*q*sa*sa+(1-q)*(1-q)*sb*sb+2*q*(1-q)*rho*sa*sb,px=x0+q*w,py=y0-v/mx*h;if(!i)c.moveTo(px,py);else c.lineTo(px,py)}c.stroke();var den=sa*sa+sb*sb-2*rho*sa*sb,opt=(sb*sb-rho*sa*sb)/Math.max(den,1e-9);opt=Math.max(0,Math.min(1,opt));c.fillStyle=MLF.rgb(pal.d);c.beginPath();c.arc(x0+a*w,y0-theory/mx*h,5,0,7);c.fill();c.fillStyle=pal.muted;c.fillText('Var(估計) vs A 權重',x0+5,40);
  var mean=MLF.mean(xs),emp=0;xs.forEach(function(v){emp+=(v-mean)*(v-mean)});emp/=xs.length;E('theory').textContent=theory.toFixed(3);E('emp').textContent=emp.toFixed(3);E('opt').textContent=opt.toFixed(2)}
 ['sa','sb','a','rho','outlier'].forEach(function(id){E(id).oninput=draw});E('resample').onclick=function(){seed++;draw()};function theme(){pal=MLF.palette();document.body.dataset.dark=pal.dark?'1':'0';draw()}MLF.onThemeChange(theme);addEventListener('resize',draw);theme()})();
</script></body></html>

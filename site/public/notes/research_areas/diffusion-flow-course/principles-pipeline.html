<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diffusion/Flow principles pipeline demo</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: 'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
    background: transparent;
    color: #202631;
  }
  body[data-dark="1"] { color: #ece9e2; }
  .card {
    max-width: 720px;
    margin: 0 auto;
    padding: 18px;
    border-radius: 8px;
    background: #fbfaf7;
    border: 1px solid #ded8cf;
  }
  body[data-dark="1"] .card { background: #1f2126; border-color: #30323a; }
  .goal { font-size: 0.92rem; line-height: 1.5; margin: 0 0 12px; }
  .goal b { color: #1f6f78; }
  body[data-dark="1"] .goal b { color: #e1b45c; }
  canvas {
    width: 100%;
    max-width: 640px;
    aspect-ratio: 1 / 0.72;
    height: auto;
    display: block;
    margin: 0 auto;
    border-radius: 8px;
    touch-action: none;
  }
  .controls { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 12px; }
  label { font-size: 0.84rem; font-weight: 700; }
  select {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid #bfc6c7;
    background: #fff;
    color: inherit;
    font: inherit;
  }
  body[data-dark="1"] select { background: #282b33; border-color: #444855; color: #ece9e2; }
  input[type=range] { width: 240px; max-width: 62vw; accent-color: #1f6f78; }
  body[data-dark="1"] input[type=range] { accent-color: #e1b45c; }
  button {
    padding: 7px 14px;
    border-radius: 8px;
    border: 0;
    cursor: pointer;
    font-weight: 800;
    background: #1f6f78;
    color: #fff;
  }
  body[data-dark="1"] button { background: #e1b45c; color: #17191d; }
  button.ghost { background: transparent; color: inherit; border: 1px solid #bfc6c7; }
  body[data-dark="1"] button.ghost { border-color: #444855; }
  .readout {
    display: grid;
    grid-template-columns: repeat(3, minmax(86px, 1fr));
    gap: 8px;
    font-size: 0.82rem;
    font-variant-numeric: tabular-nums;
  }
  .metric {
    padding: 8px 10px;
    border-radius: 8px;
    background: rgba(31,111,120,0.08);
  }
  body[data-dark="1"] .metric { background: rgba(225,180,92,0.12); }
  .metric span { display: block; font-size: 0.72rem; color: #667078; margin-bottom: 2px; }
  body[data-dark="1"] .metric span { color: #a8a69f; }
  .observe { font-size: 0.83rem; line-height: 1.55; margin: 12px 0 0; color: #667078; }
  body[data-dark="1"] .observe { color: #a8a69f; }
  @media (max-width: 520px) {
    body { padding: 10px; }
    .card { padding: 12px; }
    .readout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="card">
  <p class="goal">學習目標：用同一批 2-D 點看 <b>data → noise</b> 的前向破壞，以及理想化 <b>noise → data</b> 的反向生成。這是解析 toy，不是即時訓練出的模型。</p>
  <canvas id="cv" width="640" height="460" aria-label="2-D data noise data pipeline"></canvas>
  <div class="controls">
    <div class="row">
      <label for="mode">視角</label>
      <select id="mode">
        <option value="reverse">反向生成：noise → data</option>
        <option value="forward">前向加噪：data → noise</option>
      </select>
      <label for="shape">資料分布</label>
      <select id="shape">
        <option value="two_moons">雙月 Two moons</option>
        <option value="two_gaussians">雙峰 Two gaussians</option>
        <option value="ring">環形 Ring</option>
        <option value="swiss_roll">螺旋 Swiss roll</option>
      </select>
    </div>
    <div class="row">
      <label for="time">進度</label>
      <input id="time" type="range" min="0" max="1" step="0.005" value="0" />
      <button id="play">▶ 播放一次</button>
      <button id="reset" class="ghost">重設</button>
    </div>
    <div class="readout">
      <div class="metric"><span>α</span><strong id="alphaR">0.00</strong></div>
      <div class="metric"><span>σ</span><strong id="sigmaR">1.00</strong></div>
      <div class="metric"><span>SNR = α²/σ²</span><strong id="snrR">0.00</strong></div>
    </div>
  </div>
  <p class="observe">觀察這個不變量 / tradeoff：端點固定，滑桿只改變訊號 α 與噪聲 σ 的比例。前向時 SNR 單調下降；反向生成則是把低 SNR 的雜訊逐步帶回高 SNR 的資料結構。</p>
</div>

<script src="../noise-to-data/_demo-common.js"></script>
<script>
(function () {
  var cv = document.getElementById('cv');
  var dpi = NDFlow.hiDPICanvas(cv);
  var ctx = dpi.ctx, size = { w: 640, h: 460 };
  var modeEl = document.getElementById('mode');
  var shapeEl = document.getElementById('shape');
  var timeEl = document.getElementById('time');
  var alphaR = document.getElementById('alphaR');
  var sigmaR = document.getElementById('sigmaR');
  var snrR = document.getElementById('snrR');
  var pal = NDFlow.palette();
  var data = [], noise = [], n = 620, raf = null;

  function alpha(tau) { return Math.cos(0.5 * Math.PI * tau); }
  function sigma(tau) { return Math.sin(0.5 * Math.PI * tau); }
  function rebuild() {
    data = NDFlow.sampleTarget(shapeEl.value, n);
    noise = NDFlow.sampleNoise(n, 0.95);
  }
  function tauFromSlider() {
    var r = parseFloat(timeEl.value);
    return modeEl.value === 'forward' ? r : 1 - r;
  }
  function currentPoint(i, tau) {
    var a = alpha(tau), s = sigma(tau);
    return [a * data[i][0] + s * noise[i][0], a * data[i][1] + s * noise[i][1]];
  }
  function velocityForSlider(i, tau) {
    var da = -0.5 * Math.PI * Math.sin(0.5 * Math.PI * tau);
    var ds = 0.5 * Math.PI * Math.cos(0.5 * Math.PI * tau);
    var sign = modeEl.value === 'forward' ? 1 : -1;
    return [sign * (da * data[i][0] + ds * noise[i][0]), sign * (da * data[i][1] + ds * noise[i][1])];
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function drawArrow(x, y, vx, vy, scale) {
    var mag = Math.hypot(vx, vy);
    if (mag < 1e-4) return;
    var ux = vx / mag, uy = vy / mag;
    var len = Math.min(0.75, mag) * scale * 0.18;
    var ex = x + ux * len, ey = y - uy * len;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    var ang = Math.atan2(-(ey - y), ex - x);
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex - 5 * Math.cos(ang - 0.5), ey + 5 * Math.sin(ang - 0.5));
    ctx.lineTo(ex - 5 * Math.cos(ang + 0.5), ey + 5 * Math.sin(ang + 0.5));
    ctx.closePath();
    ctx.fill();
  }
  function draw() {
    size = dpi.resize();
    var tau = tauFromSlider();
    var a = alpha(tau), s = sigma(tau);
    var progress = parseFloat(timeEl.value);
    var scale = Math.min(size.w, size.h) / 4.9;
    var cx = size.w / 2, cy = size.h / 2;
    ctx.clearRect(0, 0, size.w, size.h);
    ctx.fillStyle = pal.bg;
    rr(0, 0, size.w, size.h, 8);
    ctx.fill();

    ctx.strokeStyle = pal.grid;
    ctx.lineWidth = 1;
    for (var gx = -2; gx <= 2; gx++) {
      ctx.beginPath();
      ctx.moveTo(cx + gx * scale, 16);
      ctx.lineTo(cx + gx * scale, size.h - 16);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(16, cy + gx * scale);
      ctx.lineTo(size.w - 16, cy + gx * scale);
      ctx.stroke();
    }

    ctx.globalAlpha = 0.18;
    ctx.fillStyle = 'rgb(' + pal.noise.join(',') + ')';
    for (var ni = 0; ni < noise.length; ni += 2) {
      ctx.beginPath();
      ctx.arc(cx + noise[ni][0] * scale, cy - noise[ni][1] * scale, 1.5, 0, 6.2832);
      ctx.fill();
    }
    ctx.fillStyle = 'rgb(' + pal.data.join(',') + ')';
    for (var di = 0; di < data.length; di += 2) {
      ctx.beginPath();
      ctx.arc(cx + data[di][0] * scale, cy - data[di][1] * scale, 1.5, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    var colorMix = modeEl.value === 'forward' ? progress : 1 - progress;
    ctx.fillStyle = NDFlow.lerpColor(pal.data, pal.noise, colorMix);
    ctx.globalAlpha = 0.72;
    for (var i = 0; i < data.length; i++) {
      var p = currentPoint(i, tau);
      ctx.beginPath();
      ctx.arc(cx + p[0] * scale, cy - p[1] * scale, 2.1, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 0.75;
    ctx.strokeStyle = pal.arrow;
    ctx.fillStyle = pal.arrow;
    ctx.lineWidth = 1.6;
    for (var j = 0; j < data.length; j += 31) {
      var q = currentPoint(j, tau);
      var v = velocityForSlider(j, tau);
      drawArrow(cx + q[0] * scale, cy - q[1] * scale, v[0], v[1], scale);
    }
    ctx.globalAlpha = 1;

    ctx.font = '700 13px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#f3f0e8';
    var label = modeEl.value === 'forward' ? 'data → noise' : 'noise → data';
    ctx.fillText(label, 18, 28);

    alphaR.textContent = a.toFixed(3);
    sigmaR.textContent = s.toFixed(3);
    snrR.textContent = s < 0.025 ? '∞' : ((a * a) / (s * s)).toFixed(2);
  }
  function play() {
    if (raf) cancelAnimationFrame(raf);
    var start = performance.now();
    var t0 = parseFloat(timeEl.value);
    if (t0 >= 0.999) t0 = 0;
    var dur = NDFlow.prefersReducedMotion() ? 1000 : 2600;
    function step(now) {
      var t = Math.min(1, t0 + (now - start) / dur);
      timeEl.value = t;
      draw();
      if (t < 1) raf = requestAnimationFrame(step);
      else raf = null;
    }
    raf = requestAnimationFrame(step);
  }
  function applyTheme() {
    pal = NDFlow.palette();
    document.body.dataset.dark = pal.dark ? '1' : '0';
    draw();
  }

  modeEl.onchange = function () { timeEl.value = 0; draw(); };
  shapeEl.onchange = function () { rebuild(); timeEl.value = 0; draw(); };
  timeEl.oninput = function () { if (raf) cancelAnimationFrame(raf); raf = null; draw(); };
  document.getElementById('play').onclick = play;
  document.getElementById('reset').onclick = function () {
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    timeEl.value = 0;
    draw();
  };
  window.addEventListener('resize', draw);
  NDFlow.onThemeChange(applyTheme);
  rebuild();
  applyTheme();
})();
</script>
</body>
</html>

              - generic [ref=f7e1062]: x0_hat = (xt - sig[t] * eps) / ab[t].sqrt()
              - generic [ref=f7e1063]: sigma_s = eta * ((1 - ab[s]) / (1 - ab[t]) * (1 - ab[t] / ab[s])).sqrt()
              - generic [ref=f7e1064]: dir_xt = (1 - ab[s] - sigma_s**2).sqrt() * eps
              - generic [ref=f7e1065]: return ab[s].sqrt() * x0_hat + dir_xt + sigma_s * torch.randn_like(xt)
            - paragraph [ref=f7e1066]:

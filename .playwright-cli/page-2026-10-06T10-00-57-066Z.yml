            - complementary [ref=f7e1442]:
              - generic [ref=f7e1443]:
                - paragraph [ref=f7e1444]: 到這裡，我們走完了 DDPM 的整條推導鏈：選擇 Gaussian forward process、建立 denoising regression、用 Tweedie 連到 score，再用 DDPM、DDIM、SDE 或 ODE 把樣本帶回 data distribution。
                - paragraph [ref=f7e1445]:
                  - text: 但這條推導也同時固定了三項設計：起點是 Gaussian、中間路徑由 noise schedule 決定，資料與 noise 的 pairing 也不能自由選擇。
                  - strong [ref=f7e1446]: 這些真的是生成模型必須接受的限制，還是只有 diffusion 做出的選擇？
                - paragraph [ref=f7e1447]: 下一個單元會把起點、路徑與配對分開來看。Flow matching 的出發點，就是讓這三項設計可以被獨立選擇。

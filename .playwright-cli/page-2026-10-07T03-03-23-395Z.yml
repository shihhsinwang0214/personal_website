            - paragraph [ref=f3e199]:
              - text: 前面我們把一張圖想成
              - generic [ref=f3e200]:
                - math [ref=f3e202]:
                  - generic [ref=f3e205]:
                    - generic [ref=f3e206]: R
                    - generic [ref=f3e207]: d
                - generic [ref=f3e210]:
                  - text: R
                  - generic [ref=f3e211]: d
              - text: 裡的一個點，再逐步加入 Gaussian noise。但一句話是「我／今天／想／吃／……」這樣的一串 token，每個位置從字典裡選一個類別。「想」和「吃」的平均不是一個字；就算給它們編號，對編號加一點 noise 也沒有相同的意義。
            - paragraph [ref=f3e216]:
              - text: 回想
              - link "U1.1" [ref=f3e217] [cursor=pointer]:
                - /url: /personal_website/zh/notes/dma-w3-1-forward-process
              - text: ，Gaussian 幫我們做到的是：
              - strong [ref=f3e218]: 先自己造出 noisy snapshot，再讓模型學怎麼回去。
              - text: 那麼，換成 token 後，能不能保留這個策略，只換掉破壞資訊的方法？
            - paragraph [ref=f3e220]: 不能加一點 Gaussian noise， 我們還可以怎麼讓一句話逐漸看不出原文？
            - paragraph [ref=f3e221]:
              - text: 想想以前做過的克漏字。「我今天想吃＿ ＿」還留著不少線索，我們可以猜空格裡可能是什麼；但如果變成「＿今天＿吃＿ ＿」，就更難猜了，可能會有很多種可能，像是「我今天想吃晚餐」、「他今天要吃火鍋」或「你今天不吃早餐」。若最後整句都遮掉，就只剩一排空格。所以其實
              - strong [ref=f3e222]: 不用對字加 Gaussian noise，我們也可以逐步拿掉／模糊原文的資訊。
            - paragraph [ref=f3e223]: 另一個經驗是收到朋友打錯字的訊息。本來想說「我今天想吃晚餐」，卻因為輸入法選錯，變成「我今天想吃早餐」。只錯一個詞時，我們還能大概理解就是想吃飯；但若更多位置都選錯，就越來越難猜原本想說什麼。例如再變成「我今天想打籃球」。
            - paragraph [ref=f3e224]:
              - strong [ref=f3e225]: 和克漏字不同，這次沒有空格提醒我們哪裡被動過，留下的字本身直接變混亂。
            - paragraph [ref=f3e226]: 要用這個想法造出 noisy snapshot，我們可以把換字方式簡化：被選中的位置都從整本字典均勻重抽，每個 token 被抽到的機率相同，而不限制在輸入法的候選字裡。像「晚餐」除了可能變成「早餐」，也可能變成完全不相關的「天空」。
            - paragraph [ref=f3e227]:
              - text: 那麼，要讓一句話一步一步變得更難辨認，我們得先決定：
              - strong [ref=f3e228]: 每一輪，每個位置有多大的機率保留、換字，或被遮掉？
              - text: 接下來的數學，就是把這些操作發生的機率寫下來。
            - paragraph [ref=f3e229]:
              - img "克漏字逐步遮掉線索；打錯字讓留下的文字變混亂。模型可以把換字簡化為從整本字典均勻重抽，也可能抽回原字。" [ref=f3e230]
            - paragraph [ref=f3e231]:
              - emphasis [ref=f3e232]: 圖：空格告訴我們哪裡缺少資訊；換字則沒有這個提示。從整本字典均勻重抽，是把生活中的打錯字簡化成可抽樣的 corruption 規則。

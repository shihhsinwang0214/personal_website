              - generic [ref=e1444]:
                - paragraph [ref=e1445]: 到這裡，我們走完了 DDPM 的整條推導鏈：選擇 Gaussian forward process、建立 denoising regression、用 Tweedie 連到 score，再用 DDPM、DDIM、SDE 或 ODE 把樣本帶回 data distribution。
                - paragraph [ref=e1446]:
                  - text: 但這條推導也同時固定了三項設計：起點是 Gaussian、中間路徑由 noise schedule 決定，資料與 noise 的 pairing 也不能自由選擇。

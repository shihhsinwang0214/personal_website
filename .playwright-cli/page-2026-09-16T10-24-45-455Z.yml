                  - generic [ref=f4e669]: τ
                - generic [ref=f4e673]: τ
              - text: ，用步首的 rate 算每個位置在這段時間內跳的機率，
              - strong [ref=f4e674]: 所有位置獨立地決定要不要跳、跳到哪
              - text: 。
            - code [ref=f4e676]:
              - generic [ref=f4e677]: "@torch.no_grad()"
              - generic [ref=f4e678]: "def tau_leap_step(model, xt, t, tau, sigma=0.0):"
              - generic [ref=f4e679]: n, L = xt.shape
              - generic [ref=f4e680]: "probs = model(xt, t).softmax(-1) # p_θ(x0^ℓ | x_t), (n, L, K)"
              - generic [ref=f4e681]: alpha = 1 - t
              - generic [ref=f4e682]: "u = 1 / t # 翻開 rate −α̇/(1−α)"
              - generic [ref=f4e683]: "u_total = u + sigma * alpha / (1 - alpha) # remasking 的補償（步驟 2）"
              - generic [ref=f4e684]: masked = xt == MASK
              - generic [ref=f4e685]: "# 被遮位置：以機率 1−exp(−u_total τ) 翻開，翻成哪個字按 p_θ 抽"
              - generic [ref=f4e686]: flip = masked & (torch.rand(n, L) < 1 - torch.exp(-u_total * tau))
              - generic [ref=f4e687]: new = torch.distributions.Categorical(probs).sample()
              - generic [ref=f4e688]: xt = torch.where(flip, new, xt)
              - generic [ref=f4e689]: "# 已翻開位置：以機率 1−exp(−σ τ) 遮回去（步驟 2；σ=0 時不動）"
              - generic [ref=f4e690]: remask = (~masked) & (torch.rand(n, L) < 1 - torch.exp(-sigma * tau))
              - generic [ref=f4e691]: return torch.where(remask, torch.full_like(xt, MASK), xt)
              - generic [ref=f4e692]: "def sample_ctmc(model, n, steps, sigma=0.0):"
              - generic [ref=f4e693]: xt = torch.full((n, L), MASK)
              - generic [ref=f4e694]: "ts = torch.linspace(1, 0, steps + 1) # t: 1 → 0"
              - generic [ref=f4e695]: "for t, s in zip(ts[:-1], ts[1:]):"
              - generic [ref=f4e696]: xt = tau_leap_step(model, xt, t, tau=t - s, sigma=sigma)

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="840" viewBox="0 0 1920 840" role="img" aria-labelledby="title desc">
  <title id="title">廣場上的 posterior mean 與 score</title>
  <desc id="desc">三個由高噪聲到低噪聲的廣場，候選連線的粗細代表 posterior weight，粗箭頭同時表示 posterior mean 的去向與密度上升的 score 方向。</desc>

  <defs>
    <style>
      .sans { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif; }
      .math { font-family: "Cambria Math", "STIX Two Math", Georgia, serif; }
      .ink { fill: #102148; }
      .muted { fill: #667085; }
      .panel-title { font-size: 31px; font-weight: 750; letter-spacing: .2px; }
      .panel-subtitle { font-size: 23px; font-weight: 650; }
      .caption { font-size: 22px; font-weight: 650; }
      .tiny { font-size: 19px; font-weight: 600; }
      .equation { font-size: 28px; }
      .candidate { fill: none; stroke: #667085; stroke-linecap: round; opacity: .74; }
      .crowd { fill: #4a90e2; stroke: #fffdfb; stroke-width: 1.5; }
      .mean { fill: none; stroke: #2a4ea3; stroke-width: 8; stroke-linecap: round; }
    </style>

    <marker id="arrow-indigo" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L20,11 L2,20 Z" fill="#2a4ea3"/>
    </marker>
    <clipPath id="clip-left"><rect x="125" y="196" width="430" height="430" rx="18"/></clipPath>
    <clipPath id="clip-mid"><rect x="745" y="196" width="430" height="430" rx="18"/></clipPath>
    <clipPath id="clip-right"><rect x="1365" y="196" width="430" height="430" rx="18"/></clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="1920" height="840" fill="#fffdfb"/>

  <!-- Reverse-time guide and visual legend -->
  <g id="time-guide" class="sans">
    <text x="52" y="42" class="ink" font-size="24" font-weight="750">posterior mean 讀成 local geometry</text>
    <path d="M150 76 H1770" fill="none" stroke="#2a4ea3" stroke-width="3" marker-end="url(#arrow-indigo)"/>
    <rect x="696" y="50" width="528" height="46" rx="23" fill="#fffdfb" stroke="#ccd7eb" stroke-width="2"/>
    <text x="960" y="81" class="ink" font-size="25" font-weight="720" text-anchor="middle">t 往回走：人群慢慢聚起來</text>
    <line x1="1450" y1="31" x2="1510" y2="31" class="candidate" stroke-width="2"/>
    <line x1="1450" y1="43" x2="1510" y2="43" class="candidate" stroke-width="7"/>
    <text x="1524" y="43" class="muted" font-size="21" font-weight="650">線寬 ∝ p(x₀ | xₜ)</text>
  </g>

  <!-- PANEL 1: high t -->
  <g id="panel-high-t" class="sans">
    <rect x="48" y="112" width="584" height="582" rx="26" fill="#f3f9fe" stroke="#cee5f7" stroke-width="3"/>
    <rect x="75" y="132" width="116" height="42" rx="21" fill="#4a90e2"/>
    <text x="133" y="161" fill="#ffffff" class="panel-title" text-anchor="middle">t 很大</text>
    <text x="208" y="159" class="ink panel-subtitle">posterior 廣而均勻</text>

    <rect x="125" y="196" width="430" height="430" rx="18" fill="#ffffff" stroke="#b7c4d6" stroke-width="2"/>
    <g clip-path="url(#clip-left)">
      <!-- local density cue: almost flat, weakly rising toward the plaza centre -->
      <ellipse cx="342" cy="423" rx="112" ry="92" fill="#e3e7ec" opacity=".34"/>
      <ellipse cx="342" cy="423" rx="77" ry="63" fill="#d8dee5" opacity=".30"/>
      <ellipse cx="342" cy="423" rx="43" ry="36" fill="#cbd3dc" opacity=".26"/>
      <ellipse cx="342" cy="423" rx="112" ry="92" fill="none" stroke="#9aa6b5" stroke-width="1.4" opacity=".35"/>
      <ellipse cx="342" cy="423" rx="77" ry="63" fill="none" stroke="#9aa6b5" stroke-width="1.4" opacity=".30"/>

      <!-- nearly uniform crowd -->
      <g id="crowd-high" class="crowd">
        <circle cx="160" cy="234" r="7"/><circle cx="214" cy="227" r="6"/><circle cx="273" cy="245" r="7"/><circle cx="331" cy="222" r="6"/><circle cx="394" cy="240" r="7"/><circle cx="451" cy="225" r="6"/><circle cx="519" cy="248" r="7"/>
        <circle cx="183" cy="292" r="6"/><circle cx="240" cy="307" r="7"/><circle cx="307" cy="286" r="6"/><circle cx="362" cy="309" r="7"/><circle cx="426" cy="284" r="6"/><circle cx="491" cy="305" r="7"/><circle cx="539" cy="282" r="6"/>
        <circle cx="146" cy="357" r="7"/><circle cx="207" cy="345" r="6"/><circle cx="263" cy="369" r="7"/><circle cx="325" cy="350" r="6"/><circle cx="390" cy="371" r="7"/><circle cx="449" cy="352" r="6"/><circle cx="518" cy="375" r="7"/>
        <circle cx="171" cy="421" r="6"/><circle cx="229" cy="405" r="7"/><circle cx="286" cy="430" r="6"/><circle cx="353" cy="410" r="7"/><circle cx="413" cy="431" r="6"/><circle cx="472" cy="407" r="7"/><circle cx="536" cy="432" r="6"/>
        <circle cx="145" cy="490" r="7"/><circle cx="207" cy="467" r="6"/><circle cx="269" cy="499" r="7"/><circle cx="330" cy="478" r="6"/><circle cx="389" cy="497" r="7"/><circle cx="452" cy="475" r="6"/><circle cx="517" cy="501" r="7"/>
        <circle cx="174" cy="556" r="6"/><circle cx="234" cy="541" r="7"/><circle cx="296" cy="571" r="6"/><circle cx="358" cy="546" r="7"/><circle cx="418" cy="565" r="6"/><circle cx="480" cy="545" r="7"/><circle cx="537" cy="574" r="6"/>
        <circle cx="155" cy="607" r="6"/><circle cx="255" cy="612" r="6"/><circle cx="383" cy="606" r="6"/><circle cx="505" cy="611" r="6"/>
      </g>

      <!-- six similarly weighted destinations -->
      <g id="posterior-high">
        <line x1="300" y1="474" x2="183" y2="292" class="candidate" stroke-width="3.1"/>
        <line x1="300" y1="474" x2="451" y2="225" class="candidate" stroke-width="2.7"/>
        <line x1="300" y1="474" x2="518" y2="375" class="candidate" stroke-width="3"/>
        <line x1="300" y1="474" x2="517" y2="501" class="candidate" stroke-width="2.8"/>
        <line x1="300" y1="474" x2="234" y2="541" class="candidate" stroke-width="3.2"/>
        <line x1="300" y1="474" x2="145" y2="490" class="candidate" stroke-width="2.6"/>
      </g>
    </g>
    <circle cx="300" cy="474" r="11" fill="#f0803c" stroke="#ffffff" stroke-width="4"/>
    <text x="276" y="461" class="math ink" font-size="24" font-weight="700">xₜ</text>
    <path d="M307 468 L343 433" class="mean" marker-end="url(#arrow-indigo)"/>
    <text x="353" y="456" class="math ink" font-size="22" font-weight="700">E[x₀|xₜ] − xₜ</text>
    <text x="340" y="653" class="caption ink" text-anchor="middle">六個方向差不多可信</text>
    <text x="340" y="678" class="caption muted" text-anchor="middle">平均後只微微指向中央</text>
  </g>

  <!-- PANEL 2: medium t -->
  <g id="panel-medium-t" class="sans">
    <rect x="668" y="112" width="584" height="582" rx="26" fill="#fffaf0" stroke="#f3dfad" stroke-width="3"/>
    <rect x="695" y="132" width="128" height="42" rx="21" fill="#f0803c"/>
    <text x="759" y="161" fill="#ffffff" class="panel-title" text-anchor="middle">t 中等</text>
    <text x="840" y="159" class="ink panel-subtitle">三團開始可辨</text>

    <rect x="745" y="196" width="430" height="430" rx="18" fill="#ffffff" stroke="#d9c99e" stroke-width="2"/>
    <g clip-path="url(#clip-mid)">
      <!-- three emerging, overlapping density cues -->
      <ellipse cx="848" cy="315" rx="88" ry="76" fill="#e1e5ea" opacity=".32"/>
      <ellipse cx="1053" cy="291" rx="91" ry="73" fill="#d8dee5" opacity=".38"/>
      <ellipse cx="950" cy="507" rx="93" ry="72" fill="#e1e5ea" opacity=".33"/>
      <ellipse cx="1053" cy="291" rx="61" ry="49" fill="#cbd3dc" opacity=".32"/>
      <ellipse cx="1053" cy="291" rx="91" ry="73" fill="none" stroke="#8d99a8" stroke-width="1.5" opacity=".45"/>

      <g id="crowd-medium" class="crowd">
        <!-- cluster A -->
        <circle cx="797" cy="275" r="7"/><circle cx="827" cy="253" r="6"/><circle cx="859" cy="272" r="7"/><circle cx="884" cy="300" r="6"/><circle cx="810" cy="320" r="7"/><circle cx="842" cy="309" r="7"/><circle cx="873" cy="338" r="6"/><circle cx="784" cy="347" r="6"/><circle cx="829" cy="365" r="7"/><circle cx="897" cy="363" r="6"/>
        <!-- cluster B -->
        <circle cx="1002" cy="247" r="6"/><circle cx="1036" cy="229" r="7"/><circle cx="1070" cy="248" r="7"/><circle cx="1101" cy="274" r="6"/><circle cx="1021" cy="286" r="7"/><circle cx="1054" cy="279" r="8"/><circle cx="1086" cy="312" r="7"/><circle cx="1000" cy="327" r="6"/><circle cx="1042" cy="341" r="7"/><circle cx="1120" cy="337" r="6"/>
        <!-- cluster C -->
        <circle cx="893" cy="473" r="6"/><circle cx="927" cy="449" r="7"/><circle cx="962" cy="467" r="7"/><circle cx="994" cy="489" r="6"/><circle cx="910" cy="515" r="7"/><circle cx="947" cy="506" r="8"/><circle cx="980" cy="535" r="7"/><circle cx="873" cy="548" r="6"/><circle cx="932" cy="565" r="7"/><circle cx="1022" cy="559" r="6"/>
        <!-- uncertain bridge points -->
        <circle cx="920" cy="287" r="6"/><circle cx="945" cy="339" r="6"/><circle cx="1010" cy="394" r="6"/><circle cx="868" cy="416" r="6"/><circle cx="1076" cy="428" r="6"/>
      </g>

      <!-- three destinations; one carries visibly larger posterior mass -->
      <g id="posterior-medium">
        <line x1="925" y1="417" x2="842" y2="309" class="candidate" stroke-width="2.5"/>
        <line x1="925" y1="417" x2="1054" y2="279" class="candidate" stroke-width="8"/>
        <line x1="925" y1="417" x2="947" y2="506" class="candidate" stroke-width="3.5"/>
      </g>
    </g>
    <circle cx="925" cy="417" r="11" fill="#f0803c" stroke="#ffffff" stroke-width="4"/>
    <text x="899" y="402" class="math ink" font-size="24" font-weight="700">xₜ</text>
    <path d="M934 407 L1012 329" class="mean" marker-end="url(#arrow-indigo)"/>
    <text x="976" y="382" class="math ink" font-size="22" font-weight="700">E[x₀|xₜ] − xₜ</text>
    <text x="960" y="653" class="caption ink" text-anchor="middle">一個候選的 posterior weight 變大</text>
    <text x="960" y="678" class="caption muted" text-anchor="middle">平均方向偏向比較近的那一團</text>
  </g>

  <!-- PANEL 3: low t -->
  <g id="panel-low-t" class="sans">
    <rect x="1288" y="112" width="584" height="582" rx="26" fill="#f3f9fe" stroke="#cee5f7" stroke-width="3"/>
    <rect x="1315" y="132" width="116" height="42" rx="21" fill="#2a4ea3"/>
    <text x="1373" y="161" fill="#ffffff" class="panel-title" text-anchor="middle">t 很小</text>
    <text x="1448" y="159" class="ink panel-subtitle">mode 已清楚分開</text>

    <rect x="1365" y="196" width="430" height="430" rx="18" fill="#ffffff" stroke="#b7c4d6" stroke-width="2"/>
    <g clip-path="url(#clip-right)">
      <!-- three compact density modes; the local cue around x_t rises to the upper-right mode -->
      <ellipse cx="1447" cy="292" rx="66" ry="61" fill="#e0e5eb" opacity=".40"/>
      <ellipse cx="1694" cy="292" rx="70" ry="62" fill="#d2d9e2" opacity=".52"/>
      <ellipse cx="1592" cy="520" rx="70" ry="60" fill="#e0e5eb" opacity=".40"/>
      <ellipse cx="1694" cy="292" rx="46" ry="41" fill="#bcc6d1" opacity=".42"/>
      <ellipse cx="1694" cy="292" rx="70" ry="62" fill="none" stroke="#8491a2" stroke-width="1.8" opacity=".52"/>
      <path d="M1591 397 C1620 383 1650 356 1674 325" fill="none" stroke="#aeb7c3" stroke-width="18" stroke-linecap="round" opacity=".22"/>

      <g id="crowd-low" class="crowd">
        <!-- compact cluster A -->
        <circle cx="1410" cy="261" r="7"/><circle cx="1438" cy="245" r="7"/><circle cx="1468" cy="260" r="7"/><circle cx="1491" cy="286" r="6"/><circle cx="1418" cy="294" r="7"/><circle cx="1447" cy="287" r="8"/><circle cx="1474" cy="315" r="7"/><circle cx="1405" cy="326" r="6"/><circle cx="1442" cy="336" r="7"/><circle cx="1495" cy="326" r="6"/>
        <!-- compact cluster B -->
        <circle cx="1654" cy="260" r="7"/><circle cx="1682" cy="243" r="7"/><circle cx="1714" cy="256" r="7"/><circle cx="1738" cy="282" r="6"/><circle cx="1665" cy="292" r="7"/><circle cx="1695" cy="285" r="8"/><circle cx="1722" cy="313" r="7"/><circle cx="1652" cy="325" r="6"/><circle cx="1688" cy="339" r="7"/><circle cx="1740" cy="327" r="6"/>
        <!-- compact cluster C -->
        <circle cx="1550" cy="488" r="7"/><circle cx="1580" cy="470" r="7"/><circle cx="1612" cy="486" r="7"/><circle cx="1637" cy="512" r="6"/><circle cx="1560" cy="522" r="7"/><circle cx="1592" cy="514" r="8"/><circle cx="1619" cy="542" r="7"/><circle cx="1547" cy="555" r="6"/><circle cx="1587" cy="565" r="7"/><circle cx="1640" cy="554" r="6"/>
      </g>

      <!-- one dominant and two negligible alternatives -->
      <g id="posterior-low">
        <line x1="1582" y1="404" x2="1447" y2="287" class="candidate" stroke-width="1.5" opacity=".28"/>
        <line x1="1582" y1="404" x2="1695" y2="285" class="candidate" stroke-width="12" opacity=".88"/>
        <line x1="1582" y1="404" x2="1592" y2="514" class="candidate" stroke-width="1.3" opacity=".24"/>
      </g>
    </g>
    <circle cx="1582" cy="404" r="11" fill="#f0803c" stroke="#ffffff" stroke-width="4"/>
    <text x="1555" y="390" class="math ink" font-size="24" font-weight="700">xₜ</text>
    <path d="M1591 395 L1678 305" class="mean" marker-end="url(#arrow-indigo)"/>
    <text x="1599" y="361" class="math ink" font-size="22" font-weight="700">E[x₀|xₜ] − xₜ</text>
    <text x="1580" y="653" class="caption ink" text-anchor="middle">一個 mode 幾乎拿走全部權重</text>
    <text x="1580" y="678" class="caption muted" text-anchor="middle">平均方向長而明確</text>
  </g>

  <!-- Observation and exact mathematical anchor -->
  <g id="tweedie-observation" class="sans">
    <rect x="48" y="714" width="1824" height="102" rx="24" fill="#eef3fb" stroke="#cad6eb" stroke-width="2"/>
    <text x="80" y="752" class="ink" font-size="24" font-weight="780">同一支粗箭頭，兩個讀法：</text>
    <rect x="360" y="728" width="486" height="38" rx="19" fill="#fff4ed" stroke="#f4bea0" stroke-width="1.5"/>
    <text x="603" y="754" fill="#c95f25" font-size="22" font-weight="720" text-anchor="middle">周遭候選的 posterior-weighted mean</text>
    <text x="873" y="754" fill="#2a4ea3" font-size="28" font-weight="800">∥</text>
    <rect x="910" y="728" width="414" height="38" rx="19" fill="#edf4fc" stroke="#b8d4f1" stroke-width="1.5"/>
    <text x="1117" y="754" fill="#2a4ea3" font-size="22" font-weight="720" text-anchor="middle">哪一邊的 density 上升得最快</text>
    <text x="1352" y="754" class="math ink" font-size="26">∇ₓ log pₜ(xₜ)</text>

    <text x="80" y="794" class="ink" font-size="21" font-weight="700">Tweedie 把比喻變成等式：</text>
    <text x="352" y="795" class="math ink equation">√ᾱₜ E[x₀ | xₜ] − xₜ = σₜ² ∇ₓₜ log pₜ(xₜ)</text>
    <text x="1160" y="794" class="muted" font-size="21" font-weight="650">箭頭始終指向局部 density 變高的方向。</text>
  </g>
</svg>

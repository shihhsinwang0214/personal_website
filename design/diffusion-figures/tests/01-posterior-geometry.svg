<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="840" viewBox="0 0 1920 840" role="img" aria-labelledby="title desc">
  <title id="title">同一支箭頭，兩種讀法</title>
  <desc id="desc">三個時間狀態顯示 posterior 權重如何形成條件平均，而同一方向也是密度上升的 score 方向。</desc>
  <defs>
    <style>
      .sans{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}
      .math{font-family:"Cambria Math","STIX Two Math",Georgia,serif}
      .ink{fill:#0b2b6f}.muted{fill:#667085}.white{fill:#fff}
      .h1{font-size:60px;font-weight:800}.sub{font-size:25px;font-weight:600}
      .panelTitle{font-size:34px;font-weight:800}.label{font-size:22px;font-weight:650}
      .small{font-size:19px;font-weight:600}.eq{font-size:30px}
      .dot{fill:#4a90e2;stroke:#fff;stroke-width:2}.candidate{stroke:#7a8799;stroke-linecap:round;opacity:.78}
      .mean{stroke:#2a4ea3;stroke-width:9;stroke-linecap:round;fill:none}
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#2a4ea3"/>
    </marker>
    <linearGradient id="density" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#dfe5ec" stop-opacity=".08"/>
      <stop offset="1" stop-color="#8795a8" stop-opacity=".48"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="840" fill="#fffdfb"/>

  <g class="sans">
    <text x="960" y="72" text-anchor="middle" class="h1 ink">同一支箭頭，兩種讀法</text>
    <text x="960" y="111" text-anchor="middle" class="sub muted">posterior-weighted mean ＝ local density 上升方向</text>
    <line x1="250" y1="139" x2="1670" y2="139" stroke="#2a4ea3" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="960" y="148" text-anchor="middle" class="label ink" paint-order="stroke" stroke="#fffdfb" stroke-width="12">reverse time：t 大 → t 小，人群逐漸聚成 modes</text>
  </g>

  <!-- t large -->
  <g class="sans">
    <rect x="55" y="175" width="570" height="500" rx="28" fill="#eef7ff" stroke="#cfe6f8" stroke-width="3"/>
    <rect x="80" y="197" width="132" height="48" rx="24" fill="#4a90e2"/>
    <text x="146" y="231" text-anchor="middle" class="panelTitle white">t 大</text>
    <text x="235" y="230" class="label ink">還看不出 modes</text>
    <rect x="82" y="262" width="516" height="326" rx="20" fill="#fff" stroke="#b9c9da" stroke-width="2"/>
    <ellipse cx="340" cy="425" rx="93" ry="80" fill="#9ea9b7" opacity=".12"/>
    <ellipse cx="340" cy="425" rx="60" ry="50" fill="#9ea9b7" opacity=".13"/>
    <g class="dot">
      <circle cx="120" cy="300" r="7"/><circle cx="178" cy="292" r="7"/><circle cx="242" cy="312" r="7"/><circle cx="306" cy="288" r="7"/><circle cx="370" cy="306" r="7"/><circle cx="440" cy="290" r="7"/><circle cx="550" cy="314" r="7"/>
      <circle cx="142" cy="358" r="7"/><circle cx="212" cy="375" r="7"/><circle cx="278" cy="350" r="7"/><circle cx="350" cy="372" r="7"/><circle cx="416" cy="348" r="7"/><circle cx="486" cy="374" r="7"/><circle cx="566" cy="356" r="7"/>
      <circle cx="113" cy="430" r="7"/><circle cx="184" cy="414" r="7"/><circle cx="252" cy="442" r="7"/><circle cx="323" cy="419" r="7"/><circle cx="394" cy="446" r="7"/><circle cx="463" cy="420" r="7"/><circle cx="546" cy="447" r="7"/>
      <circle cx="138" cy="510" r="7"/><circle cx="205" cy="490" r="7"/><circle cx="275" cy="521" r="7"/><circle cx="345" cy="496" r="7"/><circle cx="414" cy="522" r="7"/><circle cx="490" cy="494" r="7"/><circle cx="567" cy="520" r="7"/>
      <circle cx="165" cy="560" r="7"/><circle cx="250" cy="555" r="7"/><circle cx="382" cy="560" r="7"/><circle cx="530" cy="555" r="7"/>
    </g>
    <g fill="none" class="candidate">
      <line x1="302" y1="466" x2="142" y2="358" stroke-width="4"/>
      <line x1="302" y1="466" x2="306" y2="288" stroke-width="4"/>
      <line x1="302" y1="466" x2="486" y2="374" stroke-width="4"/>
      <line x1="302" y1="466" x2="490" y2="494" stroke-width="4"/>
      <line x1="302" y1="466" x2="250" y2="555" stroke-width="4"/>
      <line x1="302" y1="466" x2="113" y2="430" stroke-width="4"/>
    </g>
    <circle cx="302" cy="466" r="13" fill="#f0803c" stroke="#fff" stroke-width="4"/>
    <text x="273" y="453" class="math eq ink">xₜ</text>
    <path d="M313 458L344 430" class="mean" marker-end="url(#arrow)"/>
    <text x="340" y="623" text-anchor="middle" class="label ink">六個方向差不多可信</text>
    <text x="340" y="650" text-anchor="middle" class="small muted">平均後只微微指向中央</text>
  </g>

  <!-- t medium -->
  <g class="sans">
    <rect x="675" y="175" width="570" height="500" rx="28" fill="#fff8e7" stroke="#f3dfad" stroke-width="3"/>
    <rect x="700" y="197" width="155" height="48" rx="24" fill="#f0803c"/>
    <text x="778" y="231" text-anchor="middle" class="panelTitle white">t 中</text>
    <text x="878" y="230" class="label ink">三團開始可辨</text>
    <rect x="702" y="262" width="516" height="326" rx="20" fill="#fff" stroke="#d9c99e" stroke-width="2"/>
    <ellipse cx="825" cy="350" rx="88" ry="70" fill="#9ea9b7" opacity=".14"/>
    <ellipse cx="1067" cy="344" rx="90" ry="72" fill="#9ea9b7" opacity=".28"/>
    <ellipse cx="944" cy="505" rx="92" ry="66" fill="#9ea9b7" opacity=".16"/>
    <g class="dot">
      <circle cx="780" cy="319" r="8"/><circle cx="815" cy="300" r="7"/><circle cx="852" cy="318" r="8"/><circle cx="792" cy="356" r="7"/><circle cx="828" cy="347" r="9"/><circle cx="867" cy="375" r="7"/><circle cx="806" cy="397" r="7"/>
      <circle cx="1022" cy="310" r="7"/><circle cx="1058" cy="289" r="8"/><circle cx="1096" cy="309" r="8"/><circle cx="1035" cy="350" r="8"/><circle cx="1070" cy="339" r="10"/><circle cx="1110" cy="369" r="8"/><circle cx="1051" cy="392" r="7"/>
      <circle cx="899" cy="474" r="7"/><circle cx="935" cy="454" r="8"/><circle cx="974" cy="472" r="8"/><circle cx="915" cy="510" r="8"/><circle cx="949" cy="503" r="10"/><circle cx="988" cy="530" r="8"/><circle cx="931" cy="548" r="7"/>
      <circle cx="916" cy="360" r="6"/><circle cx="970" cy="405" r="6"/><circle cx="858" cy="440" r="6"/>
    </g>
    <g fill="none" class="candidate">
      <line x1="935" y1="420" x2="828" y2="347" stroke-width="3"/>
      <line x1="935" y1="420" x2="1070" y2="339" stroke-width="11"/>
      <line x1="935" y1="420" x2="949" y2="503" stroke-width="5"/>
    </g>
    <circle cx="935" cy="420" r="13" fill="#f0803c" stroke="#fff" stroke-width="4"/>
    <text x="906" y="407" class="math eq ink">xₜ</text>
    <path d="M947 413L1039 356" class="mean" marker-end="url(#arrow)"/>
    <text x="960" y="623" text-anchor="middle" class="label ink">一個候選拿到較大 posterior weight</text>
    <text x="960" y="650" text-anchor="middle" class="small muted">加權平均開始偏向最近的 mode</text>
  </g>

  <!-- t small -->
  <g class="sans">
    <rect x="1295" y="175" width="570" height="500" rx="28" fill="#eef7ff" stroke="#cfe6f8" stroke-width="3"/>
    <rect x="1320" y="197" width="132" height="48" rx="24" fill="#2a4ea3"/>
    <text x="1386" y="231" text-anchor="middle" class="panelTitle white">t 小</text>
    <text x="1475" y="230" class="label ink">modes 已分開</text>
    <rect x="1322" y="262" width="516" height="326" rx="20" fill="#fff" stroke="#b9c9da" stroke-width="2"/>
    <ellipse cx="1439" cy="347" rx="70" ry="62" fill="#9ea9b7" opacity=".14"/>
    <ellipse cx="1715" cy="340" rx="73" ry="64" fill="#8390a2" opacity=".30"/>
    <ellipse cx="1580" cy="510" rx="73" ry="60" fill="#9ea9b7" opacity=".14"/>
    <path d="M1580 430C1625 410 1665 383 1696 354" stroke="url(#density)" stroke-width="34" fill="none" stroke-linecap="round"/>
    <g class="dot">
      <circle cx="1401" cy="317" r="8"/><circle cx="1434" cy="296" r="8"/><circle cx="1471" cy="315" r="8"/><circle cx="1414" cy="352" r="8"/><circle cx="1445" cy="344" r="10"/><circle cx="1480" cy="372" r="8"/><circle cx="1422" cy="394" r="7"/>
      <circle cx="1674" cy="309" r="8"/><circle cx="1710" cy="287" r="8"/><circle cx="1747" cy="307" r="8"/><circle cx="1687" cy="346" r="8"/><circle cx="1718" cy="336" r="10"/><circle cx="1754" cy="365" r="8"/><circle cx="1698" cy="389" r="7"/>
      <circle cx="1538" cy="480" r="8"/><circle cx="1575" cy="459" r="8"/><circle cx="1613" cy="479" r="8"/><circle cx="1551" cy="516" r="8"/><circle cx="1583" cy="508" r="10"/><circle cx="1619" cy="536" r="8"/><circle cx="1564" cy="556" r="7"/>
    </g>
    <g fill="none" class="candidate">
      <line x1="1580" y1="430" x2="1445" y2="344" stroke-width="2" opacity=".25"/>
      <line x1="1580" y1="430" x2="1718" y2="336" stroke-width="15"/>
      <line x1="1580" y1="430" x2="1583" y2="508" stroke-width="2" opacity=".25"/>
    </g>
    <circle cx="1580" cy="430" r="13" fill="#f0803c" stroke="#fff" stroke-width="4"/>
    <text x="1551" y="417" class="math eq ink">xₜ</text>
    <path d="M1592 423L1692 354" class="mean" marker-end="url(#arrow)"/>
    <text x="1580" y="623" text-anchor="middle" class="label ink">一個 mode 幾乎拿走全部權重</text>
    <text x="1580" y="650" text-anchor="middle" class="small muted">平均方向長而明確</text>
  </g>

  <g class="sans">
    <rect x="55" y="704" width="1810" height="105" rx="26" fill="#f3f7fc" stroke="#cad8ea" stroke-width="2"/>
    <text x="100" y="744" class="label ink">線寬代表 posterior weight</text>
    <line x1="105" y1="773" x2="160" y2="773" stroke="#7a8799" stroke-width="3"/>
    <line x1="185" y1="773" x2="240" y2="773" stroke="#7a8799" stroke-width="12"/>
    <text x="270" y="781" class="small muted">細 → 不太可能　粗 → 很可能</text>
    <line x1="650" y1="758" x2="755" y2="758" class="mean" marker-end="url(#arrow)"/>
    <text x="790" y="750" class="math eq ink">√ᾱₜ E[x₀|xₜ] − xₜ</text>
    <text x="790" y="783" class="small muted">posterior mean 形成的 denoising correction</text>
    <text x="1255" y="750" class="math eq ink">= σₜ² ∇ₓ log pₜ(xₜ)</text>
    <text x="1255" y="783" class="small muted">同一支箭頭正是 density 上升最快的方向</text>
  </g>
</svg>

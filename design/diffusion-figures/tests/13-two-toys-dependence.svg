<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#f2f8ff"/></linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2454c6"/></marker>
    <marker id="arr-orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#e96a1c"/></marker>
    <marker id="arr-purple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7b68cf"/></marker>
    <style>.sans{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;fill:#07133f}.math{font-family:"Cambria Math","Times New Roman",serif;fill:#07133f}.title{font-size:62px;font-weight:800}.sub{font-size:29px;fill:#29375f}.panel{fill:url(#panel);stroke:#bdd8ff;stroke-width:2}.h{font-size:35px;font-weight:750}.label{font-size:25px}.small{font-size:21px}.bit{font-size:28px;font-weight:700}.conclusion{font-size:29px;font-weight:600}</style>
  </defs>
  <rect width="1672" height="941" fill="url(#bg)"/>
  <text x="836" y="77" text-anchor="middle" class="sans title">兩個 toy，把相依藏在哪裡？</text>
  <text x="836" y="135" text-anchor="middle" class="sans sub">Parity 把限制集中在最後一個自由度；Markov 把相依分散在每一對相鄰 token。</text>

  <rect x="31" y="177" width="764" height="605" rx="20" class="panel"/>
  <rect x="877" y="177" width="764" height="605" rx="20" class="panel"/>
  <text x="413" y="231" text-anchor="middle" class="sans h">Parity · L = 8</text>
  <text x="413" y="270" text-anchor="middle" class="sans label" fill="#5d6886">前 7 bits 決定最後一格，讓總和保持 even</text>

  <!-- parity rows -->
  <g class="sans bit" text-anchor="middle">
    <g transform="translate(123 310)"><rect width="578" height="59" rx="14" fill="#fff" stroke="#c9d9ef"/><text x="61" y="39">1</text><text x="126" y="39">0</text><text x="191" y="39">1</text><text x="256" y="39">1</text><text x="321" y="39">0</text><text x="386" y="39">0</text><text x="451" y="39">1</text><rect x="520" y="7" width="48" height="45" rx="10" fill="#e8f2ff" stroke="#67a1ef"/><text x="544" y="39" fill="#2454c6">0</text></g>
    <g transform="translate(123 382)"><rect width="578" height="59" rx="14" fill="#fff" stroke="#c9d9ef"/><text x="61" y="39">0</text><text x="126" y="39">0</text><text x="191" y="1"></text><text x="191" y="39">1</text><text x="256" y="39">0</text><text x="321" y="39">1</text><text x="386" y="39">0</text><text x="451" y="39">0</text><rect x="520" y="7" width="48" height="45" rx="10" fill="#e8f2ff" stroke="#67a1ef"/><text x="544" y="39" fill="#2454c6">0</text></g>
    <g transform="translate(123 454)"><rect width="578" height="59" rx="14" fill="#fff" stroke="#c9d9ef"/><text x="61" y="39">1</text><text x="126" y="39">1</text><text x="191" y="39">1</text><text x="256" y="39">0</text><text x="321" y="39">0</text><text x="386" y="39">1</text><text x="451" y="39">0</text><rect x="520" y="7" width="48" height="45" rx="10" fill="#e8f2ff" stroke="#67a1ef"/><text x="544" y="39" fill="#2454c6">0</text></g>
    <g transform="translate(123 526)"><rect width="578" height="59" rx="14" fill="#fff" stroke="#c9d9ef"/><text x="61" y="39">1</text><text x="126" y="39">0</text><text x="191" y="39">0</text><text x="256" y="39">0</text><text x="321" y="39">1</text><text x="386" y="39">0</text><text x="451" y="39">1</text><rect x="520" y="7" width="48" height="45" rx="10" fill="#e8f2ff" stroke="#67a1ef"/><text x="544" y="39" fill="#2454c6">1</text></g>
    <g transform="translate(123 610)"><rect width="578" height="59" rx="14" fill="#fff8f7" stroke="#ef9a8b"/><text x="61" y="39">1</text><text x="126" y="39">0</text><text x="191" y="39">1</text><text x="256" y="39">1</text><text x="321" y="39">0</text><text x="386" y="39">0</text><text x="451" y="39">1</text><rect x="520" y="7" width="48" height="45" rx="10" fill="#ffe4df" stroke="#e75b45"/><text x="544" y="39" fill="#c23c2d">1</text></g>
  </g>
  <text x="715" y="650" class="sans label" fill="#c23c2d">✕ odd</text>
  <rect x="170" y="700" width="486" height="55" rx="16" fill="#f7f4ff" stroke="#b18ae8" stroke-width="2"/><text x="413" y="736" text-anchor="middle" class="sans label" fill="#6a2eb2">相依集中在「最後一格必須補對」</text>

  <text x="1259" y="231" text-anchor="middle" class="sans h">Binary Markov · L = 16</text>
  <text x="1259" y="270" text-anchor="middle" class="sans label" fill="#5d6886">每一格都依賴前一格：長 run 是訊號，不是裝飾</text>

  <!-- transition law -->
  <circle cx="1114" cy="373" r="42" fill="#eaf3ff" stroke="#669dec" stroke-width="2"/><circle cx="1404" cy="373" r="42" fill="#fff0e6" stroke="#ff9a54" stroke-width="2"/>
  <text x="1114" y="384" text-anchor="middle" class="sans h" fill="#2454c6">0</text><text x="1404" y="384" text-anchor="middle" class="sans h" fill="#e96a1c">1</text>
  <path d="M1087 338 C1050 289 1178 289 1141 338" fill="none" stroke="#2454c6" stroke-width="4" marker-end="url(#arr)"/><text x="1114" y="303" text-anchor="middle" class="sans small" fill="#2454c6">same = 0.9</text>
  <path d="M1377 338 C1340 289 1468 289 1431 338" fill="none" stroke="#e96a1c" stroke-width="4" marker-end="url(#arr-orange)"/><text x="1404" y="303" text-anchor="middle" class="sans small" fill="#e96a1c">same = 0.9</text>
  <line x1="1158" y1="361" x2="1358" y2="361" stroke="#7b68cf" stroke-width="3" marker-end="url(#arr-purple)"/><line x1="1360" y1="386" x2="1160" y2="386" stroke="#7b68cf" stroke-width="3" marker-end="url(#arr-purple)"/>
  <text x="1259" y="353" text-anchor="middle" class="sans small" fill="#6a2eb2">switch = 0.1</text>

  <g class="sans small" text-anchor="middle">
    <g transform="translate(945 441)"><rect width="628" height="58" rx="14" fill="#fff" stroke="#c9d9ef"/><text x="314" y="38" letter-spacing="15">0000011111110000</text></g>
    <g transform="translate(945 515)"><rect width="628" height="58" rx="14" fill="#fff" stroke="#c9d9ef"/><text x="314" y="38" letter-spacing="15">1111111100000111</text></g>
    <g transform="translate(945 589)"><rect width="628" height="58" rx="14" fill="#fff" stroke="#c9d9ef"/><text x="314" y="38" letter-spacing="15">0001111111000000</text></g>
    <g transform="translate(945 672)"><rect width="628" height="58" rx="14" fill="#fff8f7" stroke="#ef9a8b"/><text x="314" y="38" letter-spacing="15" fill="#c23c2d">0101010010101010</text></g>
  </g>
  <text x="1515" y="754" text-anchor="end" class="sans small" fill="#c23c2d">切換太多：像 independent coin</text>

  <rect x="31" y="817" width="1610" height="92" rx="18" fill="#f6faff" stroke="#a9ccff" stroke-width="2"/>
  <text x="836" y="875" text-anchor="middle" class="sans conclusion">Parity 是「最後一格」的全域限制；Markov 是「每一對相鄰格」的局部限制。</text>
</svg>

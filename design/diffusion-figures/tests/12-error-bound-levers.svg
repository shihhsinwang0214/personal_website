<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#f2f8ff"/></linearGradient>
    <marker id="down" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#26815d"/></marker>
    <marker id="up" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#df4e39"/></marker>
    <style>.sans{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;fill:#07133f}.math{font-family:"Cambria Math","Times New Roman",serif;fill:#07133f}.title{font-size:61px;font-weight:800}.sub{font-size:29px;fill:#29375f}.panel{fill:url(#panel);stroke:#bdd8ff;stroke-width:2}.h{font-size:31px;font-weight:750}.label{font-size:25px}.small{font-size:22px}.conclusion{font-size:29px;font-weight:600}</style>
  </defs>
  <rect width="1672" height="941" fill="url(#bg)"/>
  <text x="836" y="77" text-anchor="middle" class="sans title">六個技巧，真的都在壓同一個誤差嗎？</text>
  <text x="836" y="135" text-anchor="middle" class="sans sub">先拆開 deterministic Euler bound，才能看出每個方法真正改的是哪一個旋鈕。</text>

  <rect x="248" y="170" width="1176" height="104" rx="20" fill="#f7faff" stroke="#9fc6ff" stroke-width="2"/>
  <text x="836" y="235" text-anchor="middle" class="math" font-size="46">Euler error  ≲  <tspan fill="#6c7897">Cₗ</tspan> · <tspan fill="#2454c6">h</tspan> · <tspan fill="#25835f">∫₀¹ ‖ẍₜ‖ dt</tspan></text>

  <rect x="31" y="307" width="494" height="438" rx="20" class="panel"/>
  <rect x="589" y="307" width="494" height="438" rx="20" class="panel"/>
  <rect x="1147" y="307" width="494" height="438" rx="20" class="panel"/>

  <text x="278" y="361" text-anchor="middle" class="math" font-size="43" fill="#6c7897">Cₗ</text>
  <text x="278" y="400" text-anchor="middle" class="sans label" font-weight="700">vector field 的 Lipschitz 放大</text>
  <line x1="91" y1="426" x2="465" y2="426" stroke="#d7e5f7" stroke-width="2"/>
  <rect x="80" y="464" width="396" height="91" rx="17" fill="#fff" stroke="#c9d8ed" stroke-width="2"/>
  <text x="278" y="502" text-anchor="middle" class="sans h">這組技巧沒有直接旋鈕</text>
  <text x="278" y="536" text-anchor="middle" class="sans small" fill="#5d6886">不要把所有改善都硬解釋成 Cₗ 下降</text>
  <text x="278" y="614" text-anchor="middle" class="sans label" fill="#5d6886">bound 是分析座標，不是方法清單</text>
  <text x="278" y="658" text-anchor="middle" class="sans small" fill="#5d6886">每個技巧應該落到正確的機制</text>

  <text x="836" y="361" text-anchor="middle" class="math" font-size="43" fill="#2454c6">h / solver order</text>
  <text x="836" y="400" text-anchor="middle" class="sans label" font-weight="700">離散化解析度</text>
  <line x1="649" y1="426" x2="1023" y2="426" stroke="#d7e5f7" stroke-width="2"/>
  <rect x="639" y="462" width="394" height="133" rx="18" fill="#f2f6ff" stroke="#8db5ff" stroke-width="2"/>
  <text x="836" y="505" text-anchor="middle" class="sans h" fill="#2454c6">high-order solver</text>
  <text x="836" y="552" text-anchor="middle" class="math" font-size="31" fill="#2454c6">h  →  h²</text>
  <text x="836" y="582" text-anchor="middle" class="sans small" fill="#526181">但 integrand 變成更高階導數</text>
  <text x="836" y="655" text-anchor="middle" class="sans label">同樣 NFE 下，用階數換精度</text>

  <text x="1394" y="361" text-anchor="middle" class="math" font-size="43" fill="#25835f">∫ ‖ẍₜ‖ dt</text>
  <text x="1394" y="400" text-anchor="middle" class="sans label" font-weight="700">trajectory curvature</text>
  <line x1="1207" y1="426" x2="1581" y2="426" stroke="#d7e5f7" stroke-width="2"/>
  <rect x="1201" y="455" width="184" height="82" rx="17" fill="#effaf4" stroke="#70c39c" stroke-width="2"/>
  <text x="1293" y="488" text-anchor="middle" class="sans label" font-weight="700">Reflow</text><text x="1293" y="520" text-anchor="middle" class="sans small" fill="#25835f">拉直 ↓</text>
  <rect x="1404" y="455" width="184" height="82" rx="17" fill="#effaf4" stroke="#70c39c" stroke-width="2"/>
  <text x="1496" y="488" text-anchor="middle" class="sans label" font-weight="700">Minibatch OT</text><text x="1496" y="520" text-anchor="middle" class="sans small" fill="#25835f">少交叉 ↓</text>
  <rect x="1250" y="622" width="288" height="75" rx="17" fill="#fff4f1" stroke="#ee9a87" stroke-width="2"/>
  <text x="1394" y="654" text-anchor="middle" class="sans label" font-weight="700" fill="#c74634">Guidance</text><text x="1394" y="684" text-anchor="middle" class="sans small" fill="#c74634">約隨 w 放大曲率 ↑</text>
  <line x1="1562" y1="687" x2="1562" y2="630" stroke="#df4e39" stroke-width="5" marker-end="url(#up)"/>

  <rect x="129" y="765" width="1414" height="55" rx="18" fill="#faf8ff" stroke="#c4a9ee" stroke-width="2"/>
  <text x="836" y="801" text-anchor="middle" class="sans label"><tspan font-weight="700" fill="#6a2eb2">不直接降低這條 deterministic bound：</tspan> ODE→SDE 改變誤差是否持續；time weighting 改變訓練誤差分配。</text>

  <rect x="31" y="839" width="1610" height="72" rx="18" fill="#f6faff" stroke="#a9ccff" stroke-width="2"/>
  <text x="836" y="885" text-anchor="middle" class="sans conclusion">幾何方法改 curvature；solver 改 h 的階；SDE 與 time weighting 是別的機制。</text>
</svg>

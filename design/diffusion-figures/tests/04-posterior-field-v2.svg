<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="840" viewBox="0 0 1920 840" role="img" aria-labelledby="title desc">
  <title id="title">Reverse time 中，posterior mean 如何變成 score</title>
  <desc id="desc">單一連續視野中，點雲由均勻逐漸聚成三個 mode；候選連線的粗細代表 posterior weight，藍色向量是加權平均與 score。</desc>
  <defs>
    <style>
      .sans{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}.math{font-family:"Cambria Math","STIX Two Math",Georgia,serif}
      .ink{fill:#0b2b6f}.muted{fill:#667085}.h1{font-size:58px;font-weight:800}.sub{font-size:24px;font-weight:600}
      .step{font-size:31px;font-weight:800}.label{font-size:21px;font-weight:700}.small{font-size:18px;font-weight:600}.eq{font-size:31px}
      .dot{fill:#4a90e2;stroke:#fff;stroke-width:2}.candidate{stroke:#8793a3;stroke-linecap:round;fill:none}.mean{stroke:#2a4ea3;stroke-width:8;stroke-linecap:round;fill:none}
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="23" markerHeight="23" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#2a4ea3"/></marker>
    <linearGradient id="timeFade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef7ff"/><stop offset=".52" stop-color="#fff8e7"/><stop offset="1" stop-color="#eef7ff"/></linearGradient>
  </defs>
  <rect width="1920" height="840" fill="#fffdfb"/>

  <g class="sans">
    <text x="960" y="68" text-anchor="middle" class="h1 ink">Reverse time 中，posterior mean 如何變成 score</text>
    <text x="960" y="105" text-anchor="middle" class="sub muted">不是三個獨立案例，而是同一個局部規則隨 t 改變</text>
    <line x1="210" y1="139" x2="1710" y2="139" stroke="#2a4ea3" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="960" y="148" text-anchor="middle" class="label ink" paint-order="stroke" stroke="#fffdfb" stroke-width="12">t 大　→　t 小：可能的來源逐漸從「很多」縮成「一個 mode」</text>
  </g>

  <rect x="55" y="174" width="1810" height="468" rx="32" fill="url(#timeFade)" stroke="#d1ddeb" stroke-width="2"/>
  <line x1="650" y1="196" x2="650" y2="618" stroke="#c7d1de" stroke-width="2" stroke-dasharray="10 12"/>
  <line x1="1270" y1="196" x2="1270" y2="618" stroke="#c7d1de" stroke-width="2" stroke-dasharray="10 12"/>

  <!-- shared labels -->
  <g class="sans">
    <text x="345" y="224" text-anchor="middle" class="step ink">t 大：posterior 很寬</text>
    <text x="960" y="224" text-anchor="middle" class="step ink">t 中：某個 mode 變得較可能</text>
    <text x="1575" y="224" text-anchor="middle" class="step ink">t 小：posterior 幾乎集中</text>
  </g>

  <!-- high t, no local card -->
  <g>
    <ellipse cx="345" cy="430" rx="94" ry="78" fill="#8e99a8" opacity=".10"/>
    <ellipse cx="345" cy="430" rx="56" ry="45" fill="#8e99a8" opacity=".12"/>
    <g class="dot">
      <circle cx="118" cy="278" r="7"/><circle cx="178" cy="300" r="7"/><circle cx="243" cy="274" r="7"/><circle cx="309" cy="298" r="7"/><circle cx="380" cy="276" r="7"/><circle cx="445" cy="302" r="7"/><circle cx="556" cy="282" r="7"/>
      <circle cx="142" cy="352" r="7"/><circle cx="210" cy="333" r="7"/><circle cx="278" cy="363" r="7"/><circle cx="351" cy="340" r="7"/><circle cx="421" cy="363" r="7"/><circle cx="492" cy="339" r="7"/><circle cx="580" cy="365" r="7"/>
      <circle cx="111" cy="432" r="7"/><circle cx="181" cy="413" r="7"/><circle cx="251" cy="444" r="7"/><circle cx="322" cy="420" r="7"/><circle cx="392" cy="446" r="7"/><circle cx="463" cy="418" r="7"/><circle cx="548" cy="445" r="7"/>
      <circle cx="136" cy="515" r="7"/><circle cx="203" cy="493" r="7"/><circle cx="274" cy="523" r="7"/><circle cx="344" cy="499" r="7"/><circle cx="414" cy="525" r="7"/><circle cx="490" cy="497" r="7"/><circle cx="575" cy="518" r="7"/>
      <circle cx="168" cy="584" r="7"/><circle cx="252" cy="568" r="7"/><circle cx="382" cy="581" r="7"/><circle cx="530" cy="566" r="7"/>
    </g>
    <g class="candidate">
      <line x1="310" y1="465" x2="142" y2="352" stroke-width="4"/><line x1="310" y1="465" x2="309" y2="298" stroke-width="4"/><line x1="310" y1="465" x2="492" y2="339" stroke-width="4"/><line x1="310" y1="465" x2="490" y2="497" stroke-width="4"/><line x1="310" y1="465" x2="252" y2="568" stroke-width="4"/><line x1="310" y1="465" x2="111" y2="432" stroke-width="4"/>
    </g>
    <circle cx="310" cy="465" r="13" fill="#f0803c" stroke="#fff" stroke-width="4"/>
    <text x="282" y="450" class="math eq ink">xₜ</text>
    <path d="M321 456L351 431" class="mean" marker-end="url(#arrow)"/>
    <text x="345" y="621" text-anchor="middle" class="sans small muted">權重接近均勻 → 向量很短</text>
  </g>

  <!-- medium t -->
  <g>
    <ellipse cx="790" cy="352" rx="86" ry="67" fill="#9aa5b3" opacity=".12"/>
    <ellipse cx="1092" cy="345" rx="91" ry="70" fill="#8793a3" opacity=".27"/>
    <ellipse cx="945" cy="527" rx="92" ry="65" fill="#9aa5b3" opacity=".14"/>
    <g class="dot">
      <circle cx="752" cy="323" r="8"/><circle cx="784" cy="302" r="8"/><circle cx="821" cy="322" r="8"/><circle cx="766" cy="360" r="8"/><circle cx="798" cy="351" r="10"/><circle cx="832" cy="379" r="8"/><circle cx="777" cy="399" r="7"/>
      <circle cx="1051" cy="315" r="8"/><circle cx="1086" cy="294" r="8"/><circle cx="1124" cy="314" r="8"/><circle cx="1064" cy="352" r="8"/><circle cx="1097" cy="342" r="10"/><circle cx="1133" cy="370" r="8"/><circle cx="1077" cy="393" r="7"/>
      <circle cx="902" cy="497" r="8"/><circle cx="938" cy="476" r="8"/><circle cx="976" cy="496" r="8"/><circle cx="916" cy="534" r="8"/><circle cx="949" cy="524" r="10"/><circle cx="985" cy="552" r="8"/><circle cx="929" cy="575" r="7"/>
      <circle cx="884" cy="379" r="6"/><circle cx="970" cy="411" r="6"/><circle cx="1013" cy="456" r="6"/>
    </g>
    <g class="candidate">
      <line x1="945" y1="440" x2="798" y2="351" stroke-width="3"/><line x1="945" y1="440" x2="1097" y2="342" stroke-width="12"/><line x1="945" y1="440" x2="949" y2="524" stroke-width="5"/>
    </g>
    <circle cx="945" cy="440" r="13" fill="#f0803c" stroke="#fff" stroke-width="4"/>
    <text x="916" y="425" class="math eq ink">xₜ</text>
    <path d="M957 432L1068 360" class="mean" marker-end="url(#arrow)"/>
    <text x="960" y="621" text-anchor="middle" class="sans small muted">一條 candidate line 變粗 → mean 偏向右上 mode</text>
  </g>

  <!-- small t -->
  <g>
    <ellipse cx="1393" cy="352" rx="70" ry="61" fill="#9aa5b3" opacity=".13"/>
    <ellipse cx="1740" cy="340" rx="74" ry="63" fill="#8793a3" opacity=".31"/>
    <ellipse cx="1560" cy="532" rx="73" ry="60" fill="#9aa5b3" opacity=".13"/>
    <g class="dot">
      <circle cx="1354" cy="322" r="8"/><circle cx="1388" cy="301" r="8"/><circle cx="1424" cy="320" r="8"/><circle cx="1367" cy="359" r="8"/><circle cx="1398" cy="350" r="10"/><circle cx="1433" cy="378" r="8"/><circle cx="1378" cy="399" r="7"/>
      <circle cx="1699" cy="310" r="8"/><circle cx="1735" cy="288" r="8"/><circle cx="1772" cy="308" r="8"/><circle cx="1712" cy="347" r="8"/><circle cx="1743" cy="337" r="10"/><circle cx="1779" cy="366" r="8"/><circle cx="1723" cy="390" r="7"/>
      <circle cx="1518" cy="501" r="8"/><circle cx="1555" cy="480" r="8"/><circle cx="1593" cy="500" r="8"/><circle cx="1531" cy="537" r="8"/><circle cx="1563" cy="529" r="10"/><circle cx="1599" cy="557" r="8"/><circle cx="1544" cy="577" r="7"/>
    </g>
    <g class="candidate">
      <line x1="1572" y1="445" x2="1398" y2="350" stroke-width="2" opacity=".22"/><line x1="1572" y1="445" x2="1743" y2="337" stroke-width="16"/><line x1="1572" y1="445" x2="1563" y2="529" stroke-width="2" opacity=".22"/>
    </g>
    <circle cx="1572" cy="445" r="13" fill="#f0803c" stroke="#fff" stroke-width="4"/>
    <text x="1543" y="430" class="math eq ink">xₜ</text>
    <path d="M1584 437L1718 352" class="mean" marker-end="url(#arrow)"/>
    <text x="1575" y="621" text-anchor="middle" class="sans small muted">幾乎只剩一條粗線 → mean 與 score 都很明確</text>
  </g>

  <!-- one inference, not three cards -->
  <g class="sans">
    <text x="70" y="689" class="label ink">視覺編碼</text>
    <line x1="70" y1="722" x2="140" y2="722" stroke="#8793a3" stroke-width="3"/><line x1="170" y1="722" x2="240" y2="722" stroke="#8793a3" stroke-width="13"/>
    <text x="265" y="729" class="small muted">線寬 ∝ p(x₀ | xₜ)</text>
    <path d="M530 722H630" class="mean" marker-end="url(#arrow)"/>
    <text x="660" y="729" class="small muted">posterior-weighted correction</text>
    <rect x="55" y="760" width="1810" height="58" rx="24" fill="#eef3fb"/>
    <text x="960" y="799" text-anchor="middle" class="math eq ink">√ᾱₜ E[x₀|xₜ] − xₜ = σₜ² ∇ₓ log pₜ(xₜ)</text>
    <text x="1450" y="729" text-anchor="middle" class="label ink">Tweedie：這不是兩支箭頭，而是同一支箭頭的兩種讀法。</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#f3f8ff"/></linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2454c6"/></marker>
    <marker id="arrow-avg" markerUnits="userSpaceOnUse" markerWidth="25" markerHeight="25" refX="22" refY="12.5" orient="auto"><path d="M0 0L25 12.5L0 25Z" fill="#2454c6"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#41a574"/></marker>
    <style>
      .sans{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;fill:#07133f}.math{font-family:"Cambria Math","Times New Roman",serif;fill:#07133f}.title{font-size:64px;font-weight:800}.sub{font-size:30px;fill:#29375f}.panel{fill:url(#panel);stroke:#bdd8ff;stroke-width:2}.axis{stroke:#1f315f;stroke-width:3}.label{font-size:28px}.small{font-size:23px}.chip{fill:#f7f4ff;stroke:#b18ae8;stroke-width:2}.conclusion{font-size:31px;font-weight:600}
    </style>
  </defs>
  <rect width="1672" height="941" fill="url(#bg)"/>
  <text x="836" y="78" text-anchor="middle" class="sans title">交叉點上的平均，會指向哪裡？</text>
  <text x="836" y="137" text-anchor="middle" class="sans sub">兩條 conditional paths 都經過原點；marginal velocity 是方向的 conditional mean。</text>

  <rect x="30" y="181" width="1612" height="604" rx="20" class="panel"/>
  <text x="515" y="232" text-anchor="middle" class="sans label" font-weight="700">兩條 conditional paths</text>

  <line x1="116" y1="711" x2="948" y2="711" class="axis" marker-end="url(#arrow-blue)"/>
  <line x1="116" y1="711" x2="116" y2="278" class="axis" marker-end="url(#arrow-blue)"/>
  <text x="965" y="728" class="math label" font-style="italic">x₁</text>
  <text x="82" y="279" class="math label" font-style="italic">x₂</text>

  <!-- endpoint clusters -->
  <circle cx="285" cy="650" r="17" fill="#3f72d9"/><circle cx="316" cy="668" r="12" fill="#77a2ef"/><circle cx="258" cy="675" r="11" fill="#a4c3f5"/>
  <circle cx="747" cy="650" r="17" fill="#3f72d9"/><circle cx="778" cy="668" r="12" fill="#77a2ef"/><circle cx="720" cy="675" r="11" fill="#a4c3f5"/>
  <circle cx="285" cy="338" r="17" fill="#ff832d"/><circle cx="316" cy="321" r="12" fill="#ffa05c"/><circle cx="258" cy="316" r="11" fill="#ffc18d"/>
  <circle cx="747" cy="338" r="17" fill="#ff832d"/><circle cx="778" cy="321" r="12" fill="#ffa05c"/><circle cx="720" cy="316" r="11" fill="#ffc18d"/>
  <text x="218" y="690" class="math label">p₀</text><text x="800" y="345" class="math label">p₁</text>

  <!-- crossing conditionals -->
  <line x1="285" y1="650" x2="747" y2="338" stroke="#53b889" stroke-width="7" opacity=".72"/>
  <line x1="747" y1="650" x2="285" y2="338" stroke="#53b889" stroke-width="7" opacity=".72"/>
  <circle cx="516" cy="494" r="18" fill="#7a3ec8" stroke="#fff" stroke-width="5"/>
  <text x="536" y="525" class="math label" fill="#6a2eb2" font-style="italic">xₜ = 0</text>

  <!-- local directions and mean -->
  <line x1="516" y1="494" x2="665" y2="393" stroke="#41a574" stroke-width="4" marker-end="url(#arrow-green)"/>
  <line x1="516" y1="494" x2="367" y2="393" stroke="#41a574" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="626" y="344" width="100" height="43" rx="13" fill="#fff" stroke="#9ed5ba"/><text x="676" y="373" text-anchor="middle" class="math small" fill="#23825a">(2, 2)</text>
  <rect x="304" y="344" width="118" height="43" rx="13" fill="#fff" stroke="#9ed5ba"/><text x="363" y="373" text-anchor="middle" class="math small" fill="#23825a">(−2, 2)</text>
  <line x1="516" y1="494" x2="516" y2="305" stroke="#2454c6" stroke-width="12" marker-end="url(#arrow-avg)"/>
  <rect x="538" y="276" width="222" height="50" rx="15" fill="#eef4ff" stroke="#8db5ff"/><text x="649" y="309" text-anchor="middle" class="math label" fill="#2454c6" font-weight="700">uₜ(0) = (0, 2)</text>

  <!-- reasoning card -->
  <rect x="1013" y="246" width="562" height="415" rx="20" fill="#fff" stroke="#c5d6f3" stroke-width="2"/>
  <text x="1294" y="301" text-anchor="middle" class="sans label" font-weight="700">在同一個位置做平均</text>
  <text x="1294" y="380" text-anchor="middle" class="math" font-size="39">uₜ(0) = ½(2,2) + ½(−2,2)</text>
  <line x1="1094" y1="414" x2="1494" y2="414" stroke="#dce7f7" stroke-width="2"/>
  <text x="1139" y="475" class="sans label" fill="#d75b33" font-weight="700">水平：</text>
  <text x="1285" y="475" class="math label">½·2 + ½·(−2) = 0</text>
  <text x="1139" y="532" class="sans label" fill="#2f8d68" font-weight="700">垂直：</text>
  <text x="1285" y="532" class="math label">½·2 + ½·2 = 2</text>
  <rect x="1100" y="571" width="388" height="62" rx="18" class="chip"/>
  <text x="1294" y="612" text-anchor="middle" class="sans label" fill="#6a2eb2" font-weight="700">左右抵消，只剩向上</text>

  <rect x="31" y="817" width="1610" height="92" rx="18" fill="#f6faff" stroke="#a9ccff" stroke-width="2"/>
  <text x="836" y="875" text-anchor="middle" class="sans conclusion">conditional directions 可以交叉；它們的平均不會「選一條」，而會產生新的 marginal direction。</text>
</svg>

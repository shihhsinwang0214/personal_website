<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-labelledby="title desc">
  <title id="title">一個式子，把路徑、配對與噪聲放在同一張圖</title>
  <desc id="desc">Stochastic interpolant 主公式連到一個共用的係數座標系、配對示意與四方法特例矩陣，顯示三個旋鈕改變的位置。</desc>
  <defs>
    <style>
      .sans{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}.math{font-family:"Cambria Math","STIX Two Math",Georgia,serif}
      .ink{fill:#0b2b6f}.muted{fill:#667085}.blue{fill:#4a90e2}.orange{fill:#f0803c}.green{fill:#23804a}
      .h1{font-size:58px;font-weight:800}.sub{font-size:24px;font-weight:600}.section{font-size:32px;font-weight:800}
      .label{font-size:22px;font-weight:700}.small{font-size:18px;font-weight:600}.tiny{font-size:16px;font-weight:600}
      .eqMain{font-size:56px}.eq{font-size:27px}.tableHead{font-size:20px;font-weight:800}.tableText{font-size:18px;font-weight:650}
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#2a4ea3"/></marker>
    <clipPath id="dogClip"><rect x="1003" y="866" width="110" height="110" rx="15"/></clipPath>
    <linearGradient id="gammaArea" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#60ba82" stop-opacity=".04"/><stop offset="1" stop-color="#60ba82" stop-opacity=".34"/></linearGradient>
  </defs>
  <rect width="1920" height="1200" fill="#fffdfb"/>

  <g class="sans">
    <text x="960" y="68" text-anchor="middle" class="h1 ink">一個式子，把三個旋鈕放進同一張圖</text>
    <text x="960" y="105" text-anchor="middle" class="sub muted">先看所有方法共享的座標系，再找是哪個量被換掉</text>
  </g>

  <!-- one master equation -->
  <g>
    <rect x="110" y="137" width="1700" height="122" rx="28" fill="#f4f7fb" stroke="#d4deeb" stroke-width="2"/>
    <text x="150" y="216" class="math eqMain ink">xₜ =</text>
    <text x="365" y="216" class="math eqMain blue">αₜ x₀</text>
    <text x="590" y="216" class="math eqMain ink">+</text>
    <text x="665" y="216" class="math eqMain orange">βₜ x₁</text>
    <text x="890" y="216" class="math eqMain ink">+</text>
    <text x="965" y="216" class="math eqMain green">γₜ z</text>
    <line x1="350" y1="235" x2="350" y2="286" stroke="#4a90e2" stroke-width="4"/>
    <line x1="735" y1="235" x2="735" y2="286" stroke="#f0803c" stroke-width="4"/>
    <line x1="1040" y1="235" x2="1040" y2="286" stroke="#60ba82" stroke-width="4"/>
    <text x="1205" y="191" class="math eq ink">(x₀,x₁) ∼ π</text>
    <text x="1205" y="226" class="math eq ink">z ∼ 𝒩(0,I)</text>
    <text x="1515" y="191" class="math eq ink">α₀=β₁=1</text>
    <text x="1515" y="226" class="math eq ink">α₁=β₀=γ₀=γ₁=0</text>
  </g>

  <!-- one shared coordinate system -->
  <g class="sans">
    <text x="95" y="318" class="section ink">同一條 t 軸上，三個係數各自做什麼</text>
    <rect x="70" y="340" width="1100" height="430" rx="26" fill="#fff" stroke="#cfd9e6" stroke-width="2"/>
    <line x1="160" y1="690" x2="1095" y2="690" stroke="#0b2b6f" stroke-width="2"/>
    <line x1="160" y1="690" x2="160" y2="405" stroke="#0b2b6f" stroke-width="2"/>
    <text x="143" y="420" class="math small ink">1</text><text x="139" y="697" class="math small ink">0</text><text x="151" y="724" class="math small ink">0</text><text x="1082" y="724" class="math small ink">1</text><text x="620" y="739" class="math label ink">t</text>

    <!-- gamma envelope is under the three curves -->
    <path d="M160 690Q627 365 1095 690L1095 690L160 690Z" fill="url(#gammaArea)"/>
    <path d="M160 690Q627 365 1095 690" fill="none" stroke="#60ba82" stroke-width="7"/>
    <path d="M160 420L1095 690" fill="none" stroke="#4a90e2" stroke-width="8"/>
    <path d="M160 690L1095 420" fill="none" stroke="#f0803c" stroke-width="8"/>

    <circle cx="160" cy="420" r="10" fill="#4a90e2"/><circle cx="1095" cy="690" r="10" fill="#4a90e2"/>
    <circle cx="160" cy="690" r="10" fill="#f0803c"/><circle cx="1095" cy="420" r="10" fill="#f0803c"/>
    <circle cx="160" cy="690" r="7" fill="#60ba82"/><circle cx="1095" cy="690" r="7" fill="#60ba82"/>

    <rect x="208" y="386" width="165" height="42" rx="21" fill="#e5f2fd"/><text x="290" y="414" text-anchor="middle" class="math label ink">αₜ：x₀ 權重</text>
    <rect x="916" y="386" width="168" height="42" rx="21" fill="#fff0e6"/><text x="1000" y="414" text-anchor="middle" class="math label ink">βₜ：x₁ 權重</text>
    <rect x="538" y="471" width="180" height="42" rx="21" fill="#eaf7ef"/><text x="628" y="499" text-anchor="middle" class="math label ink">γₜ：tube 寬度</text>

    <text x="276" y="618" class="small muted">t=0：只留下 x₀</text>
    <text x="874" y="618" class="small muted">t=1：只留下 x₁</text>
    <text x="628" y="547" text-anchor="middle" class="small muted">中段 γₜ&gt;0，conditional path 才有厚度</text>
    <rect x="310" y="712" width="636" height="38" rx="19" fill="#eef3fb"/>
    <text x="628" y="738" text-anchor="middle" class="small ink">γₜ&gt;0 時：∇ log pₜ(x) = −ηₜ(x)/γₜ</text>
  </g>

  <!-- right-side matrix, not another three-card row -->
  <g class="sans">
    <text x="1220" y="318" class="section ink">四個方法只差哪裡？</text>
    <rect x="1200" y="340" width="650" height="610" rx="26" fill="#fff" stroke="#cfd9e6" stroke-width="2"/>
    <rect x="1200" y="340" width="650" height="62" rx="26" fill="#eaf2fb"/>
    <line x1="1405" y1="340" x2="1405" y2="950" stroke="#dce3ec"/><line x1="1515" y1="340" x2="1515" y2="950" stroke="#dce3ec"/><line x1="1625" y1="340" x2="1625" y2="950" stroke="#dce3ec"/>
    <g class="tableHead ink" text-anchor="middle"><text x="1302" y="379">方法</text><text x="1460" y="379">path</text><text x="1570" y="379">γ</text><text x="1738" y="379">π</text></g>

    <rect x="1200" y="402" width="650" height="128" fill="#fff"/><rect x="1200" y="530" width="650" height="128" fill="#fbfcfe"/><rect x="1200" y="658" width="650" height="128" fill="#fff"/><rect x="1200" y="786" width="650" height="164" fill="#f1faf4"/>
    <g stroke="#e1e7ef"><line x1="1200" y1="530" x2="1850" y2="530"/><line x1="1200" y1="658" x2="1850" y2="658"/><line x1="1200" y1="786" x2="1850" y2="786"/></g>
    <g class="tableText ink">
      <text x="1230" y="449">線性 FM</text><text x="1230" y="479" class="tiny muted">straight path</text>
      <text x="1230" y="577">Rectified flow</text><text x="1230" y="607" class="tiny muted">same schedule</text>
      <text x="1230" y="705">VP diffusion</text><text x="1230" y="735" class="tiny muted">cos / sin</text>
      <text x="1230" y="833">Albergo 預設</text><text x="1230" y="863" class="tiny muted">thick path</text>
    </g>
    <g class="math tableText ink" text-anchor="middle">
      <text x="1460" y="468">1−t, t</text><text x="1570" y="468">0</text><text x="1738" y="468">獨立</text>
      <text x="1460" y="596">1−t, t</text><text x="1570" y="596">0</text><text x="1738" y="584" class="sans tiny">上一輪 ODE</text><text x="1738" y="610" class="sans tiny">誘導的 coupling</text>
      <text x="1460" y="724">cos, sin</text><text x="1570" y="724">0</text><text x="1738" y="724">獨立</text>
      <text x="1460" y="852">1−t, t</text><text x="1570" y="841" fill="#23804a">√(2t</text><text x="1570" y="866" fill="#23804a">(1−t))</text><text x="1738" y="852">獨立</text>
    </g>
    <text x="1525" y="918" text-anchor="middle" class="small muted">綠底那列只改 γₜ：因此多出可回歸的 noise target</text>
  </g>

  <!-- pi lives below the shared plot, as a coupling choice feeding the same equation -->
  <g class="sans">
    <text x="95" y="817" class="section ink">π 不在係數曲線裡：它決定哪個 x₀ 和哪個 x₁ 成為一對</text>
    <line x1="95" y1="843" x2="1145" y2="843" stroke="#d9e0e9" stroke-width="2"/>
    <text x="105" y="883" class="label ink">獨立配對</text>
    <g fill="#4a90e2"><circle cx="265" cy="875" r="10"/><circle cx="265" cy="920" r="10"/><circle cx="265" cy="965" r="10"/></g>
    <g fill="#f0803c"><circle cx="515" cy="875" r="10"/><circle cx="515" cy="920" r="10"/><circle cx="515" cy="965" r="10"/></g>
    <g stroke="#96a2b2" stroke-width="3" stroke-dasharray="8 7"><line x1="275" y1="875" x2="505" y2="965"/><line x1="275" y1="920" x2="505" y2="875"/><line x1="275" y1="965" x2="505" y2="920"/></g>
    <text x="390" y="1005" text-anchor="middle" class="small muted">同樣的 marginals，線可以交叉</text>

    <text x="620" y="883" class="label ink">coupled pairing</text>
    <g fill="#4a90e2"><circle cx="785" cy="875" r="10"/><circle cx="785" cy="920" r="10"/><circle cx="785" cy="965" r="10"/></g>
    <g fill="#f0803c"><circle cx="960" cy="875" r="10"/><circle cx="960" cy="920" r="10"/><circle cx="960" cy="965" r="10"/></g>
    <g stroke="#2a4ea3" stroke-width="4"><line x1="795" y1="875" x2="950" y2="875"/><line x1="795" y1="920" x2="950" y2="920"/><line x1="795" y1="965" x2="950" y2="965"/></g>
    <rect x="1003" y="866" width="110" height="110" rx="15" fill="#fff" stroke="#f0803c" stroke-width="4"/>
    <image href="asset://dog-shiba-data" x="1003" y="866" width="110" height="110" preserveAspectRatio="xMidYMid slice" clip-path="url(#dogClip)"/>
    <text x="1058" y="1010" text-anchor="middle" class="math small orange">x₁：data endpoint</text>
  </g>

  <g class="sans">
    <rect x="180" y="1080" width="1560" height="82" rx="30" fill="#eef3fb"/>
    <text x="960" y="1114" text-anchor="middle" class="label ink">讀圖方法：先在共用 t 軸上看 schedule 與 γₜ，再到右側矩陣找 π 是否改變。</text>
    <text x="960" y="1145" text-anchor="middle" class="small muted">只有被換掉的旋鈕能解釋方法之間的差異；其他欄必須保持對齊。</text>
  </g>
</svg>

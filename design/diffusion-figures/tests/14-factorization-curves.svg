<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#f2f8ff"/></linearGradient>
    <marker id="axis" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24365f"/></marker>
    <style>.sans{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;fill:#07133f}.math{font-family:"Cambria Math","Times New Roman",serif;fill:#07133f}.title{font-size:62px;font-weight:800}.sub{font-size:29px;fill:#29375f}.panel{fill:url(#panel);stroke:#bdd8ff;stroke-width:2}.h{font-size:35px;font-weight:750}.label{font-size:25px}.small{font-size:21px}.axis{stroke:#24365f;stroke-width:3}.grid{stroke:#dce7f6;stroke-width:2}.conclusion{font-size:29px;font-weight:600}</style>
  </defs>
  <rect width="1672" height="941" fill="url(#bg)"/>
  <text x="836" y="77" text-anchor="middle" class="sans title">同時填 k 格，factorization error 怎麼長？</text>
  <text x="836" y="135" text-anchor="middle" class="sans sub">假設 conditional marginals 完全正確；只讓 k 個位置獨立抽樣，單獨觀察 parallel update 的代價。</text>

  <rect x="480" y="165" width="712" height="62" rx="18" fill="#f7f4ff" stroke="#b18ae8" stroke-width="2"/>
  <text x="836" y="206" text-anchor="middle" class="sans label" fill="#6a2eb2"><tspan font-weight="750">k = 1</tspan> ＝ autoregressive ＝ 沒有 factorization error</text>

  <rect x="31" y="258" width="764" height="523" rx="20" class="panel"/>
  <rect x="877" y="258" width="764" height="523" rx="20" class="panel"/>
  <text x="413" y="313" text-anchor="middle" class="sans h">Parity：合法率突然掉一半</text>
  <text x="1259" y="313" text-anchor="middle" class="sans h">Markov：切換率逐步漂向 0.50</text>

  <!-- left chart -->
  <line x1="133" y1="691" x2="700" y2="691" class="axis" marker-end="url(#axis)"/><line x1="133" y1="691" x2="133" y2="378" class="axis" marker-end="url(#axis)"/>
  <line x1="133" y1="417" x2="681" y2="417" class="grid"/><line x1="133" y1="554" x2="681" y2="554" class="grid"/>
  <text x="98" y="425" text-anchor="end" class="sans small">100%</text><text x="98" y="562" text-anchor="end" class="sans small">50%</text><text x="98" y="699" text-anchor="end" class="sans small">0%</text>
  <g class="sans small" text-anchor="middle"><text x="218" y="730">1</text><text x="350" y="730">2</text><text x="482" y="730">4</text><text x="614" y="730">8</text></g>
  <text x="416" y="765" text-anchor="middle" class="sans small">每次同時填入 k 格</text>
  <polyline points="218,417 350,554 482,554 614,554" fill="none" stroke="#2454c6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2454c6" stroke="#fff" stroke-width="4"><circle cx="218" cy="417" r="13"/><circle cx="350" cy="554" r="13"/><circle cx="482" cy="554" r="13"/><circle cx="614" cy="554" r="13"/></g>
  <rect x="181" y="342" width="200" height="50" rx="15" fill="#eaf3ff" stroke="#79a8ef"/><text x="281" y="375" text-anchor="middle" class="sans small" fill="#2454c6">最後一格能補對</text>
  <rect x="403" y="584" width="224" height="50" rx="15" fill="#fff3ec" stroke="#f2a16c"/><text x="515" y="617" text-anchor="middle" class="sans small" fill="#d75b20">k ≥ 2：獨立猜答案</text>

  <!-- right chart -->
  <line x1="979" y1="691" x2="1546" y2="691" class="axis" marker-end="url(#axis)"/><line x1="979" y1="691" x2="979" y2="378" class="axis" marker-end="url(#axis)"/>
  <line x1="979" y1="417" x2="1527" y2="417" class="grid"/><line x1="979" y1="636" x2="1527" y2="636" class="grid"/>
  <line x1="979" y1="417" x2="1527" y2="417" stroke="#d75b20" stroke-width="3" stroke-dasharray="10 8"/><line x1="979" y1="636" x2="1527" y2="636" stroke="#25835f" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="944" y="425" text-anchor="end" class="sans small">0.50</text><text x="944" y="644" text-anchor="end" class="sans small">0.10</text>
  <g class="sans small" text-anchor="middle"><text x="1064" y="730">1</text><text x="1166" y="730">2</text><text x="1268" y="730">4</text><text x="1370" y="730">8</text><text x="1472" y="730">16</text></g>
  <text x="1258" y="765" text-anchor="middle" class="sans small">每次同時填入 k 格</text>
  <path d="M1064 636 C1120 610 1130 574 1166 554 C1200 531 1236 505 1268 486 C1312 456 1343 440 1370 430 C1412 418 1444 417 1472 417" fill="none" stroke="#7b4bc3" stroke-width="8" stroke-linecap="round"/>
  <g fill="#7b4bc3" stroke="#fff" stroke-width="4"><circle cx="1064" cy="636" r="13"/><circle cx="1166" cy="554" r="13"/><circle cx="1268" cy="486" r="13"/><circle cx="1370" cy="430" r="13"/><circle cx="1472" cy="417" r="13"/></g>
  <text x="1518" y="407" text-anchor="end" class="sans small" fill="#d75b20">independent 0.50</text><text x="1518" y="630" text-anchor="end" class="sans small" fill="#25835f">data 0.10</text>
  <rect x="1110" y="342" width="310" height="50" rx="15" fill="#fff3ec" stroke="#f2a16c"/><text x="1265" y="375" text-anchor="middle" class="sans small" fill="#d75b20">k 越大，long runs 越難保留</text>

  <rect x="31" y="817" width="1610" height="92" rx="18" fill="#f6faff" stroke="#a9ccff" stroke-width="2"/>
  <text x="836" y="875" text-anchor="middle" class="sans conclusion">同樣是 factorization：Parity 呈現「斷崖」，Markov 呈現「連續漂移」。</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="840" viewBox="0 0 1920 840" role="img" aria-labelledby="title desc">
  <title id="title">τ-leaping 的一步，三個近似位置</title>
  <desc id="desc">四個離散序列狀態顯示擲硬幣、各自抽字與 remasking，並把每一步對到精確機率與誤差來源。</desc>
  <defs>
    <style>
      .sans{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}.math{font-family:"Cambria Math","STIX Two Math",Georgia,serif}
      .ink{fill:#0b2b6f}.muted{fill:#667085}.white{fill:#fff}.red{fill:#d94f4f}
      .h1{font-size:58px;font-weight:800}.sub{font-size:24px;font-weight:600}.stateTitle{font-size:26px;font-weight:800}
      .label{font-size:21px;font-weight:700}.small{font-size:18px;font-weight:600}.tiny{font-size:16px;font-weight:600}.eq{font-size:23px}
      .token{font-size:19px;font-weight:800}.mask{fill:#eef0f3;stroke:#a6afbc;stroke-width:2}.filled{fill:#fff1e7;stroke:#f0803c;stroke-width:2}
      .selected{fill:none;stroke:#d94f4f;stroke-width:4}.arrow{stroke:#2a4ea3;stroke-width:5;fill:none}
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#2a4ea3"/></marker>
    <marker id="back" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto"><path d="M11 1L1 6L11 11Z" fill="#d94f4f"/></marker>
  </defs>

  <rect width="1920" height="840" fill="#fffdfb"/>
  <g class="sans">
    <text x="960" y="66" text-anchor="middle" class="h1 ink">τ-leaping 的一步，三個近似位置</text>
    <text x="960" y="104" text-anchor="middle" class="sub muted">每個位置各自決定是否跳；速度來自 rate，誤差來自 finite τ 與 factorization</text>
  </g>

  <!-- operation labels and arrows -->
  <g class="sans">
    <path d="M430 252H487" class="arrow" marker-end="url(#arrow)"/>
    <circle cx="459" cy="147" r="28" fill="#4a90e2"/><text x="459" y="156" text-anchor="middle" class="stateTitle white">1</text>
    <text x="459" y="190" text-anchor="middle" class="label ink">各自擲硬幣</text>
    <text x="459" y="217" text-anchor="middle" class="math eq ink">1 − exp(−u′ₜ τ)</text>

    <path d="M890 252H947" class="arrow" marker-end="url(#arrow)"/>
    <circle cx="919" cy="147" r="28" fill="#f0803c"/><text x="919" y="156" text-anchor="middle" class="stateTitle white">2</text>
    <text x="919" y="190" text-anchor="middle" class="label ink">依 pθ 各自抽字</text>
    <text x="919" y="217" text-anchor="middle" class="math eq ink">Categorical(pθ)</text>

    <path d="M1350 252H1407" class="arrow" marker-end="url(#arrow)"/>
    <circle cx="1379" cy="147" r="28" fill="#d94f4f"/><text x="1379" y="156" text-anchor="middle" class="stateTitle white">3</text>
    <text x="1379" y="190" text-anchor="middle" class="label ink">已填位置遮回去</text>
    <text x="1379" y="217" text-anchor="middle" class="math eq ink">1 − exp(−σₜ τ)</text>
  </g>

  <!-- state 0 -->
  <g class="sans">
    <rect x="40" y="230" width="390" height="272" rx="24" fill="#eef7ff" stroke="#cfe6f8" stroke-width="3"/>
    <text x="65" y="274" class="stateTitle ink">步首狀態 xₜ</text>
    <text x="65" y="303" class="small muted">灰格尚未決定；橘格已填</text>
    <g>
      <rect x="56" y="338" width="38" height="52" rx="8" class="filled"/><text x="75" y="372" text-anchor="middle" class="token ink">那</text>
      <rect x="101" y="338" width="38" height="52" rx="8" class="mask"/><text x="120" y="371" text-anchor="middle" class="tiny muted">M</text>
      <rect x="146" y="338" width="38" height="52" rx="8" class="mask"/><text x="165" y="371" text-anchor="middle" class="tiny muted">M</text>
      <rect x="191" y="338" width="38" height="52" rx="8" class="filled"/><text x="210" y="372" text-anchor="middle" class="token ink">在</text>
      <rect x="236" y="338" width="38" height="52" rx="8" class="mask"/><text x="255" y="371" text-anchor="middle" class="tiny muted">M</text>
      <rect x="281" y="338" width="38" height="52" rx="8" class="filled"/><text x="300" y="372" text-anchor="middle" class="token ink">覺</text>
      <rect x="326" y="338" width="38" height="52" rx="8" class="mask"/><text x="345" y="371" text-anchor="middle" class="tiny muted">M</text>
      <rect x="371" y="338" width="38" height="52" rx="8" class="mask"/><text x="390" y="371" text-anchor="middle" class="tiny muted">M</text>
    </g>
    <text x="235" y="438" text-anchor="middle" class="math eq ink">u′ₜ = uₜ + σₜ αₜ/(1−αₜ)</text>
    <text x="235" y="472" text-anchor="middle" class="small muted">用步首 rate 決定整段 τ</text>
  </g>

  <!-- state 1: selected positions -->
  <g class="sans">
    <rect x="500" y="230" width="390" height="272" rx="24" fill="#f7f9fc" stroke="#d9e0ea" stroke-width="3"/>
    <text x="525" y="274" class="stateTitle ink">硬幣結果</text>
    <text x="525" y="303" class="small muted">紅框位置準備同時翻開</text>
    <g>
      <rect x="516" y="338" width="38" height="52" rx="8" class="filled"/><text x="535" y="372" text-anchor="middle" class="token ink">那</text>
      <rect x="561" y="338" width="38" height="52" rx="8" class="mask"/><rect x="557" y="334" width="46" height="60" rx="11" class="selected"/><text x="580" y="371" text-anchor="middle" class="tiny muted">M</text>
      <rect x="606" y="338" width="38" height="52" rx="8" class="mask"/><rect x="602" y="334" width="46" height="60" rx="11" class="selected"/><text x="625" y="371" text-anchor="middle" class="tiny muted">M</text>
      <rect x="651" y="338" width="38" height="52" rx="8" class="filled"/><text x="670" y="372" text-anchor="middle" class="token ink">在</text>
      <rect x="696" y="338" width="38" height="52" rx="8" class="mask"/><rect x="692" y="334" width="46" height="60" rx="11" class="selected"/><text x="715" y="371" text-anchor="middle" class="tiny muted">M</text>
      <rect x="741" y="338" width="38" height="52" rx="8" class="filled"/><text x="760" y="372" text-anchor="middle" class="token ink">覺</text>
      <rect x="786" y="338" width="38" height="52" rx="8" class="mask"/><text x="805" y="371" text-anchor="middle" class="tiny muted">M</text>
      <rect x="831" y="338" width="38" height="52" rx="8" class="mask"/><text x="850" y="371" text-anchor="middle" class="tiny muted">M</text>
    </g>
    <text x="695" y="438" text-anchor="middle" class="label red">三枚 Bernoulli 同時成功</text>
    <text x="695" y="472" text-anchor="middle" class="small muted">每個位置的 marginal 機率都算對</text>
  </g>

  <!-- state 2: sampled tokens and K bars -->
  <g class="sans">
    <rect x="960" y="230" width="390" height="272" rx="24" fill="#fff8e7" stroke="#f3dfad" stroke-width="3"/>
    <text x="985" y="274" class="stateTitle ink">各自從 K 類抽樣</text>
    <text x="985" y="303" class="small muted">每個紅框都有自己的 pθ bar</text>
    <g fill="#4a90e2"><rect x="1022" y="319" width="7" height="17"/><rect x="1032" y="309" width="7" height="27"/><rect x="1042" y="325" width="7" height="11"/><rect x="1052" y="314" width="7" height="22"/></g>
    <g fill="#4a90e2"><rect x="1067" y="322" width="7" height="14"/><rect x="1077" y="315" width="7" height="21"/><rect x="1087" y="305" width="7" height="31"/><rect x="1097" y="326" width="7" height="10"/></g>
    <g fill="#4a90e2"><rect x="1157" y="326" width="7" height="10"/><rect x="1167" y="311" width="7" height="25"/><rect x="1177" y="319" width="7" height="17"/><rect x="1187" y="302" width="7" height="34"/></g>
    <g>
      <rect x="976" y="338" width="38" height="52" rx="8" class="filled"/><text x="995" y="372" text-anchor="middle" class="token ink">那</text>
      <rect x="1021" y="338" width="38" height="52" rx="8" class="filled"/><text x="1040" y="372" text-anchor="middle" class="token ink">隻</text>
      <rect x="1066" y="338" width="38" height="52" rx="8" class="filled"/><text x="1085" y="372" text-anchor="middle" class="token ink">狗</text>
      <rect x="1111" y="338" width="38" height="52" rx="8" class="filled"/><text x="1130" y="372" text-anchor="middle" class="token ink">在</text>
      <rect x="1156" y="338" width="38" height="52" rx="8" class="filled"/><text x="1175" y="372" text-anchor="middle" class="token ink">睡</text>
      <rect x="1201" y="338" width="38" height="52" rx="8" class="filled"/><text x="1220" y="372" text-anchor="middle" class="token ink">覺</text>
      <rect x="1246" y="338" width="38" height="52" rx="8" class="mask"/><text x="1265" y="371" text-anchor="middle" class="tiny muted">M</text>
      <rect x="1291" y="338" width="38" height="52" rx="8" class="mask"/><text x="1310" y="371" text-anchor="middle" class="tiny muted">M</text>
    </g>
    <path d="M1040 408C1080 438 1135 438 1175 408" fill="none" stroke="#d94f4f" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="1107" y="462" text-anchor="middle" class="label red">各自抽，相依被丟掉</text>
    <text x="1107" y="486" text-anchor="middle" class="small muted">同時填的位置沒有 joint coupling</text>
  </g>

  <!-- state 3: remasked -->
  <g class="sans">
    <rect x="1420" y="230" width="460" height="272" rx="24" fill="#fff3f3" stroke="#efc1c1" stroke-width="3"/>
    <text x="1445" y="274" class="stateTitle ink">remasking 後</text>
    <text x="1445" y="303" class="small muted">已填位置也能被遮回去再想一次</text>
    <g>
      <rect x="1436" y="338" width="43" height="52" rx="8" class="filled"/><text x="1458" y="372" text-anchor="middle" class="token ink">那</text>
      <rect x="1486" y="338" width="43" height="52" rx="8" class="filled"/><text x="1508" y="372" text-anchor="middle" class="token ink">隻</text>
      <rect x="1536" y="338" width="43" height="52" rx="8" class="mask"/><text x="1558" y="371" text-anchor="middle" class="tiny muted">M</text>
      <rect x="1586" y="338" width="43" height="52" rx="8" class="filled"/><text x="1608" y="372" text-anchor="middle" class="token ink">在</text>
      <rect x="1636" y="338" width="43" height="52" rx="8" class="filled"/><text x="1658" y="372" text-anchor="middle" class="token ink">睡</text>
      <rect x="1686" y="338" width="43" height="52" rx="8" class="filled"/><text x="1708" y="372" text-anchor="middle" class="token ink">覺</text>
      <rect x="1736" y="338" width="43" height="52" rx="8" class="mask"/><text x="1758" y="371" text-anchor="middle" class="tiny muted">M</text>
      <rect x="1786" y="338" width="43" height="52" rx="8" class="mask"/><text x="1808" y="371" text-anchor="middle" class="tiny muted">M</text>
    </g>
    <path d="M1558 327C1558 305 1600 305 1600 331" fill="none" stroke="#d94f4f" stroke-width="4" marker-start="url(#back)"/>
    <text x="1650" y="438" text-anchor="middle" class="math eq ink">P(remask) = 1 − exp(−σₜ τ)</text>
    <text x="1650" y="472" text-anchor="middle" class="small muted">σₜ=0 時，這一步完全不做</text>
  </g>

  <!-- aligned error sources -->
  <g class="sans">
    <text x="55" y="548" class="stateTitle ink">三個操作，各自付什麼誤差？</text>
    <rect x="55" y="570" width="570" height="160" rx="24" fill="#eef7ff" stroke="#cfe6f8" stroke-width="2"/>
    <rect x="675" y="570" width="570" height="160" rx="24" fill="#fff8e7" stroke="#f3dfad" stroke-width="2"/>
    <rect x="1295" y="570" width="570" height="160" rx="24" fill="#fff3f3" stroke="#efc1c1" stroke-width="2"/>
    <text x="85" y="610" class="label ink">① finite-τ 一階近似</text>
    <text x="85" y="648" class="small muted">整段 τ 都沿用步首 rate；τ 越大，rate</text><text x="85" y="677" class="small muted">在區間內改變得越多，Euler 誤差越大。</text>
    <text x="705" y="610" class="label ink">② factorization error</text>
    <text x="705" y="648" class="small muted">每格的 marginal 可以正確，但同時填多格時</text><text x="705" y="677" class="small muted">joint correlation 被拆成獨立抽樣。</text>
    <text x="1325" y="610" class="label ink">③ remasking 的額外成本</text>
    <text x="1325" y="648" class="small muted">多一次再決定的機會，也多一次網路呼叫與</text><text x="1325" y="677" class="small muted">factorized sampling。</text>
  </g>

  <g class="sans">
    <rect x="300" y="758" width="1320" height="58" rx="24" fill="#eef3fb"/>
    <text x="960" y="797" text-anchor="middle" class="label ink">τ → 0 時，finite-τ 與同時跳躍造成的誤差都消失；代價是步數趨近無限。</text>
  </g>
</svg>

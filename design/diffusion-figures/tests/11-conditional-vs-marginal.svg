<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#f2f8ff"/></linearGradient>
    <style>.sans{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;fill:#07133f}.math{font-family:"Cambria Math","Times New Roman",serif;fill:#07133f}.title{font-size:60px;font-weight:800}.sub{font-size:29px;fill:#29375f}.panel{fill:url(#panel);stroke:#bdd8ff;stroke-width:2}.h{font-size:34px;font-weight:750}.label{font-size:25px}.small{font-size:22px}.chip{fill:#fff;stroke:#c6d8f3;stroke-width:2}.conclusion{font-size:31px;font-weight:600}</style>
  </defs>
  <rect width="1672" height="941" fill="url(#bg)"/>
  <text x="836" y="76" text-anchor="middle" class="sans title">條件直線會交叉；ODE 軌跡為什麼不能？</text>
  <text x="836" y="132" text-anchor="middle" class="sans sub">固定相同的 p₀、p₁，只改 coupling π；conditional paths 與 marginal trajectories 會一起改變。</text>

  <rect x="31" y="178" width="764" height="607" rx="20" class="panel"/>
  <rect x="877" y="178" width="764" height="607" rx="20" class="panel"/>
  <text x="413" y="231" text-anchor="middle" class="sans h">random pairing</text>
  <text x="1259" y="231" text-anchor="middle" class="sans h">position pairing</text>
  <text x="413" y="269" text-anchor="middle" class="sans label" fill="#5c6787">crossing conditional paths</text>
  <text x="1259" y="269" text-anchor="middle" class="sans label" fill="#5c6787">parallel conditional paths</text>

  <!-- left endpoints -->
  <g><circle cx="213" cy="671" r="16" fill="#3572d4"/><circle cx="244" cy="688" r="11" fill="#8cb4ef"/><circle cx="582" cy="671" r="16" fill="#3572d4"/><circle cx="613" cy="688" r="11" fill="#8cb4ef"/>
  <circle cx="213" cy="339" r="16" fill="#ff812b"/><circle cx="244" cy="322" r="11" fill="#ffb277"/><circle cx="582" cy="339" r="16" fill="#ff812b"/><circle cx="613" cy="322" r="11" fill="#ffb277"/></g>
  <text x="113" y="700" class="math label">p₀</text><text x="112" y="340" class="math label">p₁</text>
  <!-- left green crossing conditionals -->
  <line x1="213" y1="671" x2="582" y2="339" stroke="#52b889" stroke-width="6" opacity=".68"/>
  <line x1="582" y1="671" x2="213" y2="339" stroke="#52b889" stroke-width="6" opacity=".68"/>
  <circle cx="398" cy="505" r="11" fill="#fff" stroke="#41a574" stroke-width="3"/>
  <!-- left blue marginal curves avoid crossing -->
  <path d="M213 671 C250 600 313 550 365 511 C333 467 270 410 213 339" fill="none" stroke="#2454c6" stroke-width="10" stroke-linecap="round"/>
  <path d="M582 671 C545 600 482 550 431 511 C463 467 526 410 582 339" fill="none" stroke="#2454c6" stroke-width="10" stroke-linecap="round"/>
  <rect x="608" y="430" width="160" height="148" rx="17" fill="#fff" stroke="#c6d8f3" stroke-width="2"/>
  <line x1="622" y1="462" x2="654" y2="462" stroke="#52b889" stroke-width="6"/><text x="662" y="469" class="sans small" fill="#23825a">conditional</text>
  <text x="662" y="498" class="sans small" fill="#23825a">可以交叉</text>
  <line x1="622" y1="531" x2="654" y2="531" stroke="#2454c6" stroke-width="8"/><text x="662" y="538" class="sans small" fill="#2454c6">marginal</text>
  <text x="662" y="567" class="sans small" fill="#2454c6">轉彎、不相交</text>
  <rect x="162" y="719" width="220" height="47" rx="15" class="chip"/><text x="272" y="750" text-anchor="middle" class="sans small">curvature 1.59</text>
  <rect x="396" y="719" width="239" height="47" rx="15" class="chip"/><text x="516" y="750" text-anchor="middle" class="sans small">4-step error 1.49</text>

  <!-- right endpoints and parallel paths -->
  <g><circle cx="1061" cy="671" r="16" fill="#3572d4"/><circle cx="1092" cy="688" r="11" fill="#8cb4ef"/><circle cx="1430" cy="671" r="16" fill="#3572d4"/><circle cx="1461" cy="688" r="11" fill="#8cb4ef"/>
  <circle cx="1061" cy="339" r="16" fill="#ff812b"/><circle cx="1092" cy="322" r="11" fill="#ffb277"/><circle cx="1430" cy="339" r="16" fill="#ff812b"/><circle cx="1461" cy="322" r="11" fill="#ffb277"/></g>
  <text x="963" y="700" class="math label">p₀</text><text x="962" y="340" class="math label">p₁</text>
  <line x1="1061" y1="671" x2="1061" y2="339" stroke="#52b889" stroke-width="14" opacity=".62"/>
  <line x1="1430" y1="671" x2="1430" y2="339" stroke="#52b889" stroke-width="14" opacity=".62"/>
  <line x1="1061" y1="671" x2="1061" y2="339" stroke="#2454c6" stroke-width="6"/>
  <line x1="1430" y1="671" x2="1430" y2="339" stroke="#2454c6" stroke-width="6"/>
  <rect x="1074" y="449" width="344" height="116" rx="18" fill="#fff" stroke="#86adf0" stroke-width="2"/>
  <text x="1246" y="495" text-anchor="middle" class="sans label" fill="#2454c6" font-weight="700">marginal 與 conditional 重合</text>
  <text x="1246" y="536" text-anchor="middle" class="sans small" fill="#5c6787">沒有交叉，也不需要彎曲</text>
  <rect x="1008" y="719" width="220" height="47" rx="15" class="chip"/><text x="1118" y="750" text-anchor="middle" class="sans small">curvature 1.00</text>
  <rect x="1242" y="719" width="239" height="47" rx="15" class="chip"/><text x="1362" y="750" text-anchor="middle" class="sans small">4-step error 0.03</text>

  <rect x="801" y="445" width="70" height="70" rx="19" fill="#f7f3ff" stroke="#b18ae8" stroke-width="2"/>
  <text x="836" y="491" text-anchor="middle" class="math" font-size="35" fill="#6a2eb2">π</text>

  <rect x="31" y="817" width="1610" height="92" rx="18" fill="#f6faff" stroke="#a9ccff" stroke-width="2"/>
  <text x="836" y="875" text-anchor="middle" class="sans conclusion">ODE 唯一性禁止 marginal trajectories 相交：彎曲來自 crossing，而 crossing 來自 pairing。</text>
</svg>

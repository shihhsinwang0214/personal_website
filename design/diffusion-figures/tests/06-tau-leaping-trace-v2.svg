<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="840" viewBox="0 0 1920 840" role="img" aria-labelledby="title desc">
  <title id="title">τ-leaping：同一排 tokens 在一步裡發生什麼</title>
  <desc id="desc">四個對齊的 token tape 顯示選擇、各自抽樣與 remasking；三個垂直指標直接對到 finite tau、factorization 與額外成本。</desc>
  <defs>
    <style>
      .sans{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}.math{font-family:"Cambria Math","STIX Two Math",Georgia,serif}
      .ink{fill:#0b2b6f}.muted{fill:#667085}.red{fill:#d94f4f}.h1{font-size:58px;font-weight:800}.sub{font-size:24px;font-weight:600}
      .step{font-size:28px;font-weight:800}.label{font-size:21px;font-weight:700}.small{font-size:18px;font-weight:600}.tiny{font-size:16px;font-weight:600}.eq{font-size:22px}
      .token{font-size:19px;font-weight:800}.mask{fill:#eef0f3;stroke:#a6afbc;stroke-width:2}.filled{fill:#fff1e7;stroke:#f0803c;stroke-width:2}.picked{fill:none;stroke:#d94f4f;stroke-width:4}
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#2a4ea3"/></marker>
    <marker id="down" viewBox="0 0 12 12" refX="6" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L6 11L11 1Z" fill="#d94f4f"/></marker>
  </defs>
  <rect width="1920" height="840" fill="#fffdfb"/>
  <g class="sans">
    <text x="960" y="66" text-anchor="middle" class="h1 ink">τ-leaping：同一排 tokens 在一步裡發生什麼</text>
    <text x="960" y="104" text-anchor="middle" class="sub muted">把公式貼回它真正作用的位置，誤差就不再是另一張說明卡</text>
  </g>

  <!-- one continuous algorithm rail -->
  <line x1="70" y1="332" x2="1845" y2="332" stroke="#d7dee8" stroke-width="5"/>

  <!-- state 0 -->
  <g class="sans">
    <text x="215" y="166" text-anchor="middle" class="step ink">步首 xₜ</text>
    <text x="215" y="194" text-anchor="middle" class="small muted">灰格未知；橘格已填</text>
    <rect x="40" y="218" width="350" height="160" rx="22" fill="#eef7ff" opacity=".75"/>
    <g>
      <rect x="52" y="267" width="36" height="50" rx="8" class="filled"/><text x="70" y="300" text-anchor="middle" class="token ink">那</text>
      <rect x="95" y="267" width="36" height="50" rx="8" class="mask"/><text x="113" y="299" text-anchor="middle" class="tiny muted">M</text>
      <rect x="138" y="267" width="36" height="50" rx="8" class="mask"/><text x="156" y="299" text-anchor="middle" class="tiny muted">M</text>
      <rect x="181" y="267" width="36" height="50" rx="8" class="filled"/><text x="199" y="300" text-anchor="middle" class="token ink">在</text>
      <rect x="224" y="267" width="36" height="50" rx="8" class="mask"/><text x="242" y="299" text-anchor="middle" class="tiny muted">M</text>
      <rect x="267" y="267" width="36" height="50" rx="8" class="filled"/><text x="285" y="300" text-anchor="middle" class="token ink">覺</text>
      <rect x="310" y="267" width="36" height="50" rx="8" class="mask"/><text x="328" y="299" text-anchor="middle" class="tiny muted">M</text>
      <rect x="353" y="267" width="36" height="50" rx="8" class="mask"/><text x="371" y="299" text-anchor="middle" class="tiny muted">M</text>
    </g>
    <text x="215" y="360" text-anchor="middle" class="math eq ink">u′ₜ = uₜ + σₜ αₜ/(1−αₜ)</text>
  </g>

  <!-- operation 1 placed on the rail -->
  <g class="sans">
    <circle cx="455" cy="250" r="27" fill="#4a90e2"/><text x="455" y="259" text-anchor="middle" class="step" fill="#fff">1</text>
    <text x="455" y="291" text-anchor="middle" class="small ink">每個 mask</text>
    <text x="455" y="313" text-anchor="middle" class="small ink">各自擲硬幣</text>
    <path d="M398 332H490" stroke="#2a4ea3" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="455" y="390" text-anchor="middle" class="math eq ink">1 − exp(−u′ₜ τ)</text>
  </g>

  <!-- state 1 -->
  <g class="sans">
    <text x="675" y="166" text-anchor="middle" class="step ink">被選中的位置</text>
    <text x="675" y="194" text-anchor="middle" class="small muted">紅框＝本步要翻開</text>
    <rect x="500" y="218" width="350" height="160" rx="22" fill="#f5f7fa"/>
    <g>
      <rect x="512" y="267" width="36" height="50" rx="8" class="filled"/><text x="530" y="300" text-anchor="middle" class="token ink">那</text>
      <rect x="555" y="267" width="36" height="50" rx="8" class="mask"/><rect x="551" y="263" width="44" height="58" rx="11" class="picked"/><text x="573" y="299" text-anchor="middle" class="tiny muted">M</text>
      <rect x="598" y="267" width="36" height="50" rx="8" class="mask"/><rect x="594" y="263" width="44" height="58" rx="11" class="picked"/><text x="616" y="299" text-anchor="middle" class="tiny muted">M</text>
      <rect x="641" y="267" width="36" height="50" rx="8" class="filled"/><text x="659" y="300" text-anchor="middle" class="token ink">在</text>
      <rect x="684" y="267" width="36" height="50" rx="8" class="mask"/><rect x="680" y="263" width="44" height="58" rx="11" class="picked"/><text x="702" y="299" text-anchor="middle" class="tiny muted">M</text>
      <rect x="727" y="267" width="36" height="50" rx="8" class="filled"/><text x="745" y="300" text-anchor="middle" class="token ink">覺</text>
      <rect x="770" y="267" width="36" height="50" rx="8" class="mask"/><text x="788" y="299" text-anchor="middle" class="tiny muted">M</text>
      <rect x="813" y="267" width="36" height="50" rx="8" class="mask"/><text x="831" y="299" text-anchor="middle" class="tiny muted">M</text>
    </g>
    <text x="675" y="360" text-anchor="middle" class="label red">三個 Bernoulli 同時成功</text>
  </g>

  <!-- operation 2 -->
  <g class="sans">
    <circle cx="915" cy="250" r="27" fill="#f0803c"/><text x="915" y="259" text-anchor="middle" class="step" fill="#fff">2</text>
    <text x="915" y="291" text-anchor="middle" class="small ink">各自抽</text>
    <text x="915" y="313" text-anchor="middle" class="math small ink">v ∼ pθ(v|xₜ)</text>
    <path d="M858 332H950" stroke="#2a4ea3" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="915" y="390" text-anchor="middle" class="small muted">K 類 categorical</text>
  </g>

  <!-- state 2 -->
  <g class="sans">
    <text x="1135" y="166" text-anchor="middle" class="step ink">同時得到三個字</text>
    <text x="1135" y="194" text-anchor="middle" class="small muted">每格 marginal 對，joint 不一定對</text>
    <rect x="960" y="218" width="350" height="160" rx="22" fill="#fff8e7" opacity=".9"/>
    <g fill="#4a90e2"><rect x="1018" y="245" width="6" height="18"/><rect x="1027" y="235" width="6" height="28"/><rect x="1036" y="250" width="6" height="13"/><rect x="1045" y="241" width="6" height="22"/></g>
    <g fill="#4a90e2"><rect x="1061" y="249" width="6" height="14"/><rect x="1070" y="240" width="6" height="23"/><rect x="1079" y="231" width="6" height="32"/><rect x="1088" y="251" width="6" height="12"/></g>
    <g fill="#4a90e2"><rect x="1147" y="251" width="6" height="12"/><rect x="1156" y="238" width="6" height="25"/><rect x="1165" y="246" width="6" height="17"/><rect x="1174" y="228" width="6" height="35"/></g>
    <g>
      <rect x="972" y="267" width="36" height="50" rx="8" class="filled"/><text x="990" y="300" text-anchor="middle" class="token ink">那</text>
      <rect x="1015" y="267" width="36" height="50" rx="8" class="filled"/><text x="1033" y="300" text-anchor="middle" class="token ink">隻</text>
      <rect x="1058" y="267" width="36" height="50" rx="8" class="filled"/><text x="1076" y="300" text-anchor="middle" class="token ink">狗</text>
      <rect x="1101" y="267" width="36" height="50" rx="8" class="filled"/><text x="1119" y="300" text-anchor="middle" class="token ink">在</text>
      <rect x="1144" y="267" width="36" height="50" rx="8" class="filled"/><text x="1162" y="300" text-anchor="middle" class="token ink">睡</text>
      <rect x="1187" y="267" width="36" height="50" rx="8" class="filled"/><text x="1205" y="300" text-anchor="middle" class="token ink">覺</text>
      <rect x="1230" y="267" width="36" height="50" rx="8" class="mask"/><text x="1248" y="299" text-anchor="middle" class="tiny muted">M</text>
      <rect x="1273" y="267" width="36" height="50" rx="8" class="mask"/><text x="1291" y="299" text-anchor="middle" class="tiny muted">M</text>
    </g>
    <path d="M1033 327C1068 352 1128 352 1162 327" fill="none" stroke="#d94f4f" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="1098" y="374" text-anchor="middle" class="label red">相依被丟掉</text>
  </g>

  <!-- operation 3 -->
  <g class="sans">
    <circle cx="1375" cy="250" r="27" fill="#d94f4f"/><text x="1375" y="259" text-anchor="middle" class="step" fill="#fff">3</text>
    <text x="1375" y="291" text-anchor="middle" class="small ink">已填格</text>
    <text x="1375" y="313" text-anchor="middle" class="small ink">再擲一次</text>
    <path d="M1318 332H1410" stroke="#2a4ea3" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="1375" y="390" text-anchor="middle" class="math eq ink">1 − exp(−σₜ τ)</text>
  </g>

  <!-- state 3 -->
  <g class="sans">
    <text x="1595" y="166" text-anchor="middle" class="step ink">remasking 後</text>
    <text x="1595" y="194" text-anchor="middle" class="small muted">把不確定的位置遮回去</text>
    <rect x="1420" y="218" width="450" height="160" rx="22" fill="#fff3f3"/>
    <g>
      <rect x="1435" y="267" width="43" height="50" rx="8" class="filled"/><text x="1457" y="300" text-anchor="middle" class="token ink">那</text>
      <rect x="1485" y="267" width="43" height="50" rx="8" class="filled"/><text x="1507" y="300" text-anchor="middle" class="token ink">隻</text>
      <rect x="1535" y="267" width="43" height="50" rx="8" class="mask"/><text x="1557" y="299" text-anchor="middle" class="tiny muted">M</text>
      <rect x="1585" y="267" width="43" height="50" rx="8" class="filled"/><text x="1607" y="300" text-anchor="middle" class="token ink">在</text>
      <rect x="1635" y="267" width="43" height="50" rx="8" class="filled"/><text x="1657" y="300" text-anchor="middle" class="token ink">睡</text>
      <rect x="1685" y="267" width="43" height="50" rx="8" class="filled"/><text x="1707" y="300" text-anchor="middle" class="token ink">覺</text>
      <rect x="1735" y="267" width="43" height="50" rx="8" class="mask"/><text x="1757" y="299" text-anchor="middle" class="tiny muted">M</text>
      <rect x="1785" y="267" width="43" height="50" rx="8" class="mask"/><text x="1807" y="299" text-anchor="middle" class="tiny muted">M</text>
    </g>
    <path d="M1557 253C1557 226 1610 226 1610 258" fill="none" stroke="#d94f4f" stroke-width="4" marker-start="url(#down)"/>
    <text x="1645" y="360" text-anchor="middle" class="small muted">σₜ=0 時，這一步不做</text>
  </g>

  <!-- error map connected to exact operation positions -->
  <g class="sans">
    <text x="60" y="467" class="step ink">誤差不是最後才發生；它就在這三個動作裡</text>
    <line x1="455" y1="414" x2="455" y2="512" stroke="#4a90e2" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#down)"/>
    <line x1="915" y1="414" x2="915" y2="512" stroke="#f0803c" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#down)"/>
    <line x1="1375" y1="414" x2="1375" y2="512" stroke="#d94f4f" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#down)"/>

    <circle cx="455" cy="550" r="28" fill="#4a90e2"/><text x="455" y="559" text-anchor="middle" class="step" fill="#fff">1</text>
    <text x="455" y="604" text-anchor="middle" class="label ink">finite-τ：Euler 誤差</text>
    <text x="455" y="638" text-anchor="middle" class="small muted">整段 τ 沿用步首 rate；τ 越大，</text><text x="455" y="666" text-anchor="middle" class="small muted">區間內 rate 改得越多。</text>

    <circle cx="915" cy="550" r="28" fill="#f0803c"/><text x="915" y="559" text-anchor="middle" class="step" fill="#fff">2</text>
    <text x="915" y="604" text-anchor="middle" class="label ink">factorization：joint 被拆開</text>
    <text x="915" y="638" text-anchor="middle" class="small muted">每一格的 marginal 可以正確；同時</text><text x="915" y="666" text-anchor="middle" class="small muted">填多格時，correlation 消失。</text>

    <circle cx="1375" cy="550" r="28" fill="#d94f4f"/><text x="1375" y="559" text-anchor="middle" class="step" fill="#fff">3</text>
    <text x="1375" y="604" text-anchor="middle" class="label ink">remasking：再付一次成本</text>
    <text x="1375" y="638" text-anchor="middle" class="small muted">多一次重新決定的機會，也多一次</text><text x="1375" y="666" text-anchor="middle" class="small muted">網路呼叫與 factorized sampling。</text>
  </g>

  <g class="sans">
    <rect x="240" y="735" width="1440" height="68" rx="28" fill="#eef3fb"/>
    <text x="960" y="779" text-anchor="middle" class="label ink">τ → 0：前兩種近似都消失；但步數與網路成本一起趨近無限。</text>
  </g>
</svg>

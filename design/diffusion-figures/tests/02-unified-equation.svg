<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-labelledby="title desc">
  <title id="title">一個式子，三個能動的地方</title>
  <desc id="desc">Stochastic interpolant 統一式向下拆成路徑、配對與額外噪聲三個旋鈕，並以四種方法的精確特例收束。</desc>
  <defs>
    <style>
      .sans{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}.math{font-family:"Cambria Math","STIX Two Math",Georgia,serif}
      .ink{fill:#0b2b6f}.muted{fill:#667085}.white{fill:#fff}.blue{fill:#4a90e2}.orange{fill:#f0803c}.green{fill:#60ba82}
      .h1{font-size:62px;font-weight:800}.sub{font-size:25px;font-weight:600}.panelTitle{font-size:36px;font-weight:800}
      .label{font-size:23px;font-weight:650}.small{font-size:19px;font-weight:600}.tiny{font-size:17px;font-weight:600}
      .eqMain{font-size:57px}.eq{font-size:29px}.tableHead{font-size:21px;font-weight:800}.tableText{font-size:20px;font-weight:650}
    </style>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#2a4ea3"/></marker>
    <clipPath id="dogClip"><rect x="1068" y="565" width="122" height="122" rx="16"/></clipPath>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60ba82" stop-opacity="0"/><stop offset=".5" stop-color="#60ba82" stop-opacity=".42"/><stop offset="1" stop-color="#60ba82" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1200" fill="#fffdfb"/>
  <g class="sans">
    <text x="960" y="72" text-anchor="middle" class="h1 ink">一個式子，三個能動的地方</text>
    <text x="960" y="111" text-anchor="middle" class="sub muted">路徑決定怎麼走，π 決定誰配誰，γₜ 決定中間有多厚</text>
  </g>

  <!-- master equation -->
  <g>
    <rect x="100" y="140" width="1720" height="138" rx="30" fill="#f7f9fc" stroke="#d5dfec" stroke-width="2"/>
    <rect x="250" y="170" width="345" height="78" rx="18" fill="#e7f3fd" stroke="#90c3ef" stroke-width="2"/>
    <rect x="628" y="170" width="345" height="78" rx="18" fill="#fff0e6" stroke="#f7ad7d" stroke-width="2"/>
    <rect x="1006" y="170" width="310" height="78" rx="18" fill="#eaf7ef" stroke="#9bd4ae" stroke-width="2"/>
    <text x="125" y="223" class="math eqMain ink">xₜ =</text>
    <text x="423" y="223" text-anchor="middle" class="math eqMain ink">αₜ x₀</text>
    <text x="611" y="223" text-anchor="middle" class="math eqMain ink">+</text>
    <text x="800" y="223" text-anchor="middle" class="math eqMain ink">βₜ x₁</text>
    <text x="989" y="223" text-anchor="middle" class="math eqMain ink">+</text>
    <text x="1161" y="223" text-anchor="middle" class="math eqMain ink">γₜ z</text>
    <text x="1350" y="207" class="math eq ink">(x₀,x₁) ∼ π</text>
    <text x="1350" y="240" class="math eq ink">z ∼ 𝒩(0,I)</text>
    <text x="1618" y="207" class="math eq ink">γ₀ = γ₁ = 0</text>
    <text x="1618" y="240" class="sans small muted">兩端不加額外噪聲</text>
    <path d="M425 250V294" stroke="#4a90e2" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M798 250V294" stroke="#f0803c" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M1158 250V294" stroke="#60ba82" stroke-width="4" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- path panel -->
  <g class="sans">
    <rect x="55" y="310" width="570" height="438" rx="28" fill="#eef7ff" stroke="#cfe6f8" stroke-width="3"/>
    <text x="90" y="359" class="panelTitle ink">① 路徑：αₜ、βₜ</text>
    <text x="90" y="393" class="label muted">係數 schedule 決定中間怎麼走</text>
    <rect x="86" y="418" width="508" height="270" rx="20" fill="#fff" stroke="#bcd3e7" stroke-width="2"/>
    <line x1="145" y1="635" x2="548" y2="635" stroke="#0b2b6f" stroke-width="2"/>
    <line x1="145" y1="635" x2="145" y2="462" stroke="#0b2b6f" stroke-width="2"/>
    <text x="135" y="665" class="math small ink">0</text><text x="539" y="665" class="math small ink">1</text><text x="340" y="671" class="math label ink">t</text>
    <text x="112" y="472" class="math small ink">1</text><text x="118" y="642" class="math small ink">0</text>
    <path d="M145 476L548 632" fill="none" stroke="#4a90e2" stroke-width="6"/>
    <path d="M145 632L548 476" fill="none" stroke="#f0803c" stroke-width="6"/>
    <path d="M145 476C270 480 420 545 548 632" fill="none" stroke="#2a4ea3" stroke-width="4" stroke-dasharray="12 10"/>
    <path d="M145 632C270 625 420 555 548 476" fill="none" stroke="#f0803c" stroke-width="4" stroke-dasharray="12 10"/>
    <line x1="176" y1="450" x2="224" y2="450" stroke="#4a90e2" stroke-width="6"/><text x="236" y="458" class="small ink">α：1−t</text>
    <line x1="344" y1="450" x2="392" y2="450" stroke="#f0803c" stroke-width="6"/><text x="404" y="458" class="small ink">β：t</text>
    <text x="340" y="700" text-anchor="middle" class="small muted">實線：linear　｜　虛線：VP cos / sin</text>
    <text x="340" y="726" text-anchor="middle" class="label ink">schedule 的形狀可以自己挑</text>
  </g>

  <!-- coupling panel -->
  <g class="sans">
    <rect x="675" y="310" width="570" height="438" rx="28" fill="#fff8e7" stroke="#f3dfad" stroke-width="3"/>
    <text x="710" y="359" class="panelTitle ink">② 配對：π</text>
    <text x="710" y="393" class="label muted">相同邊際，也可以有不同 transport</text>
    <rect x="706" y="418" width="508" height="270" rx="20" fill="#fff" stroke="#ead3a0" stroke-width="2"/>
    <text x="735" y="456" class="label ink">獨立配對</text>
    <g fill="#4a90e2"><circle cx="770" cy="490" r="11"/><circle cx="770" cy="535" r="11"/><circle cx="770" cy="580" r="11"/><circle cx="770" cy="625" r="11"/></g>
    <g fill="#f0803c"><circle cx="965" cy="490" r="11"/><circle cx="965" cy="535" r="11"/><circle cx="965" cy="580" r="11"/><circle cx="965" cy="625" r="11"/></g>
    <g stroke="#98a3b3" stroke-width="3" stroke-dasharray="8 7" fill="none"><path d="M781 490L954 580"/><path d="M781 535L954 490"/><path d="M781 580L954 625"/><path d="M781 625L954 535"/></g>
    <text x="735" y="671" class="small muted">線交叉：誰配誰近乎隨機</text>
    <path d="M996 505C1031 505 1037 505 1068 505" stroke="#2a4ea3" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <text x="1070" y="456" class="label ink">x₁ 是資料端點</text>
    <rect x="1068" y="565" width="122" height="122" rx="16" fill="#fff" stroke="#f0803c" stroke-width="4"/>
    <image href="asset://dog-shiba-data" x="1068" y="565" width="122" height="122" preserveAspectRatio="xMidYMid slice" clip-path="url(#dogClip)"/>
    <text x="1129" y="548" text-anchor="middle" class="math label orange">x₁</text>
    <text x="960" y="716" text-anchor="middle" class="label ink">π 不只決定端點；它也改變整條 conditional path</text>
  </g>

  <!-- gamma panel -->
  <g class="sans">
    <rect x="1295" y="310" width="570" height="438" rx="28" fill="#eef8f1" stroke="#c8e8d3" stroke-width="3"/>
    <text x="1330" y="359" class="panelTitle ink">③ 額外噪聲：γₜ</text>
    <text x="1330" y="393" class="label muted">把一條路徑撐成有厚度的 tube</text>
    <rect x="1326" y="418" width="508" height="270" rx="20" fill="#fff" stroke="#b9dbc4" stroke-width="2"/>
    <path d="M1372 556C1480 470 1680 470 1787 556C1680 642 1480 642 1372 556Z" fill="url(#tube)"/>
    <path d="M1372 556C1502 512 1658 512 1787 556" fill="none" stroke="#2a4ea3" stroke-width="6"/>
    <circle cx="1372" cy="556" r="14" fill="#4a90e2"/><circle cx="1787" cy="556" r="14" fill="#f0803c"/>
    <text x="1360" y="600" class="math label ink">γ₀=0</text><text x="1735" y="600" class="math label ink">γ₁=0</text>
    <path d="M1412 646Q1580 464 1748 646" fill="none" stroke="#60ba82" stroke-width="5"/>
    <text x="1580" y="663" text-anchor="middle" class="math small ink">γₜ = √(2t(1−t))</text>
    <text x="1580" y="716" text-anchor="middle" class="math label ink">γₜ &gt; 0：∇ log pₜ(x) = −ηₜ(x)/γₜ</text>
  </g>

  <!-- exact special-case table -->
  <g class="sans">
    <text x="75" y="803" class="panelTitle ink">前面的方法，全都是這個式子的特例</text>
    <rect x="55" y="830" width="1810" height="266" rx="24" fill="#fff" stroke="#d6dfeb" stroke-width="2"/>
    <rect x="55" y="830" width="1810" height="55" rx="24" fill="#eaf2fb"/>
    <line x1="380" y1="830" x2="380" y2="1096" stroke="#d6dfeb"/><line x1="720" y1="830" x2="720" y2="1096" stroke="#d6dfeb"/><line x1="1060" y1="830" x2="1060" y2="1096" stroke="#d6dfeb"/><line x1="1350" y1="830" x2="1350" y2="1096" stroke="#d6dfeb"/>
    <g class="tableHead ink" text-anchor="middle"><text x="218" y="866">方法</text><text x="550" y="866">αₜ</text><text x="890" y="866">βₜ</text><text x="1205" y="866">γₜ</text><text x="1608" y="866">π</text></g>
    <g stroke="#e1e7ef"><line x1="55" y1="938" x2="1865" y2="938"/><line x1="55" y1="991" x2="1865" y2="991"/><line x1="55" y1="1044" x2="1865" y2="1044"/></g>
    <g class="tableText ink" text-anchor="middle">
      <text x="218" y="920">線性 FM</text><text x="550" y="920" class="math">1−t</text><text x="890" y="920" class="math">t</text><text x="1205" y="920" class="math">0</text><text x="1608" y="920">獨立</text>
      <text x="218" y="973">Rectified flow</text><text x="550" y="973" class="math">1−t</text><text x="890" y="973" class="math">t</text><text x="1205" y="973" class="math">0</text><text x="1608" y="973">上一輪 ODE 誘導</text>
      <text x="218" y="1026">VP diffusion</text><text x="550" y="1026" class="math">cos(πt/2)</text><text x="890" y="1026" class="math">sin(πt/2)</text><text x="1205" y="1026" class="math">0</text><text x="1608" y="1026">獨立</text>
      <text x="218" y="1079">Albergo 預設</text><text x="550" y="1079" class="math">1−t</text><text x="890" y="1079" class="math">t</text><text x="1205" y="1079" class="math" fill="#23804a">√(2t(1−t))</text><text x="1608" y="1079">獨立</text>
    </g>
  </g>

  <g class="sans">
    <rect x="250" y="1115" width="1420" height="62" rx="26" fill="#eef3fb"/>
    <text x="960" y="1156" text-anchor="middle" class="label ink">看差異時只找被換掉的旋鈕：schedule、π 或 γₜ；其餘保持對齊。</text>
  </g>
</svg>
